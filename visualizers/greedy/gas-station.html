<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gas Station Visualizer</title>
    <link rel="stylesheet" href="../shared/clay-visualizer.css" />
    <style>
      .vis-presets { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; margin-bottom: 0.75rem; }
      .vis-preset-label { font-size: 0.75rem; color: var(--text-muted); }

      .vis-status-bar {
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 0.45rem;
        margin-bottom: 0.75rem;
      }

      .vis-status-group { display: flex; gap: 0.45rem; flex-wrap: wrap; }

      .vis-pill {
        background: var(--bg-card);
        border: var(--border-clay);
        box-shadow: var(--shadow-clay-subtle);
        border-radius: 999px;
        padding: 0.22rem 0.7rem;
        font-family: var(--font-code);
        font-size: 0.75rem;
      }

      .vis-pill--ok { background: var(--vis-active); font-weight: 600; }
      .vis-pill--warn { background: var(--vis-swapping); font-weight: 600; }

      .vis-canvas {
        flex-direction: column;
        align-items: stretch;
        justify-content: center;
        gap: 0.85rem;
        min-height: 220px;
        padding: 1.15rem;
      }

      .station-grid {
        display: grid;
        gap: 0.55rem;
      }

      .station-card {
        border-radius: var(--border-radius-sm);
        background: rgba(255, 255, 255, 0.74);
        border: var(--border-clay);
        box-shadow: var(--shadow-clay-subtle);
        padding: 0.55rem 0.45rem;
        text-align: center;
        font-family: var(--font-code);
        font-size: 0.74rem;
        transition: all 220ms ease;
      }

      .station-card--start { box-shadow: 0 0 0 2px #15803d, var(--shadow-clay-subtle); }
      .station-card--current { background: var(--vis-comparing); transform: translateY(-2px); }
      .station-card--reset { background: var(--vis-swapping); }
      .station-card--ok { background: var(--vis-active); }

      .station-idx { font-weight: 700; margin-bottom: 0.2rem; }
      .station-net { font-weight: 700; margin-top: 0.2rem; }
    </style>
  </head>
  <body>
    <div class="visualizer">
      <div class="vis-input">
        <input id="gas-input" class="vis-input__field" type="text" value="1, 2, 3, 4, 5" placeholder="gas: 1, 2, 3, 4, 5" aria-label="Gas amounts" />
        <input id="cost-input" class="vis-input__field" type="text" value="3, 4, 5, 1, 2" placeholder="cost: 3, 4, 5, 1, 2" aria-label="Travel costs" />
        <button id="btn-apply" class="vis-btn vis-btn--primary" type="button">Load &amp; Run</button>
      </div>

      <div class="vis-presets">
        <span class="vis-preset-label">Presets:</span>
        <button class="vis-btn" type="button" data-gas="1, 2, 3, 4, 5" data-cost="3, 4, 5, 1, 2">Valid (Start 3)</button>
        <button class="vis-btn" type="button" data-gas="2, 3, 4" data-cost="3, 4, 3">Impossible (-1)</button>
        <button class="vis-btn" type="button" data-gas="5, 1, 2, 3, 4" data-cost="4, 4, 1, 5, 1">Reset Twice (Start 4)</button>
      </div>

      <div class="vis-controls">
        <button class="vis-btn vis-btn-reset" type="button">Reset</button>
        <button class="vis-btn vis-btn-step-back" type="button">Back</button>
        <button class="vis-btn vis-btn--primary vis-btn-play" type="button">Play</button>
        <button class="vis-btn vis-btn--primary vis-btn-pause" type="button" style="display: none;">Pause</button>
        <button class="vis-btn vis-btn-step-forward" type="button">Next</button>
        <span class="vis-step-counter">No steps</span>
        <label class="vis-speed"><span>Speed</span><input class="vis-speed-slider" type="range" min="1" max="10" value="6" /></label>
      </div>

      <div class="vis-legend">
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-comparing);"></span> Current Station</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-active);"></span> Positive Tank Run</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-swapping);"></span> Tank &lt; 0 (Reset Start)</span>
      </div>

      <div class="vis-status-bar">
        <div class="vis-status-group">
          <span id="pill-start" class="vis-pill vis-pill--ok">start: 0</span>
          <span id="pill-tank" class="vis-pill">tank: 0</span>
        </div>
        <span id="pill-total" class="vis-pill">total: 0</span>
      </div>

      <div class="vis-canvas">
        <div id="station-grid" class="station-grid"></div>
      </div>

      <div id="vis-info" class="vis-info" style="margin-bottom: 1rem;">Enter gas and cost arrays of equal length, then press Play.</div>
      <div class="vis-code" id="vis-code"></div>
    </div>

    <script src="../shared/visualizer-base.js"></script>
    <script>
      const PYTHON_LINES = [
        'def can_complete_circuit(gas: list[int], cost: list[int]) -> int:',
        '    total = 0',
        '    tank = 0',
        '    start = 0',
        '    for idx, (fill, burn) in enumerate(zip(gas, cost)):',
        '        net = fill - burn',
        '        total += net',
        '        tank += net',
        '        if tank < 0:',
        '            start = idx + 1',
        '            tank = 0',
        '    return start if total >= 0 else -1',
      ];

      const gasInput = document.getElementById('gas-input');
      const costInput = document.getElementById('cost-input');
      const gridEl = document.getElementById('station-grid');
      const pillStart = document.getElementById('pill-start');
      const pillTank = document.getElementById('pill-tank');
      const pillTotal = document.getElementById('pill-total');
      const infoEl = document.getElementById('vis-info');
      const codeEl = document.getElementById('vis-code');

      function renderCode(activeLine = -1) {
        codeEl.innerHTML = PYTHON_LINES.map((line, i) => {
          const active = i === activeLine ? ' vis-code__line--active' : '';
          const esc = line.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          return `<span class="vis-code__line${active}"><span class="vis-code__line-number">${i + 1}</span>${esc}</span>`;
        }).join('');
      }

      const viz = new VisualizerEngine({
        defaultSpeed: 650,
        render: (step) => {
          const n = step.gas.length;
          gridEl.style.gridTemplateColumns = `repeat(${n}, minmax(74px, 1fr))`;
          gridEl.innerHTML = step.gas.map((g, i) => {
            const c = step.cost[i];
            const net = g - c;
            let cls = 'station-card';
            if (i === step.resetAt) cls += ' station-card--reset';
            else if (i === step.activeIdx) cls += ' station-card--current';
            else if (i >= step.start && i <= step.visitedEnd && step.total >= -999999) cls += ' station-card--ok';
            if (i === step.start) cls += ' station-card--start';
            return `
              <div class="${cls}">
                <div class="station-idx">#${i}${i === step.start ? ' (start)' : ''}</div>
                <div>+${g} / -${c}</div>
                <div class="station-net">net ${net >= 0 ? '+' : ''}${net}</div>
              </div>
            `;
          }).join('');

          pillStart.textContent = `start: ${step.start}`;
          pillTank.textContent = `tank: ${step.tank}`;
          pillTank.className = `vis-pill${step.resetAt !== -1 ? ' vis-pill--warn' : ''}`;
          pillTotal.textContent = `total: ${step.total}`;
          pillTotal.className = `vis-pill ${step.done ? (step.total >= 0 ? 'vis-pill--ok' : 'vis-pill--warn') : ''}`;
          infoEl.textContent = step.description;
        },
        highlightCode: (line) => renderCode(line),
      });

      function buildSteps(gas, cost) {
        viz.reset();
        let total = 0;
        let tank = 0;
        let start = 0;

        viz.recordStep({
          gas,
          cost,
          activeIdx: -1,
          visitedEnd: -1,
          resetAt: -1,
          start,
          tank,
          total,
          done: false,
          codeLine: 3,
          description: 'Initialize total = 0, tank = 0, candidate start = 0.',
        });

        for (let i = 0; i < gas.length; i++) {
          const net = gas[i] - cost[i];
          total += net;
          tank += net;

          viz.recordStep({
            gas,
            cost,
            activeIdx: i,
            visitedEnd: i,
            resetAt: -1,
            start,
            tank,
            total,
            done: false,
            codeLine: 7,
            description: `Station #${i}: net = ${gas[i]} - ${cost[i]} = ${net}. tank = ${tank}, total = ${total}.`,
          });

          if (tank < 0) {
            start = i + 1;
            tank = 0;
            viz.recordStep({
              gas,
              cost,
              activeIdx: i,
              visitedEnd: i,
              resetAt: i,
              start,
              tank,
              total,
              done: false,
              codeLine: 9,
              description: `tank < 0! Discard earlier starts; set start = ${start}, reset tank = 0.`,
            });
          }
        }

        viz.recordStep({
          gas,
          cost,
          activeIdx: -1,
          visitedEnd: gas.length - 1,
          resetAt: -1,
          start,
          tank,
          total,
          done: true,
          codeLine: 11,
          description: total >= 0
            ? `total (${total}) >= 0, so valid starting station is ${start}.`
            : `total (${total}) < 0, impossible to complete circuit: return -1.`,
        });

        viz.goToStep(0);
      }

      function parseAndRun() {
        const gas = gasInput.value.split(',').map((s) => parseInt(s.trim(), 10)).filter(Number.isFinite).slice(0, 10);
        const cost = costInput.value.split(',').map((s) => parseInt(s.trim(), 10)).filter(Number.isFinite).slice(0, 10);
        if (!gas.length || gas.length !== cost.length) {
          infoEl.textContent = 'Enter matching comma-separated integers for gas and cost.';
          return;
        }
        buildSteps(gas, cost);
      }

      document.getElementById('btn-apply').addEventListener('click', parseAndRun);
      document.querySelectorAll('[data-gas]').forEach((btn) => {
        btn.addEventListener('click', () => {
          gasInput.value = btn.getAttribute('data-gas') || '';
          costInput.value = btn.getAttribute('data-cost') || '';
          parseAndRun();
        });
      });

      viz.bindControls();
      renderCode();
      parseAndRun();
    </script>
  </body>
</html>
