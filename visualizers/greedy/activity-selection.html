<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Activity Selection Visualizer</title>
    <link rel="stylesheet" href="../shared/clay-visualizer.css" />
    <style>
      .vis-presets { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; margin-bottom: 0.75rem; }
      .vis-preset-label { font-size: 0.75rem; color: var(--text-muted); }

      .vis-status-bar {
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 0.45rem;
        margin-bottom: 0.75rem;
      }

      .vis-pill {
        background: var(--bg-card);
        border: var(--border-clay);
        box-shadow: var(--shadow-clay-subtle);
        border-radius: 999px;
        padding: 0.22rem 0.7rem;
        font-family: var(--font-code);
        font-size: 0.75rem;
      }

      .vis-pill--ok { background: var(--vis-active); font-weight: 600; }

      .vis-canvas {
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-start;
        gap: 0.55rem;
        min-height: 240px;
        padding: 1.15rem;
      }

      .timeline-axis {
        position: relative;
        height: 22px;
        border-bottom: 1px dashed rgba(90, 90, 90, 0.35);
        font-family: var(--font-code);
        font-size: 0.68rem;
        color: var(--text-muted);
        margin-bottom: 0.25rem;
      }

      .timeline-tick {
        position: absolute;
        transform: translateX(-50%);
      }

      .interval-track {
        position: relative;
        height: 30px;
        background: rgba(255, 255, 255, 0.38);
        border-radius: 8px;
      }

      .interval-bar {
        position: absolute;
        top: 3px;
        height: 24px;
        border-radius: 7px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-code);
        font-size: 0.72rem;
        font-weight: 600;
        background: rgba(255, 255, 255, 0.8);
        border: var(--border-clay);
        box-shadow: var(--shadow-clay-subtle);
        transition: all 220ms ease;
        white-space: nowrap;
        overflow: hidden;
        padding: 0 0.35rem;
      }

      .interval-bar--testing { background: var(--vis-comparing); transform: scale(1.02); z-index: 2; }
      .interval-bar--accepted { background: var(--vis-active); }
      .interval-bar--rejected { background: var(--vis-swapping); opacity: 0.68; }

      .cutoff-line {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 2px;
        background: #15803d;
        opacity: 0.65;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="visualizer">
      <div class="vis-input">
        <input id="intervals-input" class="vis-input__field" type="text" value="1-4, 3-5, 0-6, 5-7, 8-9, 5-9" placeholder="start-end pairs: 1-4, 3-5, 5-7" aria-label="Intervals" />
        <button id="btn-apply" class="vis-btn vis-btn--primary" type="button">Load &amp; Run</button>
      </div>

      <div class="vis-presets">
        <span class="vis-preset-label">Presets:</span>
        <button class="vis-btn" type="button" data-intervals="1-4, 3-5, 0-6, 5-7, 8-9, 5-9">6 Activities</button>
        <button class="vis-btn" type="button" data-intervals="1-10, 2-3, 4-5, 6-7">Short Beats Long</button>
        <button class="vis-btn" type="button" data-intervals="0-2, 1-3, 2-4, 3-5, 4-6">Chain Touching</button>
      </div>

      <div class="vis-controls">
        <button class="vis-btn vis-btn-reset" type="button">Reset</button>
        <button class="vis-btn vis-btn-step-back" type="button">Back</button>
        <button class="vis-btn vis-btn--primary vis-btn-play" type="button">Play</button>
        <button class="vis-btn vis-btn--primary vis-btn-pause" type="button" style="display: none;">Pause</button>
        <button class="vis-btn vis-btn-step-forward" type="button">Next</button>
        <span class="vis-step-counter">No steps</span>
        <label class="vis-speed"><span>Speed</span><input class="vis-speed-slider" type="range" min="1" max="10" value="6" /></label>
      </div>

      <div class="vis-legend">
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-comparing);"></span> Testing</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-active);"></span> Selected</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-swapping);"></span> Overlaps (Skipped)</span>
      </div>

      <div class="vis-status-bar">
        <span id="pill-last" class="vis-pill">last_end: -∞</span>
        <span id="pill-count" class="vis-pill vis-pill--ok">Selected: 0</span>
      </div>

      <div class="vis-canvas" id="timeline-canvas"></div>

      <div id="vis-info" class="vis-info" style="margin-bottom: 1rem;">Enter start-end intervals and press Play to trace earliest-end selection.</div>
      <div class="vis-code" id="vis-code"></div>
    </div>

    <script src="../shared/visualizer-base.js"></script>
    <script>
      const PYTHON_LINES = [
        'def activity_selection(intervals: list[tuple[int, int]]) -> list[tuple[int, int]]:',
        '    ordered = sorted(intervals, key=lambda interval: interval[1])',
        '    selected: list[tuple[int, int]] = []',
        '    last_end = float("-inf")',
        '    for start, end in ordered:',
        '        if start >= last_end:',
        '            selected.append((start, end))',
        '            last_end = end',
        '    return selected',
      ];

      const inputEl = document.getElementById('intervals-input');
      const canvasEl = document.getElementById('timeline-canvas');
      const pillLast = document.getElementById('pill-last');
      const pillCount = document.getElementById('pill-count');
      const infoEl = document.getElementById('vis-info');
      const codeEl = document.getElementById('vis-code');

      function renderCode(activeLine = -1) {
        codeEl.innerHTML = PYTHON_LINES.map((line, i) => {
          const active = i === activeLine ? ' vis-code__line--active' : '';
          const esc = line.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          return `<span class="vis-code__line${active}"><span class="vis-code__line-number">${i + 1}</span>${esc}</span>`;
        }).join('');
      }

      const viz = new VisualizerEngine({
        defaultSpeed: 650,
        render: (step) => {
          const span = Math.max(1, step.maxT - step.minT);
          const pct = (t) => ((t - step.minT) / span) * 100;

          const ticks = [];
          const stepTick = Math.max(1, Math.ceil(span / 8));
          for (let t = step.minT; t <= step.maxT; t += stepTick) {
            ticks.push(`<span class="timeline-tick" style="left: ${pct(t)}%">${t}</span>`);
          }

          const rows = step.ordered.map((iv, idx) => {
            const left = pct(iv.start);
            const width = Math.max(4, pct(iv.end) - left);
            const state = step.states[idx];
            let cls = 'interval-bar';
            if (idx === step.activeIdx) cls += ' interval-bar--testing';
            else if (state === 'accepted') cls += ' interval-bar--accepted';
            else if (state === 'rejected') cls += ' interval-bar--rejected';

            const cutoff = step.lastEnd !== null
              ? `<div class="cutoff-line" style="left: ${pct(step.lastEnd)}%"></div>`
              : '';

            return `
              <div class="interval-track">
                ${cutoff}
                <div class="${cls}" style="left: ${left}%; width: ${width}%">[${iv.start}, ${iv.end}]</div>
              </div>
            `;
          }).join('');

          canvasEl.innerHTML = `<div class="timeline-axis">${ticks.join('')}</div>${rows}`;
          pillLast.textContent = `last_end: ${step.lastEnd === null ? '-∞' : step.lastEnd}`;
          pillCount.textContent = `Selected: ${step.selectedCount}`;
          infoEl.textContent = step.description;
        },
        highlightCode: (line) => renderCode(line),
      });

      function buildSteps(intervals) {
        viz.reset();
        const ordered = [...intervals].sort((a, b) => a.end - b.end || a.start - b.start);
        const minT = Math.min(...ordered.map((x) => x.start));
        const maxT = Math.max(...ordered.map((x) => x.end));
        const states = Array(ordered.length).fill('idle');
        let lastEnd = null;
        let selectedCount = 0;

        viz.recordStep({
          ordered,
          minT,
          maxT,
          states,
          activeIdx: -1,
          lastEnd,
          selectedCount,
          codeLine: 1,
          description: `Sorted ${ordered.length} intervals by end time ascending.`,
        });

        for (let i = 0; i < ordered.length; i++) {
          const iv = ordered[i];
          viz.recordStep({
            ordered,
            minT,
            maxT,
            states,
            activeIdx: i,
            lastEnd,
            selectedCount,
            codeLine: 5,
            description: `Check [${iv.start}, ${iv.end}]: is start ${iv.start} >= last_end (${lastEnd === null ? '-∞' : lastEnd})?`,
          });

          if (lastEnd === null || iv.start >= lastEnd) {
            states[i] = 'accepted';
            lastEnd = iv.end;
            selectedCount += 1;
            viz.recordStep({
              ordered,
              minT,
              maxT,
              states,
              activeIdx: -1,
              lastEnd,
              selectedCount,
              codeLine: 6,
              description: `Accept [${iv.start}, ${iv.end}]. Update last_end = ${lastEnd}.`,
            });
          } else {
            states[i] = 'rejected';
            viz.recordStep({
              ordered,
              minT,
              maxT,
              states,
              activeIdx: -1,
              lastEnd,
              selectedCount,
              codeLine: 4,
              description: `Skip [${iv.start}, ${iv.end}] because ${iv.start} < ${lastEnd} overlaps.`,
            });
          }
        }

        viz.recordStep({
          ordered,
          minT,
          maxT,
          states,
          activeIdx: -1,
          lastEnd,
          selectedCount,
          codeLine: 8,
          description: `Done! Selected ${selectedCount} non-overlapping activities.`,
        });

        viz.goToStep(0);
      }

      function parseAndRun() {
        const intervals = inputEl.value
          .split(',')
          .map((tok) => {
            const [s, e] = tok.split('-').map((n) => parseInt(n.trim(), 10));
            return { start: s, end: e };
          })
          .filter((iv) => Number.isFinite(iv.start) && Number.isFinite(iv.end) && iv.start < iv.end)
          .slice(0, 9);
        if (!intervals.length) {
          infoEl.textContent = 'Enter valid intervals like 1-4, 3-5, 5-7 where start < end.';
          return;
        }
        buildSteps(intervals);
      }

      document.getElementById('btn-apply').addEventListener('click', parseAndRun);
      document.querySelectorAll('[data-intervals]').forEach((btn) => {
        btn.addEventListener('click', () => {
          inputEl.value = btn.getAttribute('data-intervals') || '';
          parseAndRun();
        });
      });

      viz.bindControls();
      renderCode();
      parseAndRun();
    </script>
  </body>
</html>
