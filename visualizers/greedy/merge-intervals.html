<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Merge Intervals Visualizer</title>
    <link rel="stylesheet" href="../shared/clay-visualizer.css" />
    <style>
      .vis-presets { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; margin-bottom: 0.75rem; }
      .vis-preset-label { font-size: 0.75rem; color: var(--text-muted); }

      .vis-status-bar {
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 0.45rem;
        margin-bottom: 0.75rem;
      }

      .vis-pill {
        background: var(--bg-card);
        border: var(--border-clay);
        box-shadow: var(--shadow-clay-subtle);
        border-radius: 999px;
        padding: 0.22rem 0.7rem;
        font-family: var(--font-code);
        font-size: 0.75rem;
      }

      .vis-pill--ok { background: var(--vis-active); font-weight: 600; }

      .vis-canvas {
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-start;
        gap: 0.85rem;
        min-height: 250px;
        padding: 1.15rem;
      }

      .sub-label {
        font-size: 0.72rem;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-bottom: 0.35rem;
      }

      .timeline-axis {
        position: relative;
        height: 20px;
        border-bottom: 1px dashed rgba(90, 90, 90, 0.35);
        font-family: var(--font-code);
        font-size: 0.68rem;
        color: var(--text-muted);
        margin-bottom: 0.35rem;
      }

      .timeline-tick { position: absolute; transform: translateX(-50%); }

      .track {
        position: relative;
        height: 28px;
        background: rgba(255, 255, 255, 0.4);
        border-radius: 8px;
        margin-bottom: 0.3rem;
      }

      .bar {
        position: absolute;
        top: 3px;
        height: 22px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-code);
        font-size: 0.72rem;
        font-weight: 600;
        background: rgba(255, 255, 255, 0.82);
        border: var(--border-clay);
        box-shadow: var(--shadow-clay-subtle);
        transition: all 220ms ease;
      }

      .bar--active { background: var(--vis-comparing); }
      .bar--merged { background: var(--vis-active); }
      .bar--done { background: var(--vis-sorted); }
    </style>
  </head>
  <body>
    <div class="visualizer">
      <div class="vis-input">
        <input id="intervals-input" class="vis-input__field" type="text" value="1-3, 2-6, 8-10, 15-18, 9-12" placeholder="start-end pairs: 1-3, 2-6, 8-10" aria-label="Intervals" />
        <button id="btn-apply" class="vis-btn vis-btn--primary" type="button">Load &amp; Run</button>
      </div>

      <div class="vis-presets">
        <span class="vis-preset-label">Presets:</span>
        <button class="vis-btn" type="button" data-intervals="1-3, 2-6, 8-10, 15-18, 9-12">Standard Overlap</button>
        <button class="vis-btn" type="button" data-intervals="1-10, 2-4, 5-7, 8-9">Nested Inside</button>
        <button class="vis-btn" type="button" data-intervals="1-3, 3-5, 5-8">Touching Endpoints</button>
      </div>

      <div class="vis-controls">
        <button class="vis-btn vis-btn-reset" type="button">Reset</button>
        <button class="vis-btn vis-btn-step-back" type="button">Back</button>
        <button class="vis-btn vis-btn--primary vis-btn-play" type="button">Play</button>
        <button class="vis-btn vis-btn--primary vis-btn-pause" type="button" style="display: none;">Pause</button>
        <button class="vis-btn vis-btn-step-forward" type="button">Next</button>
        <span class="vis-step-counter">No steps</span>
        <label class="vis-speed"><span>Speed</span><input class="vis-speed-slider" type="range" min="1" max="10" value="6" /></label>
      </div>

      <div class="vis-legend">
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-comparing);"></span> Current Interval</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-active);"></span> Active Merged Block</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-sorted);"></span> Processed</span>
      </div>

      <div class="vis-status-bar">
        <span id="pill-last" class="vis-pill">merged[-1]: -</span>
        <span id="pill-count" class="vis-pill vis-pill--ok">Merged Blocks: 0</span>
      </div>

      <div class="vis-canvas">
        <div>
          <div class="sub-label">Sorted Input Intervals</div>
          <div id="input-stage"></div>
        </div>
        <div>
          <div class="sub-label">Merged Output Blocks</div>
          <div id="merged-stage"></div>
        </div>
      </div>

      <div id="vis-info" class="vis-info" style="margin-bottom: 1rem;">Enter intervals and press Play to trace start-sorted merging.</div>
      <div class="vis-code" id="vis-code"></div>
    </div>

    <script src="../shared/visualizer-base.js"></script>
    <script>
      const PYTHON_LINES = [
        'def merge_intervals(intervals: list[tuple[int, int]]) -> list[tuple[int, int]]:',
        '    if not intervals:',
        '        return []',
        '    ordered = sorted(intervals, key=lambda item: item[0])',
        '    merged: list[tuple[int, int]] = [ordered[0]]',
        '    for start, end in ordered[1:]:',
        '        prev_start, prev_end = merged[-1]',
        '        if start <= prev_end:',
        '            merged[-1] = (prev_start, max(prev_end, end))',
        '        else:',
        '            merged.append((start, end))',
        '    return merged',
      ];

      const inputEl = document.getElementById('intervals-input');
      const inputStage = document.getElementById('input-stage');
      const mergedStage = document.getElementById('merged-stage');
      const pillLast = document.getElementById('pill-last');
      const pillCount = document.getElementById('pill-count');
      const infoEl = document.getElementById('vis-info');
      const codeEl = document.getElementById('vis-code');

      function renderCode(activeLine = -1) {
        codeEl.innerHTML = PYTHON_LINES.map((line, i) => {
          const active = i === activeLine ? ' vis-code__line--active' : '';
          const esc = line.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          return `<span class="vis-code__line${active}"><span class="vis-code__line-number">${i + 1}</span>${esc}</span>`;
        }).join('');
      }

      const viz = new VisualizerEngine({
        defaultSpeed: 650,
        render: (step) => {
          const span = Math.max(1, step.maxT - step.minT);
          const pct = (t) => ((t - step.minT) / span) * 100;

          const ticks = [];
          const tickStep = Math.max(1, Math.ceil(span / 8));
          for (let t = step.minT; t <= step.maxT; t += tickStep) {
            ticks.push(`<span class="timeline-tick" style="left: ${pct(t)}%">${t}</span>`);
          }

          inputStage.innerHTML = `<div class="timeline-axis">${ticks.join('')}</div>` + step.ordered.map((iv, idx) => {
            const left = pct(iv.start);
            const width = Math.max(5, pct(iv.end) - left);
            let cls = 'bar';
            if (idx === step.activeIdx) cls += ' bar--active';
            else if (idx < step.processedCount) cls += ' bar--done';
            return `<div class="track"><div class="${cls}" style="left: ${left}%; width: ${width}%">[${iv.start}, ${iv.end}]</div></div>`;
          }).join('');

          mergedStage.innerHTML = step.merged.map((iv, idx) => {
            const left = pct(iv.start);
            const width = Math.max(5, pct(iv.end) - left);
            const cls = idx === step.merged.length - 1 ? 'bar bar--merged' : 'bar bar--done';
            return `<div class="track"><div class="${cls}" style="left: ${left}%; width: ${width}%">[${iv.start}, ${iv.end}]</div></div>`;
          }).join('');

          const tail = step.merged[step.merged.length - 1];
          pillLast.textContent = tail ? `merged[-1]: [${tail.start}, ${tail.end}]` : 'merged[-1]: -';
          pillCount.textContent = `Merged Blocks: ${step.merged.length}`;
          infoEl.textContent = step.description;
        },
        highlightCode: (line) => renderCode(line),
      });

      function buildSteps(intervals) {
        viz.reset();
        const ordered = [...intervals].sort((a, b) => a.start - b.start || a.end - b.end);
        const minT = Math.min(...ordered.map((x) => x.start));
        const maxT = Math.max(...ordered.map((x) => x.end));
        const merged = [{ ...ordered[0] }];

        viz.recordStep({
          ordered,
          minT,
          maxT,
          merged,
          activeIdx: 0,
          processedCount: 1,
          codeLine: 4,
          description: `Sort by start time and seed merged with [${ordered[0].start}, ${ordered[0].end}].`,
        });

        for (let i = 1; i < ordered.length; i++) {
          const iv = ordered[i];
          const prev = merged[merged.length - 1];

          viz.recordStep({
            ordered,
            minT,
            maxT,
            merged,
            activeIdx: i,
            processedCount: i,
            codeLine: 7,
            description: `Check [${iv.start}, ${iv.end}] against merged[-1] = [${prev.start}, ${prev.end}].`,
          });

          if (iv.start <= prev.end) {
            prev.end = Math.max(prev.end, iv.end);
            viz.recordStep({
              ordered,
              minT,
              maxT,
              merged,
              activeIdx: i,
              processedCount: i + 1,
              codeLine: 8,
              description: `${iv.start} <= ${prev.end}: merge into [${prev.start}, ${prev.end}].`,
            });
          } else {
            merged.push({ ...iv });
            viz.recordStep({
              ordered,
              minT,
              maxT,
              merged,
              activeIdx: i,
              processedCount: i + 1,
              codeLine: 10,
              description: `${iv.start} > ${prev.end}: no overlap, append [${iv.start}, ${iv.end}].`,
            });
          }
        }

        viz.recordStep({
          ordered,
          minT,
          maxT,
          merged,
          activeIdx: -1,
          processedCount: ordered.length,
          codeLine: 11,
          description: `Done! Reduced ${ordered.length} intervals into ${merged.length} merged blocks.`,
        });

        viz.goToStep(0);
      }

      function parseAndRun() {
        const intervals = inputEl.value
          .split(',')
          .map((tok) => {
            const [s, e] = tok.split('-').map((n) => parseInt(n.trim(), 10));
            return { start: s, end: e };
          })
          .filter((iv) => Number.isFinite(iv.start) && Number.isFinite(iv.end) && iv.start <= iv.end)
          .slice(0, 8);
        if (!intervals.length) {
          infoEl.textContent = 'Enter valid intervals like 1-3, 2-6, 8-10.';
          return;
        }
        buildSteps(intervals);
      }

      document.getElementById('btn-apply').addEventListener('click', parseAndRun);
      document.querySelectorAll('[data-intervals]').forEach((btn) => {
        btn.addEventListener('click', () => {
          inputEl.value = btn.getAttribute('data-intervals') || '';
          parseAndRun();
        });
      });

      viz.bindControls();
      renderCode();
      parseAndRun();
    </script>
  </body>
</html>
