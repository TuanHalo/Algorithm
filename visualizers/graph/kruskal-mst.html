<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kruskal's Minimum Spanning Tree Visualizer</title>
    <link rel="stylesheet" href="../shared/clay-visualizer.css" />
    <link rel="stylesheet" href="../shared/graph-canvas.css" />
    <style>
      .vis-presets { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; margin-bottom: 0.75rem; }
      .vis-preset-label { font-size: 0.75rem; color: var(--text-muted); }
      .vis-canvas { flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 0.65rem; min-height: 340px; padding: 1rem 1.15rem; }
      .vis-status-bar { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.45rem; margin-bottom: 0.65rem; }
      .vis-pill { background: var(--bg-card); border: var(--border-clay); box-shadow: var(--shadow-clay-subtle); border-radius: 999px; padding: 0.2rem 0.65rem; font-family: var(--font-code); font-size: 0.74rem; }
    </style>
  </head>
  <body>
    <div class="visualizer">
      <div class="vis-input">
        <input id="graph-input" class="vis-input__field" type="text" value="A-B:4, A-C:2, B-C:1, B-D:5, C-D:8, C-E:10, D-E:2, D-F:6, E-F:3" placeholder="Weighted undirected edges: A-B:4, B-C:1" aria-label="Weighted undirected edges" />
        <button id="btn-apply" class="vis-btn vis-btn--primary" type="button">Load &amp; Run</button>
      </div>

      <div class="vis-presets">
        <span class="vis-preset-label">Presets:</span>
        <button class="vis-btn" type="button" data-edges="A-B:4, A-C:2, B-C:1, B-D:5, C-D:8, C-E:10, D-E:2, D-F:6, E-F:3">6-Node Network</button>
        <button class="vis-btn" type="button" data-edges="A-B:1, B-C:4, C-D:2, A-D:5, A-C:3, B-D:6">4-Node Square</button>
      </div>

      <div class="vis-controls">
        <button class="vis-btn vis-btn-reset" type="button">Reset</button>
        <button class="vis-btn vis-btn-step-back" type="button">Back</button>
        <button class="vis-btn vis-btn--primary vis-btn-play" type="button">Play</button>
        <button class="vis-btn vis-btn--primary vis-btn-pause" type="button" style="display: none;">Pause</button>
        <button class="vis-btn vis-btn-step-forward" type="button">Next</button>
        <span class="vis-step-counter">No steps</span>
        <label class="vis-speed"><span>Speed</span><input class="vis-speed-slider" type="range" min="1" max="10" value="6" /></label>
      </div>

      <div class="vis-status-bar">
        <span id="status-cost" class="vis-pill">MST Total Weight: 0</span>
        <span id="status-edges" class="vis-pill">Edges Picked: 0</span>
      </div>

      <div class="vis-canvas">
        <div id="graph-toolbar" class="g-toolbar"></div>
        <div id="graph-stage"></div>
        <div class="g-aux-row">
          <div class="g-aux-box">
            <div class="g-aux-box__title">Edges Sorted by Weight</div>
            <div id="sorted-edges-view" class="g-chip-list"></div>
          </div>
        </div>
      </div>

      <div id="vis-info" class="vis-info" style="margin-bottom: 1rem;">Kruskal sorts all edges cheapest first and uses Union-Find to skip any edge that closes a loop.</div>
      <div class="vis-code" id="vis-code"></div>
    </div>

    <script src="../shared/visualizer-base.js"></script>
    <script src="../shared/graph-canvas.js"></script>
    <script>
      const PYTHON_LINES = [
        'def kruskal_mst(nodes: list[str], edges: list[tuple[int, str, str]]) -> list[tuple[str, str, int]]:',
        '    parent = {u: u for u in nodes}',
        '    def find(x: str) -> str:',
        '        while parent[x] != x: x = parent[x]',
        '        return x',
        '    mst = []',
        '    for w, u, v in sorted(edges):',
        '        ru, rv = find(u), find(v)',
        '        if ru != rv:',
        '            parent[rv] = ru',
        '            mst.append((u, v, w))',
        '    return mst',
      ];

      const codeEl = document.getElementById('vis-code');
      const infoEl = document.getElementById('vis-info');
      const inputEl = document.getElementById('graph-input');
      const edgesView = document.getElementById('sorted-edges-view');
      const costPill = document.getElementById('status-cost');
      const edgesPill = document.getElementById('status-edges');

      function renderCode(activeLine = -1) {
        codeEl.innerHTML = PYTHON_LINES.map((line, i) => {
          const active = i === activeLine ? ' vis-code__line--active' : '';
          const esc = line.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          return `<span class="vis-code__line${active}"><span class="vis-code__line-number">${i + 1}</span>${esc}</span>`;
        }).join('');
      }

      const canvas = new GraphCanvas({
        stageEl: document.getElementById('graph-stage'),
        toolbarEl: document.getElementById('graph-toolbar'),
        directed: false,
        weighted: true,
        defaultWeight: 3,
        onChange: (serialized) => { inputEl.value = serialized; buildSteps(); },
        onSelectNode: () => { buildSteps(); },
      });

      const viz = new VisualizerEngine({
        defaultSpeed: 650,
        render: (step) => {
          canvas.render(step.graphState);
          infoEl.textContent = step.description;
          costPill.textContent = `MST Total Weight: ${step.totalCost}`;
          edgesPill.textContent = `Edges Picked: ${step.pickedCount} / ${Math.max(0, step.nodeCount - 1)}`;

          edgesView.innerHTML = step.sortedEdges
            .map((e, i) => {
              const cls = i === step.activeIdx ? ' g-chip--active' : e.status === 'mst' ? ' g-chip--done' : e.status === 'skip' ? ' g-chip--warn' : '';
              return `<span class="g-chip${cls}">${e.from}-${e.to}:${e.weight}</span>`;
            })
            .join('') || '<span style="color:var(--text-muted);font-size:0.72rem;">no edges</span>';
        },
        highlightCode: renderCode,
      });

      viz.bindControls();

      function buildSteps() {
        viz.reset();
        const nodes = canvas.nodes.map((n) => n.id);
        if (!nodes.length) return;

        const sortedEdges = canvas.edges
          .map((e) => ({ from: e.from, to: e.to, weight: Number(e.weight ?? 1), status: 'pending' }))
          .sort((a, b) => a.weight - b.weight || a.from.localeCompare(b.from));

        const parent = {};
        nodes.forEach((n) => { parent[n] = n; });
        const find = (x) => {
          while (parent[x] !== x) x = parent[x];
          return x;
        };

        let totalCost = 0;
        let pickedCount = 0;

        const snap = (activeIdx, codeLine, description) => {
          const roots = Array.from(new Set(nodes.map((n) => find(n))));
          const nodeStates = {};
          const nodeBadges = {};
          nodes.forEach((n) => {
            const r = find(n);
            nodeStates[n] = `comp${roots.indexOf(r) % 5}`;
            nodeBadges[n] = `set:${r}`;
          });
          const edgeStates = {};
          sortedEdges.forEach((e, i) => {
            const key = GraphCanvas.edgeKey(e.from, e.to, false);
            if (i === activeIdx) edgeStates[key] = 'exploring';
            else if (e.status === 'mst') edgeStates[key] = 'mst';
            else if (e.status === 'skip') edgeStates[key] = 'skip';
          });

          viz.recordStep({
            sortedEdges: sortedEdges.map((x) => ({ ...x })),
            activeIdx,
            totalCost,
            pickedCount,
            nodeCount: nodes.length,
            graphState: { nodeStates, nodeBadges, edgeStates },
            codeLine,
            description,
          });
        };

        snap(-1, 6, `Sort all ${sortedEdges.length} edges by weight ascending.`);

        for (let i = 0; i < sortedEdges.length; i++) {
          const e = sortedEdges[i];
          snap(i, 7, `Check cheapest remaining edge ${e.from} - ${e.to} (weight ${e.weight}).`);
          const ru = find(e.from);
          const rv = find(e.to);
          if (ru !== rv) {
            parent[rv] = ru;
            e.status = 'mst';
            totalCost += e.weight;
            pickedCount += 1;
            snap(i, 10, `Accept ${e.from} - ${e.to} (w=${e.weight}): merges sets ${ru} and ${rv}. Total = ${totalCost}.`);
          } else {
            e.status = 'skip';
            snap(i, 8, `Skip ${e.from} - ${e.to} (w=${e.weight}): both share root ${ru}, so adding it forms a cycle.`);
          }
        }

        snap(-1, 11, `Kruskal complete. MST uses ${pickedCount} edges with total weight ${totalCost}.`);
        viz.goToStep(0);
      }

      function loadFromInput() {
        const parsed = GraphCanvas.parseEdgeList(inputEl.value, { directed: false, weighted: true, defaultWeight: 1 });
        canvas.loadGraph(parsed.nodes, parsed.edges);
        buildSteps();
      }

      document.getElementById('btn-apply').addEventListener('click', loadFromInput);
      document.querySelectorAll('[data-edges]').forEach((btn) => {
        btn.addEventListener('click', () => {
          inputEl.value = btn.dataset.edges;
          loadFromInput();
        });
      });

      renderCode();
      loadFromInput();
    </script>
  </body>
</html>
