<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Topological Sort (Kahn's Algorithm) Visualizer</title>
    <link rel="stylesheet" href="../shared/clay-visualizer.css" />
    <link rel="stylesheet" href="../shared/graph-canvas.css" />
    <style>
      .vis-presets { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; margin-bottom: 0.75rem; }
      .vis-preset-label { font-size: 0.75rem; color: var(--text-muted); }
      .vis-canvas { flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 0.65rem; min-height: 340px; padding: 1rem 1.15rem; }
      .vis-status-bar { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.45rem; margin-bottom: 0.65rem; }
      .vis-pill { background: var(--bg-card); border: var(--border-clay); box-shadow: var(--shadow-clay-subtle); border-radius: 999px; padding: 0.2rem 0.65rem; font-family: var(--font-code); font-size: 0.74rem; }
    </style>
  </head>
  <body>
    <div class="visualizer">
      <div class="vis-input">
        <input id="graph-input" class="vis-input__field" type="text" value="A->C, B->C, C->D, C->E, D->F, E->F" placeholder="Directed edges: A->B, B->C" aria-label="Directed graph edges" />
        <button id="btn-apply" class="vis-btn vis-btn--primary" type="button">Load &amp; Run</button>
      </div>

      <div class="vis-presets">
        <span class="vis-preset-label">Presets:</span>
        <button class="vis-btn" type="button" data-edges="A->C, B->C, C->D, C->E, D->F, E->F">Course Prereqs</button>
        <button class="vis-btn" type="button" data-edges="A->B, A->C, B->D, C->D, D->E">Diamond Build</button>
        <button class="vis-btn" type="button" data-edges="A->B, B->C, C->A, C->D">Cycle (Blocked)</button>
      </div>

      <div class="vis-controls">
        <button class="vis-btn vis-btn-reset" type="button">Reset</button>
        <button class="vis-btn vis-btn-step-back" type="button">Back</button>
        <button class="vis-btn vis-btn--primary vis-btn-play" type="button">Play</button>
        <button class="vis-btn vis-btn--primary vis-btn-pause" type="button" style="display: none;">Pause</button>
        <button class="vis-btn vis-btn-step-forward" type="button">Next</button>
        <span class="vis-step-counter">No steps</span>
        <label class="vis-speed"><span>Speed</span><input class="vis-speed-slider" type="range" min="1" max="10" value="6" /></label>
      </div>

      <div class="vis-status-bar">
        <span id="status-queue" class="vis-pill">Ready Queue (in=0): -</span>
        <span id="status-result" class="vis-pill">Order: -</span>
      </div>

      <div class="vis-canvas">
        <div id="graph-toolbar" class="g-toolbar"></div>
        <div id="graph-stage"></div>
        <div class="g-aux-row">
          <div class="g-aux-box">
            <div class="g-aux-box__title">In-Degree Table</div>
            <div id="indeg-view"></div>
          </div>
          <div class="g-aux-box">
            <div class="g-aux-box__title">Topological Order</div>
            <div id="order-view" class="g-chip-list"></div>
          </div>
        </div>
      </div>

      <div id="vis-info" class="vis-info" style="margin-bottom: 1rem;">Nodes with 0 incoming prerequisites enter the queue first. Add a cycle to see Kahn's algorithm stall.</div>
      <div class="vis-code" id="vis-code"></div>
    </div>

    <script src="../shared/visualizer-base.js"></script>
    <script src="../shared/graph-canvas.js"></script>
    <script>
      const PYTHON_LINES = [
        'from collections import deque',
        'def topo_sort(nodes: list[str], adj: dict[str, list[str]]) -> list[str]:',
        '    in_deg = {u: 0 for u in nodes}',
        '    for u in nodes:',
        '        for v in adj[u]: in_deg[v] += 1',
        '    queue = deque([u for u in nodes if in_deg[u] == 0])',
        '    order = []',
        '    while queue:',
        '        u = queue.popleft()',
        '        order.append(u)',
        '        for v in adj[u]:',
        '            in_deg[v] -= 1',
        '            if in_deg[v] == 0: queue.append(v)',
        '    return order if len(order) == len(nodes) else []',
      ];

      const codeEl = document.getElementById('vis-code');
      const infoEl = document.getElementById('vis-info');
      const inputEl = document.getElementById('graph-input');
      const indegView = document.getElementById('indeg-view');
      const orderView = document.getElementById('order-view');
      const queuePill = document.getElementById('status-queue');
      const resultPill = document.getElementById('status-result');

      function renderCode(activeLine = -1) {
        codeEl.innerHTML = PYTHON_LINES.map((line, i) => {
          const active = i === activeLine ? ' vis-code__line--active' : '';
          const esc = line.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          return `<span class="vis-code__line${active}"><span class="vis-code__line-number">${i + 1}</span>${esc}</span>`;
        }).join('');
      }

      const canvas = new GraphCanvas({
        stageEl: document.getElementById('graph-stage'),
        toolbarEl: document.getElementById('graph-toolbar'),
        directed: true,
        weighted: false,
        onChange: (serialized) => { inputEl.value = serialized; buildSteps(); },
        onSelectNode: () => { buildSteps(); },
      });

      const viz = new VisualizerEngine({
        defaultSpeed: 650,
        render: (step) => {
          canvas.render(step.graphState);
          infoEl.textContent = step.description;
          queuePill.textContent = `Ready Queue (in=0): [${step.queue.join(', ')}]`;
          resultPill.textContent = `Order: ${step.order.join(' -> ') || '-'}`;

          const keys = Object.keys(step.inDeg);
          indegView.innerHTML = `<table class="g-mini-table"><thead><tr>${keys.map((k) => `<th>${k}</th>`).join('')}</tr></thead><tbody><tr>${keys
            .map((k) => {
              const cls = k === step.updatedNode ? 'g-mini-cell--updated' : step.inDeg[k] === 0 ? 'g-mini-cell--active' : '';
              return `<td class="${cls}">${step.inDeg[k]}</td>`;
            })
            .join('')}</tr></tbody></table>`;

          orderView.innerHTML = step.order.length
            ? step.order.map((n, i) => `<span class="g-chip g-chip--done">${i + 1}. ${n}</span>`).join('')
            : '<span style="color:var(--text-muted);font-size:0.72rem;">none yet</span>';
        },
        highlightCode: renderCode,
      });

      viz.bindControls();

      function buildSteps() {
        viz.reset();
        const nodes = canvas.nodes.map((n) => n.id);
        if (!nodes.length) return;

        const adj = {};
        const inDeg = {};
        nodes.forEach((n) => { adj[n] = []; inDeg[n] = 0; });
        canvas.edges.forEach((e) => {
          adj[e.from].push(e.to);
          inDeg[e.to] += 1;
        });
        Object.values(adj).forEach((l) => l.sort());

        const queue = nodes.filter((u) => inDeg[u] === 0);
        const order = [];
        const removedEdges = new Set();

        const snap = (current, updatedNode, exploringEdge, codeLine, description, stuck = false) => {
          const nodeStates = {};
          const nodeBadges = {};
          nodes.forEach((n) => {
            if (stuck && !order.includes(n)) nodeStates[n] = 'conflict';
            else if (n === current) nodeStates[n] = 'active';
            else if (order.includes(n)) nodeStates[n] = 'visited';
            else if (queue.includes(n)) nodeStates[n] = 'queued';
            nodeBadges[n] = `in=${inDeg[n]}`;
          });
          const edgeStates = {};
          removedEdges.forEach((k) => { edgeStates[k] = 'skip'; });
          if (exploringEdge) edgeStates[exploringEdge] = 'exploring';

          viz.recordStep({
            inDeg: { ...inDeg },
            queue: [...queue],
            order: [...order],
            updatedNode,
            graphState: { nodeStates, nodeBadges, edgeStates },
            codeLine,
            description,
          });
        };

        snap(null, null, null, 5, `Count in-degrees. Nodes starting with in_deg == 0: [${queue.join(', ') || 'none'}].`);

        while (queue.length > 0) {
          const u = queue.shift();
          order.push(u);
          snap(u, null, null, 9, `Pop ${u} (in_deg = 0) and append it to the topological order.`);

          for (const v of adj[u]) {
            const key = GraphCanvas.edgeKey(u, v, true);
            inDeg[v] -= 1;
            removedEdges.add(key);
            if (inDeg[v] === 0) {
              queue.push(v);
              snap(u, v, key, 12, `Remove ${u} -> ${v}: ${v}'s in-degree drops to 0, so enqueue ${v}.`);
            } else {
              snap(u, v, key, 11, `Remove ${u} -> ${v}: ${v}'s in-degree drops to ${inDeg[v]}.`);
            }
          }
        }

        if (order.length < nodes.length) {
          snap(null, null, null, 13, `Stopped early after ${order.length}/${nodes.length} nodes: remaining nodes form a cycle!`, true);
        } else {
          snap(null, null, null, 13, `Valid topological order found: ${order.join(' -> ')}.`);
        }

        viz.goToStep(0);
      }

      function loadFromInput() {
        const parsed = GraphCanvas.parseEdgeList(inputEl.value, { directed: true, weighted: false });
        canvas.loadGraph(parsed.nodes, parsed.edges);
        buildSteps();
      }

      document.getElementById('btn-apply').addEventListener('click', loadFromInput);
      document.querySelectorAll('[data-edges]').forEach((btn) => {
        btn.addEventListener('click', () => {
          inputEl.value = btn.dataset.edges;
          loadFromInput();
        });
      });

      renderCode();
      loadFromInput();
    </script>
  </body>
</html>
