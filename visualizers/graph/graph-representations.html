<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Graph Representations Visualizer</title>
    <link rel="stylesheet" href="../shared/clay-visualizer.css" />
    <link rel="stylesheet" href="../shared/graph-canvas.css" />
    <style>
      .vis-presets {
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 0.75rem;
      }
      .vis-preset-label { font-size: 0.75rem; color: var(--text-muted); }
      .vis-canvas {
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-start;
        gap: 0.65rem;
        min-height: 360px;
        padding: 1rem 1.15rem;
      }
      .vis-pill {
        background: var(--bg-card);
        border: var(--border-clay);
        box-shadow: var(--shadow-clay-subtle);
        border-radius: 999px;
        padding: 0.2rem 0.65rem;
        font-family: var(--font-code);
        font-size: 0.74rem;
      }
      .vis-status-bar {
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 0.45rem;
        margin-bottom: 0.65rem;
      }
      .rep-toggle {
        display: inline-flex;
        gap: 0.35rem;
        align-items: center;
      }
      .rep-list-row {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        margin-bottom: 0.28rem;
        font-family: var(--font-code);
        font-size: 0.74rem;
      }
      .rep-list-key {
        min-width: 26px;
        font-weight: 700;
        text-align: center;
        padding: 0.14rem 0.35rem;
        border-radius: 5px;
        background: rgba(205, 180, 219, 0.45);
      }
    </style>
  </head>
  <body>
    <div class="visualizer">
      <div class="vis-input">
        <input
          id="graph-input"
          class="vis-input__field"
          type="text"
          value="A-B, A-C, B-D, C-D, D-E"
          placeholder="Edges: A-B, B-C (or A->B for directed)"
          aria-label="Graph edge list"
        />
        <div class="rep-toggle">
          <button id="btn-directed" class="vis-btn" type="button">Directed: Off</button>
          <button id="btn-apply" class="vis-btn vis-btn--primary" type="button">Load &amp; Run</button>
        </div>
      </div>

      <div class="vis-presets">
        <span class="vis-preset-label">Presets:</span>
        <button class="vis-btn" type="button" data-edges="A-B, A-C, B-D, C-D, D-E" data-dir="0">Social Graph</button>
        <button class="vis-btn" type="button" data-edges="A->B, A->C, B->D, C->D, D->A" data-dir="1">Directed Links</button>
        <button class="vis-btn" type="button" data-edges="A-B, A-C, A-D, B-C, B-D, C-D" data-dir="0">Dense K4</button>
      </div>

      <div class="vis-controls">
        <button class="vis-btn vis-btn-reset" type="button">Reset</button>
        <button class="vis-btn vis-btn-step-back" type="button">Back</button>
        <button class="vis-btn vis-btn--primary vis-btn-play" type="button">Play</button>
        <button class="vis-btn vis-btn--primary vis-btn-pause" type="button" style="display: none;">Pause</button>
        <button class="vis-btn vis-btn-step-forward" type="button">Next</button>
        <span class="vis-step-counter">No steps</span>
        <label class="vis-speed">
          <span>Speed</span>
          <input class="vis-speed-slider" type="range" min="1" max="10" value="6" />
        </label>
      </div>

      <div class="vis-status-bar">
        <span id="status-counts" class="vis-pill">V=5, E=5</span>
        <span id="status-mode" class="vis-pill">Click any node to inspect its row and bucket</span>
      </div>

      <div class="vis-canvas">
        <div id="graph-toolbar" class="g-toolbar"></div>
        <div id="graph-stage"></div>
        <div class="g-aux-row">
          <div class="g-aux-box">
            <div class="g-aux-box__title">Adjacency List (O(V + E))</div>
            <div id="adj-list-view"></div>
          </div>
          <div class="g-aux-box">
            <div class="g-aux-box__title">Adjacency Matrix (O(V²))</div>
            <div id="adj-matrix-view"></div>
          </div>
        </div>
      </div>

      <div id="vis-info" class="vis-info" style="margin-bottom: 1rem;">
        Click a node or press Play to watch edges populate the adjacency list and matrix.
      </div>

      <div class="vis-code" id="vis-code"></div>
    </div>

    <script src="../shared/visualizer-base.js"></script>
    <script src="../shared/graph-canvas.js"></script>
    <script>
      const PYTHON_LINES = [
        'def build_graph(nodes: list[str], edges: list[tuple[str, str]], directed: bool = False):',
        '    adj_list = {node: [] for node in nodes}',
        '    idx = {node: i for i, node in enumerate(nodes)}',
        '    matrix = [[0] * len(nodes) for _ in range(len(nodes))]',
        '    for u, v in edges:',
        '        adj_list[u].append(v)',
        '        matrix[idx[u]][idx[v]] = 1',
        '        if not directed:',
        '            adj_list[v].append(u)',
        '            matrix[idx[v]][idx[u]] = 1',
        '    return adj_list, matrix',
      ];

      const codeEl = document.getElementById('vis-code');
      const infoEl = document.getElementById('vis-info');
      const listView = document.getElementById('adj-list-view');
      const matrixView = document.getElementById('adj-matrix-view');
      const inputEl = document.getElementById('graph-input');
      const dirBtn = document.getElementById('btn-directed');
      const countsPill = document.getElementById('status-counts');

      function renderCode(activeLine = -1) {
        codeEl.innerHTML = PYTHON_LINES.map((line, i) => {
          const active = i === activeLine ? ' vis-code__line--active' : '';
          const esc = line.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          return `<span class="vis-code__line${active}"><span class="vis-code__line-number">${i + 1}</span>${esc}</span>`;
        }).join('');
      }

      let isDirected = false;

      const canvas = new GraphCanvas({
        stageEl: document.getElementById('graph-stage'),
        toolbarEl: document.getElementById('graph-toolbar'),
        directed: isDirected,
        weighted: false,
        onChange: (serialized) => {
          inputEl.value = serialized;
          buildSteps();
        },
        onSelectNode: (nodeId) => {
          buildSteps(nodeId);
          viz.goToStep(viz.steps.length - 1);
        },
      });

      const viz = new VisualizerEngine({
        defaultSpeed: 650,
        render: (step) => {
          canvas.render(step.graphState);
          infoEl.textContent = step.description;

          const nodes = step.nodes;
          listView.innerHTML = nodes
            .map((u) => {
              const neighbors = step.adjList[u] || [];
              const hi = step.focusNode === u ? ' g-chip--accent' : '';
              const chips = neighbors.length
                ? neighbors.map((v) => `<span class="g-chip${hi}">${v}</span>`).join('')
                : '<span style="color:var(--text-muted);font-size:0.7rem;">empty</span>';
              return `<div class="rep-list-row"><span class="rep-list-key">${u}</span><div class="g-chip-list">${chips}</div></div>`;
            })
            .join('');

          const head = `<tr><th></th>${nodes.map((n) => `<th>${n}</th>`).join('')}</tr>`;
          const rows = nodes
            .map((u, r) => {
              const cells = nodes
                .map((v, c) => {
                  const val = step.matrix[r][c];
                  const isCellActive = step.activeCells.some(([ar, ac]) => ar === r && ac === c);
                  const isRowFocus = step.focusNode === u;
                  const cls = isCellActive
                    ? 'g-mini-cell--updated'
                    : isRowFocus && val === 1
                    ? 'g-mini-cell--active'
                    : '';
                  return `<td class="${cls}">${val}</td>`;
                })
                .join('');
              return `<tr><th>${u}</th>${cells}</tr>`;
            })
            .join('');
          matrixView.innerHTML = `<table class="g-mini-table"><thead>${head}</thead><tbody>${rows}</tbody></table>`;
        },
        highlightCode: renderCode,
      });

      viz.bindControls();

      function buildSteps(focusNode = null) {
        viz.reset();
        const nodes = canvas.nodes.map((n) => n.id);
        const edges = canvas.edges;
        countsPill.textContent = `V=${nodes.length}, E=${edges.length}`;

        const adjList = {};
        const idx = {};
        nodes.forEach((n, i) => {
          adjList[n] = [];
          idx[n] = i;
        });
        const matrix = nodes.map(() => nodes.map(() => 0));

        viz.recordStep({
          nodes,
          adjList,
          matrix,
          activeCells: [],
          focusNode,
          graphState: { nodeStates: focusNode ? { [focusNode]: 'active' } : {}, edgeStates: {} },
          codeLine: 1,
          description: `Initialize ${nodes.length} empty adjacency buckets and a ${nodes.length}x${nodes.length} zero matrix.`,
        });

        for (const edge of edges) {
          const { from: u, to: v } = edge;
          const activeCells = [[idx[u], idx[v]]];
          adjList[u].push(v);
          matrix[idx[u]][idx[v]] = 1;

          const edgeStates = {};
          const key = GraphCanvas.edgeKey(u, v, isDirected);
          edgeStates[key] = 'exploring';

          if (!isDirected) {
            adjList[v].push(u);
            matrix[idx[v]][idx[u]] = 1;
            activeCells.push([idx[v], idx[u]]);
          }

          viz.recordStep({
            nodes,
            adjList,
            matrix,
            activeCells,
            focusNode,
            graphState: {
              nodeStates: { [u]: 'active', [v]: 'queued' },
              edgeStates,
            },
            codeLine: isDirected ? 6 : 9,
            description: isDirected
              ? `Add directed edge ${u} -> ${v}: append ${v} to adj[${u}] and set matrix[${u}][${v}] = 1.`
              : `Add undirected edge ${u} - ${v}: update both adj[${u}], adj[${v}] and mirror matrix entries.`,
          });
        }

        const focusStates = {};
        if (focusNode && adjList[focusNode]) {
          focusStates[focusNode] = 'visiting';
          adjList[focusNode].forEach((nb) => {
            focusStates[nb] = 'visited';
          });
        }
        viz.recordStep({
          nodes,
          adjList,
          matrix,
          activeCells: [],
          focusNode,
          graphState: { nodeStates: focusStates, edgeStates: {} },
          codeLine: 10,
          description: focusNode
            ? `Inspecting ${focusNode}: neighbors are [${(adjList[focusNode] || []).join(', ') || 'none'}].`
            : 'Both representations are built. Click any node on the canvas to highlight its neighbors.',
        });

        viz.goToStep(0);
      }

      function loadFromInput() {
        const parsed = GraphCanvas.parseEdgeList(inputEl.value, { directed: isDirected, weighted: false });
        canvas.setConfig({ directed: isDirected, weighted: false });
        canvas.loadGraph(parsed.nodes, parsed.edges);
        buildSteps();
      }

      dirBtn.addEventListener('click', () => {
        isDirected = !isDirected;
        dirBtn.textContent = `Directed: ${isDirected ? 'On' : 'Off'}`;
        canvas.setConfig({ directed: isDirected, weighted: false });
        inputEl.value = canvas.serialize();
        buildSteps();
      });

      document.getElementById('btn-apply').addEventListener('click', loadFromInput);
      document.querySelectorAll('[data-edges]').forEach((btn) => {
        btn.addEventListener('click', () => {
          isDirected = btn.dataset.dir === '1';
          dirBtn.textContent = `Directed: ${isDirected ? 'On' : 'Off'}`;
          inputEl.value = btn.dataset.edges;
          loadFromInput();
        });
      });

      renderCode();
      loadFromInput();
    </script>
  </body>
</html>
