<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>0-1 BFS Visualizer</title>
    <link rel="stylesheet" href="../shared/clay-visualizer.css" />
    <link rel="stylesheet" href="../shared/graph-canvas.css" />
    <style>
      .vis-presets { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; margin-bottom: 0.75rem; }
      .vis-preset-label { font-size: 0.75rem; color: var(--text-muted); }
      .vis-canvas { flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 0.65rem; min-height: 340px; padding: 1rem 1.15rem; }
      .vis-status-bar { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.45rem; margin-bottom: 0.65rem; }
      .vis-pill { background: var(--bg-card); border: var(--border-clay); box-shadow: var(--shadow-clay-subtle); border-radius: 999px; padding: 0.2rem 0.65rem; font-family: var(--font-code); font-size: 0.74rem; }
    </style>
  </head>
  <body>
    <div class="visualizer">
      <div class="vis-input">
        <input id="graph-input" class="vis-input__field" type="text" value="A-B:1, A-C:0, B-D:0, C-D:1, C-E:0, D-F:1, E-F:1" placeholder="Weighted edges (0 or 1): A-B:0, A-C:1" aria-label="0-1 weighted graph edges" />
        <button id="btn-apply" class="vis-btn vis-btn--primary" type="button">Load &amp; Run</button>
      </div>

      <div class="vis-presets">
        <span class="vis-preset-label">Presets:</span>
        <button class="vis-btn" type="button" data-edges="A-B:1, A-C:0, B-D:0, C-D:1, C-E:0, D-F:1, E-F:1">Zero Shortcut</button>
        <button class="vis-btn" type="button" data-edges="A-B:1, A-C:1, B-D:0, C-E:1, D-E:0, E-F:0">Free Detour</button>
      </div>

      <div class="vis-controls">
        <button class="vis-btn vis-btn-reset" type="button">Reset</button>
        <button class="vis-btn vis-btn-step-back" type="button">Back</button>
        <button class="vis-btn vis-btn--primary vis-btn-play" type="button">Play</button>
        <button class="vis-btn vis-btn--primary vis-btn-pause" type="button" style="display: none;">Pause</button>
        <button class="vis-btn vis-btn-step-forward" type="button">Next</button>
        <span class="vis-step-counter">No steps</span>
        <label class="vis-speed"><span>Speed</span><input class="vis-speed-slider" type="range" min="1" max="10" value="6" /></label>
      </div>

      <div class="vis-status-bar">
        <span id="status-start" class="vis-pill">Start: A (click any node to change)</span>
        <span id="status-rule" class="vis-pill">w=0 -> appendleft | w=1 -> append</span>
      </div>

      <div class="vis-canvas">
        <div id="graph-toolbar" class="g-toolbar"></div>
        <div id="graph-stage"></div>
        <div class="g-aux-row">
          <div class="g-aux-box">
            <div class="g-aux-box__title">Deque (front -> back)</div>
            <div id="deque-view" class="g-chip-list"></div>
          </div>
          <div class="g-aux-box">
            <div class="g-aux-box__title">dist[] Table</div>
            <div id="dist-view"></div>
          </div>
        </div>
      </div>

      <div id="vis-info" class="vis-info" style="margin-bottom: 1rem;">Click any node to change the source vertex. Zero-weight edges push to the front of the deque.</div>
      <div class="vis-code" id="vis-code"></div>
    </div>

    <script src="../shared/visualizer-base.js"></script>
    <script src="../shared/graph-canvas.js"></script>
    <script>
      const PYTHON_LINES = [
        'from collections import deque',
        'def zero_one_bfs(nodes: list[str], adj: dict[str, list[tuple[str, int]]], start: str) -> dict[str, float]:',
        '    dist = {u: float("inf") for u in nodes}',
        '    dist[start] = 0',
        '    dq = deque([start])',
        '    while dq:',
        '        u = dq.popleft()',
        '        for v, w in adj[u]:',
        '            if dist[u] + w < dist[v]:',
        '                dist[v] = dist[u] + w',
        '                if w == 0: dq.appendleft(v)',
        '                else: dq.append(v)',
        '    return dist',
      ];

      const codeEl = document.getElementById('vis-code');
      const infoEl = document.getElementById('vis-info');
      const inputEl = document.getElementById('graph-input');
      const dequeView = document.getElementById('deque-view');
      const distView = document.getElementById('dist-view');
      const startPill = document.getElementById('status-start');

      function renderCode(activeLine = -1) {
        codeEl.innerHTML = PYTHON_LINES.map((line, i) => {
          const active = i === activeLine ? ' vis-code__line--active' : '';
          const esc = line.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          return `<span class="vis-code__line${active}"><span class="vis-code__line-number">${i + 1}</span>${esc}</span>`;
        }).join('');
      }

      const canvas = new GraphCanvas({
        stageEl: document.getElementById('graph-stage'),
        toolbarEl: document.getElementById('graph-toolbar'),
        directed: false,
        weighted: true,
        defaultWeight: 0,
        weightChoices: [0, 1],
        onChange: (serialized) => { inputEl.value = serialized; buildSteps(); },
        onSelectNode: () => { buildSteps(); },
      });

      const viz = new VisualizerEngine({
        defaultSpeed: 650,
        render: (step) => {
          canvas.render(step.graphState);
          infoEl.textContent = step.description;
          dequeView.innerHTML = step.dq.length
            ? step.dq.map((n, i) => `<span class="g-chip${i === 0 ? ' g-chip--active' : ''}">${n}</span>`).join('')
            : '<span style="color:var(--text-muted);font-size:0.72rem;">empty</span>';
          const keys = Object.keys(step.dist);
          distView.innerHTML = `<table class="g-mini-table"><thead><tr>${keys.map((k) => `<th>${k}</th>`).join('')}</tr></thead><tbody><tr>${keys
            .map((k) => {
              const v = step.dist[k] === Infinity ? '∞' : step.dist[k];
              const cls = k === step.updated ? 'g-mini-cell--updated' : '';
              return `<td class="${cls}">${v}</td>`;
            })
            .join('')}</tr></tbody></table>`;
        },
        highlightCode: renderCode,
      });

      viz.bindControls();

      function buildSteps() {
        viz.reset();
        const nodes = canvas.nodes.map((n) => n.id);
        if (!nodes.length) return;
        const start = canvas.startNode || nodes[0];
        startPill.textContent = `Start: ${start} (click any node to change)`;

        const adj = {};
        nodes.forEach((n) => { adj[n] = []; });
        canvas.edges.forEach((e) => {
          const w = e.weight === 0 ? 0 : 1;
          adj[e.from].push([e.to, w]);
          adj[e.to].push([e.from, w]);
        });
        Object.values(adj).forEach((l) => l.sort((a, b) => a[0].localeCompare(b[0])));

        const dist = {};
        nodes.forEach((n) => { dist[n] = Infinity; });
        dist[start] = 0;
        const dq = [start];
        const parentEdge = {};

        const snap = (current, updated, exploringEdge, codeLine, description) => {
          const nodeStates = {};
          const nodeBadges = {};
          nodes.forEach((n) => {
            if (n === current) nodeStates[n] = 'active';
            else if (dq.includes(n)) nodeStates[n] = 'queued';
            else if (dist[n] < Infinity) nodeStates[n] = 'visited';
            nodeBadges[n] = dist[n] === Infinity ? '∞' : String(dist[n]);
          });
          const edgeStates = {};
          Object.values(parentEdge).forEach((k) => { edgeStates[k] = 'relaxed'; });
          if (exploringEdge) edgeStates[exploringEdge] = 'exploring';

          viz.recordStep({
            dq: [...dq],
            dist: { ...dist },
            updated,
            graphState: { nodeStates, nodeBadges, edgeStates },
            codeLine,
            description,
          });
        };

        snap(null, start, null, 4, `Set dist[${start}] = 0 and push ${start} into the deque.`);

        while (dq.length > 0) {
          const u = dq.shift();
          snap(u, null, null, 6, `Pop ${u} (dist=${dist[u]}) from the front of the deque.`);
          for (const [v, w] of adj[u]) {
            const key = GraphCanvas.edgeKey(u, v, false);
            if (dist[u] + w < dist[v]) {
              dist[v] = dist[u] + w;
              parentEdge[v] = key;
              if (w === 0) {
                dq.unshift(v);
                snap(u, v, key, 10, `Relax ${u} - ${v} (w=0): dist[${v}] = ${dist[v]}. Push ${v} to front of deque.`);
              } else {
                dq.push(v);
                snap(u, v, key, 11, `Relax ${u} - ${v} (w=1): dist[${v}] = ${dist[v]}. Push ${v} to back of deque.`);
              }
            } else {
              snap(u, null, key, 8, `Check ${u} - ${v} (w=${w}): ${dist[u] + w} is not better than dist[${v}]=${dist[v]}.`);
            }
          }
        }

        snap(null, null, null, 12, '0-1 BFS complete. Every reachable distance is final.');
        viz.goToStep(0);
      }

      function loadFromInput() {
        const parsed = GraphCanvas.parseEdgeList(inputEl.value, { directed: false, weighted: true, defaultWeight: 1 });
        parsed.edges.forEach((e) => { e.weight = e.weight === 0 ? 0 : 1; });
        canvas.loadGraph(parsed.nodes, parsed.edges);
        buildSteps();
      }

      document.getElementById('btn-apply').addEventListener('click', loadFromInput);
      document.querySelectorAll('[data-edges]').forEach((btn) => {
        btn.addEventListener('click', () => {
          inputEl.value = btn.dataset.edges;
          loadFromInput();
        });
      });

      renderCode();
      loadFromInput();
    </script>
  </body>
</html>
