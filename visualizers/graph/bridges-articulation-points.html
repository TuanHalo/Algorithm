<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bridges & Articulation Points Visualizer</title>
    <link rel="stylesheet" href="../shared/clay-visualizer.css" />
    <link rel="stylesheet" href="../shared/graph-canvas.css" />
    <style>
      .vis-presets { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; margin-bottom: 0.75rem; }
      .vis-preset-label { font-size: 0.75rem; color: var(--text-muted); }
      .vis-canvas { flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 0.65rem; min-height: 340px; padding: 1rem 1.15rem; }
      .vis-status-bar { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.45rem; margin-bottom: 0.65rem; }
      .vis-pill { background: var(--bg-card); border: var(--border-clay); box-shadow: var(--shadow-clay-subtle); border-radius: 999px; padding: 0.2rem 0.65rem; font-family: var(--font-code); font-size: 0.74rem; }
    </style>
  </head>
  <body>
    <div class="visualizer">
      <div class="vis-input">
        <input id="graph-input" class="vis-input__field" type="text" value="A-B, B-C, C-A, C-D, D-E, E-F, F-D" placeholder="Undirected edges: A-B, B-C, C-A, C-D" aria-label="Undirected graph edges" />
        <button id="btn-apply" class="vis-btn vis-btn--primary" type="button">Load &amp; Run</button>
      </div>

      <div class="vis-presets">
        <span class="vis-preset-label">Presets:</span>
        <button class="vis-btn" type="button" data-edges="A-B, B-C, C-A, C-D, D-E, E-F, F-D">Bridge C-D</button>
        <button class="vis-btn" type="button" data-edges="A-B, B-C, C-D, D-E">All Bridges (Chain)</button>
        <button class="vis-btn" type="button" data-edges="A-B, B-C, C-D, D-A, A-C">2-Edge Connected</button>
      </div>

      <div class="vis-controls">
        <button class="vis-btn vis-btn-reset" type="button">Reset</button>
        <button class="vis-btn vis-btn-step-back" type="button">Back</button>
        <button class="vis-btn vis-btn--primary vis-btn-play" type="button">Play</button>
        <button class="vis-btn vis-btn--primary vis-btn-pause" type="button" style="display: none;">Pause</button>
        <button class="vis-btn vis-btn-step-forward" type="button">Next</button>
        <span class="vis-step-counter">No steps</span>
        <label class="vis-speed"><span>Speed</span><input class="vis-speed-slider" type="range" min="1" max="10" value="6" /></label>
      </div>

      <div class="vis-legend">
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-comparing);"></span> Active</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-swapping);"></span> Articulation Point / Bridge</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-active);"></span> Visited Safe</span>
      </div>

      <div class="vis-status-bar">
        <span id="status-bridges" class="vis-pill">Bridges: -</span>
        <span id="status-aps" class="vis-pill">Articulation Points: -</span>
      </div>

      <div class="vis-canvas">
        <div id="graph-toolbar" class="g-toolbar"></div>
        <div id="graph-stage"></div>
        <div class="g-aux-row">
          <div class="g-aux-box">
            <div class="g-aux-box__title">tin[] and low[] Timestamps</div>
            <div id="tin-table-view"></div>
          </div>
        </div>
      </div>

      <div id="vis-info" class="vis-info" style="margin-bottom: 1rem;">Edges without a back-edge bypass (low[v] > tin[u]) are bridges; red nodes disconnect the graph if removed.</div>
      <div class="vis-code" id="vis-code"></div>
    </div>

    <script src="../shared/visualizer-base.js"></script>
    <script src="../shared/graph-canvas.js"></script>
    <script>
      const PYTHON_LINES = [
        'def find_bridges_and_aps(nodes: list[str], adj: dict[str, list[str]]):',
        '    tin, low, timer = {}, {}, [0]',
        '    bridges, aps = [], set()',
        '    def dfs(u: str, parent: str | None) -> None:',
        '        tin[u] = low[u] = timer[0]; timer[0] += 1',
        '        children = 0',
        '        for v in adj[u]:',
        '            if v == parent: continue',
        '            if v in tin:',
        '                low[u] = min(low[u], tin[v])',
        '            else:',
        '                children += 1; dfs(v, u)',
        '                low[u] = min(low[u], low[v])',
        '                if low[v] > tin[u]: bridges.append((u, v))',
        '                if parent is not None and low[v] >= tin[u]: aps.add(u)',
        '        if parent is None and children > 1: aps.add(u)',
        '    for u in nodes:',
        '        if u not in tin: dfs(u, None)',
        '    return bridges, aps',
      ];

      const codeEl = document.getElementById('vis-code');
      const infoEl = document.getElementById('vis-info');
      const inputEl = document.getElementById('graph-input');
      const tinView = document.getElementById('tin-table-view');
      const bridgesPill = document.getElementById('status-bridges');
      const apsPill = document.getElementById('status-aps');

      function renderCode(activeLine = -1) {
        codeEl.innerHTML = PYTHON_LINES.map((line, i) => {
          const active = i === activeLine ? ' vis-code__line--active' : '';
          const esc = line.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          return `<span class="vis-code__line${active}"><span class="vis-code__line-number">${i + 1}</span>${esc}</span>`;
        }).join('');
      }

      const canvas = new GraphCanvas({
        stageEl: document.getElementById('graph-stage'),
        toolbarEl: document.getElementById('graph-toolbar'),
        directed: false,
        weighted: false,
        onChange: (serialized) => { inputEl.value = serialized; buildSteps(); },
        onSelectNode: () => { buildSteps(); },
      });

      const viz = new VisualizerEngine({
        defaultSpeed: 650,
        render: (step) => {
          canvas.render(step.graphState);
          infoEl.textContent = step.description;
          bridgesPill.textContent = `Bridges: ${step.bridges.map(([a, b]) => `${a}-${b}`).join(', ') || 'none'}`;
          apsPill.textContent = `Articulation Points: ${step.aps.join(', ') || 'none'}`;

          const keys = step.nodes;
          tinView.innerHTML = `<table class="g-mini-table"><thead><tr><th>Node</th>${keys.map((k) => `<th>${k}</th>`).join('')}</tr></thead><tbody>
            <tr><td><strong>tin</strong></td>${keys.map((k) => `<td>${step.tin[k] ?? '-'}</td>`).join('')}</tr>
            <tr><td><strong>low</strong></td>${keys.map((k) => `<td class="${k === step.updated ? 'g-mini-cell--updated' : ''}">${step.low[k] ?? '-'}</td>`).join('')}</tr>
          </tbody></table>`;
        },
        highlightCode: renderCode,
      });

      viz.bindControls();

      function buildSteps() {
        viz.reset();
        const nodes = canvas.nodes.map((n) => n.id);
        if (!nodes.length) return;

        const adj = {};
        nodes.forEach((n) => { adj[n] = []; });
        canvas.edges.forEach((e) => {
          adj[e.from].push(e.to);
          adj[e.to].push(e.from);
        });
        Object.values(adj).forEach((l) => l.sort());

        const tin = {};
        const low = {};
        let timer = 0;
        const bridges = [];
        const aps = new Set();

        const snap = (current, updated, exploringEdge, codeLine, description) => {
          const nodeStates = {};
          const nodeBadges = {};
          nodes.forEach((n) => {
            if (aps.has(n)) nodeStates[n] = 'conflict';
            else if (n === current) nodeStates[n] = 'active';
            else if (tin[n] !== undefined) nodeStates[n] = 'visited';
            if (tin[n] !== undefined) nodeBadges[n] = `${tin[n]}/${low[n]}`;
          });
          const edgeStates = {};
          bridges.forEach(([a, b]) => {
            edgeStates[GraphCanvas.edgeKey(a, b, false)] = 'bridge';
          });
          if (exploringEdge && !edgeStates[exploringEdge]) edgeStates[exploringEdge] = 'exploring';

          viz.recordStep({
            nodes,
            tin: { ...tin },
            low: { ...low },
            bridges: bridges.map((x) => [...x]),
            aps: Array.from(aps),
            updated,
            graphState: { nodeStates, nodeBadges, edgeStates },
            codeLine,
            description,
          });
        };

        function dfs(u, parent) {
          tin[u] = low[u] = timer++;
          let children = 0;
          snap(u, u, null, 4, `Enter ${u}: set tin[${u}] = low[${u}] = ${tin[u]}.`);

          for (const v of adj[u]) {
            if (v === parent) continue;
            const key = GraphCanvas.edgeKey(u, v, false);
            if (tin[v] !== undefined) {
              if (tin[v] < low[u]) {
                low[u] = tin[v];
                snap(u, u, key, 9, `Back-edge ${u} - ${v}: update low[${u}] = min(low[${u}], tin[${v}]) = ${low[u]}.`);
              } else {
                snap(u, null, key, 9, `Back-edge ${u} - ${v}: tin[${v}]=${tin[v]} does not lower low[${u}]=${low[u]}.`);
              }
            } else {
              children += 1;
              snap(u, null, key, 11, `Tree edge ${u} - ${v}: recurse into ${v}.`);
              dfs(v, u);
              if (low[v] < low[u]) {
                low[u] = low[v];
              }
              const notes = [];
              if (low[v] > tin[u]) {
                bridges.push([u, v]);
                notes.push(`${u}-${v} is a Bridge (low[${v}]=${low[v]} > tin[${u}]=${tin[u]})`);
              }
              if (parent !== null && low[v] >= tin[u]) {
                aps.add(u);
                notes.push(`${u} is an Articulation Point`);
              }
              snap(u, u, key, 13, notes.length
                ? `Return from ${v} to ${u}: ${notes.join('; ')}.`
                : `Return from ${v} to ${u}: update low[${u}] = ${low[u]}.`);
            }
          }
          if (parent === null && children > 1) {
            aps.add(u);
            snap(u, null, null, 15, `Root ${u} has ${children} DFS children (> 1), so ${u} is an Articulation Point.`);
          }
        }

        const ordered = canvas.startNode ? [canvas.startNode, ...nodes.filter((n) => n !== canvas.startNode)] : nodes;
        for (const u of ordered) {
          if (tin[u] === undefined) dfs(u, null);
        }

        snap(null, null, null, 18, `Finished. Found ${bridges.length} bridge(s) and ${aps.size} articulation point(s).`);
        viz.goToStep(0);
      }

      function loadFromInput() {
        const parsed = GraphCanvas.parseEdgeList(inputEl.value, { directed: false, weighted: false });
        canvas.loadGraph(parsed.nodes, parsed.edges);
        buildSteps();
      }

      document.getElementById('btn-apply').addEventListener('click', loadFromInput);
      document.querySelectorAll('[data-edges]').forEach((btn) => {
        btn.addEventListener('click', () => {
          inputEl.value = btn.dataset.edges;
          loadFromInput();
        });
      });

      renderCode();
      loadFromInput();
    </script>
  </body>
</html>
