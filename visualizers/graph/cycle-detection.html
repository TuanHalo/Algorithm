<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cycle Detection in Graphs Visualizer</title>
    <link rel="stylesheet" href="../shared/clay-visualizer.css" />
    <link rel="stylesheet" href="../shared/graph-canvas.css" />
    <style>
      .vis-presets { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; margin-bottom: 0.75rem; }
      .vis-preset-label { font-size: 0.75rem; color: var(--text-muted); }
      .vis-canvas { flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 0.65rem; min-height: 330px; padding: 1rem 1.15rem; }
      .vis-status-bar { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.45rem; margin-bottom: 0.65rem; }
      .vis-pill { background: var(--bg-card); border: var(--border-clay); box-shadow: var(--shadow-clay-subtle); border-radius: 999px; padding: 0.2rem 0.65rem; font-family: var(--font-code); font-size: 0.74rem; }
    </style>
  </head>
  <body>
    <div class="visualizer">
      <div class="vis-input">
        <input id="graph-input" class="vis-input__field" type="text" value="A->B, B->C, C->D, D->B" placeholder="Directed: A->B, B->C | Undirected: A-B, B-C" aria-label="Graph edges" />
        <button id="btn-mode" class="vis-btn" type="button">Mode: Directed (3-Color)</button>
        <button id="btn-apply" class="vis-btn vis-btn--primary" type="button">Load &amp; Run</button>
      </div>

      <div class="vis-presets">
        <span class="vis-preset-label">Presets:</span>
        <button class="vis-btn" type="button" data-edges="A->B, B->C, C->D, D->B" data-dir="1">Directed Cycle</button>
        <button class="vis-btn" type="button" data-edges="A->B, A->C, B->D, C->D" data-dir="1">Directed Diamond (DAG)</button>
        <button class="vis-btn" type="button" data-edges="A-B, B-C, C-D, D-A" data-dir="0">Undirected Cycle</button>
        <button class="vis-btn" type="button" data-edges="A-B, A-C, B-D, C-E" data-dir="0">Undirected Tree</button>
      </div>

      <div class="vis-controls">
        <button class="vis-btn vis-btn-reset" type="button">Reset</button>
        <button class="vis-btn vis-btn-step-back" type="button">Back</button>
        <button class="vis-btn vis-btn--primary vis-btn-play" type="button">Play</button>
        <button class="vis-btn vis-btn--primary vis-btn-pause" type="button" style="display: none;">Pause</button>
        <button class="vis-btn vis-btn-step-forward" type="button">Next</button>
        <span class="vis-step-counter">No steps</span>
        <label class="vis-speed"><span>Speed</span><input class="vis-speed-slider" type="range" min="1" max="10" value="6" /></label>
      </div>

      <div class="vis-legend">
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-default);"></span> Unvisited (0)</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-pivot);"></span> Visiting / In Stack (1)</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-active);"></span> Done (2)</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-swapping);"></span> Cycle Back-Edge</span>
      </div>

      <div class="vis-status-bar">
        <span id="status-result" class="vis-pill">Result: Checking...</span>
        <span id="status-stack" class="vis-pill">Path: -</span>
      </div>

      <div class="vis-canvas">
        <div id="graph-toolbar" class="g-toolbar"></div>
        <div id="graph-stage"></div>
        <div class="g-aux-row">
          <div class="g-aux-box">
            <div class="g-aux-box__title">Node States</div>
            <div id="state-view" class="g-chip-list"></div>
          </div>
        </div>
      </div>

      <div id="vis-info" class="vis-info" style="margin-bottom: 1rem;">Switch between Directed (3-color) and Undirected (parent check), or edit nodes/edges on the canvas.</div>
      <div class="vis-code" id="vis-code"></div>
    </div>

    <script src="../shared/visualizer-base.js"></script>
    <script src="../shared/graph-canvas.js"></script>
    <script>
      const DIRECTED_CODE = [
        'def has_cycle_directed(nodes: list[str], adj: dict[str, list[str]]) -> bool:',
        '    state = {u: 0 for u in nodes}  # 0=unvisited, 1=visiting, 2=done',
        '    def dfs(u: str) -> bool:',
        '        state[u] = 1',
        '        for v in adj[u]:',
        '            if state[v] == 1 or (state[v] == 0 and dfs(v)):',
        '                return True',
        '        state[u] = 2',
        '        return False',
        '    return any(state[u] == 0 and dfs(u) for u in nodes)',
      ];
      const UNDIRECTED_CODE = [
        'def has_cycle_undirected(nodes: list[str], adj: dict[str, list[str]]) -> bool:',
        '    visited: set[str] = set()',
        '    def dfs(u: str, parent: str | None) -> bool:',
        '        visited.add(u)',
        '        for v in adj[u]:',
        '            if v not in visited:',
        '                if dfs(v, u): return True',
        '            elif v != parent:',
        '                return True  # Back-edge to an ancestor',
        '        return False',
        '    return any(u not in visited and dfs(u, None) for u in nodes)',
      ];

      const codeEl = document.getElementById('vis-code');
      const infoEl = document.getElementById('vis-info');
      const inputEl = document.getElementById('graph-input');
      const modeBtn = document.getElementById('btn-mode');
      const stateView = document.getElementById('state-view');
      const resultPill = document.getElementById('status-result');
      const stackPill = document.getElementById('status-stack');

      let isDirected = true;

      function renderCode(activeLine = -1) {
        const lines = isDirected ? DIRECTED_CODE : UNDIRECTED_CODE;
        codeEl.innerHTML = lines.map((line, i) => {
          const active = i === activeLine ? ' vis-code__line--active' : '';
          const esc = line.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          return `<span class="vis-code__line${active}"><span class="vis-code__line-number">${i + 1}</span>${esc}</span>`;
        }).join('');
      }

      const canvas = new GraphCanvas({
        stageEl: document.getElementById('graph-stage'),
        toolbarEl: document.getElementById('graph-toolbar'),
        directed: isDirected,
        weighted: false,
        onChange: (serialized) => { inputEl.value = serialized; buildSteps(); },
        onSelectNode: () => { buildSteps(); },
      });

      const viz = new VisualizerEngine({
        defaultSpeed: 650,
        render: (step) => {
          canvas.render(step.graphState);
          infoEl.textContent = step.description;
          resultPill.textContent = `Result: ${step.result}`;
          stackPill.textContent = `Active Path: ${step.path.join(' -> ') || '-'}`;
          const labels = isDirected ? { 0: 'unvisited', 1: 'visiting', 2: 'done' } : { 0: 'unvisited', 1: 'visiting', 2: 'visited' };
          stateView.innerHTML = Object.entries(step.states)
            .map(([n, st]) => {
              const cls = st === 1 ? ' g-chip--active' : st === 2 ? ' g-chip--done' : '';
              return `<span class="g-chip${cls}">${n}: ${labels[st]}</span>`;
            })
            .join('');
        },
        highlightCode: renderCode,
      });

      viz.bindControls();

      function buildSteps() {
        viz.reset();
        renderCode();
        const nodes = canvas.nodes.map((n) => n.id);
        if (!nodes.length) return;

        const adj = {};
        nodes.forEach((n) => { adj[n] = []; });
        canvas.edges.forEach((e) => {
          adj[e.from].push(e.to);
          if (!isDirected) adj[e.to].push(e.from);
        });
        Object.values(adj).forEach((l) => l.sort());

        const states = {};
        nodes.forEach((n) => { states[n] = 0; });
        const path = [];
        let foundCycle = false;
        let cycleEdge = null;

        const snap = (exploringEdge, result, codeLine, description) => {
          const nodeStates = {};
          const nodeBadges = {};
          nodes.forEach((n) => {
            if (states[n] === 1) nodeStates[n] = 'visiting';
            else if (states[n] === 2) nodeStates[n] = 'visited';
            if (foundCycle && path.includes(n) && exploringEdge) nodeStates[n] = 'conflict';
            nodeBadges[n] = isDirected ? `s=${states[n]}` : states[n] > 0 ? 'seen' : '0';
          });
          const edgeStates = {};
          if (exploringEdge) edgeStates[exploringEdge] = foundCycle ? 'cycle' : 'exploring';
          if (cycleEdge) edgeStates[cycleEdge] = 'cycle';

          viz.recordStep({
            states: { ...states },
            path: [...path],
            result,
            graphState: { nodeStates, nodeBadges, edgeStates },
            codeLine,
            description,
          });
        };

        snap(null, 'Scanning...', 1, isDirected
          ? 'Initialize all nodes to state 0 (unvisited).'
          : 'Initialize an empty visited set.');

        function dfsDirected(u) {
          states[u] = 1;
          path.push(u);
          snap(null, 'Scanning...', 3, `Mark ${u} as state 1 (visiting) and push it onto the active recursion path.`);
          for (const v of adj[u]) {
            const key = GraphCanvas.edgeKey(u, v, true);
            if (states[v] === 1) {
              foundCycle = true;
              cycleEdge = key;
              snap(key, 'Cycle Detected', 6, `Edge ${u} -> ${v} points to ${v} which is still visiting (state 1). Cycle found!`);
              return true;
            }
            if (states[v] === 0) {
              snap(key, 'Scanning...', 5, `Explore unvisited edge ${u} -> ${v}.`);
              if (dfsDirected(v)) return true;
            } else {
              snap(key, 'Scanning...', 4, `Neighbor ${v} is already done (state 2, cross/forward edge), so no cycle here.`);
            }
          }
          states[u] = 2;
          path.pop();
          snap(null, 'Scanning...', 7, `All outgoing edges from ${u} are clear. Mark ${u} as state 2 (done).`);
          return false;
        }

        function dfsUndirected(u, parent) {
          states[u] = 1;
          path.push(u);
          snap(null, 'Scanning...', 3, `Visit ${u} (parent=${parent || 'None'}).`);
          for (const v of adj[u]) {
            const key = GraphCanvas.edgeKey(u, v, false);
            if (states[v] === 0) {
              snap(key, 'Scanning...', 6, `Traverse tree edge ${u} - ${v} to unvisited neighbor ${v}.`);
              if (dfsUndirected(v, u)) return true;
            } else if (v !== parent) {
              foundCycle = true;
              cycleEdge = key;
              snap(key, 'Cycle Detected', 8, `Edge ${u} - ${v} hits already visited ${v} (not parent ${parent}). Cycle found!`);
              return true;
            } else {
              snap(key, 'Scanning...', 7, `Ignore edge ${u} - ${v} back to immediate parent ${parent}.`);
            }
          }
          states[u] = 2;
          path.pop();
          snap(null, 'Scanning...', 9, `Finish ${u}; backtrack.`);
          return false;
        }

        for (const start of nodes) {
          if (states[start] === 0) {
            const hit = isDirected ? dfsDirected(start) : dfsUndirected(start, null);
            if (hit) break;
          }
        }

        if (!foundCycle) {
          snap(null, 'Acyclic (No Cycle)', isDirected ? 9 : 10, 'Finished full DFS without finding any back-edge. Graph is acyclic.');
        }
        viz.goToStep(0);
      }

      function loadFromInput() {
        const parsed = GraphCanvas.parseEdgeList(inputEl.value, { directed: isDirected, weighted: false });
        canvas.setConfig({ directed: isDirected, weighted: false });
        canvas.loadGraph(parsed.nodes, parsed.edges);
        buildSteps();
      }

      modeBtn.addEventListener('click', () => {
        isDirected = !isDirected;
        modeBtn.textContent = isDirected ? 'Mode: Directed (3-Color)' : 'Mode: Undirected (Parent)';
        canvas.setConfig({ directed: isDirected, weighted: false });
        inputEl.value = canvas.serialize();
        buildSteps();
      });

      document.getElementById('btn-apply').addEventListener('click', loadFromInput);
      document.querySelectorAll('[data-edges]').forEach((btn) => {
        btn.addEventListener('click', () => {
          isDirected = btn.dataset.dir === '1';
          modeBtn.textContent = isDirected ? 'Mode: Directed (3-Color)' : 'Mode: Undirected (Parent)';
          inputEl.value = btn.dataset.edges;
          loadFromInput();
        });
      });

      renderCode();
      loadFromInput();
    </script>
  </body>
</html>
