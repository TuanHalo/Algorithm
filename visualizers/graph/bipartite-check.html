<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bipartite Graph Check Visualizer</title>
    <link rel="stylesheet" href="../shared/clay-visualizer.css" />
    <link rel="stylesheet" href="../shared/graph-canvas.css" />
    <style>
      .vis-presets { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; margin-bottom: 0.75rem; }
      .vis-preset-label { font-size: 0.75rem; color: var(--text-muted); }
      .vis-canvas { flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 0.65rem; min-height: 330px; padding: 1rem 1.15rem; }
      .vis-status-bar { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.45rem; margin-bottom: 0.65rem; }
      .vis-pill { background: var(--bg-card); border: var(--border-clay); box-shadow: var(--shadow-clay-subtle); border-radius: 999px; padding: 0.2rem 0.65rem; font-family: var(--font-code); font-size: 0.74rem; }
    </style>
  </head>
  <body>
    <div class="visualizer">
      <div class="vis-input">
        <input id="graph-input" class="vis-input__field" type="text" value="A-B, B-C, C-D, D-A" placeholder="Edges: A-B, B-C, C-D" aria-label="Graph edges" />
        <button id="btn-apply" class="vis-btn vis-btn--primary" type="button">Load &amp; Run</button>
      </div>

      <div class="vis-presets">
        <span class="vis-preset-label">Presets:</span>
        <button class="vis-btn" type="button" data-edges="A-B, B-C, C-D, D-A">Even Cycle (Bipartite)</button>
        <button class="vis-btn" type="button" data-edges="A-B, B-C, C-A">Triangle (Odd Cycle)</button>
        <button class="vis-btn" type="button" data-edges="A-D, A-E, B-D, B-F, C-E, C-F">K3,2 Complete</button>
      </div>

      <div class="vis-controls">
        <button class="vis-btn vis-btn-reset" type="button">Reset</button>
        <button class="vis-btn vis-btn-step-back" type="button">Back</button>
        <button class="vis-btn vis-btn--primary vis-btn-play" type="button">Play</button>
        <button class="vis-btn vis-btn--primary vis-btn-pause" type="button" style="display: none;">Pause</button>
        <button class="vis-btn vis-btn-step-forward" type="button">Next</button>
        <span class="vis-step-counter">No steps</span>
        <label class="vis-speed"><span>Speed</span><input class="vis-speed-slider" type="range" min="1" max="10" value="6" /></label>
      </div>

      <div class="vis-legend">
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: #a8d8ea;"></span> Team 0 (Blue)</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: #ffc8a2;"></span> Team 1 (Peach)</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-swapping);"></span> Same-Color Conflict</span>
      </div>

      <div class="vis-status-bar">
        <span id="status-result" class="vis-pill">Result: Checking...</span>
        <span id="status-queue" class="vis-pill">Queue: -</span>
      </div>

      <div class="vis-canvas">
        <div id="graph-toolbar" class="g-toolbar"></div>
        <div id="graph-stage"></div>
        <div class="g-aux-row">
          <div class="g-aux-box">
            <div class="g-aux-box__title">Color Assignment</div>
            <div id="color-view" class="g-chip-list"></div>
          </div>
        </div>
      </div>

      <div id="vis-info" class="vis-info" style="margin-bottom: 1rem;">Add or remove an edge to see when an odd cycle breaks 2-coloring.</div>
      <div class="vis-code" id="vis-code"></div>
    </div>

    <script src="../shared/visualizer-base.js"></script>
    <script src="../shared/graph-canvas.js"></script>
    <script>
      const PYTHON_LINES = [
        'from collections import deque',
        'def is_bipartite(nodes: list[str], adj: dict[str, list[str]]) -> bool:',
        '    color: dict[str, int] = {}',
        '    for start in nodes:',
        '        if start in color:',
        '            continue',
        '        color[start] = 0',
        '        queue = deque([start])',
        '        while queue:',
        '            u = queue.popleft()',
        '            for v in adj[u]:',
        '                if v not in color:',
        '                    color[v] = 1 - color[u]',
        '                    queue.append(v)',
        '                elif color[v] == color[u]:',
        '                    return False',
        '    return True',
      ];

      const codeEl = document.getElementById('vis-code');
      const infoEl = document.getElementById('vis-info');
      const inputEl = document.getElementById('graph-input');
      const colorView = document.getElementById('color-view');
      const resultPill = document.getElementById('status-result');
      const queuePill = document.getElementById('status-queue');

      function renderCode(activeLine = -1) {
        codeEl.innerHTML = PYTHON_LINES.map((line, i) => {
          const active = i === activeLine ? ' vis-code__line--active' : '';
          const esc = line.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          return `<span class="vis-code__line${active}"><span class="vis-code__line-number">${i + 1}</span>${esc}</span>`;
        }).join('');
      }

      const canvas = new GraphCanvas({
        stageEl: document.getElementById('graph-stage'),
        toolbarEl: document.getElementById('graph-toolbar'),
        directed: false,
        weighted: false,
        onChange: (serialized) => { inputEl.value = serialized; buildSteps(); },
        onSelectNode: () => { buildSteps(); },
      });

      const viz = new VisualizerEngine({
        defaultSpeed: 650,
        render: (step) => {
          canvas.render(step.graphState);
          infoEl.textContent = step.description;
          resultPill.textContent = `Result: ${step.result}`;
          queuePill.textContent = `Queue: [${step.queue.join(', ')}]`;
          colorView.innerHTML = Object.entries(step.color)
            .map(([n, c]) => `<span class="g-chip" style="background:${c === 0 ? '#a8d8ea' : '#ffc8a2'}">${n}: Team ${c}</span>`)
            .join('') || '<span style="color:var(--text-muted);font-size:0.72rem;">uncolored</span>';
        },
        highlightCode: renderCode,
      });

      viz.bindControls();

      function buildSteps() {
        viz.reset();
        const nodes = canvas.nodes.map((n) => n.id);
        if (!nodes.length) return;

        const adj = {};
        nodes.forEach((n) => { adj[n] = []; });
        canvas.edges.forEach((e) => {
          adj[e.from].push(e.to);
          adj[e.to].push(e.from);
        });
        Object.values(adj).forEach((l) => l.sort());

        const color = {};
        let conflict = false;

        const snap = (queue, exploringEdge, conflictPair, result, codeLine, description) => {
          const nodeStates = {};
          const nodeBadges = {};
          nodes.forEach((n) => {
            if (conflictPair && conflictPair.includes(n)) nodeStates[n] = 'conflict';
            else if (color[n] === 0) nodeStates[n] = 'colorA';
            else if (color[n] === 1) nodeStates[n] = 'colorB';
            if (color[n] !== undefined) nodeBadges[n] = `T${color[n]}`;
          });
          const edgeStates = {};
          if (exploringEdge) edgeStates[exploringEdge] = conflictPair ? 'cycle' : 'exploring';

          viz.recordStep({
            color: { ...color },
            queue: [...queue],
            result,
            graphState: { nodeStates, nodeBadges, edgeStates },
            codeLine,
            description,
          });
        };

        snap([], null, null, 'Checking...', 2, 'Start with every node uncolored and try to assign Team 0 or Team 1.');

        for (const start of nodes) {
          if (color[start] !== undefined) continue;
          color[start] = 0;
          const queue = [start];
          snap(queue, null, null, 'Checking...', 6, `Assign ${start} to Team 0 and push it to the BFS queue.`);

          while (queue.length > 0) {
            const u = queue.shift();
            for (const v of adj[u]) {
              const key = GraphCanvas.edgeKey(u, v, false);
              if (color[v] === undefined) {
                color[v] = 1 - color[u];
                queue.push(v);
                snap(queue, key, null, 'Checking...', 12, `Color neighbor ${v} as Team ${color[v]} (opposite of ${u}) and enqueue ${v}.`);
              } else if (color[v] === color[u]) {
                conflict = true;
                snap(queue, key, [u, v], 'Not Bipartite', 15, `Conflict on edge ${u} - ${v}: both endpoints are Team ${color[u]}. Odd cycle found!`);
                break;
              } else {
                snap(queue, key, null, 'Checking...', 14, `Edge ${u} - ${v} already has opposite teams (${color[u]} vs ${color[v]}).`);
              }
            }
            if (conflict) break;
          }
          if (conflict) break;
        }

        if (!conflict) {
          snap([], null, null, 'Bipartite (Valid 2-Coloring)', 16, 'Every edge connects opposite teams. The graph is bipartite!');
        }
        viz.goToStep(0);
      }

      function loadFromInput() {
        const parsed = GraphCanvas.parseEdgeList(inputEl.value, { directed: false, weighted: false });
        canvas.loadGraph(parsed.nodes, parsed.edges);
        buildSteps();
      }

      document.getElementById('btn-apply').addEventListener('click', loadFromInput);
      document.querySelectorAll('[data-edges]').forEach((btn) => {
        btn.addEventListener('click', () => {
          inputEl.value = btn.dataset.edges;
          loadFromInput();
        });
      });

      renderCode();
      loadFromInput();
    </script>
  </body>
</html>
