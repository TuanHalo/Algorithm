<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prim's Minimum Spanning Tree Visualizer</title>
    <link rel="stylesheet" href="../shared/clay-visualizer.css" />
    <link rel="stylesheet" href="../shared/graph-canvas.css" />
    <style>
      .vis-presets { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; margin-bottom: 0.75rem; }
      .vis-preset-label { font-size: 0.75rem; color: var(--text-muted); }
      .vis-canvas { flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 0.65rem; min-height: 340px; padding: 1rem 1.15rem; }
      .vis-status-bar { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.45rem; margin-bottom: 0.65rem; }
      .vis-pill { background: var(--bg-card); border: var(--border-clay); box-shadow: var(--shadow-clay-subtle); border-radius: 999px; padding: 0.2rem 0.65rem; font-family: var(--font-code); font-size: 0.74rem; }
    </style>
  </head>
  <body>
    <div class="visualizer">
      <div class="vis-input">
        <input id="graph-input" class="vis-input__field" type="text" value="A-B:4, A-C:2, B-C:1, B-D:5, C-D:8, C-E:10, D-E:2, D-F:6, E-F:3" placeholder="Weighted undirected edges: A-B:4, B-C:1" aria-label="Weighted undirected edges" />
        <button id="btn-apply" class="vis-btn vis-btn--primary" type="button">Load &amp; Run</button>
      </div>

      <div class="vis-presets">
        <span class="vis-preset-label">Presets:</span>
        <button class="vis-btn" type="button" data-edges="A-B:4, A-C:2, B-C:1, B-D:5, C-D:8, C-E:10, D-E:2, D-F:6, E-F:3">6-Node Network</button>
        <button class="vis-btn" type="button" data-edges="A-B:2, A-D:6, B-C:3, B-D:8, B-E:5, C-E:7, D-E:9">Cut Frontier</button>
      </div>

      <div class="vis-controls">
        <button class="vis-btn vis-btn-reset" type="button">Reset</button>
        <button class="vis-btn vis-btn-step-back" type="button">Back</button>
        <button class="vis-btn vis-btn--primary vis-btn-play" type="button">Play</button>
        <button class="vis-btn vis-btn--primary vis-btn-pause" type="button" style="display: none;">Pause</button>
        <button class="vis-btn vis-btn-step-forward" type="button">Next</button>
        <span class="vis-step-counter">No steps</span>
        <label class="vis-speed"><span>Speed</span><input class="vis-speed-slider" type="range" min="1" max="10" value="6" /></label>
      </div>

      <div class="vis-status-bar">
        <span id="status-start" class="vis-pill">Start: A (click any node to change)</span>
        <span id="status-cost" class="vis-pill">MST Total Weight: 0</span>
      </div>

      <div class="vis-canvas">
        <div id="graph-toolbar" class="g-toolbar"></div>
        <div id="graph-stage"></div>
        <div class="g-aux-row">
          <div class="g-aux-box">
            <div class="g-aux-box__title">Frontier Min-Heap (weight, node, via)</div>
            <div id="heap-view" class="g-chip-list"></div>
          </div>
          <div class="g-aux-box">
            <div class="g-aux-box__title">MST Edges Grown</div>
            <div id="mst-view" class="g-chip-list"></div>
          </div>
        </div>
      </div>

      <div id="vis-info" class="vis-info" style="margin-bottom: 1rem;">Click any node to change Prim's root, then press Play to grow the MST one cheapest frontier edge at a time.</div>
      <div class="vis-code" id="vis-code"></div>
    </div>

    <script src="../shared/visualizer-base.js"></script>
    <script src="../shared/graph-canvas.js"></script>
    <script>
      const PYTHON_LINES = [
        'import heapq',
        'def prim_mst(adj: dict[str, list[tuple[str, int]]], start: str) -> int:',
        '    visited: set[str] = set()',
        '    heap: list[tuple[int, str]] = [(0, start)]',
        '    total = 0',
        '    while heap:',
        '        w, u = heapq.heappop(heap)',
        '        if u in visited:',
        '            continue',
        '        visited.add(u)',
        '        total += w',
        '        for v, edge_w in adj[u]:',
        '            if v not in visited:',
        '                heapq.heappush(heap, (edge_w, v))',
        '    return total',
      ];

      const codeEl = document.getElementById('vis-code');
      const infoEl = document.getElementById('vis-info');
      const inputEl = document.getElementById('graph-input');
      const heapView = document.getElementById('heap-view');
      const mstView = document.getElementById('mst-view');
      const startPill = document.getElementById('status-start');
      const costPill = document.getElementById('status-cost');

      function renderCode(activeLine = -1) {
        codeEl.innerHTML = PYTHON_LINES.map((line, i) => {
          const active = i === activeLine ? ' vis-code__line--active' : '';
          const esc = line.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          return `<span class="vis-code__line${active}"><span class="vis-code__line-number">${i + 1}</span>${esc}</span>`;
        }).join('');
      }

      const canvas = new GraphCanvas({
        stageEl: document.getElementById('graph-stage'),
        toolbarEl: document.getElementById('graph-toolbar'),
        directed: false,
        weighted: true,
        defaultWeight: 3,
        onChange: (serialized) => { inputEl.value = serialized; buildSteps(); },
        onSelectNode: () => { buildSteps(); },
      });

      const viz = new VisualizerEngine({
        defaultSpeed: 650,
        render: (step) => {
          canvas.render(step.graphState);
          infoEl.textContent = step.description;
          costPill.textContent = `MST Total Weight: ${step.total}`;
          const sortedHeap = [...step.heap].sort((a, b) => a[0] - b[0] || a[1].localeCompare(b[1]));
          heapView.innerHTML = sortedHeap.length
            ? sortedHeap.map(([w, n, p], i) => `<span class="g-chip${i === 0 ? ' g-chip--active' : ''}">(${w}, ${n}${p ? ` via ${p}` : ''})</span>`).join('')
            : '<span style="color:var(--text-muted);font-size:0.72rem;">empty</span>';
          mstView.innerHTML = step.mstEdges.length
            ? step.mstEdges.map(([p, u, w]) => `<span class="g-chip g-chip--done">${p}-${u}:${w}</span>`).join('')
            : '<span style="color:var(--text-muted);font-size:0.72rem;">none yet</span>';
        },
        highlightCode: renderCode,
      });

      viz.bindControls();

      function buildSteps() {
        viz.reset();
        const nodes = canvas.nodes.map((n) => n.id);
        if (!nodes.length) return;
        const start = canvas.startNode || nodes[0];
        startPill.textContent = `Start: ${start} (click any node to change)`;

        const adj = {};
        nodes.forEach((n) => { adj[n] = []; });
        canvas.edges.forEach((e) => {
          const w = Number(e.weight ?? 1);
          adj[e.from].push([e.to, w]);
          adj[e.to].push([e.from, w]);
        });
        Object.values(adj).forEach((l) => l.sort((a, b) => a[0].localeCompare(b[0])));

        const visited = new Set();
        const heap = [[0, start, null]];
        const mstEdges = [];
        let total = 0;

        const snap = (current, exploringEdge, codeLine, description) => {
          const queued = new Set(heap.map((item) => item[1]));
          const nodeStates = {};
          const nodeBadges = {};
          nodes.forEach((n) => {
            if (n === current) nodeStates[n] = 'active';
            else if (visited.has(n)) nodeStates[n] = 'visited';
            else if (queued.has(n)) nodeStates[n] = 'queued';
            if (visited.has(n)) nodeBadges[n] = 'in MST';
          });
          const edgeStates = {};
          mstEdges.forEach(([p, u]) => {
            edgeStates[GraphCanvas.edgeKey(p, u, false)] = 'mst';
          });
          if (exploringEdge) edgeStates[exploringEdge] = 'exploring';

          viz.recordStep({
            heap: heap.map((x) => [...x]),
            mstEdges: mstEdges.map((x) => [...x]),
            total,
            graphState: { nodeStates, nodeBadges, edgeStates },
            codeLine,
            description,
          });
        };

        snap(null, null, 3, `Push (0, ${start}) to start growing the MST from ${start}.`);

        while (heap.length > 0) {
          heap.sort((a, b) => a[0] - b[0] || a[1].localeCompare(b[1]));
          const [w, u, parent] = heap.shift();
          if (visited.has(u)) {
            snap(u, parent ? GraphCanvas.edgeKey(parent, u, false) : null, 8, `Skip (${w}, ${u}) because ${u} is already in the MST.`);
            continue;
          }
          visited.add(u);
          total += w;
          if (parent) mstEdges.push([parent, u, w]);
          snap(u, null, 10, parent
            ? `Add ${parent} - ${u} (weight ${w}) to the MST. Total = ${total}.`
            : `Include root ${u} in the MST with cost 0.`);

          for (const [v, edgeW] of adj[u]) {
            const key = GraphCanvas.edgeKey(u, v, false);
            if (!visited.has(v)) {
              heap.push([edgeW, v, u]);
              snap(u, key, 13, `Push frontier edge (${edgeW}, ${v}) from ${u} into the min-heap.`);
            }
          }
        }

        snap(null, null, 14, `Prim's MST finished. Total tree weight is ${total}.`);
        viz.goToStep(0);
      }

      function loadFromInput() {
        const parsed = GraphCanvas.parseEdgeList(inputEl.value, { directed: false, weighted: true, defaultWeight: 1 });
        canvas.loadGraph(parsed.nodes, parsed.edges);
        buildSteps();
      }

      document.getElementById('btn-apply').addEventListener('click', loadFromInput);
      document.querySelectorAll('[data-edges]').forEach((btn) => {
        btn.addEventListener('click', () => {
          inputEl.value = btn.dataset.edges;
          loadFromInput();
        });
      });

      renderCode();
      loadFromInput();
    </script>
  </body>
</html>
