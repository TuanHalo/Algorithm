<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Validate BST &amp; Kth Smallest Visualizer</title>
    <link rel="stylesheet" href="../shared/clay-visualizer.css" />
    <link rel="stylesheet" href="../shared/binary-tree-canvas.css" />
    <style>
      .vis-presets { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; margin-bottom: 0.75rem; }
      .vis-preset-label { font-size: 0.75rem; color: var(--text-muted); }
      .vis-canvas { flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 0.65rem; min-height: 330px; padding: 1rem 1.15rem; }
      .vis-status-bar { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.45rem; margin-bottom: 0.65rem; }
      .vis-pill { background: var(--bg-card); border: var(--border-clay); box-shadow: var(--shadow-clay-subtle); border-radius: 999px; padding: 0.2rem 0.65rem; font-family: var(--font-code); font-size: 0.74rem; }
      .vis-small-input { max-width: 76px; min-width: 64px !important; flex: 0 0 auto !important; }
    </style>
  </head>
  <body>
    <div class="visualizer">
      <div class="vis-input">
        <input id="tree-input" class="vis-input__field" type="text" value="10, 5, 15, 2, 12, null, 20" placeholder="Level-order: 10, 5, 15, 2, 12" aria-label="Level-order binary tree" />
        <input id="k-input" class="vis-input__field vis-small-input" type="number" min="1" value="3" aria-label="k for kth smallest" />
        <button id="btn-apply" class="vis-btn vis-btn--primary" type="button">Run Check</button>
      </div>

      <div class="t-mode-tabs">
        <span class="vis-preset-label">Mode:</span>
        <button class="vis-btn vis-btn--primary" type="button" data-mode="validate">Validate BST Bounds</button>
        <button class="vis-btn" type="button" data-mode="kth">Kth Smallest (Inorder)</button>
      </div>

      <div class="vis-presets">
        <span class="vis-preset-label">Presets:</span>
        <button class="vis-btn" type="button" data-tree="10, 5, 15, 2, 12, null, 20">Tricky Trap (12 &gt; 10)</button>
        <button class="vis-btn" type="button" data-tree="10, 5, 15, 2, 7, 12, 20">Valid BST</button>
        <button class="vis-btn" type="button" data-tree="5, 1, 4, null, null, 3, 6">Invalid Right (4 &lt; 5)</button>
      </div>

      <div class="vis-controls">
        <button class="vis-btn vis-btn-reset" type="button">Reset</button>
        <button class="vis-btn vis-btn-step-back" type="button">Back</button>
        <button class="vis-btn vis-btn--primary vis-btn-play" type="button">Play</button>
        <button class="vis-btn vis-btn--primary vis-btn-pause" type="button" style="display: none;">Pause</button>
        <button class="vis-btn vis-btn-step-forward" type="button">Next</button>
        <span class="vis-step-counter">No steps</span>
        <label class="vis-speed"><span>Speed</span><input class="vis-speed-slider" type="range" min="1" max="10" value="6" /></label>
      </div>

      <div class="vis-legend">
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-comparing);"></span> Checking</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-active);"></span> Valid / Target</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-swapping);"></span> Bound Violation</span>
      </div>

      <div class="vis-status-bar">
        <span id="status-mode" class="vis-pill">Valid BST: checking...</span>
        <span id="status-extra" class="vis-pill">Bounds: (-inf, +inf)</span>
      </div>

      <div class="vis-canvas">
        <div id="tree-stage" class="t-stage-wrap"></div>
        <div class="t-aux-row">
          <div class="t-aux-box">
            <div class="t-aux-box__title">Active Range / Inorder Progress</div>
            <div id="aux-left" class="t-chip-list"></div>
          </div>
          <div class="t-aux-box">
            <div class="t-aux-box__title">Checked Nodes</div>
            <div id="aux-right" class="t-chip-list"></div>
          </div>
        </div>
      </div>

      <div id="vis-info" class="vis-info" style="margin-bottom: 1rem;">Spot why local parent-child checks fail: node 12 is larger than 5, yet breaks root 10's upper bound!</div>
      <div class="vis-code" id="vis-code"></div>
    </div>

    <script src="../shared/visualizer-base.js"></script>
    <script src="../shared/binary-tree-canvas.js"></script>
    <script>
      const CODE_BY_MODE = {
        validate: [
          'def is_valid_bst(node: TreeNode | None, low: float, high: float) -> bool:',
          '    if node is None:',
          '        return True',
          '    if not (low < node.val < high):',
          '        return False',
          '    return (is_valid_bst(node.left, low, node.val)',
          '            and is_valid_bst(node.right, node.val, high))',
        ],
        kth: [
          'def kth_smallest(root: TreeNode | None, k: int) -> int:',
          '    stack, curr = [], root',
          '    while curr or stack:',
          '        while curr:',
          '            stack.append(curr)',
          '            curr = curr.left',
          '        curr = stack.pop()',
          '        k -= 1',
          '        if k == 0: return curr.val',
          '        curr = curr.right',
        ],
      };

      const codeEl = document.getElementById('vis-code');
      const infoEl = document.getElementById('vis-info');
      const inputEl = document.getElementById('tree-input');
      const kInputEl = document.getElementById('k-input');
      const modePill = document.getElementById('status-mode');
      const extraPill = document.getElementById('status-extra');
      const auxLeft = document.getElementById('aux-left');
      const auxRight = document.getElementById('aux-right');

      let mode = 'validate';
      let currentRoot = null;

      const fmtBound = (v) => (v === -Infinity ? '-inf' : v === Infinity ? '+inf' : String(v));

      function renderCode(activeLine = -1) {
        const lines = CODE_BY_MODE[mode];
        codeEl.innerHTML = lines.map((line, i) => {
          const active = i === activeLine ? ' vis-code__line--active' : '';
          const esc = line.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          return `<span class="vis-code__line${active}"><span class="vis-code__line-number">${i + 1}</span>${esc}</span>`;
        }).join('');
      }

      const canvas = new BinaryTreeCanvas({
        containerEl: document.getElementById('tree-stage'),
      });

      const viz = new VisualizerEngine({
        defaultSpeed: 700,
        render: (step) => {
          canvas.renderBinary(currentRoot, {
            nodeStates: step.nodeStates,
            nodeBadges: step.nodeBadges,
            edgeStates: step.edgeStates,
          });
          infoEl.textContent = step.description;
          modePill.textContent = step.pill1;
          extraPill.textContent = step.pill2;
          auxLeft.innerHTML = step.leftChips.length
            ? step.leftChips.map((c) => `<span class="t-chip ${c.cls || ''}">${c.text}</span>`).join('')
            : '<span class="t-empty">none</span>';
          auxRight.innerHTML = step.rightChips.length
            ? step.rightChips.map((c) => `<span class="t-chip ${c.cls || ''}">${c.text}</span>`).join('')
            : '<span class="t-empty">none yet</span>';
        },
        highlightCode: renderCode,
      });
      viz.bindControls();

      function buildSteps() {
        viz.reset();
        renderCode();
        const parsed = BinaryTreeCanvas.parseLevelOrder(inputEl.value);
        currentRoot = parsed.root;
        if (!currentRoot) {
          canvas.renderBinary(null);
          return;
        }

        if (mode === 'validate') {
          const boundsMap = {};
          const validIds = new Set();
          const badIds = new Set();
          const checked = [];

          const snap = (activeId, activeEdge, pill1, pill2, codeLine, description) => {
            const nodeStates = {};
            const nodeBadges = {};
            Object.keys(parsed.nodesById).forEach((id) => {
              if (badIds.has(id)) nodeStates[id] = 'violation';
              else if (id === activeId) nodeStates[id] = 'active';
              else if (validIds.has(id)) nodeStates[id] = 'visited';
              if (boundsMap[id]) {
                nodeBadges[id] = { text: boundsMap[id], warn: badIds.has(id) };
              }
            });
            const edgeStates = {};
            if (activeEdge) edgeStates[activeEdge] = badIds.size ? 'violation' : 'exploring';

            viz.recordStep({
              pill1,
              pill2,
              leftChips: activeId && boundsMap[activeId] ? [{ text: `allowed: ${boundsMap[activeId]}`, cls: badIds.has(activeId) ? 't-chip--warn' : 't-chip--active' }] : [],
              rightChips: checked.map((c) => ({ text: c.text, cls: c.ok ? 't-chip--done' : 't-chip--warn' })),
              nodeStates,
              nodeBadges,
              edgeStates,
              codeLine,
              description,
            });
          };

          const check = (node, parent, low, high) => {
            if (!node) return true;
            const rangeText = `(${fmtBound(low)}, ${fmtBound(high)})`;
            boundsMap[node.id] = rangeText;
            const edge = parent ? `${parent.id}->${node.id}` : null;
            const num = Number(node.val);
            const ok = num > low && num < high;

            if (!ok) {
              badIds.add(node.id);
              checked.push({ text: `${node.val} ∉ ${rangeText}`, ok: false });
              snap(node.id, edge, 'Valid BST: NO', `Violation at ${node.val}`, 4, `FAIL: ${node.val} violates allowed range ${rangeText}!`);
              return false;
            }

            validIds.add(node.id);
            checked.push({ text: `${node.val} ∈ ${rangeText}`, ok: true });
            snap(node.id, edge, 'Valid BST: checking...', `Bounds: ${rangeText}`, 3, `${node.val} fits inside ${rangeText}. Recurse left with (${fmtBound(low)}, ${node.val}) and right with (${node.val}, ${fmtBound(high)}).`);
            return check(node.left, node, low, num) && check(node.right, node, num, high);
          };

          snap(null, null, 'Valid BST: checking...', 'Bounds: (-inf, +inf)', 0, 'Start BST validation at root with range (-inf, +inf).');
          const ok = check(currentRoot, null, -Infinity, Infinity);
          if (ok) {
            snap(null, null, 'Valid BST: YES', 'All bounds satisfied', 6, 'Every node strictly obeys its ancestor bounds. Valid BST!');
          }
        } else {
          let k = Math.max(1, parseInt(kInputEl.value, 10) || 1);
          const origK = k;
          const stack = [];
          const popped = [];
          let foundId = null;
          let curr = currentRoot;

          const snap = (activeId, codeLine, description) => {
            const stackIds = new Set(stack.map((n) => n.id));
            const nodeStates = {};
            const nodeBadges = {};
            Object.keys(parsed.nodesById).forEach((id) => {
              if (id === foundId) nodeStates[id] = 'visited';
              else if (id === activeId) nodeStates[id] = 'active';
              else if (stackIds.has(id)) nodeStates[id] = 'pivot';
            });
            popped.forEach((p, idx) => {
              nodeBadges[p.id] = `#${idx + 1}`;
            });
            viz.recordStep({
              pill1: `Target: k=${origK} (remaining: ${k})`,
              pill2: foundId ? `Answer: ${parsed.nodesById[foundId].val}` : `Inorder count: ${popped.length}`,
              leftChips: stack.map((n, i) => ({ text: String(n.val), cls: i === stack.length - 1 ? 't-chip--pivot' : '' })),
              rightChips: popped.map((p, idx) => ({ text: `#${idx + 1} ${p.val}`, cls: p.id === foundId ? 't-chip--done' : '' })),
              nodeStates,
              nodeBadges,
              edgeStates: {},
              codeLine,
              description,
            });
          };

          snap(null, 1, `Find the #${origK} smallest element using iterative inorder traversal.`);
          while (curr || stack.length > 0) {
            while (curr) {
              stack.push(curr);
              snap(curr.id, 4, `Push ${curr.val} onto stack and keep moving left.`);
              curr = curr.left;
            }
            curr = stack.pop();
            popped.push(curr);
            k -= 1;
            if (k === 0) {
              foundId = curr.id;
              snap(curr.id, 8, `Pop ${curr.val}: k reached 0! The #${origK} smallest value is ${curr.val}.`);
              break;
            }
            snap(curr.id, 7, `Pop ${curr.val} (#${popped.length} smallest), remaining k = ${k}. Step to right child.`);
            curr = curr.right;
          }
          if (!foundId) {
            snap(null, 0, `Tree has fewer than ${origK} nodes.`);
          }
        }

        viz.goToStep(0);
      }

      document.getElementById('btn-apply').addEventListener('click', buildSteps);
      document.querySelectorAll('[data-mode]').forEach((btn) => {
        btn.addEventListener('click', () => {
          mode = btn.dataset.mode;
          document.querySelectorAll('[data-mode]').forEach((b) => {
            b.classList.toggle('vis-btn--primary', b.dataset.mode === mode);
          });
          buildSteps();
        });
      });
      document.querySelectorAll('[data-tree]').forEach((btn) => {
        btn.addEventListener('click', () => {
          inputEl.value = btn.dataset.tree;
          buildSteps();
        });
      });

      renderCode();
      buildSteps();
    </script>
  </body>
</html>
