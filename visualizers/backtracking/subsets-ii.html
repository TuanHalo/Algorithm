<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subsets II (Duplicate Pruning) Visualizer</title>
    <link rel="stylesheet" href="../shared/clay-visualizer.css" />
    <link rel="stylesheet" href="../shared/tree-canvas.css" />
    <style>
      .vis-presets { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; margin-bottom: 0.75rem; }
      .vis-preset-label { font-size: 0.75rem; color: var(--text-muted); }
      .vis-canvas { flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 0.75rem; min-height: 360px; padding: 1rem 1.15rem; }
      .vis-status-bar { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.45rem; margin-bottom: 0.65rem; }
      .vis-pill { background: var(--bg-card); border: var(--border-clay); box-shadow: var(--shadow-clay-subtle); border-radius: 999px; padding: 0.2rem 0.65rem; font-family: var(--font-code); font-size: 0.74rem; }
    </style>
  </head>
  <body>
    <div class="visualizer">
      <div class="vis-input">
        <input id="nums-input" class="vis-input__field" type="text" value="1, 2, 2" placeholder="Up to 4 integers with repeats: 1, 2, 2" aria-label="Input integers with duplicates" />
        <button id="btn-apply" class="vis-btn vis-btn--primary" type="button">Load &amp; Run</button>
      </div>

      <div class="vis-presets">
        <span class="vis-preset-label">Presets:</span>
        <button class="vis-btn" type="button" data-nums="1, 2, 2">1, 2, 2 (6 unique)</button>
        <button class="vis-btn" type="button" data-nums="2, 2, 2">2, 2, 2 (4 unique)</button>
        <button class="vis-btn" type="button" data-nums="1, 1, 2, 3">1, 1, 2, 3 (12 unique)</button>
      </div>

      <div class="vis-controls">
        <button class="vis-btn vis-btn-reset" type="button">Reset</button>
        <button class="vis-btn vis-btn-step-back" type="button">Back</button>
        <button class="vis-btn vis-btn--primary vis-btn-play" type="button">Play</button>
        <button class="vis-btn vis-btn--primary vis-btn-pause" type="button" style="display: none;">Pause</button>
        <button class="vis-btn vis-btn-step-forward" type="button">Next</button>
        <span class="vis-step-counter">No steps</span>
        <label class="vis-speed"><span>Speed</span><input class="vis-speed-slider" type="range" min="1" max="10" value="6" /></label>
      </div>

      <div class="vis-legend">
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-comparing);"></span> Active</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-pivot);"></span> On Path</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-swapping);"></span> Duplicate Branch Skipped</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-active);"></span> Saved Subset</span>
      </div>

      <div class="vis-status-bar">
        <span id="status-start" class="vis-pill">Start: 0</span>
        <span id="status-count" class="vis-pill">Unique Subsets: 0</span>
      </div>

      <div class="vis-canvas">
        <div id="tree-stage" class="bt-stage-wrap"></div>
        <div class="bt-aux-row">
          <div class="bt-aux-box">
            <div class="bt-aux-box__title">Sorted Input &amp; Loop Pointer</div>
            <div id="nums-view" class="bt-chip-list"></div>
          </div>
          <div class="bt-aux-box">
            <div class="bt-aux-box__title">Current Path</div>
            <div id="path-view" class="bt-chip-list"></div>
          </div>
          <div class="bt-aux-box">
            <div class="bt-aux-box__title">Collected Unique Subsets</div>
            <div id="result-view" class="bt-chip-list"></div>
          </div>
        </div>
      </div>

      <div id="vis-info" class="vis-info" style="margin-bottom: 1rem;">Sorting places duplicates side by side so same-depth repeats are skipped cleanly.</div>
      <div class="vis-code" id="vis-code"></div>
    </div>

    <script src="../shared/visualizer-base.js"></script>
    <script src="../shared/tree-canvas.js"></script>
    <script>
      const PYTHON_LINES = [
        'def subsets_with_dup(nums: list[int]) -> list[list[int]]:',
        '    nums.sort()',
        '    result: list[list[int]] = []',
        '    path: list[int] = []',
        '    def backtrack(start: int) -> None:',
        '        result.append(path.copy())',
        '        for i in range(start, len(nums)):',
        '            if i > start and nums[i] == nums[i - 1]:',
        '                continue',
        '            path.append(nums[i])',
        '            backtrack(i + 1)',
        '            path.pop()',
        '    backtrack(0)',
        '    return result',
      ];

      const codeEl = document.getElementById('vis-code');
      const infoEl = document.getElementById('vis-info');
      const inputEl = document.getElementById('nums-input');
      const numsView = document.getElementById('nums-view');
      const pathView = document.getElementById('path-view');
      const resultView = document.getElementById('result-view');
      const startPill = document.getElementById('status-start');
      const countPill = document.getElementById('status-count');

      function renderCode(activeLine = -1) {
        codeEl.innerHTML = PYTHON_LINES.map((line, i) => {
          const active = i === activeLine ? ' vis-code__line--active' : '';
          const esc = line.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          return `<span class="vis-code__line${active}"><span class="vis-code__line-number">${i + 1}</span>${esc}</span>`;
        }).join('');
      }

      const treeCanvas = new TreeCanvas({
        containerEl: document.getElementById('tree-stage'),
        nodeWidth: 70,
        gapX: 12,
        levelGap: 62,
      });

      const viz = new VisualizerEngine({
        defaultSpeed: 650,
        render: (step) => {
          treeCanvas.render(step.tree);
          infoEl.textContent = step.description;
          startPill.textContent = `Start: ${step.start}`;
          countPill.textContent = `Unique Subsets: ${step.results.length}`;
          numsView.innerHTML = step.nums
            .map((v, i) => {
              let cls = 'bt-chip';
              if (i === step.activeIdx) cls += step.pruned ? ' bt-chip--pruned' : ' bt-chip--active';
              else if (i < step.start) cls += ' bt-chip--path';
              return `<span class="${cls}">[${i}]=${v}</span>`;
            })
            .join('');
          pathView.innerHTML = step.path.length
            ? step.path.map((v) => `<span class="bt-chip bt-chip--path">${v}</span>`).join('')
            : '<span class="bt-chip">[]</span>';
          resultView.innerHTML = step.results.length
            ? step.results.map((r) => `<span class="bt-chip bt-chip--done">[${r.join(', ')}]</span>`).join('')
            : '<span style="color:var(--text-muted);font-size:0.72rem;">none yet</span>';
        },
        highlightCode: renderCode,
      });

      viz.bindControls();

      function parseNums() {
        const vals = inputEl.value
          .split(/[,\s]+/)
          .map((s) => s.trim())
          .filter(Boolean)
          .map(Number)
          .filter((n) => Number.isFinite(n))
          .slice(0, 4);
        return (vals.length ? vals : [1, 2, 2]).sort((a, b) => a - b);
      }

      function buildSteps() {
        viz.reset();
        const nums = parseNums();
        inputEl.value = nums.join(', ');

        let nextId = 1;
        const root = { id: 'n0', label: '[]', edgeLabel: '', finalState: 'solution', children: [] };
        const path = [];
        const results = [];
        const stackIds = new Set();

        function cloneTree(node, activeId) {
          let state = node.finalState || 'default';
          if (node.id === activeId) state = 'active';
          else if (stackIds.has(node.id)) state = 'on-path';
          return {
            id: node.id,
            label: node.label,
            edgeLabel: node.edgeLabel,
            state,
            children: node.children.map((c) => cloneTree(c, activeId)),
          };
        }

        const snap = (start, activeIdx, activeId, pruned, codeLine, description) => {
          viz.recordStep({
            nums,
            start,
            activeIdx,
            pruned,
            path: [...path],
            results: results.map((r) => [...r]),
            tree: cloneTree(root, activeId),
            codeLine,
            description,
          });
        };

        function explore(start, node) {
          stackIds.add(node.id);
          results.push([...path]);
          node.finalState = 'solution';
          snap(start, -1, node.id, false, 5, `Save [${path.join(', ')}] at entry (every prefix path is a valid unique subset).`);

          for (let i = start; i < nums.length; i++) {
            if (i > start && nums[i] === nums[i - 1]) {
              const dupNode = { id: `n${nextId++}`, label: 'dup skip', edgeLabel: `skip ${nums[i]}`, finalState: 'pruned', children: [] };
              node.children.push(dupNode);
              snap(start, i, dupNode.id, true, 8, `Skip i=${i} (${nums[i]}): i > start (${start}) and nums[${i}] == nums[${i - 1}].`);
              continue;
            }

            path.push(nums[i]);
            const child = { id: `n${nextId++}`, label: `[${path.join(',')}]`, edgeLabel: `+${nums[i]}`, finalState: 'default', children: [] };
            node.children.push(child);
            snap(start, i, node.id, false, 9, `Pick nums[${i}] = ${nums[i]} and recurse from start = ${i + 1}.`);

            explore(i + 1, child);

            path.pop();
            snap(start, i, node.id, false, 11, `Pop ${nums[i]} to backtrack at start = ${start}.`);
          }

          stackIds.delete(node.id);
          snap(start, -1, node.id, false, 4, `Finish loop from start = ${start} and return.`);
        }

        snap(0, -1, null, false, 1, `Sort input to [${nums.join(', ')}] before backtracking.`);
        explore(0, root);
        snap(0, -1, null, false, 13, `Finished. Found ${results.length} unique subsets.`);
        viz.goToStep(0);
      }

      document.getElementById('btn-apply').addEventListener('click', buildSteps);
      document.querySelectorAll('[data-nums]').forEach((btn) => {
        btn.addEventListener('click', () => {
          inputEl.value = btn.dataset.nums;
          buildSteps();
        });
      });

      renderCode();
      buildSteps();
    </script>
  </body>
</html>
