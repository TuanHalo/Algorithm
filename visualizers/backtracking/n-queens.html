<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>N-Queens Visualizer</title>
    <link rel="stylesheet" href="../shared/clay-visualizer.css" />
    <link rel="stylesheet" href="../shared/tree-canvas.css" />
    <style>
      .vis-input__num { width: 105px; flex: 0 0 auto; min-width: 88px; }
      .vis-presets { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; margin-bottom: 0.75rem; }
      .vis-preset-label { font-size: 0.75rem; color: var(--text-muted); }
      .vis-canvas { flex-direction: column; align-items: center; justify-content: flex-start; gap: 0.85rem; min-height: 340px; padding: 1.15rem; }
      .vis-status-bar { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.45rem; margin-bottom: 0.65rem; }
      .vis-pill { background: var(--bg-card); border: var(--border-clay); box-shadow: var(--shadow-clay-subtle); border-radius: 999px; padding: 0.2rem 0.65rem; font-family: var(--font-code); font-size: 0.74rem; }
      .nq-board { display: grid; gap: 3px; padding: 0.65rem; border-radius: var(--border-radius-sm); background: rgba(255, 255, 255, 0.45); box-shadow: var(--shadow-clay-pressed); }
      .nq-cell { width: 44px; height: 44px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; font-weight: 700; transition: all 180ms ease; border: 1px solid rgba(0,0,0,0.06); }
      .nq-cell--light { background: rgba(255, 255, 255, 0.88); }
      .nq-cell--dark { background: rgba(205, 180, 219, 0.28); }
      .nq-cell--attacked { background: rgba(255, 211, 182, 0.48); }
      .nq-cell--queen { background: var(--vis-active); border: 2px solid #15803d; }
      .nq-cell--testing { background: var(--vis-comparing); border: 2px solid #c2410c; transform: scale(1.05); }
      .nq-cell--conflict { background: var(--vis-swapping); border: 2px solid #b91c1c; }
    </style>
  </head>
  <body>
    <div class="visualizer">
      <div class="vis-input">
        <label for="n-input" style="font-size:0.85rem;font-weight:500;">Board size N (4 to 6):</label>
        <input id="n-input" class="vis-input__field vis-input__num" type="number" min="4" max="6" value="4" aria-label="Board size N" />
        <button id="btn-apply" class="vis-btn vis-btn--primary" type="button">Load &amp; Run</button>
      </div>

      <div class="vis-presets">
        <span class="vis-preset-label">Presets:</span>
        <button class="vis-btn" type="button" data-n="4">4-Queens (2 solutions)</button>
        <button class="vis-btn" type="button" data-n="5">5-Queens (10 solutions)</button>
        <button class="vis-btn" type="button" data-n="6">6-Queens (4 solutions)</button>
      </div>

      <div class="vis-controls">
        <button class="vis-btn vis-btn-reset" type="button">Reset</button>
        <button class="vis-btn vis-btn-step-back" type="button">Back</button>
        <button class="vis-btn vis-btn--primary vis-btn-play" type="button">Play</button>
        <button class="vis-btn vis-btn--primary vis-btn-pause" type="button" style="display: none;">Pause</button>
        <button class="vis-btn vis-btn-step-forward" type="button">Next</button>
        <span class="vis-step-counter">No steps</span>
        <label class="vis-speed"><span>Speed</span><input class="vis-speed-slider" type="range" min="1" max="10" value="6" /></label>
      </div>

      <div class="vis-legend">
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-active);"></span> Placed Queen</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-comparing);"></span> Trying Cell</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-swapping);"></span> Conflict</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-highlight);"></span> Attacked Square</span>
      </div>

      <div class="vis-status-bar">
        <span id="status-row" class="vis-pill">Row: 0</span>
        <span id="status-sols" class="vis-pill">Solutions Found: 0</span>
      </div>

      <div class="vis-canvas">
        <div id="board-stage" class="nq-board"></div>
        <div class="bt-aux-row">
          <div class="bt-aux-box">
            <div class="bt-aux-box__title">Blocked Sets (cols, r-c, r+c)</div>
            <div id="sets-view" class="bt-chip-list"></div>
          </div>
          <div class="bt-aux-box">
            <div class="bt-aux-box__title">Found Solutions (col per row)</div>
            <div id="sols-view" class="bt-chip-list"></div>
          </div>
        </div>
      </div>

      <div id="vis-info" class="vis-info" style="margin-bottom: 1rem;">Place one queen per row while three sets block attacked columns and diagonals in O(1).</div>
      <div class="vis-code" id="vis-code"></div>
    </div>

    <script src="../shared/visualizer-base.js"></script>
    <script>
      const PYTHON_LINES = [
        'def solve_n_queens(n: int) -> list[list[int]]:',
        '    solutions: list[list[int]] = []',
        '    cols, diag1, diag2 = set(), set(), set()',
        '    queens = [-1] * n',
        '    def backtrack(r: int) -> None:',
        '        if r == n:',
        '            solutions.append(queens.copy())',
        '            return',
        '        for c in range(n):',
        '            if c in cols or (r - c) in diag1 or (r + c) in diag2:',
        '                continue',
        '            cols.add(c); diag1.add(r - c); diag2.add(r + c)',
        '            queens[r] = c',
        '            backtrack(r + 1)',
        '            cols.remove(c); diag1.remove(r - c); diag2.remove(r + c)',
        '            queens[r] = -1',
        '    backtrack(0)',
        '    return solutions',
      ];

      const codeEl = document.getElementById('vis-code');
      const infoEl = document.getElementById('vis-info');
      const nInput = document.getElementById('n-input');
      const boardStage = document.getElementById('board-stage');
      const setsView = document.getElementById('sets-view');
      const solsView = document.getElementById('sols-view');
      const rowPill = document.getElementById('status-row');
      const solsPill = document.getElementById('status-sols');

      function renderCode(activeLine = -1) {
        codeEl.innerHTML = PYTHON_LINES.map((line, i) => {
          const active = i === activeLine ? ' vis-code__line--active' : '';
          const esc = line.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          return `<span class="vis-code__line${active}"><span class="vis-code__line-number">${i + 1}</span>${esc}</span>`;
        }).join('');
      }

      const viz = new VisualizerEngine({
        defaultSpeed: 450,
        render: (step) => {
          infoEl.textContent = step.description;
          rowPill.textContent = `Row: ${step.row}`;
          solsPill.textContent = `Solutions Found: ${step.solutions.length}`;

          const n = step.queens.length;
          const cellPx = n <= 5 ? 46 : 40;
          boardStage.style.gridTemplateColumns = `repeat(${n}, ${cellPx}px)`;

          const colSet = new Set(step.cols);
          const d1Set = new Set(step.diag1);
          const d2Set = new Set(step.diag2);

          let html = '';
          for (let r = 0; r < n; r++) {
            for (let c = 0; c < n; c++) {
              const hasQueen = step.queens[r] === c;
              const isTesting = step.test && step.test[0] === r && step.test[1] === c;
              const isConflict = step.conflict && step.conflict[0] === r && step.conflict[1] === c;
              const attacked = !hasQueen && (colSet.has(c) || d1Set.has(r - c) || d2Set.has(r + c));
              let cls = `nq-cell ${(r + c) % 2 === 0 ? 'nq-cell--light' : 'nq-cell--dark'}`;
              if (hasQueen) cls += ' nq-cell--queen';
              else if (isConflict) cls += ' nq-cell--conflict';
              else if (isTesting) cls += ' nq-cell--testing';
              else if (attacked) cls += ' nq-cell--attacked';
              html += `<div class="${cls}" style="width:${cellPx}px;height:${cellPx}px;">${hasQueen ? '♛' : isConflict ? '×' : ''}</div>`;
            }
          }
          boardStage.innerHTML = html;

          setsView.innerHTML = [
            `<span class="bt-chip">cols: {${step.cols.join(', ')}}</span>`,
            `<span class="bt-chip">r-c: {${step.diag1.join(', ')}}</span>`,
            `<span class="bt-chip">r+c: {${step.diag2.join(', ')}}</span>`,
          ].join('');

          solsView.innerHTML = step.solutions.length
            ? step.solutions.map((s, idx) => `<span class="bt-chip bt-chip--done">#${idx + 1}: [${s.join(',')}]</span>`).join('')
            : '<span style="color:var(--text-muted);font-size:0.72rem;">none yet</span>';
        },
        highlightCode: renderCode,
      });

      viz.bindControls();

      function buildSteps() {
        viz.reset();
        const n = Math.max(4, Math.min(6, parseInt(nInput.value, 10) || 4));
        nInput.value = String(n);

        const cols = new Set();
        const diag1 = new Set();
        const diag2 = new Set();
        const queens = new Array(n).fill(-1);
        const solutions = [];
        // Keep 6-Queens responsive while preserving full step trace for 4 & 5
        const maxSolutions = n === 6 ? 2 : 20;

        const snap = (row, test, conflict, codeLine, description) => {
          viz.recordStep({
            row,
            test,
            conflict,
            queens: [...queens],
            cols: [...cols].sort((a, b) => a - b),
            diag1: [...diag1].sort((a, b) => a - b),
            diag2: [...diag2].sort((a, b) => a - b),
            solutions: solutions.map((s) => [...s]),
            codeLine,
            description,
          });
        };

        function backtrack(r) {
          if (solutions.length >= maxSolutions) return;
          if (r === n) {
            solutions.push([...queens]);
            snap(r, null, null, 6, `All ${n} rows filled! Save solution [${queens.join(', ')}] and return.`);
            return;
          }

          for (let c = 0; c < n; c++) {
            if (solutions.length >= maxSolutions) return;
            if (cols.has(c) || diag1.has(r - c) || diag2.has(r + c)) {
              snap(r, null, [r, c], 10, `Conflict at (${r}, ${c}): column or diagonal is already attacked.`);
              continue;
            }
            cols.add(c);
            diag1.add(r - c);
            diag2.add(r + c);
            queens[r] = c;
            snap(r, [r, c], null, 12, `Place queen at (${r}, ${c}) and add c=${c}, r-c=${r - c}, r+c=${r + c}.`);

            backtrack(r + 1);

            cols.delete(c);
            diag1.delete(r - c);
            diag2.delete(r + c);
            queens[r] = -1;
            snap(r, null, null, 14, `Remove queen from (${r}, ${c}) and clear its blocked sets.`);
          }
        }

        snap(0, null, null, 16, `Ready to solve ${n}-Queens row by row.`);
        backtrack(0);
        const suffix = n === 6 ? ' (stopped after first 2 solutions for playback speed)' : '';
        snap(0, null, null, 17, `Finished. Found ${solutions.length} solution(s)${suffix}.`);
        viz.goToStep(0);
      }

      document.getElementById('btn-apply').addEventListener('click', buildSteps);
      document.querySelectorAll('[data-n]').forEach((btn) => {
        btn.addEventListener('click', () => {
          nInput.value = btn.dataset.n;
          buildSteps();
        });
      });

      renderCode();
      buildSteps();
    </script>
  </body>
</html>
