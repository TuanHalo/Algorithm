<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Separate Chaining & Rehashing Visualizer</title>
    <link rel="stylesheet" href="../shared/clay-visualizer.css" />
    <style>
      .vis-presets {
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 0.75rem;
      }

      .vis-preset-label { font-size: 0.75rem; color: var(--text-muted); }

      .vis-status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
        font-family: var(--font-code);
        font-size: 0.78rem;
        color: var(--text-secondary);
      }

      .vis-status-group { display: flex; gap: 0.5rem; flex-wrap: wrap; }

      .vis-pill {
        background: var(--bg-card);
        border: var(--border-clay);
        box-shadow: var(--shadow-clay-subtle);
        border-radius: 999px;
        padding: 0.25rem 0.75rem;
      }

      .vis-pill--accent {
        background: rgba(181, 199, 237, 0.5);
        font-weight: 600;
        color: var(--text-primary);
      }

      .vis-pill--rehash {
        background: var(--vis-pivot);
        font-weight: 600;
        color: var(--text-primary);
      }

      .vis-canvas {
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-start;
        gap: 0.55rem;
        min-height: 240px;
        padding: 1.15rem 1.25rem;
      }

      .chain-row {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        padding: 0.4rem 0.65rem;
        border-radius: var(--border-radius-xs);
        background: rgba(255, 255, 255, 0.46);
        border: var(--border-clay);
        box-shadow: var(--shadow-clay-subtle);
        overflow-x: auto;
      }

      .chain-row--active {
        background: rgba(181, 199, 237, 0.5);
      }

      .chain-row__bucket {
        font-family: var(--font-code);
        font-size: 0.72rem;
        font-weight: 700;
        color: var(--text-muted);
        min-width: 42px;
      }

      .chain-node {
        font-family: var(--font-code);
        font-size: 0.75rem;
        font-weight: 600;
        padding: 0.22rem 0.55rem;
        border-radius: 7px;
        background: var(--vis-sorted);
        border: var(--border-clay);
        box-shadow: var(--shadow-clay-subtle);
        white-space: nowrap;
      }

      .chain-node--active { background: var(--vis-active); }
      .chain-node--walking { background: var(--vis-comparing); }
      .chain-arrow { color: var(--text-muted); font-size: 0.85rem; }
      .chain-null { font-family: var(--font-code); font-size: 0.7rem; color: var(--text-muted); }
    </style>
  </head>
  <body>
    <div class="visualizer">
      <div class="vis-input">
        <input
          type="text"
          id="entriesInput"
          class="vis-input__field"
          value="cat:1, act:2, dog:3, god:4, owl:5, fox:6"
          placeholder="key:val pairs (e.g., cat:1, act:2, dog:3, god:4)"
          aria-label="Key value pairs"
        />
        <button id="btnBuild" class="vis-btn vis-btn--primary">Build & Rehash</button>
      </div>

      <div class="vis-presets">
        <span class="vis-preset-label">Presets:</span>
        <button class="vis-btn" data-entries="cat:1, act:2, dog:3, god:4, owl:5, fox:6">Anagrams + 2× Rehash</button>
        <button class="vis-btn" data-entries="ab:10, ba:20, cd:30, dc:40">Heavy Collisions</button>
        <button class="vis-btn" data-entries="a:1, b:2, c:3, d:4, e:5, f:6, g:7">Multiple Resizes (4 → 8 → 16)</button>
      </div>

      <div class="vis-controls">
        <button class="vis-btn vis-btn--primary vis-btn-play">▶ Play</button>
        <button class="vis-btn vis-btn-pause" style="display: none">⏸ Pause</button>
        <button class="vis-btn vis-btn-step-back">⏮ Step Back</button>
        <button class="vis-btn vis-btn-step-forward">⏭ Step</button>
        <button class="vis-btn vis-btn-reset">↺ Reset</button>
        <span class="vis-step-counter">No steps</span>
        <div class="vis-speed">
          <span>Speed</span>
          <input type="range" class="vis-speed-slider" min="1" max="10" value="6" />
        </div>
      </div>

      <div class="vis-status-bar">
        <div class="vis-status-group">
          <span class="vis-pill vis-pill--accent" id="pillPhase">Insert</span>
          <span class="vis-pill" id="pillCap">Capacity: 4</span>
        </div>
        <div class="vis-status-group">
          <span class="vis-pill" id="pillAlpha">Load α: 0.00</span>
        </div>
      </div>

      <div class="vis-canvas" id="canvas"></div>

      <div class="vis-legend">
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: #b5c7ed"></span>Active Bucket</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-comparing)"></span>Walking Chain</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-active)"></span>Appended Node</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-pivot)"></span>2× Rehash Event</span>
      </div>

      <div class="vis-code" id="codePanel"></div>
      <div class="vis-info" id="infoBar">Watch collisions form linked chains and trigger automatic 2× rehashing past α = 0.75.</div>
    </div>

    <script src="../shared/visualizer-base.js"></script>
    <script>
      const CODE_LINES = [
        'def put(self, key: str, value: int) -> None:',
        '    idx = sum(ord(c) for c in key) % len(self.buckets)',
        '    for i, (k, _) in enumerate(self.buckets[idx]):',
        '        if k == key:',
        '            self.buckets[idx][i] = (key, value)',
        '            return',
        '    self.buckets[idx].append((key, value))',
        '    self.size += 1',
        '    if self.size / len(self.buckets) > 0.75:',
        '        self._rehash()',
        '',
        'def _rehash(self) -> None:',
        '    old_buckets = self.buckets',
        '    self.buckets = [[] for _ in range(len(old_buckets) * 2)]',
        '    for chain in old_buckets:',
        '        for key, val in chain:',
        '            self.put(key, val)',
      ];

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = String(text);
        return div.innerHTML;
      }

      const codePanel = document.getElementById('codePanel');
      codePanel.innerHTML = CODE_LINES.map((line, i) =>
        `<span class="vis-code__line" data-line="${i}"><span class="vis-code__line-number">${i + 1}</span>${escapeHtml(line)}</span>`
      ).join('');

      function highlightCode(lineIndex) {
        codePanel.querySelectorAll('.vis-code__line').forEach((el, idx) => {
          el.classList.toggle('vis-code__line--active', idx === lineIndex);
        });
      }

      function parsePairs(raw) {
        return raw.split(',').map((item) => {
          const [k, v] = item.split(':').map((s) => s.trim());
          return k ? { key: k, val: v ?? '1' } : null;
        }).filter(Boolean).slice(0, 10);
      }

      const viz = new VisualizerEngine({
        defaultSpeed: 550,
        highlightCode,
        render(step) {
          const { buckets, activeBucket, activeNodeIdx, nodeState, size, isRehash, phaseLabel, description } = step;
          const cap = buckets.length;
          const phasePill = document.getElementById('pillPhase');
          phasePill.textContent = phaseLabel;
          phasePill.className = isRehash ? 'vis-pill vis-pill--rehash' : 'vis-pill vis-pill--accent';
          document.getElementById('pillCap').textContent = `Capacity: ${cap}`;
          document.getElementById('pillAlpha').textContent = `Load α: ${size}/${cap} = ${(size / cap).toFixed(2)}`;

          document.getElementById('canvas').innerHTML = buckets.map((chain, idx) => {
            const rowCls = idx === activeBucket ? 'chain-row chain-row--active' : 'chain-row';
            const nodesHtml = chain.map(([k, v], nIdx) => {
              let cls = 'chain-node';
              if (idx === activeBucket && nIdx === activeNodeIdx) {
                cls += nodeState === 'added' ? ' chain-node--active' : ' chain-node--walking';
              }
              return `<span class="${cls}">${escapeHtml(k)}: ${escapeHtml(v)}</span><span class="chain-arrow">→</span>`;
            }).join('');
            return `<div class="${rowCls}"><span class="chain-row__bucket">[${idx}]</span>${nodesHtml}<span class="chain-null">None</span></div>`;
          }).join('');

          document.getElementById('infoBar').textContent = description;
        },
      });

      function hashStr(key, cap) {
        let sum = 0;
        for (const c of key) sum += c.charCodeAt(0);
        return sum % cap;
      }

      function buildSteps() {
        const pairs = parsePairs(document.getElementById('entriesInput').value);
        if (pairs.length === 0) return;
        viz.reset();

        let buckets = Array.from({ length: 4 }, () => []);
        let size = 0;
        const snap = () => buckets.map((c) => c.map((p) => [...p]));

        viz.recordStep({
          buckets: snap(), activeBucket: null, activeNodeIdx: -1, nodeState: null,
          size, isRehash: false, phaseLabel: 'Init (cap = 4)', codeLine: 0,
          description: 'Started ChainedHashTable with capacity 4 and threshold α = 0.75.',
        });

        for (const { key, val } of pairs) {
          const idx = hashStr(key, buckets.length);
          viz.recordStep({
            buckets: snap(), activeBucket: idx, activeNodeIdx: -1, nodeState: null,
            size, isRehash: false, phaseLabel: `put(${key}, ${val})`, codeLine: 1,
            description: `Hashed "${key}" → bucket [${idx}] (mod ${buckets.length}).`,
          });

          for (let i = 0; i < buckets[idx].length; i++) {
            viz.recordStep({
              buckets: snap(), activeBucket: idx, activeNodeIdx: i, nodeState: 'walking',
              size, isRehash: false, phaseLabel: `Walk chain [${idx}]`, codeLine: 2,
              description: `Collision check at node ${i} ("${buckets[idx][i][0]}" != "${key}").`,
            });
          }

          const existingIdx = buckets[idx].findIndex(([k]) => k === key);
          if (existingIdx !== -1) {
            buckets[idx][existingIdx] = [key, val];
            viz.recordStep({
              buckets: snap(), activeBucket: idx, activeNodeIdx: existingIdx, nodeState: 'added',
              size, isRehash: false, phaseLabel: `Updated ${key}`, codeLine: 4,
              description: `Updated existing key "${key}" to ${val} in bucket [${idx}].`,
            });
          } else {
            buckets[idx].push([key, val]);
            size += 1;
            viz.recordStep({
              buckets: snap(), activeBucket: idx, activeNodeIdx: buckets[idx].length - 1, nodeState: 'added',
              size, isRehash: false, phaseLabel: `Appended ${key}`, codeLine: 6,
              description: `Appended (${key}, ${val}) to chain [${idx}]. Size = ${size}.`,
            });
          }

          if (size / buckets.length > 0.75) {
            const oldCap = buckets.length;
            const newCap = oldCap * 2;
            viz.recordStep({
              buckets: snap(), activeBucket: null, activeNodeIdx: -1, nodeState: null,
              size, isRehash: true, phaseLabel: `Rehash ${oldCap} → ${newCap}`, codeLine: 9,
              description: `Load factor ${size}/${oldCap} = ${(size / oldCap).toFixed(2)} > 0.75! Doubling buckets to ${newCap}.`,
            });

            const oldBuckets = buckets;
            buckets = Array.from({ length: newCap }, () => []);
            size = 0;

            viz.recordStep({
              buckets: snap(), activeBucket: null, activeNodeIdx: -1, nodeState: null,
              size, isRehash: true, phaseLabel: `New table (${newCap})`, codeLine: 13,
              description: `Allocated ${newCap} empty buckets; now re-inserting all saved entries.`,
            });

            for (const chain of oldBuckets) {
              for (const [k, v] of chain) {
                const newIdx = hashStr(k, newCap);
                buckets[newIdx].push([k, v]);
                size += 1;
                viz.recordStep({
                  buckets: snap(), activeBucket: newIdx, activeNodeIdx: buckets[newIdx].length - 1, nodeState: 'added',
                  size, isRehash: true, phaseLabel: `Rehash ${k} → [${newIdx}]`, codeLine: 16,
                  description: `Rehashed "${k}" from mod ${oldCap} into new bucket [${newIdx}] (mod ${newCap}).`,
                });
              }
            }
          }
        }

        viz.goToStep(0);
      }

      viz.bindControls();
      document.getElementById('btnBuild').addEventListener('click', buildSteps);
      document.querySelectorAll('.vis-presets .vis-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          document.getElementById('entriesInput').value = btn.dataset.entries;
          buildSteps();
        });
      });

      buildSteps();
    </script>
  </body>
</html>
