<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prefix Sum + Hash Map Visualizer</title>
    <link rel="stylesheet" href="../shared/clay-visualizer.css" />
    <style>
      .vis-input__target {
        width: 110px;
        flex: 0 0 auto;
        min-width: 90px;
      }

      .vis-presets {
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 0.75rem;
      }

      .vis-preset-label { font-size: 0.75rem; color: var(--text-muted); }

      .vis-status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
        font-family: var(--font-code);
        font-size: 0.78rem;
        color: var(--text-secondary);
      }

      .vis-status-group { display: flex; gap: 0.5rem; flex-wrap: wrap; }

      .vis-pill {
        background: var(--bg-card);
        border: var(--border-clay);
        box-shadow: var(--shadow-clay-subtle);
        border-radius: 999px;
        padding: 0.25rem 0.75rem;
      }

      .vis-pill--accent {
        background: rgba(181, 199, 237, 0.5);
        font-weight: 600;
        color: var(--text-primary);
      }

      .vis-canvas {
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-start;
        gap: 0.9rem;
        min-height: 225px;
        padding: 1.15rem 1.25rem;
      }

      .array-strip {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 0.45rem;
      }

      .arr-cell {
        min-width: 54px;
        padding: 0.5rem 0.6rem;
        border-radius: var(--border-radius-xs);
        background: rgba(255, 255, 255, 0.58);
        border: var(--border-clay);
        box-shadow: var(--shadow-clay-subtle);
        text-align: center;
        font-family: var(--font-code);
        transition: transform 250ms ease, background 250ms ease;
      }

      .arr-cell--visited { background: rgba(168, 216, 234, 0.55); }
      .arr-cell--current { background: #b5c7ed; transform: translateY(-4px); font-weight: 700; }
      .arr-cell--matched { background: var(--vis-active); }

      .arr-cell__val { font-size: 0.95rem; font-weight: 700; }
      .arr-cell__idx { font-size: 0.65rem; color: var(--text-muted); margin-top: 2px; }

      .formula-banner {
        text-align: center;
        font-family: var(--font-code);
        font-size: 0.82rem;
        padding: 0.55rem 0.9rem;
        border-radius: var(--border-radius-xs);
        background: rgba(255, 255, 255, 0.45);
        box-shadow: var(--shadow-clay-pressed);
      }

      .seen-map {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
        align-items: center;
        padding: 0.6rem 0.8rem;
        border-radius: var(--border-radius-xs);
        background: rgba(255, 255, 255, 0.42);
        box-shadow: var(--shadow-clay-pressed);
      }

      .seen-label {
        font-family: var(--font-code);
        font-size: 0.72rem;
        font-weight: 700;
        color: var(--text-muted);
        margin-right: 0.3rem;
      }

      .seen-chip {
        font-family: var(--font-code);
        font-size: 0.76rem;
        font-weight: 600;
        padding: 0.22rem 0.55rem;
        border-radius: 7px;
        background: var(--vis-sorted);
        box-shadow: var(--shadow-clay-subtle);
      }

      .seen-chip--hit { background: var(--vis-active); font-weight: 700; }
      .seen-chip--updated { background: var(--vis-comparing); }
    </style>
  </head>
  <body>
    <div class="visualizer">
      <div class="vis-input">
        <input
          type="text"
          id="arrInput"
          class="vis-input__field"
          value="1, 2, 3, -2, 5, -3"
          placeholder="Comma-separated integers (negatives allowed)"
          aria-label="Input integer array"
        />
        <input
          type="number"
          id="targetInput"
          class="vis-input__field vis-input__target"
          value="3"
          aria-label="Target subarray sum"
        />
        <button id="btnRun" class="vis-btn vis-btn--primary">Count Subarrays</button>
      </div>

      <div class="vis-presets">
        <span class="vis-preset-label">Presets:</span>
        <button class="vis-btn" data-arr="1, 2, 3, -2, 5, -3" data-target="3">With Negatives (k = 3)</button>
        <button class="vis-btn" data-arr="1, 1, 1" data-target="2">Overlapping [1, 1, 1] (k = 2)</button>
        <button class="vis-btn" data-arr="3, 4, -7, 1, 3, 3, 1, -4" data-target="7">Zero-Sum Loops (k = 7)</button>
      </div>

      <div class="vis-controls">
        <button class="vis-btn vis-btn--primary vis-btn-play">▶ Play</button>
        <button class="vis-btn vis-btn-pause" style="display: none">⏸ Pause</button>
        <button class="vis-btn vis-btn-step-back">⏮ Step Back</button>
        <button class="vis-btn vis-btn-step-forward">⏭ Step</button>
        <button class="vis-btn vis-btn-reset">↺ Reset</button>
        <span class="vis-step-counter">No steps</span>
        <div class="vis-speed">
          <span>Speed</span>
          <input type="range" class="vis-speed-slider" min="1" max="10" value="5" />
        </div>
      </div>

      <div class="vis-status-bar">
        <div class="vis-status-group">
          <span class="vis-pill vis-pill--accent" id="pillPrefix">prefix_sum: 0</span>
          <span class="vis-pill" id="pillNeed">need: —</span>
        </div>
        <div class="vis-status-group">
          <span class="vis-pill" id="pillCount">Matched Subarrays: 0</span>
        </div>
      </div>

      <div class="vis-canvas">
        <div class="array-strip" id="arrayStrip"></div>
        <div class="formula-banner" id="formulaBanner">need = prefix_sum - target</div>
        <div class="seen-map" id="seenMap"></div>
      </div>

      <div class="vis-legend">
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: #b5c7ed"></span>Current Element</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-active)"></span>Matched `need` in `seen`</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-comparing)"></span>Updated `seen[prefix_sum]`</span>
      </div>

      <div class="vis-code" id="codePanel"></div>
      <div class="vis-info" id="infoBar">Enter integers and a target sum k to watch O(n) prefix-sum hashing count subarrays.</div>
    </div>

    <script src="../shared/visualizer-base.js"></script>
    <script>
      const CODE_LINES = [
        'def subarray_sum(nums: list[int], target: int) -> int:',
        '    seen: dict[int, int] = {0: 1}',
        '    prefix_sum = 0',
        '    count = 0',
        '    for num in nums:',
        '        prefix_sum += num',
        '        need = prefix_sum - target',
        '        if need in seen:',
        '            count += seen[need]',
        '        seen[prefix_sum] = seen.get(prefix_sum, 0) + 1',
        '    return count',
      ];

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = String(text);
        return div.innerHTML;
      }

      const codePanel = document.getElementById('codePanel');
      codePanel.innerHTML = CODE_LINES.map((line, i) =>
        `<span class="vis-code__line" data-line="${i}"><span class="vis-code__line-number">${i + 1}</span>${escapeHtml(line)}</span>`
      ).join('');

      function highlightCode(lineIndex) {
        codePanel.querySelectorAll('.vis-code__line').forEach((el, idx) => {
          el.classList.toggle('vis-code__line--active', idx === lineIndex);
        });
      }

      const viz = new VisualizerEngine({
        defaultSpeed: 600,
        highlightCode,
        render(step) {
          const { nums, target, curIdx, prefixSum, need, count, seen, hitKey, updatedKey, formulaText, description } = step;
          document.getElementById('pillPrefix').textContent = `prefix_sum: ${prefixSum}`;
          document.getElementById('pillNeed').textContent = `need: ${need !== null ? need : '—'}`;
          document.getElementById('pillCount').textContent = `Matched Subarrays: ${count}`;
          document.getElementById('formulaBanner').textContent = formulaText;

          document.getElementById('arrayStrip').innerHTML = nums.map((num, idx) => {
            let cls = 'arr-cell';
            if (idx === curIdx) cls += hitKey !== null ? ' arr-cell--matched' : ' arr-cell--current';
            else if (idx < curIdx) cls += ' arr-cell--visited';
            return `<div class="${cls}"><div class="arr-cell__val">${num}</div><div class="arr-cell__idx">[${idx}]</div></div>`;
          }).join('');

          const entries = Object.entries(seen);
          document.getElementById('seenMap').innerHTML = '<span class="seen-label">seen:</span>' + entries.map(([k, v]) => {
            const numK = Number(k);
            let cls = 'seen-chip';
            if (hitKey !== null && numK === hitKey) cls += ' seen-chip--hit';
            else if (updatedKey !== null && numK === updatedKey) cls += ' seen-chip--updated';
            return `<span class="${cls}">${escapeHtml(k)} → ${escapeHtml(v)}×</span>`;
          }).join('');

          document.getElementById('infoBar').textContent = description;
        },
      });

      function buildSteps() {
        const nums = document.getElementById('arrInput').value
          .split(',')
          .map((s) => parseInt(s.trim(), 10))
          .filter((n) => !Number.isNaN(n))
          .slice(0, 12);
        const target = parseInt(document.getElementById('targetInput').value, 10) || 0;
        if (nums.length === 0) return;

        viz.reset();
        const seen = { 0: 1 };
        let prefixSum = 0;
        let count = 0;

        viz.recordStep({
          nums, target, curIdx: -1, prefixSum: 0, need: null, count: 0,
          seen: { ...seen }, hitKey: null, updatedKey: 0,
          formulaText: `target = ${target} | seeded seen = {0: 1} for empty prefix`,
          codeLine: 1,
          description: `Seeded seen = {0: 1} so subarrays starting at index 0 are counted automatically.`,
        });

        for (let i = 0; i < nums.length; i++) {
          const num = nums[i];
          prefixSum += num;
          const need = prefixSum - target;

          viz.recordStep({
            nums, target, curIdx: i, prefixSum, need, count,
            seen: { ...seen }, hitKey: null, updatedKey: null,
            formulaText: `prefix_sum = ${prefixSum} | need = ${prefixSum} - (${target}) = ${need}`,
            codeLine: 6,
            description: `At [${i}] (${num}): prefix_sum is ${prefixSum}, so we look for need = ${need} in seen.`,
          });

          if (Object.prototype.hasOwnProperty.call(seen, need)) {
            count += seen[need];
            viz.recordStep({
              nums, target, curIdx: i, prefixSum, need, count,
              seen: { ...seen }, hitKey: need, updatedKey: null,
              formulaText: `Hit! seen[${need}] = ${seen[need]} → count becomes ${count}`,
              codeLine: 8,
              description: `Found ${need} in seen (${seen[need]}×)! Added ${seen[need]} to count (total = ${count}).`,
            });
          } else {
            viz.recordStep({
              nums, target, curIdx: i, prefixSum, need, count,
              seen: { ...seen }, hitKey: null, updatedKey: null,
              formulaText: `${need} not in seen — count stays ${count}`,
              codeLine: 7,
              description: `${need} is not in seen yet.`,
            });
          }

          seen[prefixSum] = (seen[prefixSum] || 0) + 1;
          viz.recordStep({
            nums, target, curIdx: i, prefixSum, need, count,
            seen: { ...seen }, hitKey: null, updatedKey: prefixSum,
            formulaText: `Recorded seen[${prefixSum}] = ${seen[prefixSum]}`,
            codeLine: 9,
            description: `Incremented seen[${prefixSum}] to ${seen[prefixSum]}.`,
          });
        }

        viz.recordStep({
          nums, target, curIdx: nums.length, prefixSum, need: null, count,
          seen: { ...seen }, hitKey: null, updatedKey: null,
          formulaText: `Done! Total subarrays summing to ${target}: ${count}`,
          codeLine: 10,
          description: `Finished single O(n) pass — found ${count} subarray(s) summing to ${target}.`,
        });

        viz.goToStep(0);
      }

      viz.bindControls();
      document.getElementById('btnRun').addEventListener('click', buildSteps);
      document.querySelectorAll('.vis-presets .vis-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          document.getElementById('arrInput').value = btn.dataset.arr;
          document.getElementById('targetInput').value = btn.dataset.target;
          buildSteps();
        });
      });

      buildSteps();
    </script>
  </body>
</html>
