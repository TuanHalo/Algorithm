<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hash Functions & Load Factor Visualizer</title>
    <link rel="stylesheet" href="../shared/clay-visualizer.css" />
    <style>
      .vis-input__cap {
        width: 112px;
        flex: 0 0 auto;
        min-width: 96px;
      }

      .vis-presets {
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 0.75rem;
      }

      .vis-preset-label {
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      .vis-status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
        font-family: var(--font-code);
        font-size: 0.78rem;
        color: var(--text-secondary);
      }

      .vis-status-group {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }

      .vis-pill {
        background: var(--bg-card);
        border: var(--border-clay);
        box-shadow: var(--shadow-clay-subtle);
        border-radius: 999px;
        padding: 0.25rem 0.75rem;
      }

      .vis-pill--accent {
        background: rgba(181, 199, 237, 0.5);
        font-weight: 600;
        color: var(--text-primary);
      }

      .vis-pill--warn {
        background: var(--vis-swapping);
        font-weight: 600;
        color: var(--text-primary);
      }

      .vis-canvas {
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-start;
        gap: 0.9rem;
        min-height: 230px;
        padding: 1.15rem 1.25rem;
      }

      .hash-math-box {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 0.45rem;
        padding: 0.65rem 0.9rem;
        border-radius: var(--border-radius-sm);
        background: rgba(255, 255, 255, 0.45);
        box-shadow: var(--shadow-clay-pressed);
        font-family: var(--font-code);
        font-size: 0.8rem;
        min-height: 44px;
      }

      .hash-char {
        padding: 0.2rem 0.45rem;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.75);
        border: var(--border-clay);
        box-shadow: var(--shadow-clay-subtle);
      }

      .hash-char--active {
        background: var(--vis-comparing);
        font-weight: 700;
      }

      .load-meter {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        font-family: var(--font-code);
        font-size: 0.76rem;
      }

      .load-track {
        flex: 1;
        height: 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.55);
        box-shadow: var(--shadow-clay-pressed);
        overflow: hidden;
        position: relative;
      }

      .load-fill {
        height: 100%;
        border-radius: 999px;
        background: #b5c7ed;
        transition: width 300ms ease, background 300ms ease;
      }

      .load-fill--high {
        background: var(--vis-swapping);
      }

      .buckets-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
        gap: 0.55rem;
      }

      .bucket-slot {
        background: rgba(255, 255, 255, 0.5);
        border: var(--border-clay);
        border-radius: var(--border-radius-xs);
        box-shadow: var(--shadow-clay-subtle);
        padding: 0.45rem 0.55rem;
        min-height: 62px;
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
        transition: transform 250ms ease, background 250ms ease;
      }

      .bucket-slot--active {
        background: rgba(181, 199, 237, 0.55);
        transform: translateY(-2px);
      }

      .bucket-slot--collision {
        background: var(--vis-comparing);
      }

      .bucket-slot__idx {
        font-family: var(--font-code);
        font-size: 0.68rem;
        font-weight: 700;
        color: var(--text-muted);
      }

      .bucket-slot__items {
        display: flex;
        flex-wrap: wrap;
        gap: 0.25rem;
      }

      .bucket-chip {
        font-family: var(--font-code);
        font-size: 0.72rem;
        font-weight: 600;
        padding: 0.15rem 0.4rem;
        border-radius: 6px;
        background: var(--vis-sorted);
        box-shadow: var(--shadow-clay-subtle);
      }

      .bucket-chip--new {
        background: var(--vis-active);
      }
    </style>
  </head>
  <body>
    <div class="visualizer">
      <div class="vis-input">
        <input
          type="text"
          id="keysInput"
          class="vis-input__field"
          value="cat, dog, act, owl, fox, bee"
          placeholder="Comma-separated keys (e.g., cat, dog, act, owl)"
          aria-label="Keys to hash"
        />
        <input
          type="number"
          id="capInput"
          class="vis-input__field vis-input__cap"
          value="6"
          min="3"
          max="12"
          aria-label="Bucket capacity"
        />
        <button id="btnLoad" class="vis-btn vis-btn--primary">Hash Keys</button>
      </div>

      <div class="vis-presets">
        <span class="vis-preset-label">Presets:</span>
        <button class="vis-btn" data-keys="cat, dog, act, owl, fox, bee" data-cap="6">Anagrams (cat vs act)</button>
        <button class="vis-btn" data-keys="ada, lin, grace, alan, tim, ken" data-cap="5">Trigger Load > 0.75</button>
        <button class="vis-btn" data-keys="key1, key2, key3, key4" data-cap="8">Low Load Spread</button>
      </div>

      <div class="vis-controls">
        <button class="vis-btn vis-btn--primary vis-btn-play">▶ Play</button>
        <button class="vis-btn vis-btn-pause" style="display: none">⏸ Pause</button>
        <button class="vis-btn vis-btn-step-back">⏮ Step Back</button>
        <button class="vis-btn vis-btn-step-forward">⏭ Step</button>
        <button class="vis-btn vis-btn-reset">↺ Reset</button>
        <span class="vis-step-counter">No steps</span>
        <div class="vis-speed">
          <span>Speed</span>
          <input type="range" class="vis-speed-slider" min="1" max="10" value="6" />
        </div>
      </div>

      <div class="vis-status-bar">
        <div class="vis-status-group">
          <span class="vis-pill vis-pill--accent" id="pillKey">Key: —</span>
          <span class="vis-pill" id="pillIndex">Index: —</span>
        </div>
        <div class="vis-status-group">
          <span class="vis-pill" id="pillLoad">Load: 0 / 6 (0.00)</span>
        </div>
      </div>

      <div class="vis-canvas">
        <div class="hash-math-box" id="mathBox">Enter keys and press Hash Keys</div>
        <div class="load-meter">
          <span>α = n / m</span>
          <div class="load-track"><div class="load-fill" id="loadFill" style="width: 0%"></div></div>
          <span id="loadText">0.00 / 0.75</span>
        </div>
        <div class="buckets-grid" id="bucketsGrid"></div>
      </div>

      <div class="vis-legend">
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: #b5c7ed"></span>Target Bucket</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-active)"></span>Placed Key</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-comparing)"></span>Char Step / Collision</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-swapping)"></span>Load > 0.75 (Resize!)</span>
      </div>

      <div class="vis-code" id="codePanel"></div>
      <div class="vis-info" id="infoBar">Enter comma-separated keys to see polynomial hashing and load factor in action.</div>
    </div>

    <script src="../shared/visualizer-base.js"></script>
    <script>
      const CODE_LINES = [
        'def hash_string(key: str, capacity: int) -> int:',
        '    total = 0',
        '    for ch in key:',
        '        total = (total * 31 + ord(ch)) % capacity',
        '    return total',
        '',
        'def needs_resize(item_count: int, capacity: int, threshold: float = 0.75) -> bool:',
        '    load_factor = item_count / capacity',
        '    return load_factor > threshold',
      ];

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = String(text);
        return div.innerHTML;
      }

      const codePanel = document.getElementById('codePanel');
      codePanel.innerHTML = CODE_LINES.map((line, i) =>
        `<span class="vis-code__line" data-line="${i}"><span class="vis-code__line-number">${i + 1}</span>${escapeHtml(line)}</span>`
      ).join('');

      function highlightCode(lineIndex) {
        codePanel.querySelectorAll('.vis-code__line').forEach((el, idx) => {
          el.classList.toggle('vis-code__line--active', idx === lineIndex);
        });
      }

      function cloneBuckets(buckets) {
        return buckets.map((b) => [...b]);
      }

      const viz = new VisualizerEngine({
        defaultSpeed: 550,
        highlightCode,
        render(step) {
          const { buckets, activeBucket, activeKey, activeCharIdx, runningTotal, lastPlaced, itemCount, capacity, resizeAlert, description } = step;
          document.getElementById('pillKey').textContent = `Key: ${activeKey ?? '—'}`;
          document.getElementById('pillIndex').textContent = `Index: ${activeBucket !== null ? activeBucket : '—'}`;

          const alpha = capacity > 0 ? itemCount / capacity : 0;
          const loadPill = document.getElementById('pillLoad');
          loadPill.textContent = `Load: ${itemCount} / ${capacity} (${alpha.toFixed(2)})`;
          loadPill.className = resizeAlert ? 'vis-pill vis-pill--warn' : 'vis-pill';

          const loadFill = document.getElementById('loadFill');
          loadFill.style.width = `${Math.min(100, alpha * 100)}%`;
          loadFill.className = resizeAlert ? 'load-fill load-fill--high' : 'load-fill';
          document.getElementById('loadText').textContent = `${alpha.toFixed(2)} / 0.75`;

          const mathBox = document.getElementById('mathBox');
          if (!activeKey) {
            mathBox.textContent = 'Table ready — starting hash computation';
          } else {
            const charsHtml = [...activeKey].map((ch, idx) => {
              const cls = idx === activeCharIdx ? 'hash-char hash-char--active' : 'hash-char';
              return `<span class="${cls}">'${escapeHtml(ch)}' (${ch.charCodeAt(0)})</span>`;
            }).join('');
            const totalText = runningTotal !== null ? ` → total % ${capacity} = ${runningTotal}` : '';
            mathBox.innerHTML = `${charsHtml}<span>${escapeHtml(totalText)}</span>`;
          }

          const grid = document.getElementById('bucketsGrid');
          grid.innerHTML = buckets.map((items, idx) => {
            const isTarget = idx === activeBucket;
            const hasCollision = isTarget && items.length > 1;
            const slotCls = hasCollision
              ? 'bucket-slot bucket-slot--collision'
              : isTarget
                ? 'bucket-slot bucket-slot--active'
                : 'bucket-slot';
            const chips = items.map((item, j) => {
              const isNew = lastPlaced && lastPlaced.bucket === idx && j === items.length - 1;
              return `<span class="${isNew ? 'bucket-chip bucket-chip--new' : 'bucket-chip'}">${escapeHtml(item)}</span>`;
            }).join('');
            return `<div class="${slotCls}"><span class="bucket-slot__idx">Bucket [${idx}]</span><div class="bucket-slot__items">${chips}</div></div>`;
          }).join('');

          document.getElementById('infoBar').textContent = description;
        },
      });

      function buildSteps() {
        const raw = document.getElementById('keysInput').value;
        const keys = raw.split(',').map((s) => s.trim()).filter(Boolean).slice(0, 12);
        const cap = Math.max(3, Math.min(12, parseInt(document.getElementById('capInput').value, 10) || 6));
        document.getElementById('capInput').value = cap;

        viz.reset();
        const buckets = Array.from({ length: cap }, () => []);
        let itemCount = 0;

        viz.recordStep({
          buckets: cloneBuckets(buckets),
          activeBucket: null,
          activeKey: null,
          activeCharIdx: -1,
          runningTotal: null,
          lastPlaced: null,
          itemCount,
          capacity: cap,
          resizeAlert: false,
          codeLine: 0,
          description: `Initialized ${cap} empty buckets. Threshold α = 0.75.`,
        });

        for (const key of keys) {
          let total = 0;
          viz.recordStep({
            buckets: cloneBuckets(buckets),
            activeBucket: null,
            activeKey: key,
            activeCharIdx: -1,
            runningTotal: 0,
            lastPlaced: null,
            itemCount,
            capacity: cap,
            resizeAlert: itemCount / cap > 0.75,
            codeLine: 1,
            description: `Hashing "${key}": start total = 0.`,
          });

          for (let i = 0; i < key.length; i++) {
            const code = key.charCodeAt(i);
            const prev = total;
            total = (total * 31 + code) % cap;
            viz.recordStep({
              buckets: cloneBuckets(buckets),
              activeBucket: null,
              activeKey: key,
              activeCharIdx: i,
              runningTotal: total,
              lastPlaced: null,
              itemCount,
              capacity: cap,
              resizeAlert: itemCount / cap > 0.75,
              codeLine: 3,
              description: `Char '${key[i]}' (ord ${code}): (${prev} * 31 + ${code}) % ${cap} = ${total}.`,
            });
          }

          const collided = buckets[total].length > 0;
          buckets[total].push(key);
          itemCount += 1;
          const alpha = itemCount / cap;
          const over = alpha > 0.75;

          viz.recordStep({
            buckets: cloneBuckets(buckets),
            activeBucket: total,
            activeKey: key,
            activeCharIdx: -1,
            runningTotal: total,
            lastPlaced: { bucket: total },
            itemCount,
            capacity: cap,
            resizeAlert: over,
            codeLine: 4,
            description: collided
              ? `"${key}" landed in bucket [${total}] (collision with existing item!).`
              : `"${key}" placed cleanly into bucket [${total}].`,
          });

          if (over) {
            viz.recordStep({
              buckets: cloneBuckets(buckets),
              activeBucket: total,
              activeKey: key,
              activeCharIdx: -1,
              runningTotal: total,
              lastPlaced: null,
              itemCount,
              capacity: cap,
              resizeAlert: true,
              codeLine: 8,
              description: `Load factor ${itemCount}/${cap} = ${alpha.toFixed(2)} > 0.75! Time to resize & rehash to 2× capacity.`,
            });
          }
        }

        viz.goToStep(0);
      }

      viz.bindControls();
      document.getElementById('btnLoad').addEventListener('click', buildSteps);
      document.querySelectorAll('.vis-presets .vis-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          document.getElementById('keysInput').value = btn.dataset.keys;
          document.getElementById('capInput').value = btn.dataset.cap;
          buildSteps();
        });
      });

      buildSteps();
    </script>
  </body>
</html>
