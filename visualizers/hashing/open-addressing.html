<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Addressing & Probing Visualizer</title>
    <link rel="stylesheet" href="../shared/clay-visualizer.css" />
    <style>
      .vis-select {
        padding: 0.45rem 0.75rem;
        border: var(--border-clay);
        border-radius: var(--border-radius-xs);
        background: rgba(255, 255, 255, 0.7);
        font-family: var(--font-body);
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--text-primary);
        box-shadow: var(--shadow-clay-subtle);
      }

      .vis-presets {
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 0.75rem;
      }

      .vis-preset-label { font-size: 0.75rem; color: var(--text-muted); }

      .vis-status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
        font-family: var(--font-code);
        font-size: 0.78rem;
        color: var(--text-secondary);
      }

      .vis-status-group { display: flex; gap: 0.5rem; flex-wrap: wrap; }

      .vis-pill {
        background: var(--bg-card);
        border: var(--border-clay);
        box-shadow: var(--shadow-clay-subtle);
        border-radius: 999px;
        padding: 0.25rem 0.75rem;
      }

      .vis-pill--accent {
        background: rgba(181, 199, 237, 0.5);
        font-weight: 600;
        color: var(--text-primary);
      }

      .vis-canvas {
        flex-direction: column;
        align-items: stretch;
        justify-content: center;
        gap: 0.85rem;
        min-height: 220px;
        padding: 1.15rem 1.25rem;
      }

      .probe-trail {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        font-family: var(--font-code);
        font-size: 0.76rem;
        min-height: 30px;
      }

      .probe-hop {
        padding: 0.18rem 0.5rem;
        border-radius: 6px;
        background: var(--vis-comparing);
        box-shadow: var(--shadow-clay-subtle);
      }

      .probe-hop--landed {
        background: var(--vis-active);
        font-weight: 700;
      }

      .slots-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(84px, 1fr));
        gap: 0.5rem;
      }

      .slot-card {
        background: rgba(255, 255, 255, 0.52);
        border: var(--border-clay);
        border-radius: var(--border-radius-xs);
        box-shadow: var(--shadow-clay-subtle);
        padding: 0.55rem 0.45rem;
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        transition: transform 250ms ease, background 250ms ease;
      }

      .slot-card--probing {
        background: var(--vis-comparing);
        transform: translateY(-3px);
      }

      .slot-card--placed {
        background: var(--vis-active);
        transform: translateY(-3px);
      }

      .slot-card--tomb {
        background: rgba(255, 170, 165, 0.45);
      }

      .slot-card__idx {
        font-family: var(--font-code);
        font-size: 0.68rem;
        color: var(--text-muted);
      }

      .slot-card__val {
        font-family: var(--font-code);
        font-size: 0.85rem;
        font-weight: 700;
      }

      .slot-card__tag {
        font-family: var(--font-code);
        font-size: 0.65rem;
        color: var(--text-secondary);
      }
    </style>
  </head>
  <body>
    <div class="visualizer">
      <div class="vis-input">
        <input
          type="text"
          id="opsInput"
          class="vis-input__field"
          value="put(3, 30), put(11, 110), put(19, 190), del(11), get(19), put(27, 270)"
          placeholder="put(k, v), get(k), del(k)"
          aria-label="Open addressing operations"
        />
        <select id="probeMode" class="vis-select" aria-label="Probing strategy">
          <option value="linear">Linear Probing (+i)</option>
          <option value="quadratic">Quadratic Probing (+i²)</option>
        </select>
        <button id="btnRun" class="vis-btn vis-btn--primary">Run Probes</button>
      </div>

      <div class="vis-presets">
        <span class="vis-preset-label">Presets:</span>
        <button class="vis-btn" data-ops="put(3, 30), put(11, 110), put(19, 190), del(11), get(19), put(27, 270)">Tombstone Bridge</button>
        <button class="vis-btn" data-ops="put(2, 20), put(10, 100), put(18, 180), put(26, 260), get(26)">Primary Clustering (mod 8)</button>
        <button class="vis-btn" data-ops="put(5, 50), put(13, 130), del(5), put(21, 210), get(13)">Reuse Tombstone</button>
      </div>

      <div class="vis-controls">
        <button class="vis-btn vis-btn--primary vis-btn-play">▶ Play</button>
        <button class="vis-btn vis-btn-pause" style="display: none">⏸ Pause</button>
        <button class="vis-btn vis-btn-step-back">⏮ Step Back</button>
        <button class="vis-btn vis-btn-step-forward">⏭ Step</button>
        <button class="vis-btn vis-btn-reset">↺ Reset</button>
        <span class="vis-step-counter">No steps</span>
        <div class="vis-speed">
          <span>Speed</span>
          <input type="range" class="vis-speed-slider" min="1" max="10" value="6" />
        </div>
      </div>

      <div class="vis-status-bar">
        <div class="vis-status-group">
          <span class="vis-pill vis-pill--accent" id="pillOp">Op: —</span>
          <span class="vis-pill" id="pillFormula">Probe: —</span>
        </div>
        <div class="vis-status-group">
          <span class="vis-pill" id="pillProbes">Probes: 0</span>
        </div>
      </div>

      <div class="vis-canvas">
        <div class="probe-trail" id="probeTrail">Probe sequence will appear here</div>
        <div class="slots-grid" id="slotsGrid"></div>
      </div>

      <div class="vis-legend">
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-comparing)"></span>Probing Slot</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-active)"></span>Placed / Found</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-swapping)"></span>TOMBSTONE (keep probing!)</span>
      </div>

      <div class="vis-code" id="codePanel"></div>
      <div class="vis-info" id="infoBar">Compare Linear vs Quadratic probing and see why deleted slots become TOMBSTONE markers.</div>
    </div>

    <script src="../shared/visualizer-base.js"></script>
    <script>
      const CODE_LINES = [
        'def _probe(self, key: int, step: int, quadratic: bool) -> int:',
        '    offset = step * step if quadratic else step',
        '    return (abs(key) + offset) % len(self.keys)',
        '',
        'def put(self, key: int, val: int, quadratic: bool = False) -> bool:',
        '    first_tomb = -1',
        '    for step in range(len(self.keys)):',
        '        idx = self._probe(key, step, quadratic)',
        '        slot = self.keys[idx]',
        '        if slot is None:',
        '            target = first_tomb if first_tomb != -1 else idx',
        '            self.keys[target], self.vals[target] = key, val',
        '            return True',
        '        if slot is self.TOMBSTONE and first_tomb == -1:',
        '            first_tomb = idx',
        '        elif slot == key:',
        '            self.vals[idx] = val',
        '            return True',
        '    return False',
      ];

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = String(text);
        return div.innerHTML;
      }

      const codePanel = document.getElementById('codePanel');
      codePanel.innerHTML = CODE_LINES.map((line, i) =>
        `<span class="vis-code__line" data-line="${i}"><span class="vis-code__line-number">${i + 1}</span>${escapeHtml(line)}</span>`
      ).join('');

      function highlightCode(lineIndex) {
        codePanel.querySelectorAll('.vis-code__line').forEach((el, idx) => {
          el.classList.toggle('vis-code__line--active', idx === lineIndex);
        });
      }

      function parseOps(text) {
        const ops = [];
        const regex = /(put|get|del)\s*\(\s*(-?\d+)(?:\s*,\s*(-?\d+))?\s*\)/gi;
        let match;
        while ((match = regex.exec(text)) !== null) {
          const type = match[1].toLowerCase();
          const key = parseInt(match[2], 10);
          const val = match[3] !== undefined ? parseInt(match[3], 10) : key * 10;
          ops.push({ type, key, val, raw: type === 'put' ? `put(${key}, ${val})` : `${type}(${key})` });
        }
        return ops.slice(0, 10);
      }

      const CAP = 8;
      const TOMB = '__TOMBSTONE__';

      const viz = new VisualizerEngine({
        defaultSpeed: 600,
        highlightCode,
        render(step) {
          const { slots, activeIdx, placedIdx, trail, opLabel, formulaText, probeCount, description } = step;
          document.getElementById('pillOp').textContent = `Op: ${opLabel}`;
          document.getElementById('pillFormula').textContent = `Probe: ${formulaText}`;
          document.getElementById('pillProbes').textContent = `Probes: ${probeCount}`;

          const trailEl = document.getElementById('probeTrail');
          if (trail.length === 0) {
            trailEl.textContent = 'Ready to probe slots [0..7]';
          } else {
            trailEl.innerHTML = trail.map((t, i) => {
              const cls = (i === trail.length - 1 && placedIdx !== null) ? 'probe-hop probe-hop--landed' : 'probe-hop';
              return `<span class="${cls}">step ${t.step} → [${t.idx}]</span>`;
            }).join('<span>→</span>');
          }

          document.getElementById('slotsGrid').innerHTML = slots.map((slot, idx) => {
            let cls = 'slot-card';
            if (slot.key === TOMB) cls += ' slot-card--tomb';
            if (idx === activeIdx) cls += ' slot-card--probing';
            if (idx === placedIdx) cls += ' slot-card--placed';

            let display = 'EMPTY';
            let tag = 'None';
            if (slot.key === TOMB) {
              display = 'TOMB';
              tag = 'deleted';
            } else if (slot.key !== null) {
              display = `${slot.key}:${slot.val}`;
              tag = 'occupied';
            }

            return `<div class="${cls}"><span class="slot-card__idx">Slot [${idx}]</span><span class="slot-card__val">${escapeHtml(display)}</span><span class="slot-card__tag">${tag}</span></div>`;
          }).join('');

          document.getElementById('infoBar').textContent = description;
        },
      });

      function buildSteps() {
        const ops = parseOps(document.getElementById('opsInput').value);
        if (ops.length === 0) return;
        const quadratic = document.getElementById('probeMode').value === 'quadratic';
        viz.reset();

        const slots = Array.from({ length: CAP }, () => ({ key: null, val: null }));
        const snap = () => slots.map((s) => ({ ...s }));
        const probeAt = (key, step) => (Math.abs(key) + (quadratic ? step * step : step)) % CAP;

        viz.recordStep({
          slots: snap(), activeIdx: null, placedIdx: null, trail: [],
          opLabel: 'Ready', formulaText: quadratic ? '(h + i²) % 8' : '(h + i) % 8', probeCount: 0,
          codeLine: 0,
          description: `Initialized flat table of ${CAP} slots using ${quadratic ? 'Quadratic' : 'Linear'} Probing.`,
        });

        for (const op of ops) {
          const trail = [];
          if (op.type === 'put') {
            let firstTomb = -1;
            let done = false;
            for (let step = 0; step < CAP; step++) {
              const idx = probeAt(op.key, step);
              trail.push({ step, idx });
              const formula = quadratic
                ? `(${Math.abs(op.key)} + ${step}²) % ${CAP} = ${idx}`
                : `(${Math.abs(op.key)} + ${step}) % ${CAP} = ${idx}`;

              const cur = slots[idx].key;
              viz.recordStep({
                slots: snap(), activeIdx: idx, placedIdx: null, trail: [...trail],
                opLabel: op.raw, formulaText: formula, probeCount: step + 1,
                codeLine: 7,
                description: `${op.raw}: probe step ${step} landed on [${idx}] (${cur === null ? 'EMPTY' : cur === TOMB ? 'TOMBSTONE' : `key ${cur}`}).`,
              });

              if (cur === null) {
                const target = firstTomb !== -1 ? firstTomb : idx;
                slots[target] = { key: op.key, val: op.val };
                viz.recordStep({
                  slots: snap(), activeIdx: null, placedIdx: target, trail: [...trail],
                  opLabel: op.raw, formulaText: formula, probeCount: step + 1,
                  codeLine: 11,
                  description: firstTomb !== -1
                    ? `Hit EMPTY at [${idx}], so key ${op.key} isn't further ahead — reused earlier TOMBSTONE at [${target}]!`
                    : `Slot [${target}] is EMPTY — stored (${op.key}: ${op.val}).`,
                });
                done = true;
                break;
              } else if (cur === TOMB && firstTomb === -1) {
                firstTomb = idx;
                viz.recordStep({
                  slots: snap(), activeIdx: idx, placedIdx: null, trail: [...trail],
                  opLabel: op.raw, formulaText: formula, probeCount: step + 1,
                  codeLine: 14,
                  description: `Noted first TOMBSTONE at [${idx}]; keep probing to confirm ${op.key} isn't already stored.`,
                });
              } else if (cur === op.key) {
                slots[idx].val = op.val;
                viz.recordStep({
                  slots: snap(), activeIdx: null, placedIdx: idx, trail: [...trail],
                  opLabel: op.raw, formulaText: formula, probeCount: step + 1,
                  codeLine: 16,
                  description: `Found existing key ${op.key} at [${idx}] — updated value to ${op.val}.`,
                });
                done = true;
                break;
              }
            }
            if (!done && firstTomb !== -1) {
              slots[firstTomb] = { key: op.key, val: op.val };
              viz.recordStep({
                slots: snap(), activeIdx: null, placedIdx: firstTomb, trail: [...trail],
                opLabel: op.raw, formulaText: 'reused tomb', probeCount: CAP,
                codeLine: 11,
                description: `Probed full ring and reused saved TOMBSTONE slot [${firstTomb}].`,
              });
            }
          } else if (op.type === 'get' || op.type === 'del') {
            for (let step = 0; step < CAP; step++) {
              const idx = probeAt(op.key, step);
              trail.push({ step, idx });
              const formula = quadratic
                ? `(${Math.abs(op.key)} + ${step}²) % ${CAP} = ${idx}`
                : `(${Math.abs(op.key)} + ${step}) % ${CAP} = ${idx}`;
              const cur = slots[idx].key;

              viz.recordStep({
                slots: snap(), activeIdx: idx, placedIdx: null, trail: [...trail],
                opLabel: op.raw, formulaText: formula, probeCount: step + 1,
                codeLine: 7,
                description: `${op.raw}: checking slot [${idx}] (${cur === null ? 'EMPTY' : cur === TOMB ? 'TOMBSTONE' : `key ${cur}`}).`,
              });

              if (cur === null) {
                viz.recordStep({
                  slots: snap(), activeIdx: idx, placedIdx: null, trail: [...trail],
                  opLabel: op.raw, formulaText: formula, probeCount: step + 1,
                  codeLine: 9,
                  description: `Reached EMPTY slot [${idx}] — key ${op.key} cannot exist further down the probe chain.`,
                });
                break;
              }
              if (cur === op.key) {
                if (op.type === 'del') {
                  slots[idx] = { key: TOMB, val: null };
                  viz.recordStep({
                    slots: snap(), activeIdx: null, placedIdx: null, trail: [...trail],
                    opLabel: op.raw, formulaText: formula, probeCount: step + 1,
                    codeLine: 13,
                    description: `Deleted ${op.key} at [${idx}] by placing a TOMBSTONE so later probes won't stop early!`,
                  });
                } else {
                  viz.recordStep({
                    slots: snap(), activeIdx: null, placedIdx: idx, trail: [...trail],
                    opLabel: op.raw, formulaText: formula, probeCount: step + 1,
                    codeLine: 15,
                    description: `Found ${op.key}: ${slots[idx].val} at slot [${idx}] after ${step + 1} probe(s)!`,
                  });
                }
                break;
              }
            }
          }
        }

        viz.goToStep(0);
      }

      viz.bindControls();
      document.getElementById('btnRun').addEventListener('click', buildSteps);
      document.getElementById('probeMode').addEventListener('change', buildSteps);
      document.querySelectorAll('.vis-presets .vis-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          document.getElementById('opsInput').value = btn.dataset.ops;
          buildSteps();
        });
      });

      buildSteps();
    </script>
  </body>
</html>
