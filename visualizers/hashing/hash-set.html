<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hash Set Visualizer</title>
    <link rel="stylesheet" href="../shared/clay-visualizer.css" />
    <style>
      .vis-presets {
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 0.75rem;
      }

      .vis-preset-label { font-size: 0.75rem; color: var(--text-muted); }

      .vis-status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
        font-family: var(--font-code);
        font-size: 0.78rem;
        color: var(--text-secondary);
      }

      .vis-status-group { display: flex; gap: 0.5rem; flex-wrap: wrap; }

      .vis-pill {
        background: var(--bg-card);
        border: var(--border-clay);
        box-shadow: var(--shadow-clay-subtle);
        border-radius: 999px;
        padding: 0.25rem 0.75rem;
      }

      .vis-pill--accent {
        background: rgba(181, 199, 237, 0.5);
        font-weight: 600;
        color: var(--text-primary);
      }

      .vis-canvas {
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-start;
        gap: 0.75rem;
        min-height: 225px;
        padding: 1.15rem 1.25rem;
      }

      .op-strip {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
        padding: 0.5rem 0.75rem;
        border-radius: var(--border-radius-xs);
        background: rgba(255, 255, 255, 0.42);
        box-shadow: var(--shadow-clay-pressed);
      }

      .op-badge {
        font-family: var(--font-code);
        font-size: 0.72rem;
        padding: 0.2rem 0.5rem;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.7);
        border: var(--border-clay);
      }

      .op-badge--active { background: #b5c7ed; font-weight: 700; }
      .op-badge--done { opacity: 0.55; }

      .buckets-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(105px, 1fr));
        gap: 0.55rem;
      }

      .bucket-box {
        background: rgba(255, 255, 255, 0.5);
        border: var(--border-clay);
        border-radius: var(--border-radius-xs);
        box-shadow: var(--shadow-clay-subtle);
        padding: 0.45rem 0.55rem;
        min-height: 68px;
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        transition: background 250ms ease, transform 250ms ease;
      }

      .bucket-box--active {
        background: rgba(181, 199, 237, 0.55);
        transform: translateY(-2px);
      }

      .bucket-box__idx {
        font-family: var(--font-code);
        font-size: 0.68rem;
        font-weight: 700;
        color: var(--text-muted);
      }

      .bucket-box__items {
        display: flex;
        flex-wrap: wrap;
        gap: 0.3rem;
      }

      .set-chip {
        font-family: var(--font-code);
        font-size: 0.76rem;
        font-weight: 600;
        padding: 0.18rem 0.5rem;
        border-radius: 7px;
        background: var(--vis-sorted);
        box-shadow: var(--shadow-clay-subtle);
      }

      .set-chip--added { background: var(--vis-active); }
      .set-chip--dup { background: var(--vis-comparing); }
      .set-chip--removed { background: var(--vis-swapping); }
    </style>
  </head>
  <body>
    <div class="visualizer">
      <div class="vis-input">
        <input
          type="text"
          id="opsInput"
          class="vis-input__field"
          value="add(12), add(5), add(18), add(12), contains(18), remove(5), contains(5)"
          placeholder="Operations: add(x), contains(x), remove(x)"
          aria-label="Hash set operations"
        />
        <button id="btnRun" class="vis-btn vis-btn--primary">Run Sequence</button>
      </div>

      <div class="vis-presets">
        <span class="vis-preset-label">Presets:</span>
        <button class="vis-btn" data-ops="add(12), add(5), add(18), add(12), contains(18), remove(5), contains(5)">Unique + Duplicate + Remove</button>
        <button class="vis-btn" data-ops="add(3), add(9), add(15), add(21), contains(15)">Same Bucket Chain (mod 6)</button>
        <button class="vis-btn" data-ops="add(4), add(4), add(7), add(4), add(10), contains(7)">Deduplicate Stream</button>
      </div>

      <div class="vis-controls">
        <button class="vis-btn vis-btn--primary vis-btn-play">▶ Play</button>
        <button class="vis-btn vis-btn-pause" style="display: none">⏸ Pause</button>
        <button class="vis-btn vis-btn-step-back">⏮ Step Back</button>
        <button class="vis-btn vis-btn-step-forward">⏭ Step</button>
        <button class="vis-btn vis-btn-reset">↺ Reset</button>
        <span class="vis-step-counter">No steps</span>
        <div class="vis-speed">
          <span>Speed</span>
          <input type="range" class="vis-speed-slider" min="1" max="10" value="6" />
        </div>
      </div>

      <div class="vis-status-bar">
        <div class="vis-status-group">
          <span class="vis-pill vis-pill--accent" id="pillOp">Op: —</span>
          <span class="vis-pill" id="pillOutcome">Outcome: —</span>
        </div>
        <div class="vis-status-group">
          <span class="vis-pill" id="pillSize">Unique Size: 0</span>
        </div>
      </div>

      <div class="vis-canvas">
        <div class="op-strip" id="opStrip"></div>
        <div class="buckets-grid" id="bucketsGrid"></div>
      </div>

      <div class="vis-legend">
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: #b5c7ed"></span>Target Bucket</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-active)"></span>Added / Found (True)</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-comparing)"></span>Duplicate Ignored (False)</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-swapping)"></span>Removed / Missing</span>
      </div>

      <div class="vis-code" id="codePanel"></div>
      <div class="vis-info" id="infoBar">Run add, contains, and remove operations to see how a HashSet enforces uniqueness.</div>
    </div>

    <script src="../shared/visualizer-base.js"></script>
    <script>
      const CODE_LINES = [
        'def _index(self, key: int) -> int:',
        '    return abs(key) % len(self.buckets)',
        '',
        'def add(self, key: int) -> bool:',
        '    bucket = self.buckets[self._index(key)]',
        '    if key in bucket:',
        '        return False',
        '    bucket.append(key)',
        '    return True',
        '',
        'def contains(self, key: int) -> bool:',
        '    return key in self.buckets[self._index(key)]',
        '',
        'def remove(self, key: int) -> bool:',
        '    bucket = self.buckets[self._index(key)]',
        '    if key not in bucket:',
        '        return False',
        '    bucket.remove(key)',
        '    return True',
      ];

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = String(text);
        return div.innerHTML;
      }

      const codePanel = document.getElementById('codePanel');
      codePanel.innerHTML = CODE_LINES.map((line, i) =>
        `<span class="vis-code__line" data-line="${i}"><span class="vis-code__line-number">${i + 1}</span>${escapeHtml(line)}</span>`
      ).join('');

      function highlightCode(lineIndex) {
        codePanel.querySelectorAll('.vis-code__line').forEach((el, idx) => {
          el.classList.toggle('vis-code__line--active', idx === lineIndex);
        });
      }

      function parseOps(text) {
        const ops = [];
        const regex = /(add|contains|remove)\s*\(\s*(-?\d+)\s*\)/gi;
        let match;
        while ((match = regex.exec(text)) !== null) {
          const type = match[1].toLowerCase();
          const key = parseInt(match[2], 10);
          ops.push({ type, key, raw: `${type}(${key})` });
        }
        return ops.slice(0, 14);
      }

      const CAP = 6;
      const viz = new VisualizerEngine({
        defaultSpeed: 550,
        highlightCode,
        render(step) {
          const { ops, opIdx, buckets, activeBucket, targetKey, state, outcome, size, description } = step;
          document.getElementById('pillOp').textContent = opIdx >= 0 ? `Op: ${ops[opIdx].raw}` : 'Op: Ready';
          document.getElementById('pillOutcome').textContent = `Outcome: ${outcome}`;
          document.getElementById('pillSize').textContent = `Unique Size: ${size}`;

          document.getElementById('opStrip').innerHTML = ops.map((op, i) => {
            let cls = 'op-badge';
            if (i === opIdx) cls += ' op-badge--active';
            else if (i < opIdx) cls += ' op-badge--done';
            return `<span class="${cls}">${escapeHtml(op.raw)}</span>`;
          }).join('');

          document.getElementById('bucketsGrid').innerHTML = buckets.map((items, idx) => {
            const boxCls = idx === activeBucket ? 'bucket-box bucket-box--active' : 'bucket-box';
            const chips = items.map((val) => {
              let cls = 'set-chip';
              if (idx === activeBucket && val === targetKey) {
                if (state === 'added') cls += ' set-chip--added';
                else if (state === 'dup') cls += ' set-chip--dup';
                else if (state === 'removed') cls += ' set-chip--removed';
              }
              return `<span class="${cls}">${escapeHtml(val)}</span>`;
            }).join('');
            return `<div class="${boxCls}"><span class="bucket-box__idx">[${idx}]</span><div class="bucket-box__items">${chips}</div></div>`;
          }).join('');

          document.getElementById('infoBar').textContent = description;
        },
      });

      function buildSteps() {
        const ops = parseOps(document.getElementById('opsInput').value);
        if (ops.length === 0) return;
        viz.reset();
        const buckets = Array.from({ length: CAP }, () => []);
        const snap = () => buckets.map((b) => [...b]);
        const countAll = () => buckets.reduce((acc, b) => acc + b.length, 0);

        viz.recordStep({
          ops, opIdx: -1, buckets: snap(), activeBucket: null, targetKey: null,
          state: null, outcome: '—', size: 0, codeLine: 0,
          description: `Initialized HashSet with ${CAP} buckets.`,
        });

        ops.forEach((op, opIdx) => {
          const idx = Math.abs(op.key) % CAP;
          viz.recordStep({
            ops, opIdx, buckets: snap(), activeBucket: idx, targetKey: op.key,
            state: null, outcome: `bucket [${idx}]`, size: countAll(),
            codeLine: 1,
            description: `${op.raw}: abs(${op.key}) % ${CAP} = [${idx}].`,
          });

          const exists = buckets[idx].includes(op.key);
          if (op.type === 'add') {
            if (exists) {
              viz.recordStep({
                ops, opIdx, buckets: snap(), activeBucket: idx, targetKey: op.key,
                state: 'dup', outcome: 'False (duplicate)', size: countAll(),
                codeLine: 6,
                description: `${op.key} is already in bucket [${idx}] — skipped to keep elements unique!`,
              });
            } else {
              buckets[idx].push(op.key);
              viz.recordStep({
                ops, opIdx, buckets: snap(), activeBucket: idx, targetKey: op.key,
                state: 'added', outcome: 'True (added)', size: countAll(),
                codeLine: 8,
                description: `Added ${op.key} to bucket [${idx}].`,
              });
            }
          } else if (op.type === 'contains') {
            viz.recordStep({
              ops, opIdx, buckets: snap(), activeBucket: idx, targetKey: op.key,
              state: exists ? 'added' : 'removed', outcome: exists ? 'True' : 'False', size: countAll(),
              codeLine: 11,
              description: exists
                ? `contains(${op.key}) → True (found in bucket [${idx}]).`
                : `contains(${op.key}) → False (not in bucket [${idx}]).`,
            });
          } else {
            if (!exists) {
              viz.recordStep({
                ops, opIdx, buckets: snap(), activeBucket: idx, targetKey: op.key,
                state: 'removed', outcome: 'False (not found)', size: countAll(),
                codeLine: 16,
                description: `${op.key} not found in bucket [${idx}] — nothing to remove.`,
              });
            } else {
              viz.recordStep({
                ops, opIdx, buckets: snap(), activeBucket: idx, targetKey: op.key,
                state: 'removed', outcome: 'removing…', size: countAll(),
                codeLine: 17,
                description: `Found ${op.key} in bucket [${idx}]; removing it.`,
              });
              buckets[idx] = buckets[idx].filter((x) => x !== op.key);
              viz.recordStep({
                ops, opIdx, buckets: snap(), activeBucket: idx, targetKey: null,
                state: null, outcome: 'True (removed)', size: countAll(),
                codeLine: 18,
                description: `Removed ${op.key}. Unique size is now ${countAll()}.`,
              });
            }
          }
        });

        viz.goToStep(0);
      }

      viz.bindControls();
      document.getElementById('btnRun').addEventListener('click', buildSteps);
      document.querySelectorAll('.vis-presets .vis-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          document.getElementById('opsInput').value = btn.dataset.ops;
          buildSteps();
        });
      });

      buildSteps();
    </script>
  </body>
</html>
