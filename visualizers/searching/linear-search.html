<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linear Search Visualizer</title>
    <link rel="stylesheet" href="../shared/clay-visualizer.css" />
    <style>
      .vis-target-group {
        display: flex;
        align-items: center;
        gap: 0.45rem;
      }

      .vis-target-label {
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--text-secondary);
        white-space: nowrap;
      }

      .vis-target-field {
        width: 84px;
        min-width: 72px;
        flex: 0 0 auto;
        text-align: center;
      }

      .vis-presets {
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 0.75rem;
      }

      .vis-preset-label {
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      .vis-status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
        font-family: var(--font-code);
        font-size: 0.78rem;
        color: var(--text-secondary);
      }

      .vis-pill {
        background: var(--bg-card);
        border: var(--border-clay);
        box-shadow: var(--shadow-clay-subtle);
        border-radius: 999px;
        padding: 0.25rem 0.75rem;
      }

      .vis-pill--target {
        background: rgba(168, 216, 234, 0.55);
        font-weight: 600;
        color: var(--text-primary);
      }

      .vis-canvas {
        align-items: center;
        min-height: 170px;
        gap: 0.65rem;
        flex-wrap: wrap;
        padding: 2rem 1.25rem 1.5rem;
      }

      .vis-cell {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.35rem;
        transition: transform 250ms ease, opacity 250ms ease;
      }

      .vis-cell__box {
        width: 58px;
        height: 58px;
        border-radius: var(--border-radius-sm);
        background: var(--vis-default);
        border: var(--border-clay);
        box-shadow: var(--shadow-clay-subtle);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-code);
        font-size: 1.05rem;
        font-weight: 700;
        color: var(--text-primary);
        transition: all 250ms ease;
      }

      .vis-cell__index {
        font-family: var(--font-code);
        font-size: 0.72rem;
        color: var(--text-muted);
      }

      .vis-cell__badge {
        position: absolute;
        top: -24px;
        font-family: var(--font-code);
        font-size: 0.66rem;
        font-weight: 700;
        padding: 2px 6px;
        border-radius: 6px;
        letter-spacing: 0.03em;
        box-shadow: var(--shadow-clay-subtle);
        white-space: nowrap;
      }

      .vis-cell__badge--scan {
        background: var(--vis-comparing);
        color: #431407;
      }

      .vis-cell__badge--found {
        background: var(--vis-active);
        color: #14532d;
      }

      .vis-cell--scanning {
        transform: translateY(-4px);
      }

      .vis-cell--scanning .vis-cell__box {
        background: var(--vis-comparing);
        box-shadow: var(--shadow-clay);
      }

      .vis-cell--checked {
        opacity: 0.45;
      }

      .vis-cell--checked .vis-cell__box {
        background: #e2e8f0;
      }

      .vis-cell--found {
        transform: translateY(-6px) scale(1.05);
      }

      .vis-cell--found .vis-cell__box {
        background: var(--vis-active);
        box-shadow: 0 0 16px rgba(168, 230, 207, 0.95), var(--shadow-clay);
      }

      @media (max-width: 600px) {
        .vis-cell__box {
          width: 46px;
          height: 46px;
          font-size: 0.92rem;
        }
        .vis-target-field {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="visualizer">
      <!-- Input Controls -->
      <div class="vis-input">
        <input
          id="array-input"
          class="vis-input__field"
          type="text"
          value="14, 7, 23, 9, 42, 18, 5"
          placeholder="Enter numbers separated by commas, e.g. 14, 7, 23, 9"
          aria-label="Array numbers"
        />
        <div class="vis-target-group">
          <label for="target-input" class="vis-target-label">Target:</label>
          <input
            id="target-input"
            class="vis-input__field vis-target-field"
            type="number"
            value="42"
            aria-label="Target number"
          />
        </div>
        <button id="btn-apply" class="vis-btn vis-btn--primary" type="button">▶ Load &amp; Run</button>
        <button id="btn-random" class="vis-btn" type="button">🎲 Random</button>
      </div>

      <div class="vis-presets">
        <span class="vis-preset-label">Try presets:</span>
        <button class="vis-btn" type="button" data-array="14, 7, 23, 9, 42, 18, 5" data-target="14">Best case (index 0)</button>
        <button class="vis-btn" type="button" data-array="14, 7, 23, 9, 42, 18, 5" data-target="5">Worst case (last item)</button>
        <button class="vis-btn" type="button" data-array="14, 7, 23, 9, 42, 18, 5" data-target="99">Not found (-1)</button>
        <button class="vis-btn" type="button" data-array="14, 7, 23, 9, 42, 18, 5" data-target="42">Middle match</button>
      </div>

      <!-- Playback Controls -->
      <div class="vis-controls">
        <button class="vis-btn vis-btn-reset" type="button" title="Jump to start">⏮ Reset</button>
        <button class="vis-btn vis-btn-step-back" type="button" title="Previous step">◀ Back</button>
        <button class="vis-btn vis-btn--primary vis-btn-play" type="button" title="Play animation">▶ Play</button>
        <button class="vis-btn vis-btn--primary vis-btn-pause" type="button" title="Pause animation" style="display: none;">⏸ Pause</button>
        <button class="vis-btn vis-btn-step-forward" type="button" title="Next step">Next ▶</button>
        <span class="vis-step-counter">No steps</span>
        <label class="vis-speed">
          <span>Speed</span>
          <input class="vis-speed-slider" type="range" min="1" max="10" value="6" />
        </label>
      </div>

      <!-- Legend -->
      <div class="vis-legend">
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-default);"></span> Unchecked</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-comparing);"></span> Inspecting</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: #e2e8f0;"></span> Not a Match</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-active);"></span> Found!</span>
      </div>

      <!-- Status Pills -->
      <div class="vis-status-bar">
        <span id="status-target" class="vis-pill vis-pill--target">Target: 42</span>
        <span id="status-comparisons" class="vis-pill">Comparisons: 0</span>
      </div>

      <!-- Array Canvas -->
      <div id="vis-canvas" class="vis-canvas" aria-live="polite"></div>

      <!-- Step Description -->
      <div id="vis-info" class="vis-info" style="margin-bottom: 1rem;">
        Enter an array and target above, then press <strong>Play</strong> or <strong>Next</strong>.
      </div>

      <!-- Highlighted Python Code -->
      <div class="vis-code" id="vis-code"></div>
    </div>

    <script src="../shared/visualizer-base.js"></script>
    <script>
      const PYTHON_LINES = [
        'def linear_search(arr: list[int], target: int) -> int:',
        '    for index, value in enumerate(arr):',
        '        if value == target:',
        '            return index',
        '    return -1',
      ];

      const canvasEl = document.getElementById('vis-canvas');
      const infoEl = document.getElementById('vis-info');
      const codeEl = document.getElementById('vis-code');
      const arrayInputEl = document.getElementById('array-input');
      const targetInputEl = document.getElementById('target-input');
      const statusTargetEl = document.getElementById('status-target');
      const statusComparisonsEl = document.getElementById('status-comparisons');

      function renderCodePanel() {
        codeEl.innerHTML = PYTHON_LINES.map((line, index) => {
          return `<span class="vis-code__line" data-line="${index}"><span class="vis-code__line-number">${index + 1}</span>${line}</span>`;
        }).join('');
      }

      function highlightCodeLine(lineIndex) {
        codeEl.querySelectorAll('.vis-code__line').forEach((el, idx) => {
          el.classList.toggle('vis-code__line--active', idx === lineIndex);
        });
      }

      function renderStep(step) {
        const arr = step.array;
        const checked = new Set(step.checked || []);
        const scanningIdx = step.scanning;
        const foundIdx = step.found;

        statusTargetEl.textContent = `Target: ${step.target}`;
        statusComparisonsEl.textContent = `Comparisons: ${step.comparisons ?? 0}`;

        canvasEl.innerHTML = arr.map((val, idx) => {
          let stateClass = '';
          let badgeHtml = '';

          if (idx === foundIdx) {
            stateClass = 'vis-cell--found';
            badgeHtml = '<span class="vis-cell__badge vis-cell__badge--found">FOUND</span>';
          } else if (idx === scanningIdx) {
            stateClass = 'vis-cell--scanning';
            badgeHtml = `<span class="vis-cell__badge vis-cell__badge--scan">index=${idx}</span>`;
          } else if (checked.has(idx)) {
            stateClass = 'vis-cell--checked';
          }

          return `
            <div class="vis-cell ${stateClass}">
              ${badgeHtml}
              <div class="vis-cell__box">${val}</div>
              <span class="vis-cell__index">[${idx}]</span>
            </div>
          `;
        }).join('');

        infoEl.innerHTML = step.description;
      }

      const engine = new VisualizerEngine({
        render: renderStep,
        highlightCode: highlightCodeLine,
        defaultSpeed: 550,
      });

      function parseInputs() {
        const raw = arrayInputEl.value
          .split(',')
          .map((s) => Number(s.trim()))
          .filter((n) => Number.isFinite(n));
        const arr = raw.length >= 1 ? raw.slice(0, 12) : [14, 7, 23, 9, 42, 18, 5];
        const parsedTarget = Number(targetInputEl.value);
        const target = Number.isFinite(parsedTarget) ? parsedTarget : 42;
        return { arr, target };
      }

      function buildLinearSearchSteps(arr, target) {
        engine.reset();
        const checked = [];
        let comparisons = 0;

        engine.recordStep({
          array: [...arr],
          target,
          checked: [],
          comparisons: 0,
          description: `Starting Linear Search for <strong>${target}</strong> across ${arr.length} elements.`,
          codeLine: 0,
        });

        for (let index = 0; index < arr.length; index++) {
          const value = arr[index];
          comparisons++;

          engine.recordStep({
            array: [...arr],
            target,
            scanning: index,
            checked: [...checked],
            comparisons,
            description: `Checking index <strong>${index}</strong>: is <strong>${value} == ${target}</strong>?`,
            codeLine: 2,
          });

          if (value === target) {
            engine.recordStep({
              array: [...arr],
              target,
              found: index,
              checked: [...checked],
              comparisons,
              description: `✅ Match! Found <strong>${target}</strong> at index <strong>${index}</strong> after ${comparisons} comparison${comparisons === 1 ? '' : 's'}.`,
              codeLine: 3,
            });
            engine.goToStep(0);
            return;
          }

          checked.push(index);
          engine.recordStep({
            array: [...arr],
            target,
            checked: [...checked],
            comparisons,
            description: `<strong>${value}</strong> ≠ <strong>${target}</strong>. Mark index ${index} checked and move to the next item.`,
            codeLine: 1,
          });
        }

        engine.recordStep({
          array: [...arr],
          target,
          checked: [...checked],
          comparisons,
          description: `❌ Reached the end of the list. <strong>${target}</strong> was not found — returning <strong>-1</strong>.`,
          codeLine: 4,
        });

        engine.goToStep(0);
      }

      renderCodePanel();
      engine.bindControls();

      document.getElementById('btn-apply').addEventListener('click', () => {
        const { arr, target } = parseInputs();
        arrayInputEl.value = arr.join(', ');
        targetInputEl.value = String(target);
        buildLinearSearchSteps(arr, target);
        engine.play();
      });

      document.getElementById('btn-random').addEventListener('click', () => {
        const arr = Array.from({ length: 7 }, () => Math.floor(Math.random() * 45) + 1);
        const pickExisting = Math.random() < 0.75;
        const target = pickExisting
          ? arr[Math.floor(Math.random() * arr.length)]
          : Math.floor(Math.random() * 45) + 50;
        arrayInputEl.value = arr.join(', ');
        targetInputEl.value = String(target);
        buildLinearSearchSteps(arr, target);
      });

      document.querySelectorAll('[data-array]').forEach((btn) => {
        btn.addEventListener('click', () => {
          arrayInputEl.value = btn.dataset.array;
          targetInputEl.value = btn.dataset.target;
          const { arr, target } = parseInputs();
          buildLinearSearchSteps(arr, target);
        });
      });

      const initial = parseInputs();
      buildLinearSearchSteps(initial.arr, initial.target);
    </script>
  </body>
</html>
