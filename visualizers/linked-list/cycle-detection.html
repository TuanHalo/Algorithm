<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Floyd's Cycle Detection Visualizer</title>
    <link rel="stylesheet" href="../shared/clay-visualizer.css" />
    <style>
      .vis-input__pos {
        width: 110px;
        flex: 0 0 auto;
        min-width: 90px;
      }

      .vis-presets {
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 0.75rem;
      }

      .vis-preset-label { font-size: 0.75rem; color: var(--text-muted); }

      .vis-status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
        font-family: var(--font-code);
        font-size: 0.78rem;
        color: var(--text-secondary);
      }

      .vis-status-group { display: flex; gap: 0.5rem; flex-wrap: wrap; }

      .vis-pill {
        background: var(--bg-card);
        border: var(--border-clay);
        box-shadow: var(--shadow-clay-subtle);
        border-radius: 999px;
        padding: 0.25rem 0.75rem;
      }

      .vis-pill--accent {
        background: rgba(240, 182, 208, 0.45);
        font-weight: 600;
        color: var(--text-primary);
      }

      .vis-canvas {
        flex-direction: column;
        align-items: stretch;
        justify-content: center;
        min-height: 215px;
        padding: 1.25rem;
      }

      .cyc-stage {
        position: relative;
        padding: 2rem 0.75rem 2.6rem;
        border-radius: var(--border-radius-sm);
        background: rgba(255, 255, 255, 0.38);
        box-shadow: var(--shadow-clay-pressed);
        overflow-x: auto;
      }

      .cyc-chain {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.45rem;
        min-width: max-content;
        margin: 0 auto;
        position: relative;
        z-index: 2;
      }

      .cyc-slot {
        position: relative;
        display: flex;
        align-items: center;
        gap: 0.45rem;
      }

      .cyc-badges-top,
      .cyc-badges-bottom {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 3px;
        white-space: nowrap;
      }

      .cyc-badges-top { top: -25px; }
      .cyc-badges-bottom { bottom: -21px; }

      .cyc-badge {
        font-family: var(--font-code);
        font-size: 0.6rem;
        font-weight: 700;
        padding: 2px 6px;
        border-radius: 5px;
        box-shadow: var(--shadow-clay-subtle);
      }

      .cyc-badge--slow { background: #a8d8ea; color: #0c4a6e; }
      .cyc-badge--fast { background: #ffc8a2; color: #5c2d0c; }
      .cyc-badge--finder { background: #cdb4db; color: #3d2b4d; }
      .cyc-badge--entry { background: #a8e6cf; color: #124d36; }

      .cyc-node {
        min-width: 50px;
        padding: 0.48rem 0.75rem;
        border-radius: var(--border-radius-sm);
        background: var(--vis-default);
        border: var(--border-clay);
        box-shadow: var(--shadow-clay-subtle);
        font-family: var(--font-code);
        font-size: 0.92rem;
        font-weight: 700;
        text-align: center;
        transition: all 220ms ease;
      }

      .cyc-node--slow { background: var(--vis-sorted); }
      .cyc-node--fast { background: var(--vis-comparing); }
      .cyc-node--collide {
        background: var(--vis-swapping);
        transform: scale(1.06);
        box-shadow: var(--shadow-clay);
      }
      .cyc-node--finder { background: var(--vis-pivot); }
      .cyc-node--entry {
        background: var(--vis-active);
        transform: scale(1.07);
        box-shadow: var(--shadow-clay);
      }

      .cyc-arrow {
        font-family: var(--font-code);
        font-size: 1rem;
        font-weight: 700;
        color: var(--text-secondary);
      }

      .cyc-null {
        font-family: var(--font-code);
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--text-muted);
        padding: 0.35rem 0.6rem;
        border-radius: var(--border-radius-xs);
        border: 1px dashed rgba(90, 90, 90, 0.3);
        background: rgba(255, 255, 255, 0.45);
      }

      .cyc-svg {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div class="visualizer">
      <div class="vis-input">
        <input
          id="list-input"
          class="vis-input__field"
          type="text"
          value="3, 2, 0, -4, 7"
          placeholder="Node values (up to 7 nodes)"
          aria-label="Linked list node values"
        />
        <input
          id="pos-input"
          class="vis-input__field vis-input__pos"
          type="number"
          min="-1"
          max="6"
          value="1"
          title="Cycle entry index (-1 = no cycle)"
          aria-label="Cycle entry index (-1 for no cycle)"
        />
        <button id="btn-apply" class="vis-btn vis-btn--primary" type="button">▶ Load &amp; Run</button>
        <button id="btn-random" class="vis-btn" type="button">🎲 Random</button>
      </div>

      <div class="vis-presets">
        <span class="vis-preset-label">Try presets:</span>
        <button class="vis-btn" type="button" data-list="3, 2, 0, -4, 7" data-pos="1">Cycle at pos=1</button>
        <button class="vis-btn" type="button" data-list="10, 20, 30, 40" data-pos="0">Cycle at Head (pos=0)</button>
        <button class="vis-btn" type="button" data-list="5, 9, 12" data-pos="2">Tail Self-Loop (pos=2)</button>
        <button class="vis-btn" type="button" data-list="1, 2, 3, 4, 5" data-pos="-1">Acyclic (pos=-1)</button>
      </div>

      <div class="vis-controls">
        <button class="vis-btn vis-btn-reset" type="button" title="Jump to start">⏮ Reset</button>
        <button class="vis-btn vis-btn-step-back" type="button" title="Previous step">◀ Back</button>
        <button class="vis-btn vis-btn--primary vis-btn-play" type="button" title="Play animation">▶ Play</button>
        <button class="vis-btn vis-btn--primary vis-btn-pause" type="button" title="Pause animation" style="display: none;">⏸ Pause</button>
        <button class="vis-btn vis-btn-step-forward" type="button" title="Next step">Next ▶</button>
        <span class="vis-step-counter">No steps</span>
        <label class="vis-speed">
          <span>Speed</span>
          <input class="vis-speed-slider" type="range" min="1" max="10" value="6" />
        </label>
      </div>

      <div class="vis-legend">
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-sorted);"></span> Slow</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-comparing);"></span> Fast</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-swapping);"></span> Collision</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-pivot);"></span> Phase 2 Finder</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-active);"></span> Cycle Entry</span>
      </div>

      <div class="vis-status-bar">
        <span id="status-phase" class="vis-pill vis-pill--accent">Phase 1: Detect Cycle</span>
        <div class="vis-status-group">
          <span id="status-ptrs" class="vis-pill">slow=0, fast=0</span>
          <span id="status-cycle" class="vis-pill">pos=1</span>
        </div>
      </div>

      <div id="vis-canvas" class="vis-canvas" aria-live="polite"></div>

      <div id="vis-info" class="vis-info" style="margin-bottom: 1rem;">
        Set list values and cycle entry index <code>pos</code> (<code>-1</code> for no cycle), then press <strong>Play</strong>.
      </div>

      <div class="vis-code" id="vis-code"></div>
    </div>

    <script src="../shared/visualizer-base.js"></script>
    <script>
      const PYTHON_LINES = [
        'def detect_cycle(head: ListNode | None) -> ListNode | None:',
        '    slow = fast = head',
        '    while fast and fast.next:',
        '        slow = slow.next',
        '        fast = fast.next.next',
        '        if slow == fast:               # Phase 1: cycle exists',
        '            finder = head              # Phase 2: reset one pointer',
        '            while finder != slow:',
        '                finder = finder.next',
        '                slow = slow.next',
        '            return finder              # Meeting point is cycle entry',
        '    return None',
      ];

      const canvasEl = document.getElementById('vis-canvas');
      const infoEl = document.getElementById('vis-info');
      const codeEl = document.getElementById('vis-code');
      const listInputEl = document.getElementById('list-input');
      const posInputEl = document.getElementById('pos-input');
      const statusPhaseEl = document.getElementById('status-phase');
      const statusPtrsEl = document.getElementById('status-ptrs');
      const statusCycleEl = document.getElementById('status-cycle');

      function renderCodePanel() {
        codeEl.innerHTML = PYTHON_LINES.map((line, index) => (
          `<span class="vis-code__line" data-line="${index}"><span class="vis-code__line-number">${index + 1}</span>${line}</span>`
        )).join('');
      }

      function highlightCodeLine(lineIndex) {
        codeEl.querySelectorAll('.vis-code__line').forEach((el, idx) => {
          el.classList.toggle('vis-code__line--active', idx === lineIndex);
        });
      }

      function parseInputs() {
        const rawVals = listInputEl.value
          .split(',')
          .map((s) => Number(s.trim()))
          .filter((n) => Number.isFinite(n))
          .slice(0, 7);
        const nodes = rawVals.length > 0 ? rawVals : [3, 2, 0, -4, 7];
        let pos = Number.parseInt(posInputEl.value, 10);
        if (!Number.isFinite(pos) || pos < -1) pos = -1;
        if (pos >= nodes.length) pos = nodes.length - 1;
        listInputEl.value = nodes.join(', ');
        posInputEl.value = String(pos);
        return { nodes, pos };
      }

      function drawCycleArc(stageEl, svgEl, pos) {
        if (pos < 0) return;
        const nodeEls = stageEl.querySelectorAll('[data-node-idx]');
        if (nodeEls.length === 0 || pos >= nodeEls.length) return;
        const tailEl = nodeEls[nodeEls.length - 1];
        const targetEl = nodeEls[pos];
        const stageRect = stageEl.getBoundingClientRect();
        const tailRect = tailEl.getBoundingClientRect();
        const targetRect = targetEl.getBoundingClientRect();

        const x1 = tailRect.left - stageRect.left + tailRect.width / 2 + stageEl.scrollLeft;
        const x2 = targetRect.left - stageRect.left + targetRect.width / 2 + stageEl.scrollLeft;
        const y = tailRect.bottom - stageRect.top;
        const loopDepth = pos === nodeEls.length - 1 ? 26 : 32;

        const pathD = pos === nodeEls.length - 1
          ? `M ${x1 + 10} ${y} C ${x1 + 26} ${y + loopDepth}, ${x1 - 26} ${y + loopDepth}, ${x2 - 10} ${y + 2}`
          : `M ${x1} ${y} C ${x1} ${y + loopDepth}, ${x2} ${y + loopDepth}, ${x2} ${y + 3}`;

        svgEl.setAttribute('viewBox', `0 0 ${stageEl.scrollWidth} ${stageEl.scrollHeight}`);
        svgEl.style.width = `${stageEl.scrollWidth}px`;
        svgEl.innerHTML = `
          <defs>
            <marker id="cyc-head" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
              <polygon points="0 0, 7 3.5, 0 7" fill="#c94f82"></polygon>
            </marker>
          </defs>
          <path d="${pathD}" fill="none" stroke="#c94f82" stroke-width="2.2" stroke-dasharray="5 3" marker-end="url(#cyc-head)"></path>
        `;
      }

      function renderStep(step) {
        statusPhaseEl.textContent = step.phaseLabel;
        statusPtrsEl.textContent = step.phase === 2
          ? `finder=${step.finder}, slow=${step.slow}`
          : `slow=${step.slow >= 0 ? step.slow : 'None'}, fast=${step.fast >= 0 ? step.fast : 'None'}`;
        statusCycleEl.textContent = step.pos >= 0 ? `cycle → idx ${step.pos}` : 'acyclic (pos=-1)';

        const nodesHtml = step.nodes.map((val, idx) => {
          const topBadges = [];
          const bottomBadges = [];

          if (step.foundEntry === idx) {
            topBadges.push('<span class="cyc-badge cyc-badge--entry">ENTRY</span>');
          } else {
            if (idx === step.slow) topBadges.push('<span class="cyc-badge cyc-badge--slow">SLOW</span>');
            if (step.phase === 1 && idx === step.fast) bottomBadges.push('<span class="cyc-badge cyc-badge--fast">FAST</span>');
            if (step.phase === 2 && idx === step.finder) bottomBadges.push('<span class="cyc-badge cyc-badge--finder">FINDER</span>');
          }

          let cls = '';
          if (step.foundEntry === idx) cls = 'cyc-node--entry';
          else if (step.collision && idx === step.slow) cls = 'cyc-node--collide';
          else if (step.phase === 2 && idx === step.finder) cls = 'cyc-node--finder';
          else if (idx === step.slow) cls = 'cyc-node--slow';
          else if (step.phase === 1 && idx === step.fast) cls = 'cyc-node--fast';

          const isTail = idx === step.nodes.length - 1;
          const arrow = isTail
            ? (step.pos === -1 ? '<span class="cyc-arrow">→</span><span class="cyc-null">None</span>' : '')
            : '<span class="cyc-arrow">→</span>';

          return `
            <div class="cyc-slot">
              ${topBadges.length > 0 ? `<div class="cyc-badges-top">${topBadges.join('')}</div>` : ''}
              <div class="cyc-node ${cls}" data-node-idx="${idx}">${val}</div>
              ${bottomBadges.length > 0 ? `<div class="cyc-badges-bottom">${bottomBadges.join('')}</div>` : ''}
              ${arrow}
            </div>
          `;
        }).join('');

        canvasEl.innerHTML = `
          <div class="cyc-stage" id="cyc-stage">
            <svg class="cyc-svg" id="cyc-svg"></svg>
            <div class="cyc-chain">${nodesHtml}</div>
          </div>
        `;

        const stageEl = document.getElementById('cyc-stage');
        const svgEl = document.getElementById('cyc-svg');
        requestAnimationFrame(() => drawCycleArc(stageEl, svgEl, step.pos));
        infoEl.innerHTML = step.description;
      }

      const engine = new VisualizerEngine({
        render: renderStep,
        highlightCode: highlightCodeLine,
        defaultSpeed: 700,
      });

      function nextIdx(curr, n, pos) {
        if (curr < 0 || curr >= n) return -1;
        if (curr === n - 1) return pos >= 0 ? pos : -1;
        return curr + 1;
      }

      function buildSteps(nodes, pos) {
        engine.reset();
        const n = nodes.length;
        let slow = 0;
        let fast = 0;

        const snap = (extra) => {
          engine.recordStep({
            nodes: [...nodes],
            pos,
            phase: extra.phase ?? 1,
            phaseLabel: extra.phaseLabel,
            slow,
            fast,
            finder: extra.finder ?? -1,
            collision: extra.collision ?? false,
            foundEntry: extra.foundEntry ?? -1,
            description: extra.description,
            codeLine: extra.codeLine,
          });
        };

        snap({
          phaseLabel: 'Phase 1: Initialize',
          description: `Both <code>slow</code> and <code>fast</code> begin at <code>head</code> (<strong>${nodes[0]}</strong>).`,
          codeLine: 1,
        });

        let met = false;
        let safety = 0;
        while (fast !== -1 && nextIdx(fast, n, pos) !== -1 && safety < 40) {
          safety++;
          slow = nextIdx(slow, n, pos);
          const f1 = nextIdx(fast, n, pos);
          fast = nextIdx(f1, n, pos);

          if (slow === fast) {
            met = true;
            snap({
              phaseLabel: 'Phase 1: Collision!',
              collision: true,
              description: `<code>slow</code> and <code>fast</code> collided at node <strong>${nodes[slow]}</strong> (index ${slow}): cycle confirmed.`,
              codeLine: 5,
            });
            break;
          } else {
            snap({
              phaseLabel: 'Phase 1: Detect Cycle',
              description: `<code>slow</code> (+1) → <strong>${nodes[slow]}</strong>; <code>fast</code> (+2) → ${fast >= 0 ? `<strong>${nodes[fast]}</strong>` : '<code>None</code>'}.`,
              codeLine: 4,
            });
          }
        }

        if (!met) {
          snap({
            phaseLabel: 'Acyclic (None)',
            description: '<code>fast</code> reached the end (<code>None</code>) without meeting <code>slow</code>. No cycle exists, so it returns <code>None</code>.',
            codeLine: 11,
          });
          engine.goToStep(0);
          return;
        }

        // Phase 2: find cycle entry
        let finder = 0;
        snap({
          phase: 2,
          finder,
          phaseLabel: 'Phase 2: Find Entry',
          description: `Reset <code>finder = head</code> (<strong>${nodes[0]}</strong>) while keeping <code>slow</code> at collision node <strong>${nodes[slow]}</strong>.`,
          codeLine: 6,
        });

        while (finder !== slow) {
          finder = nextIdx(finder, n, pos);
          slow = nextIdx(slow, n, pos);
          snap({
            phase: 2,
            finder,
            phaseLabel: finder === slow ? 'Entry Found!' : 'Phase 2: Step +1',
            foundEntry: finder === slow ? finder : -1,
            description: finder === slow
              ? `<code>finder</code> and <code>slow</code> met at index <code>${finder}</code> (<strong>${nodes[finder]}</strong>), the cycle entry.`
              : `Moved both +1: <code>finder</code> → <strong>${nodes[finder]}</strong>, <code>slow</code> → <strong>${nodes[slow]}</strong>.`,
            codeLine: finder === slow ? 10 : 8,
          });
        }

        if (engine.steps[engine.steps.length - 1].foundEntry === -1) {
          snap({
            phase: 2,
            finder,
            foundEntry: finder,
            phaseLabel: 'Entry Found!',
            description: `<code>finder == slow</code> immediately at <code>head</code> (<strong>${nodes[finder]}</strong>, index ${finder}): cycle entry found.`,
            codeLine: 10,
          });
        }

        engine.goToStep(0);
      }

      renderCodePanel();
      engine.bindControls();

      document.getElementById('btn-apply').addEventListener('click', () => {
        const { nodes, pos } = parseInputs();
        buildSteps(nodes, pos);
        engine.play();
      });

      document.getElementById('btn-random').addEventListener('click', () => {
        const count = Math.floor(Math.random() * 3) + 4;
        const vals = Array.from({ length: count }, () => Math.floor(Math.random() * 89) + 10);
        const pos = Math.random() < 0.25 ? -1 : Math.floor(Math.random() * (count - 1));
        listInputEl.value = vals.join(', ');
        posInputEl.value = String(pos);
        buildSteps(vals, pos);
      });

      document.querySelectorAll('[data-list]').forEach((btn) => {
        btn.addEventListener('click', () => {
          listInputEl.value = btn.dataset.list;
          posInputEl.value = btn.dataset.pos;
          const { nodes, pos } = parseInputs();
          buildSteps(nodes, pos);
        });
      });

      const initial = parseInputs();
      buildSteps(initial.nodes, initial.pos);
    </script>
  </body>
</html>
