<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reverse Linked List Visualizer</title>
    <link rel="stylesheet" href="../shared/clay-visualizer.css" />
    <style>
      .vis-presets {
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 0.75rem;
      }

      .vis-preset-label { font-size: 0.75rem; color: var(--text-muted); }

      .vis-status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
        font-family: var(--font-code);
        font-size: 0.78rem;
        color: var(--text-secondary);
      }

      .vis-status-group { display: flex; gap: 0.5rem; flex-wrap: wrap; }

      .vis-pill {
        background: var(--bg-card);
        border: var(--border-clay);
        box-shadow: var(--shadow-clay-subtle);
        border-radius: 999px;
        padding: 0.25rem 0.75rem;
      }

      .vis-pill--accent {
        background: rgba(240, 182, 208, 0.45);
        font-weight: 600;
        color: var(--text-primary);
      }

      .vis-canvas {
        flex-direction: column;
        align-items: stretch;
        justify-content: center;
        min-height: 195px;
        padding: 1.5rem 1.25rem;
      }

      .rev-chain {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 0.45rem;
        padding: 2rem 0.75rem 1.25rem;
        border-radius: var(--border-radius-sm);
        background: rgba(255, 255, 255, 0.38);
        box-shadow: var(--shadow-clay-pressed);
        min-height: 120px;
      }

      .rev-slot {
        position: relative;
        display: flex;
        align-items: center;
      }

      .rev-badges {
        position: absolute;
        top: -25px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 3px;
        white-space: nowrap;
      }

      .rev-badge {
        font-family: var(--font-code);
        font-size: 0.6rem;
        font-weight: 700;
        padding: 2px 6px;
        border-radius: 5px;
        box-shadow: var(--shadow-clay-subtle);
      }

      .rev-badge--prev { background: #a8d8ea; color: #0c4a6e; }
      .rev-badge--curr { background: #ffc8a2; color: #5c2d0c; }
      .rev-badge--next { background: #cdb4db; color: #3d2b4d; }
      .rev-badge--head { background: #f0b6d0; color: #521836; }

      .rev-node {
        min-width: 52px;
        padding: 0.5rem 0.85rem;
        border-radius: var(--border-radius-sm);
        background: var(--vis-default);
        border: var(--border-clay);
        box-shadow: var(--shadow-clay-subtle);
        font-family: var(--font-code);
        font-size: 0.95rem;
        font-weight: 700;
        text-align: center;
        transition: all 240ms ease;
      }

      .rev-node--reversed { background: var(--vis-sorted); }
      .rev-node--curr {
        background: var(--vis-comparing);
        transform: translateY(-4px) scale(1.04);
        box-shadow: var(--shadow-clay);
      }
      .rev-node--saved { background: var(--vis-pivot); }
      .rev-node--done {
        background: var(--vis-active);
        box-shadow: var(--shadow-clay);
      }

      .rev-null {
        font-family: var(--font-code);
        font-size: 0.76rem;
        font-weight: 600;
        color: var(--text-muted);
        padding: 0.4rem 0.65rem;
        border-radius: var(--border-radius-xs);
        border: 1px dashed rgba(90, 90, 90, 0.3);
        background: rgba(255, 255, 255, 0.45);
      }

      .rev-arrow {
        font-family: var(--font-code);
        font-size: 1.05rem;
        font-weight: 700;
        padding: 0 0.15rem;
        transition: all 240ms ease;
      }

      .rev-arrow--forward { color: var(--text-secondary); }
      .rev-arrow--broken { color: #d9534f; }
      .rev-arrow--flipped { color: #0c4a6e; transform: scale(1.1); }
    </style>
  </head>
  <body>
    <div class="visualizer">
      <div class="vis-input">
        <input
          id="list-input"
          class="vis-input__field"
          type="text"
          value="10, 20, 30, 40, 50"
          placeholder="Node values (comma-separated, up to 8 nodes)"
          aria-label="Linked list values to reverse"
        />
        <button id="btn-apply" class="vis-btn vis-btn--primary" type="button">▶ Load &amp; Run</button>
        <button id="btn-random" class="vis-btn" type="button">🎲 Random</button>
      </div>

      <div class="vis-presets">
        <span class="vis-preset-label">Try presets:</span>
        <button class="vis-btn" type="button" data-list="10, 20, 30, 40, 50">5 Nodes</button>
        <button class="vis-btn" type="button" data-list="4, 9">2 Nodes</button>
        <button class="vis-btn" type="button" data-list="42">Single Node</button>
        <button class="vis-btn" type="button" data-list="">Empty List</button>
      </div>

      <div class="vis-controls">
        <button class="vis-btn vis-btn-reset" type="button" title="Jump to start">⏮ Reset</button>
        <button class="vis-btn vis-btn-step-back" type="button" title="Previous step">◀ Back</button>
        <button class="vis-btn vis-btn--primary vis-btn-play" type="button" title="Play animation">▶ Play</button>
        <button class="vis-btn vis-btn--primary vis-btn-pause" type="button" title="Pause animation" style="display: none;">⏸ Pause</button>
        <button class="vis-btn vis-btn-step-forward" type="button" title="Next step">Next ▶</button>
        <span class="vis-step-counter">No steps</span>
        <label class="vis-speed">
          <span>Speed</span>
          <input class="vis-speed-slider" type="range" min="1" max="10" value="6" />
        </label>
      </div>

      <div class="vis-legend">
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-comparing);"></span> Current (curr)</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-pivot);"></span> Saved (next_node)</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-sorted);"></span> Reversed Link (←)</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-active);"></span> Final New Head</span>
      </div>

      <div class="vis-status-bar">
        <span id="status-phase" class="vis-pill vis-pill--accent">Phase: Ready</span>
        <div class="vis-status-group">
          <span id="status-ptrs" class="vis-pill">prev=None, curr=head</span>
          <span id="status-flipped" class="vis-pill">Flipped: 0 / 0</span>
        </div>
      </div>

      <div id="vis-canvas" class="vis-canvas" aria-live="polite"></div>

      <div id="vis-info" class="vis-info" style="margin-bottom: 1rem;">
        Enter list values above and press <strong>Play</strong> or <strong>Next</strong> to watch pointers flip in place.
      </div>

      <div class="vis-code" id="vis-code"></div>
    </div>

    <script src="../shared/visualizer-base.js"></script>
    <script>
      const PYTHON_LINES = [
        'def reverse_list(head: ListNode | None) -> ListNode | None:',
        '    prev: ListNode | None = None',
        '    curr = head',
        '    while curr is not None:',
        '        next_node = curr.next  # Save rest of chain before rewiring',
        '        curr.next = prev       # Flip pointer backward',
        '        prev = curr            # Advance prev',
        '        curr = next_node       # Advance curr',
        '    return prev',
      ];

      const canvasEl = document.getElementById('vis-canvas');
      const infoEl = document.getElementById('vis-info');
      const codeEl = document.getElementById('vis-code');
      const listInputEl = document.getElementById('list-input');
      const statusPhaseEl = document.getElementById('status-phase');
      const statusPtrsEl = document.getElementById('status-ptrs');
      const statusFlippedEl = document.getElementById('status-flipped');

      function renderCodePanel() {
        codeEl.innerHTML = PYTHON_LINES.map((line, index) => (
          `<span class="vis-code__line" data-line="${index}"><span class="vis-code__line-number">${index + 1}</span>${line}</span>`
        )).join('');
      }

      function highlightCodeLine(lineIndex) {
        codeEl.querySelectorAll('.vis-code__line').forEach((el, idx) => {
          el.classList.toggle('vis-code__line--active', idx === lineIndex);
        });
      }

      function parseList(raw) {
        if (!raw.trim()) return [];
        return raw
          .split(',')
          .map((s) => Number(s.trim()))
          .filter((n) => Number.isFinite(n))
          .slice(0, 8);
      }

      function ptrLabel(nodes, idx) {
        if (idx === -1 || idx >= nodes.length) return 'None';
        return String(nodes[idx]);
      }

      function renderStep(step) {
        const n = step.nodes.length;
        statusPhaseEl.textContent = `Phase: ${step.phase}`;
        statusPtrsEl.textContent = `prev=${ptrLabel(step.nodes, step.prevIdx)}, curr=${ptrLabel(step.nodes, step.currIdx)}`;
        statusFlippedEl.textContent = `Flipped: ${step.flippedCount} / ${n}`;

        if (n === 0) {
          canvasEl.innerHTML = `
            <div class="rev-chain">
              <div class="rev-slot">
                <div class="rev-badges"><span class="rev-badge rev-badge--prev">PREV</span><span class="rev-badge rev-badge--curr">CURR</span></div>
                <span class="rev-null">None</span>
              </div>
            </div>
          `;
          infoEl.innerHTML = step.description;
          return;
        }

        const leftNullBadges = [];
        if (step.prevIdx === -1) leftNullBadges.push('<span class="rev-badge rev-badge--prev">PREV</span>');

        let html = `
          <div class="rev-slot">
            ${leftNullBadges.length > 0 ? `<div class="rev-badges">${leftNullBadges.join('')}</div>` : ''}
            <span class="rev-null">None</span>
          </div>
        `;

        // Gap before index 0: only flipped once node 0 points back to None
        const firstArrow = step.edges[0] === 'left'
          ? '<span class="rev-arrow rev-arrow--flipped">←</span>'
          : '<span class="rev-arrow" style="opacity: 0.25;">·</span>';
        html += firstArrow;

        for (let i = 0; i < n; i++) {
          const badges = [];
          if (step.done && i === n - 1) badges.push('<span class="rev-badge rev-badge--head">NEW HEAD</span>');
          if (i === step.prevIdx) badges.push('<span class="rev-badge rev-badge--prev">PREV</span>');
          if (i === step.currIdx) badges.push('<span class="rev-badge rev-badge--curr">CURR</span>');
          if (i === step.nextIdx) badges.push('<span class="rev-badge rev-badge--next">NEXT</span>');

          let cls = '';
          if (step.done) cls = i === n - 1 ? 'rev-node--done' : 'rev-node--reversed';
          else if (i === step.currIdx) cls = 'rev-node--curr';
          else if (i === step.nextIdx) cls = 'rev-node--saved';
          else if (step.edges[i] === 'left') cls = 'rev-node--reversed';

          html += `
            <div class="rev-slot">
              ${badges.length > 0 ? `<div class="rev-badges">${badges.join('')}</div>` : ''}
              <div class="rev-node ${cls}">${step.nodes[i]}</div>
            </div>
          `;

          // Gap between node i and node i + 1 (or right None)
          const rightEdge = step.edges[i + 1];
          if (rightEdge === 'right') {
            html += '<span class="rev-arrow rev-arrow--forward">→</span>';
          } else if (rightEdge === 'broken') {
            html += '<span class="rev-arrow rev-arrow--broken">✕</span>';
          } else if (rightEdge === 'left') {
            html += '<span class="rev-arrow rev-arrow--flipped">←</span>';
          } else {
            html += '<span class="rev-arrow" style="opacity: 0.25;">·</span>';
          }
        }

        const rightNullBadges = [];
        if (step.currIdx === n) rightNullBadges.push('<span class="rev-badge rev-badge--curr">CURR</span>');
        if (step.nextIdx === n) rightNullBadges.push('<span class="rev-badge rev-badge--next">NEXT</span>');

        html += `
          <div class="rev-slot">
            ${rightNullBadges.length > 0 ? `<div class="rev-badges">${rightNullBadges.join('')}</div>` : ''}
            <span class="rev-null">None</span>
          </div>
        `;

        canvasEl.innerHTML = `<div class="rev-chain">${html}</div>`;
        infoEl.innerHTML = step.description;
      }

      const engine = new VisualizerEngine({
        render: renderStep,
        highlightCode: highlightCodeLine,
        defaultSpeed: 700,
      });

      function buildSteps(nodes) {
        engine.reset();
        const n = nodes.length;
        // edges[k] describes link anchored at node k-1 / node k:
        // edges[0] is link from node 0 back to left None ('none' | 'left')
        // edges[k] (1..n) is link between node k-1 and node k (or right None when k===n): 'right' | 'broken' | 'left' | 'none'
        const edges = new Array(n + 1).fill('right');
        edges[0] = 'none';
        let flippedCount = 0;

        const snap = (extra) => {
          engine.recordStep({
            nodes: [...nodes],
            edges: [...edges],
            flippedCount,
            prevIdx: extra.prevIdx,
            currIdx: extra.currIdx,
            nextIdx: extra.nextIdx ?? -2,
            phase: extra.phase,
            done: extra.done ?? false,
            description: extra.description,
            codeLine: extra.codeLine,
          });
        };

        snap({
          prevIdx: -1,
          currIdx: n > 0 ? 0 : -1,
          phase: 'Initialize',
          description: n === 0
            ? 'Empty list: <code>prev = None</code>, <code>curr = None</code>. Loop skips and returns <code>None</code>.'
            : `Start with <code>prev = None</code> and <code>curr = head</code> (<strong>${nodes[0]}</strong>).`,
          codeLine: n === 0 ? 8 : 2,
        });

        let prev = -1;
        let curr = 0;

        while (curr < n) {
          const next = curr + 1;
          snap({
            prevIdx: prev,
            currIdx: curr,
            nextIdx: next,
            phase: '1. Save next_node',
            description: `Saved <code>next_node = ${ptrLabel(nodes, next)}</code> so we do not lose the remaining chain after rewiring.`,
            codeLine: 4,
          });

          edges[curr + 1] = 'broken';
          edges[curr] = 'left';
          flippedCount++;
          snap({
            prevIdx: prev,
            currIdx: curr,
            nextIdx: next,
            phase: '2. Flip curr.next',
            description: `Rewired <code>${nodes[curr]}.next = ${ptrLabel(nodes, prev)}</code> (pointer now points left).`,
            codeLine: 5,
          });

          prev = curr;
          edges[curr + 1] = curr + 1 < n ? 'none' : 'none';
          snap({
            prevIdx: prev,
            currIdx: curr,
            nextIdx: next,
            phase: '3. Advance prev',
            description: `Moved <code>prev</code> forward to <strong>${nodes[prev]}</strong>.`,
            codeLine: 6,
          });

          curr = next;
          snap({
            prevIdx: prev,
            currIdx: curr,
            nextIdx: -2,
            phase: '4. Advance curr',
            description: curr < n
              ? `Moved <code>curr</code> forward to <code>next_node</code> (<strong>${nodes[curr]}</strong>).`
              : '<code>curr</code> reached <code>None</code>; the <code>while</code> loop ends.',
            codeLine: curr < n ? 7 : 3,
          });
        }

        if (n > 0) {
          snap({
            prevIdx: n - 1,
            currIdx: n,
            done: true,
            phase: 'Done',
            description: `Returned <code>prev</code> (<strong>${nodes[n - 1]}</strong>) as the new head of the reversed list!`,
            codeLine: 8,
          });
        }

        engine.goToStep(0);
      }

      renderCodePanel();
      engine.bindControls();

      document.getElementById('btn-apply').addEventListener('click', () => {
        const nodes = parseList(listInputEl.value);
        listInputEl.value = nodes.join(', ');
        buildSteps(nodes);
        engine.play();
      });

      document.getElementById('btn-random').addEventListener('click', () => {
        const count = Math.floor(Math.random() * 4) + 4;
        const vals = Array.from({ length: count }, () => Math.floor(Math.random() * 89) + 10);
        listInputEl.value = vals.join(', ');
        buildSteps(vals);
      });

      document.querySelectorAll('[data-list]').forEach((btn) => {
        btn.addEventListener('click', () => {
          listInputEl.value = btn.dataset.list;
          buildSteps(parseList(btn.dataset.list));
        });
      });

      buildSteps(parseList(listInputEl.value));
    </script>
  </body>
</html>
