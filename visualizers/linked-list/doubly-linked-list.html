<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doubly Linked List Visualizer</title>
    <link rel="stylesheet" href="../shared/clay-visualizer.css" />
    <style>
      .vis-presets {
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 0.75rem;
      }

      .vis-preset-label { font-size: 0.75rem; color: var(--text-muted); }

      .vis-status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
        font-family: var(--font-code);
        font-size: 0.78rem;
        color: var(--text-secondary);
      }

      .vis-status-group { display: flex; gap: 0.5rem; flex-wrap: wrap; }

      .vis-pill {
        background: var(--bg-card);
        border: var(--border-clay);
        box-shadow: var(--shadow-clay-subtle);
        border-radius: 999px;
        padding: 0.25rem 0.75rem;
      }

      .vis-pill--accent {
        background: rgba(240, 182, 208, 0.45);
        font-weight: 600;
        color: var(--text-primary);
      }

      .vis-canvas {
        flex-direction: column;
        align-items: stretch;
        justify-content: center;
        gap: 0.9rem;
        min-height: 205px;
        padding: 1.4rem 1.25rem;
      }

      .dll-chain {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 0.35rem;
        padding: 1.8rem 0.75rem 1.4rem;
        border-radius: var(--border-radius-sm);
        background: rgba(255, 255, 255, 0.38);
        box-shadow: var(--shadow-clay-pressed);
        min-height: 112px;
      }

      .dll-sentinel {
        font-family: var(--font-code);
        font-size: 0.72rem;
        font-weight: 700;
        color: var(--text-secondary);
        padding: 0.45rem 0.6rem;
        border-radius: var(--border-radius-xs);
        border: 1.5px dashed rgba(90, 90, 90, 0.32);
        background: rgba(255, 255, 255, 0.58);
      }

      .dll-node-wrap {
        position: relative;
        display: flex;
        align-items: center;
        gap: 0.35rem;
      }

      .dll-badges {
        position: absolute;
        top: -24px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 3px;
        white-space: nowrap;
      }

      .dll-badge {
        font-family: var(--font-code);
        font-size: 0.6rem;
        font-weight: 700;
        padding: 2px 6px;
        border-radius: 5px;
        box-shadow: var(--shadow-clay-subtle);
      }

      .dll-badge--front { background: #a8d8ea; color: #0c4a6e; }
      .dll-badge--back { background: var(--vis-pivot); color: #3d2b4d; }
      .dll-badge--curr { background: #ffc8a2; color: #5c2d0c; }

      .dll-node {
        display: flex;
        align-items: stretch;
        border-radius: var(--border-radius-sm);
        background: var(--vis-default);
        border: var(--border-clay);
        box-shadow: var(--shadow-clay-subtle);
        overflow: hidden;
        transition: all 240ms ease;
      }

      .dll-node__ptr {
        padding: 0.48rem 0.38rem;
        background: rgba(255, 255, 255, 0.42);
        font-family: var(--font-code);
        font-size: 0.66rem;
        color: var(--text-muted);
        display: flex;
        align-items: center;
      }

      .dll-node__ptr--left { border-right: 1px solid rgba(90, 90, 90, 0.14); }
      .dll-node__ptr--right { border-left: 1px solid rgba(90, 90, 90, 0.14); }

      .dll-node__val {
        padding: 0.48rem 0.65rem;
        font-family: var(--font-code);
        font-size: 0.9rem;
        font-weight: 700;
        color: var(--text-primary);
      }

      .dll-node--insert {
        background: var(--vis-active);
        transform: translateY(-4px) scale(1.04);
        box-shadow: var(--shadow-clay);
      }

      .dll-node--scan {
        background: var(--vis-comparing);
        transform: translateY(-3px);
      }

      .dll-node--unlink {
        background: var(--vis-swapping);
        transform: translateY(-4px);
      }

      .dll-arrow {
        font-family: var(--font-code);
        font-size: 0.95rem;
        font-weight: 700;
        color: var(--text-secondary);
      }

      .ops-chips {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.35rem;
      }

      .op-chip {
        font-family: var(--font-code);
        font-size: 0.72rem;
        padding: 0.22rem 0.5rem;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.55);
        border: var(--border-clay);
        color: var(--text-secondary);
      }

      .op-chip--done { opacity: 0.45; }

      .op-chip--current {
        background: #f0b6d0;
        color: #521836;
        font-weight: 700;
        box-shadow: var(--shadow-clay-subtle);
      }
    </style>
  </head>
  <body>
    <div class="visualizer">
      <div class="vis-input">
        <input
          id="ops-input"
          class="vis-input__field"
          type="text"
          value="PUSH_FRONT 20, PUSH_BACK 30, PUSH_FRONT 10, REMOVE 20, POP_BACK, POP_FRONT"
          placeholder="PUSH_FRONT 10, PUSH_BACK 20, POP_FRONT, POP_BACK, REMOVE 20"
          aria-label="Doubly linked list operations"
        />
        <button id="btn-apply" class="vis-btn vis-btn--primary" type="button">▶ Load &amp; Run</button>
        <button id="btn-random" class="vis-btn" type="button">🎲 Random</button>
      </div>

      <div class="vis-presets">
        <span class="vis-preset-label">Try presets:</span>
        <button class="vis-btn" type="button" data-ops="PUSH_FRONT 20, PUSH_BACK 30, PUSH_FRONT 10, REMOVE 20, POP_BACK, POP_FRONT">Ends &amp; Unlink</button>
        <button class="vis-btn" type="button" data-ops="PUSH_BACK 5, PUSH_BACK 15, PUSH_BACK 25, POP_BACK, POP_FRONT">O(1) Both Ends</button>
        <button class="vis-btn" type="button" data-ops="PUSH_BACK 11, PUSH_BACK 22, PUSH_BACK 33, REMOVE 22, REMOVE 99">Unlink Middle</button>
        <button class="vis-btn" type="button" data-ops="PUSH_FRONT 7, POP_BACK, POP_FRONT, PUSH_BACK 19">Empty Guard</button>
      </div>

      <div class="vis-controls">
        <button class="vis-btn vis-btn-reset" type="button" title="Jump to start">⏮ Reset</button>
        <button class="vis-btn vis-btn-step-back" type="button" title="Previous step">◀ Back</button>
        <button class="vis-btn vis-btn--primary vis-btn-play" type="button" title="Play animation">▶ Play</button>
        <button class="vis-btn vis-btn--primary vis-btn-pause" type="button" title="Pause animation" style="display: none;">⏸ Pause</button>
        <button class="vis-btn vis-btn-step-forward" type="button" title="Next step">Next ▶</button>
        <span class="vis-step-counter">No steps</span>
        <label class="vis-speed">
          <span>Speed</span>
          <input class="vis-speed-slider" type="range" min="1" max="10" value="6" />
        </label>
      </div>

      <div class="vis-legend">
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-active);"></span> Inserted</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-comparing);"></span> Searching</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-swapping);"></span> Unlinking / Empty</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: rgba(255,255,255,0.8);"></span> Sentinel Boundary</span>
      </div>

      <div class="vis-status-bar">
        <span id="status-op" class="vis-pill vis-pill--accent">Operation: Ready</span>
        <div class="vis-status-group">
          <span id="status-len" class="vis-pill">Length: 0</span>
          <span id="status-output" class="vis-pill">Last Output: None</span>
        </div>
      </div>

      <div id="vis-canvas" class="vis-canvas" aria-live="polite"></div>

      <div id="vis-info" class="vis-info" style="margin-bottom: 1rem;">
        Enter doubly linked list operations above and press <strong>Play</strong> or <strong>Next</strong>.
      </div>

      <div class="vis-code" id="vis-code"></div>
    </div>

    <script src="../shared/visualizer-base.js"></script>
    <script>
      const PYTHON_LINES = [
        'class DoublyLinkedList:',
        '    def __init__(self) -> None:',
        '        self.head = DNode(0); self.tail = DNode(0)',
        '        self.head.next, self.tail.prev = self.tail, self.head',
        '    def _insert_between(self, val: int, left: DNode, right: DNode) -> DNode:',
        '        node = DNode(val, prev=left, next=right)',
        '        left.next = right.prev = node',
        '        return node',
        '    def unlink(self, node: DNode) -> int:',
        '        node.prev.next = node.next',
        '        node.next.prev = node.prev',
        '        return node.val',
        '    def push_front(self, val: int) -> None:',
        '        self._insert_between(val, self.head, self.head.next)',
        '    def push_back(self, val: int) -> None:',
        '        self._insert_between(val, self.tail.prev, self.tail)',
      ];

      const canvasEl = document.getElementById('vis-canvas');
      const infoEl = document.getElementById('vis-info');
      const codeEl = document.getElementById('vis-code');
      const opsInputEl = document.getElementById('ops-input');
      const statusOpEl = document.getElementById('status-op');
      const statusLenEl = document.getElementById('status-len');
      const statusOutputEl = document.getElementById('status-output');

      function renderCodePanel() {
        codeEl.innerHTML = PYTHON_LINES.map((line, index) => (
          `<span class="vis-code__line" data-line="${index}"><span class="vis-code__line-number">${index + 1}</span>${line}</span>`
        )).join('');
      }

      function highlightCodeLine(lineIndex) {
        codeEl.querySelectorAll('.vis-code__line').forEach((el, idx) => {
          el.classList.toggle('vis-code__line--active', idx === lineIndex);
        });
      }

      function parseOperations(rawText) {
        const tokens = rawText.split(',').map((t) => t.trim()).filter(Boolean);
        const parsed = [];
        for (const token of tokens.slice(0, 12)) {
          const parts = token.split(/\s+/);
          const cmd = parts[0].toUpperCase();
          if ((cmd === 'PUSH_FRONT' || cmd === 'PREPEND') && Number.isFinite(Number(parts[1]))) {
            const v = Number(parts[1]);
            parsed.push({ type: 'PUSH_FRONT', value: v, label: `PUSH_FRONT ${v}` });
          } else if ((cmd === 'PUSH_BACK' || cmd === 'APPEND') && Number.isFinite(Number(parts[1]))) {
            const v = Number(parts[1]);
            parsed.push({ type: 'PUSH_BACK', value: v, label: `PUSH_BACK ${v}` });
          } else if (cmd === 'POP_FRONT') {
            parsed.push({ type: 'POP_FRONT', label: 'POP_FRONT' });
          } else if (cmd === 'POP_BACK') {
            parsed.push({ type: 'POP_BACK', label: 'POP_BACK' });
          } else if ((cmd === 'REMOVE' || cmd === 'DELETE') && Number.isFinite(Number(parts[1]))) {
            const v = Number(parts[1]);
            parsed.push({ type: 'REMOVE', value: v, label: `REMOVE ${v}` });
          }
        }
        return parsed.length > 0
          ? parsed
          : [
              { type: 'PUSH_FRONT', value: 20, label: 'PUSH_FRONT 20' },
              { type: 'PUSH_BACK', value: 30, label: 'PUSH_BACK 30' },
              { type: 'POP_BACK', label: 'POP_BACK' },
            ];
      }

      function renderStep(step) {
        statusOpEl.textContent = `Operation: ${step.opLabel}`;
        statusLenEl.textContent = `Length: ${step.nodes.length}`;
        statusOutputEl.textContent = `Last Output: ${step.output}`;

        const itemsHtml = step.nodes.map((val, idx) => {
          const badges = [];
          if (idx === 0) badges.push('<span class="dll-badge dll-badge--front">FRONT</span>');
          if (idx === step.nodes.length - 1) badges.push('<span class="dll-badge dll-badge--back">BACK</span>');
          if (idx === step.currIdx) badges.push('<span class="dll-badge dll-badge--curr">CURR</span>');

          let cls = '';
          if (idx === step.insertIdx) cls = 'dll-node--insert';
          else if (idx === step.unlinkIdx) cls = 'dll-node--unlink';
          else if (idx === step.currIdx) cls = 'dll-node--scan';

          return `
            <span class="dll-arrow">⇄</span>
            <div class="dll-node-wrap">
              ${badges.length > 0 ? `<div class="dll-badges">${badges.join('')}</div>` : ''}
              <div class="dll-node ${cls}">
                <span class="dll-node__ptr dll-node__ptr--left">prev</span>
                <span class="dll-node__val">${val}</span>
                <span class="dll-node__ptr dll-node__ptr--right">next</span>
              </div>
            </div>
          `;
        }).join('');

        const chainHtml = `
          <span class="dll-sentinel">HEAD</span>
          ${step.nodes.length > 0 ? itemsHtml : ''}
          <span class="dll-arrow">⇄</span>
          <span class="dll-sentinel">TAIL</span>
        `;

        const chipsHtml = step.ops.map((op, idx) => {
          let cls = '';
          if (idx < step.opIdx) cls = 'op-chip--done';
          else if (idx === step.opIdx) cls = 'op-chip--current';
          return `<span class="op-chip ${cls}">${op.label}</span>`;
        }).join('');

        canvasEl.innerHTML = `
          <div class="dll-chain">${chainHtml}</div>
          <div class="ops-chips">${chipsHtml}</div>
        `;
        infoEl.innerHTML = step.description;
      }

      const engine = new VisualizerEngine({
        render: renderStep,
        highlightCode: highlightCodeLine,
        defaultSpeed: 650,
      });

      function buildSteps(ops) {
        engine.reset();
        const nodes = [];
        let lastOutput = 'None';

        const snap = (extra) => {
          engine.recordStep({
            nodes: [...nodes],
            ops,
            opIdx: extra.opIdx ?? -1,
            opLabel: extra.opLabel ?? 'Ready',
            output: extra.output ?? lastOutput,
            currIdx: extra.currIdx ?? -1,
            insertIdx: extra.insertIdx ?? -1,
            unlinkIdx: extra.unlinkIdx ?? -1,
            description: extra.description,
            codeLine: extra.codeLine,
          });
        };

        snap({
          opLabel: 'Initialize',
          description: 'Created sentinel <strong>HEAD</strong> and <strong>TAIL</strong> nodes wired directly to each other (<code>head.next = tail</code>, <code>tail.prev = head</code>).',
          codeLine: 3,
        });

        ops.forEach((op, idx) => {
          if (op.type === 'PUSH_FRONT') {
            nodes.unshift(op.value);
            lastOutput = `front=${op.value}`;
            snap({
              opIdx: idx,
              opLabel: op.label,
              insertIdx: 0,
              description: `<strong>push_front(${op.value})</strong> splices <strong>${op.value}</strong> between <code>head</code> and <code>head.next</code> in <strong>O(1)</strong>.`,
              codeLine: 13,
            });
          } else if (op.type === 'PUSH_BACK') {
            nodes.push(op.value);
            lastOutput = `back=${op.value}`;
            snap({
              opIdx: idx,
              opLabel: op.label,
              insertIdx: nodes.length - 1,
              description: `<strong>push_back(${op.value})</strong> splices <strong>${op.value}</strong> between <code>tail.prev</code> and <code>tail</code> in <strong>O(1)</strong> (no traversal needed!).`,
              codeLine: 15,
            });
          } else if (op.type === 'POP_FRONT') {
            if (nodes.length === 0) {
              lastOutput = 'None';
              snap({
                opIdx: idx,
                opLabel: 'POP_FRONT (empty)',
                description: '⚠️ List is empty (<code>head.next == tail</code>); nothing to unlink.',
                codeLine: 8,
              });
            } else {
              snap({
                opIdx: idx,
                opLabel: op.label,
                unlinkIdx: 0,
                description: `About to unlink front node <strong>${nodes[0]}</strong>: wiring <code>head.next = node.next</code> and <code>node.next.prev = head</code>.`,
                codeLine: 9,
              });
              const val = nodes.shift();
              lastOutput = String(val);
              snap({
                opIdx: idx,
                opLabel: `POP_FRONT → ${val}`,
                description: `Unlinked <strong>${val}</strong> from the front in <strong>O(1)</strong>.`,
                codeLine: 11,
              });
            }
          } else if (op.type === 'POP_BACK') {
            if (nodes.length === 0) {
              lastOutput = 'None';
              snap({
                opIdx: idx,
                opLabel: 'POP_BACK (empty)',
                description: '⚠️ List is empty (<code>tail.prev == head</code>); nothing to unlink.',
                codeLine: 8,
              });
            } else {
              const lastIdx = nodes.length - 1;
              snap({
                opIdx: idx,
                opLabel: op.label,
                unlinkIdx: lastIdx,
                description: `About to unlink back node <strong>${nodes[lastIdx]}</strong> directly via <code>tail.prev</code> in <strong>O(1)</strong>.`,
                codeLine: 10,
              });
              const val = nodes.pop();
              lastOutput = String(val);
              snap({
                opIdx: idx,
                opLabel: `POP_BACK → ${val}`,
                description: `Unlinked <strong>${val}</strong> from the back without walking the whole list.`,
                codeLine: 11,
              });
            }
          } else if (op.type === 'REMOVE') {
            let foundAt = -1;
            for (let i = 0; i < nodes.length; i++) {
              const match = nodes[i] === op.value;
              if (match) {
                foundAt = i;
                break;
              }
              snap({
                opIdx: idx,
                opLabel: op.label,
                currIdx: i,
                description: `Scanning for <strong>${op.value}</strong>: <code>curr.val = ${nodes[i]}</code> ≠ <strong>${op.value}</strong>.`,
                codeLine: 8,
              });
            }
            if (foundAt !== -1) {
              snap({
                opIdx: idx,
                opLabel: op.label,
                unlinkIdx: foundAt,
                description: `Found <strong>${op.value}</strong>! Unlinking directly using <code>node.prev.next = node.next</code> and <code>node.next.prev = node.prev</code>.`,
                codeLine: 9,
              });
              nodes.splice(foundAt, 1);
              lastOutput = `removed ${op.value}`;
              snap({
                opIdx: idx,
                opLabel: `${op.label} → True`,
                description: `Unlinked <strong>${op.value}</strong> and connected its neighbors directly.`,
                codeLine: 11,
              });
            } else {
              lastOutput = 'Not found';
              snap({
                opIdx: idx,
                opLabel: `${op.label} → False`,
                description: `Reached <code>TAIL</code> sentinel without finding <strong>${op.value}</strong>.`,
                codeLine: 11,
              });
            }
          }
        });

        engine.goToStep(0);
      }

      renderCodePanel();
      engine.bindControls();

      document.getElementById('btn-apply').addEventListener('click', () => {
        const ops = parseOperations(opsInputEl.value);
        opsInputEl.value = ops.map((o) => o.label).join(', ');
        buildSteps(ops);
        engine.play();
      });

      document.getElementById('btn-random').addEventListener('click', () => {
        const vals = [];
        const seq = [];
        for (let i = 0; i < 6; i++) {
          if (vals.length < 2 || Math.random() < 0.6) {
            const v = Math.floor(Math.random() * 89) + 10;
            if (Math.random() < 0.5) {
              seq.push(`PUSH_FRONT ${v}`);
              vals.unshift(v);
            } else {
              seq.push(`PUSH_BACK ${v}`);
              vals.push(v);
            }
          } else {
            const r = Math.random();
            if (r < 0.35) {
              seq.push('POP_FRONT');
              vals.shift();
            } else if (r < 0.7) {
              seq.push('POP_BACK');
              vals.pop();
            } else {
              const target = vals.splice(Math.floor(Math.random() * vals.length), 1)[0];
              seq.push(`REMOVE ${target}`);
            }
          }
        }
        opsInputEl.value = seq.join(', ');
        buildSteps(parseOperations(opsInputEl.value));
      });

      document.querySelectorAll('[data-ops]').forEach((btn) => {
        btn.addEventListener('click', () => {
          opsInputEl.value = btn.dataset.ops;
          buildSteps(parseOperations(opsInputEl.value));
        });
      });

      buildSteps(parseOperations(opsInputEl.value));
    </script>
  </body>
</html>
