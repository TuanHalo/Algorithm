<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Singly Linked List Visualizer</title>
    <link rel="stylesheet" href="../shared/clay-visualizer.css" />
    <style>
      .vis-presets {
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 0.75rem;
      }

      .vis-preset-label {
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      .vis-status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
        font-family: var(--font-code);
        font-size: 0.78rem;
        color: var(--text-secondary);
      }

      .vis-status-group {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }

      .vis-pill {
        background: var(--bg-card);
        border: var(--border-clay);
        box-shadow: var(--shadow-clay-subtle);
        border-radius: 999px;
        padding: 0.25rem 0.75rem;
      }

      .vis-pill--accent {
        background: rgba(240, 182, 208, 0.45);
        font-weight: 600;
        color: var(--text-primary);
      }

      .vis-canvas {
        flex-direction: column;
        align-items: stretch;
        justify-content: center;
        gap: 0.9rem;
        min-height: 205px;
        padding: 1.4rem 1.25rem;
      }

      .ll-chain {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 0.45rem;
        padding: 1.8rem 0.75rem 1.4rem;
        border-radius: var(--border-radius-sm);
        background: rgba(255, 255, 255, 0.38);
        box-shadow: var(--shadow-clay-pressed);
        min-height: 112px;
      }

      .ll-node-wrap {
        position: relative;
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }

      .ll-badges {
        position: absolute;
        top: -24px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 3px;
        white-space: nowrap;
      }

      .ll-badge {
        font-family: var(--font-code);
        font-size: 0.6rem;
        font-weight: 700;
        padding: 2px 6px;
        border-radius: 5px;
        box-shadow: var(--shadow-clay-subtle);
      }

      .ll-badge--head { background: #f0b6d0; color: #521836; }
      .ll-badge--curr { background: #ffc8a2; color: #5c2d0c; }
      .ll-badge--prev { background: #a8d8ea; color: #0c4a6e; }

      .ll-node {
        display: flex;
        align-items: stretch;
        border-radius: var(--border-radius-sm);
        background: var(--vis-default);
        border: var(--border-clay);
        box-shadow: var(--shadow-clay-subtle);
        overflow: hidden;
        transition: all 240ms ease;
      }

      .ll-node__val {
        padding: 0.5rem 0.75rem;
        font-family: var(--font-code);
        font-size: 0.92rem;
        font-weight: 700;
        color: var(--text-primary);
      }

      .ll-node__ptr {
        padding: 0.5rem 0.45rem;
        background: rgba(255, 255, 255, 0.42);
        border-left: 1px solid rgba(90, 90, 90, 0.15);
        font-family: var(--font-code);
        font-size: 0.7rem;
        color: var(--text-muted);
        display: flex;
        align-items: center;
      }

      .ll-node--insert {
        background: var(--vis-active);
        transform: translateY(-4px) scale(1.04);
        box-shadow: var(--shadow-clay);
      }

      .ll-node--scan {
        background: var(--vis-comparing);
        transform: translateY(-3px);
      }

      .ll-node--delete {
        background: var(--vis-swapping);
        transform: translateY(-4px);
      }

      .ll-node--found {
        background: var(--vis-sorted);
        transform: translateY(-4px) scale(1.04);
        box-shadow: var(--shadow-clay);
      }

      .ll-arrow {
        font-family: var(--font-code);
        font-size: 1rem;
        font-weight: 700;
        color: var(--text-secondary);
      }

      .ll-null {
        font-family: var(--font-code);
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--text-muted);
        padding: 0.35rem 0.65rem;
        border-radius: var(--border-radius-xs);
        border: 1px dashed rgba(90, 90, 90, 0.3);
        background: rgba(255, 255, 255, 0.45);
      }

      .ops-chips {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.35rem;
      }

      .op-chip {
        font-family: var(--font-code);
        font-size: 0.72rem;
        padding: 0.22rem 0.5rem;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.55);
        border: var(--border-clay);
        color: var(--text-secondary);
      }

      .op-chip--done { opacity: 0.45; }

      .op-chip--current {
        background: #f0b6d0;
        color: #521836;
        font-weight: 700;
        box-shadow: var(--shadow-clay-subtle);
      }
    </style>
  </head>
  <body>
    <div class="visualizer">
      <div class="vis-input">
        <input
          id="ops-input"
          class="vis-input__field"
          type="text"
          value="PREPEND 20, PREPEND 10, APPEND 30, INSERT 2 25, SEARCH 25, DELETE 20"
          placeholder="PREPEND 10, APPEND 30, INSERT 1 15, DELETE 10, SEARCH 30"
          aria-label="Singly linked list operations"
        />
        <button id="btn-apply" class="vis-btn vis-btn--primary" type="button">▶ Load &amp; Run</button>
        <button id="btn-random" class="vis-btn" type="button">🎲 Random</button>
      </div>

      <div class="vis-presets">
        <span class="vis-preset-label">Try presets:</span>
        <button class="vis-btn" type="button" data-ops="PREPEND 20, PREPEND 10, APPEND 30, INSERT 2 25, SEARCH 25, DELETE 20">Core Operations</button>
        <button class="vis-btn" type="button" data-ops="APPEND 5, APPEND 12, APPEND 19, PREPEND 1, INSERT 0 0">Head &amp; Tail Mix</button>
        <button class="vis-btn" type="button" data-ops="APPEND 10, APPEND 20, DELETE 10, DELETE 20, DELETE 99">Delete &amp; Empty</button>
        <button class="vis-btn" type="button" data-ops="APPEND 7, APPEND 14, APPEND 21, SEARCH 14, SEARCH 99">Search Hit &amp; Miss</button>
      </div>

      <div class="vis-controls">
        <button class="vis-btn vis-btn-reset" type="button" title="Jump to start">⏮ Reset</button>
        <button class="vis-btn vis-btn-step-back" type="button" title="Previous step">◀ Back</button>
        <button class="vis-btn vis-btn--primary vis-btn-play" type="button" title="Play animation">▶ Play</button>
        <button class="vis-btn vis-btn--primary vis-btn-pause" type="button" title="Pause animation" style="display: none;">⏸ Pause</button>
        <button class="vis-btn vis-btn-step-forward" type="button" title="Next step">Next ▶</button>
        <span class="vis-step-counter">No steps</span>
        <label class="vis-speed">
          <span>Speed</span>
          <input class="vis-speed-slider" type="range" min="1" max="10" value="6" />
        </label>
      </div>

      <div class="vis-legend">
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-active);"></span> Inserted</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-comparing);"></span> Traversing</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-swapping);"></span> Deleting / Miss</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-sorted);"></span> Found Match</span>
      </div>

      <div class="vis-status-bar">
        <span id="status-op" class="vis-pill vis-pill--accent">Operation: Ready</span>
        <div class="vis-status-group">
          <span id="status-len" class="vis-pill">Length: 0</span>
          <span id="status-result" class="vis-pill">Result: None</span>
        </div>
      </div>

      <div id="vis-canvas" class="vis-canvas" aria-live="polite"></div>

      <div id="vis-info" class="vis-info" style="margin-bottom: 1rem;">
        Enter singly linked list operations above and press <strong>Play</strong> or <strong>Next</strong>.
      </div>

      <div class="vis-code" id="vis-code"></div>
    </div>

    <script src="../shared/visualizer-base.js"></script>
    <script>
      const PYTHON_LINES = [
        'class ListNode:',
        '    def __init__(self, val: int, next: "ListNode | None" = None) -> None:',
        '        self.val = val',
        '        self.next = next',
        'class SinglyLinkedList:',
        '    def prepend(self, val: int) -> None:',
        '        self.head = ListNode(val, self.head)',
        '    def append(self, val: int) -> None:',
        '        if not self.head: self.head = ListNode(val); return',
        '        curr = self.head',
        '        while curr.next: curr = curr.next',
        '        curr.next = ListNode(val)',
        '    def delete(self, val: int) -> bool:',
        '        if not self.head: return False',
        '        if self.head.val == val: self.head = self.head.next; return True',
        '        curr = self.head',
        '        while curr.next and curr.next.val != val: curr = curr.next',
        '        if not curr.next: return False',
        '        curr.next = curr.next.next; return True',
      ];

      const canvasEl = document.getElementById('vis-canvas');
      const infoEl = document.getElementById('vis-info');
      const codeEl = document.getElementById('vis-code');
      const opsInputEl = document.getElementById('ops-input');
      const statusOpEl = document.getElementById('status-op');
      const statusLenEl = document.getElementById('status-len');
      const statusResultEl = document.getElementById('status-result');

      function renderCodePanel() {
        codeEl.innerHTML = PYTHON_LINES.map((line, index) => (
          `<span class="vis-code__line" data-line="${index}"><span class="vis-code__line-number">${index + 1}</span>${line}</span>`
        )).join('');
      }

      function highlightCodeLine(lineIndex) {
        codeEl.querySelectorAll('.vis-code__line').forEach((el, idx) => {
          el.classList.toggle('vis-code__line--active', idx === lineIndex);
        });
      }

      function parseOperations(rawText) {
        const tokens = rawText.split(',').map((t) => t.trim()).filter(Boolean);
        const parsed = [];
        for (const token of tokens.slice(0, 12)) {
          const parts = token.split(/\s+/);
          const cmd = parts[0].toUpperCase();
          if ((cmd === 'PREPEND' || cmd === 'PUSH_FRONT') && Number.isFinite(Number(parts[1]))) {
            const v = Number(parts[1]);
            parsed.push({ type: 'PREPEND', value: v, label: `PREPEND ${v}` });
          } else if ((cmd === 'APPEND' || cmd === 'PUSH_BACK') && Number.isFinite(Number(parts[1]))) {
            const v = Number(parts[1]);
            parsed.push({ type: 'APPEND', value: v, label: `APPEND ${v}` });
          } else if (cmd === 'INSERT' && Number.isFinite(Number(parts[1])) && Number.isFinite(Number(parts[2]))) {
            const idx = Math.max(0, Math.trunc(Number(parts[1])));
            const v = Number(parts[2]);
            parsed.push({ type: 'INSERT', index: idx, value: v, label: `INSERT ${idx} ${v}` });
          } else if ((cmd === 'DELETE' || cmd === 'REMOVE') && Number.isFinite(Number(parts[1]))) {
            const v = Number(parts[1]);
            parsed.push({ type: 'DELETE', value: v, label: `DELETE ${v}` });
          } else if ((cmd === 'SEARCH' || cmd === 'FIND') && Number.isFinite(Number(parts[1]))) {
            const v = Number(parts[1]);
            parsed.push({ type: 'SEARCH', value: v, label: `SEARCH ${v}` });
          }
        }
        return parsed.length > 0
          ? parsed
          : [
              { type: 'PREPEND', value: 20, label: 'PREPEND 20' },
              { type: 'APPEND', value: 30, label: 'APPEND 30' },
              { type: 'SEARCH', value: 30, label: 'SEARCH 30' },
            ];
      }

      function renderStep(step) {
        statusOpEl.textContent = `Operation: ${step.opLabel}`;
        statusLenEl.textContent = `Length: ${step.nodes.length}`;
        statusResultEl.textContent = `Result: ${step.result}`;

        let chainHtml = '';
        if (step.nodes.length === 0) {
          chainHtml = '<span class="ll-badge ll-badge--head" style="margin-right: 0.4rem;">HEAD</span><span class="ll-null">None</span>';
        } else {
          chainHtml = step.nodes.map((val, idx) => {
            const badges = [];
            if (idx === 0) badges.push('<span class="ll-badge ll-badge--head">HEAD</span>');
            if (idx === step.prevIdx) badges.push('<span class="ll-badge ll-badge--prev">PREV</span>');
            if (idx === step.currIdx) badges.push('<span class="ll-badge ll-badge--curr">CURR</span>');

            let nodeCls = '';
            if (idx === step.insertIdx) nodeCls = 'll-node--insert';
            else if (idx === step.deleteIdx) nodeCls = 'll-node--delete';
            else if (idx === step.foundIdx) nodeCls = 'll-node--found';
            else if (idx === step.currIdx) nodeCls = 'll-node--scan';

            return `
              <div class="ll-node-wrap">
                ${badges.length > 0 ? `<div class="ll-badges">${badges.join('')}</div>` : ''}
                <div class="ll-node ${nodeCls}">
                  <span class="ll-node__val">${val}</span>
                  <span class="ll-node__ptr">next</span>
                </div>
                <span class="ll-arrow">→</span>
              </div>
            `;
          }).join('') + '<span class="ll-null">None</span>';
        }

        const chipsHtml = step.ops.map((op, idx) => {
          let cls = '';
          if (idx < step.opIdx) cls = 'op-chip--done';
          else if (idx === step.opIdx) cls = 'op-chip--current';
          return `<span class="op-chip ${cls}">${op.label}</span>`;
        }).join('');

        canvasEl.innerHTML = `
          <div class="ll-chain">${chainHtml}</div>
          <div class="ops-chips">${chipsHtml}</div>
        `;
        infoEl.innerHTML = step.description;
      }

      const engine = new VisualizerEngine({
        render: renderStep,
        highlightCode: highlightCodeLine,
        defaultSpeed: 650,
      });

      function buildSteps(ops) {
        engine.reset();
        const nodes = [];
        let lastResult = 'None';

        const snap = (extra) => {
          engine.recordStep({
            nodes: [...nodes],
            ops,
            opIdx: extra.opIdx ?? -1,
            opLabel: extra.opLabel ?? 'Ready',
            result: extra.result ?? lastResult,
            currIdx: extra.currIdx ?? -1,
            prevIdx: extra.prevIdx ?? -1,
            insertIdx: extra.insertIdx ?? -1,
            deleteIdx: extra.deleteIdx ?? -1,
            foundIdx: extra.foundIdx ?? -1,
            description: extra.description,
            codeLine: extra.codeLine,
          });
        };

        snap({
          opLabel: 'Initialize',
          description: 'Initialized an empty <strong>Singly Linked List</strong> with <code>head = None</code>.',
          codeLine: 4,
        });

        ops.forEach((op, idx) => {
          if (op.type === 'PREPEND') {
            nodes.unshift(op.value);
            lastResult = `head=${op.value}`;
            snap({
              opIdx: idx,
              opLabel: op.label,
              insertIdx: 0,
              description: `<strong>prepend(${op.value})</strong> links new node to old <code>head</code> and updates <code>head</code> in <strong>O(1)</strong>.`,
              codeLine: 6,
            });
          } else if (op.type === 'APPEND') {
            if (nodes.length === 0) {
              nodes.push(op.value);
              lastResult = `head=${op.value}`;
              snap({
                opIdx: idx,
                opLabel: op.label,
                insertIdx: 0,
                description: `List was empty, so <strong>append(${op.value})</strong> sets <code>self.head = ListNode(${op.value})</code>.`,
                codeLine: 8,
              });
            } else {
              for (let i = 0; i < nodes.length; i++) {
                snap({
                  opIdx: idx,
                  opLabel: op.label,
                  currIdx: i,
                  description: i < nodes.length - 1
                    ? `Walking <code>curr</code> to tail: at node <strong>${nodes[i]}</strong>, <code>curr.next</code> is not None.`
                    : `Reached tail node <strong>${nodes[i]}</strong> where <code>curr.next == None</code>.`,
                  codeLine: i < nodes.length - 1 ? 10 : 9,
                });
              }
              nodes.push(op.value);
              lastResult = `tail=${op.value}`;
              snap({
                opIdx: idx,
                opLabel: op.label,
                insertIdx: nodes.length - 1,
                description: `Attached new node <strong>${op.value}</strong> to <code>curr.next</code>.`,
                codeLine: 11,
              });
            }
          } else if (op.type === 'INSERT') {
            const targetIdx = Math.min(op.index, nodes.length);
            if (targetIdx === 0) {
              nodes.unshift(op.value);
              lastResult = `inserted@${targetIdx}`;
              snap({
                opIdx: idx,
                opLabel: op.label,
                insertIdx: 0,
                description: `Index is <code>0</code>, so <strong>insert(0, ${op.value})</strong> updates <code>head</code> directly in <strong>O(1)</strong>.`,
                codeLine: 6,
              });
            } else {
              for (let i = 0; i < targetIdx; i++) {
                snap({
                  opIdx: idx,
                  opLabel: op.label,
                  currIdx: i,
                  description: `Stepping <code>curr</code> to predecessor index <code>${targetIdx - 1}</code> (currently at <code>${i}</code>: <strong>${nodes[i]}</strong>).`,
                  codeLine: 10,
                });
              }
              nodes.splice(targetIdx, 0, op.value);
              lastResult = `inserted@${targetIdx}`;
              snap({
                opIdx: idx,
                opLabel: op.label,
                prevIdx: targetIdx - 1,
                insertIdx: targetIdx,
                description: `Spliced <strong>${op.value}</strong> after index <code>${targetIdx - 1}</code>: <code>node.next = prev.next; prev.next = node</code>.`,
                codeLine: 11,
              });
            }
          } else if (op.type === 'DELETE') {
            if (nodes.length === 0) {
              lastResult = 'False (empty)';
              snap({
                opIdx: idx,
                opLabel: op.label,
                description: `List is empty, so <strong>delete(${op.value})</strong> returns <strong>False</strong>.`,
                codeLine: 13,
              });
            } else if (nodes[0] === op.value) {
              snap({
                opIdx: idx,
                opLabel: op.label,
                deleteIdx: 0,
                description: `<code>head.val == ${op.value}</code>! Moving <code>self.head = self.head.next</code>.`,
                codeLine: 14,
              });
              nodes.shift();
              lastResult = 'True';
              snap({
                opIdx: idx,
                opLabel: `${op.label} → True`,
                description: `Removed head node <strong>${op.value}</strong>.`,
                codeLine: 14,
              });
            } else {
              let foundAt = -1;
              for (let i = 0; i < nodes.length - 1; i++) {
                snap({
                  opIdx: idx,
                  opLabel: op.label,
                  currIdx: i,
                  description: `Checking <code>curr.next.val</code> after <strong>${nodes[i]}</strong> (next is <strong>${nodes[i + 1]}</strong>).`,
                  codeLine: 16,
                });
                if (nodes[i + 1] === op.value) {
                  foundAt = i + 1;
                  break;
                }
              }
              if (foundAt !== -1) {
                snap({
                  opIdx: idx,
                  opLabel: op.label,
                  currIdx: foundAt - 1,
                  deleteIdx: foundAt,
                  description: `Found <strong>${op.value}</strong> at <code>curr.next</code>; bypassing it with <code>curr.next = curr.next.next</code>.`,
                  codeLine: 18,
                });
                nodes.splice(foundAt, 1);
                lastResult = 'True';
                snap({
                  opIdx: idx,
                  opLabel: `${op.label} → True`,
                  description: `Deleted <strong>${op.value}</strong> and linked its neighbors.`,
                  codeLine: 18,
                });
              } else {
                lastResult = 'False';
                snap({
                  opIdx: idx,
                  opLabel: `${op.label} → False`,
                  description: `Reached end of list without finding <strong>${op.value}</strong>, so it returns <strong>False</strong>.`,
                  codeLine: 17,
                });
              }
            }
          } else if (op.type === 'SEARCH') {
            let matchIdx = -1;
            for (let i = 0; i < nodes.length; i++) {
              const hit = nodes[i] === op.value;
              if (hit) matchIdx = i;
              snap({
                opIdx: idx,
                opLabel: op.label,
                currIdx: hit ? -1 : i,
                foundIdx: hit ? i : -1,
                result: hit ? `index ${i}` : lastResult,
                description: hit
                  ? `Match! Found <strong>${op.value}</strong> at index <code>${i}</code>.`
                  : `Inspecting node <strong>${nodes[i]}</strong> ≠ <strong>${op.value}</strong>; advancing <code>curr = curr.next</code>.`,
                codeLine: 16,
              });
              if (hit) break;
            }
            if (matchIdx === -1) {
              lastResult = 'Not found';
              snap({
                opIdx: idx,
                opLabel: `${op.label} → None`,
                description: `Traversal hit <code>None</code>; <strong>${op.value}</strong> is not in the list.`,
                codeLine: 17,
              });
            } else {
              lastResult = `index ${matchIdx}`;
            }
          }
        });

        engine.goToStep(0);
      }

      renderCodePanel();
      engine.bindControls();

      document.getElementById('btn-apply').addEventListener('click', () => {
        const ops = parseOperations(opsInputEl.value);
        opsInputEl.value = ops.map((o) => o.label).join(', ');
        buildSteps(ops);
        engine.play();
      });

      document.getElementById('btn-random').addEventListener('click', () => {
        const vals = [];
        const seq = [];
        for (let i = 0; i < 6; i++) {
          if (vals.length < 2 || Math.random() < 0.65) {
            const v = Math.floor(Math.random() * 89) + 10;
            if (Math.random() < 0.4) {
              seq.push(`PREPEND ${v}`);
              vals.unshift(v);
            } else {
              seq.push(`APPEND ${v}`);
              vals.push(v);
            }
          } else if (Math.random() < 0.5 && vals.length > 0) {
            const pick = vals[Math.floor(Math.random() * vals.length)];
            seq.push(`SEARCH ${pick}`);
          } else {
            const idx = Math.floor(Math.random() * vals.length);
            const target = vals.splice(idx, 1)[0];
            seq.push(`DELETE ${target}`);
          }
        }
        opsInputEl.value = seq.join(', ');
        buildSteps(parseOperations(opsInputEl.value));
      });

      document.querySelectorAll('[data-ops]').forEach((btn) => {
        btn.addEventListener('click', () => {
          opsInputEl.value = btn.dataset.ops;
          buildSteps(parseOperations(opsInputEl.value));
        });
      });

      buildSteps(parseOperations(opsInputEl.value));
    </script>
  </body>
</html>
