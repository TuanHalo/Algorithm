<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>0/1 Knapsack DP Visualizer</title>
    <link rel="stylesheet" href="../shared/clay-visualizer.css" />
    <link rel="stylesheet" href="../shared/dp-canvas.css" />
  </head>
  <body>
    <div class="visualizer">
      <div class="vis-input">
        <span class="vis-input__label">Weights:</span>
        <input type="text" id="weightsInput" class="vis-input__field" value="2, 3, 4" aria-label="Item weights" />
        <span class="vis-input__label">Values:</span>
        <input type="text" id="valuesInput" class="vis-input__field" value="3, 4, 5" aria-label="Item values" />
        <span class="vis-input__label">Cap:</span>
        <input type="number" id="capInput" class="vis-input__field vis-input__num" min="1" max="10" value="5" aria-label="Knapsack capacity" />
        <button id="btnRun" class="vis-btn vis-btn--primary" type="button">Pack Bag</button>
      </div>

      <div class="dp-presets">
        <span class="dp-preset-label">Presets:</span>
        <button class="vis-btn" type="button" data-w="2, 3, 4" data-v="3, 4, 5" data-c="5">Classic (Cap 5)</button>
        <button class="vis-btn" type="button" data-w="1, 3, 4, 5" data-v="1, 4, 5, 7" data-c="7">4 Items (Cap 7)</button>
        <button class="vis-btn" type="button" data-w="2, 2, 3" data-v="6, 10, 12" data-c="5">Greedy Trap (Cap 5)</button>
      </div>

      <div class="vis-controls">
        <button class="vis-btn vis-btn-reset" type="button">Reset</button>
        <button class="vis-btn vis-btn-step-back" type="button">Back</button>
        <button class="vis-btn vis-btn--primary vis-btn-play" type="button">Play</button>
        <button class="vis-btn vis-btn--primary vis-btn-pause" type="button" style="display: none;">Pause</button>
        <button class="vis-btn vis-btn-step-forward" type="button">Next</button>
        <span class="vis-step-counter">No steps</span>
        <label class="vis-speed"><span>Speed</span><input class="vis-speed-slider" type="range" min="1" max="10" value="7" /></label>
      </div>

      <div class="dp-status-bar">
        <div class="dp-status-group">
          <span id="pillItem" class="dp-pill dp-pill--accent">Item: -</span>
        </div>
        <span id="pillAns" class="dp-pill dp-pill--answer">Max Value: -</span>
      </div>

      <div class="vis-canvas dp-canvas">
        <div id="formulaBar" class="dp-formula-bar">dp[i][w] = max(skip: dp[i-1][w], take: val + dp[i-1][w - wt])</div>
        <div id="gridArea"></div>
      </div>

      <div class="vis-legend">
        <div class="vis-legend__item"><span class="vis-legend__dot" style="background: #ffc8a2;"></span>Active (i, w)</div>
        <div class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-sorted);"></span>Skip / Take Sources</div>
        <div class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-active);"></span>Written</div>
        <div class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-pivot);"></span>Traceback Path</div>
      </div>

      <div id="visInfo" class="vis-info" style="margin-bottom: 1rem;">For each item and capacity, decide whether skipping or packing it yields higher value.</div>
      <div id="visCode" class="vis-code"></div>
    </div>

    <script src="../shared/visualizer-base.js"></script>
    <script src="../shared/dp-canvas.js"></script>
    <script>
      const PYTHON_LINES = [
        'def knapsack_01(weights: list[int], values: list[int], cap: int) -> int:',
        '    n = len(weights)',
        '    dp = [[0] * (cap + 1) for _ in range(n + 1)]',
        '    for i in range(1, n + 1):',
        '        wt, val = weights[i - 1], values[i - 1]',
        '        for w in range(cap + 1):',
        '            dp[i][w] = dp[i - 1][w]  # Skip item i - 1',
        '            if w >= wt:',
        '                dp[i][w] = max(dp[i][w], val + dp[i - 1][w - wt])',
        '    return dp[n][cap]',
      ];

      const weightsInput = document.getElementById('weightsInput');
      const valuesInput = document.getElementById('valuesInput');
      const capInput = document.getElementById('capInput');
      const pillItem = document.getElementById('pillItem');
      const pillAns = document.getElementById('pillAns');
      const formulaBar = document.getElementById('formulaBar');
      const gridArea = document.getElementById('gridArea');
      const visInfo = document.getElementById('visInfo');
      const visCode = document.getElementById('visCode');

      const viz = new VisualizerEngine({
        defaultSpeed: 420,
        render: (step) => {
          pillItem.textContent = step.itemLabel;
          pillAns.textContent = step.ansLabel;
          formulaBar.textContent = step.formula;
          visInfo.textContent = step.description;

          DPCanvas.render2D(gridArea, {
            title: 'DP Value Matrix (rows = items, cols = capacity w)',
            matrix: step.grid,
            rowHeaders: step.rowHeaders,
            colHeaders: step.colHeaders,
            cornerLabel: 'item\\w',
            active: step.active || [],
            deps: step.deps || [],
            updated: step.updated || [],
            path: step.path || [],
          });
        },
        highlightCode: (line) => DPCanvas.renderCode(visCode, PYTHON_LINES, line),
      });
      viz.bindControls();

      function run() {
        const wRaw = weightsInput.value.split(/[,\s]+/).map((x) => parseInt(x, 10)).filter((x) => !Number.isNaN(x) && x > 0);
        const vRaw = valuesInput.value.split(/[,\s]+/).map((x) => parseInt(x, 10)).filter((x) => !Number.isNaN(x) && x >= 0);
        const len = Math.max(1, Math.min(5, Math.min(wRaw.length, vRaw.length)));
        const weights = len ? wRaw.slice(0, len) : [2, 3, 4];
        const values = len ? vRaw.slice(0, len) : [3, 4, 5];
        weightsInput.value = weights.join(', ');
        valuesInput.value = values.join(', ');

        let cap = parseInt(capInput.value, 10) || 5;
        cap = Math.max(1, Math.min(10, cap));
        capInput.value = String(cap);

        const n = weights.length;
        const rowHeaders = ['0 items', ...weights.map((wt, i) => `#${i + 1} (w=${wt}, v=${values[i]})`)];
        const colHeaders = Array.from({ length: cap + 1 }, (_, w) => String(w));
        const clone = (g) => g.map((r) => [...r]);

        viz.reset();
        const grid = Array.from({ length: n + 1 }, () => Array(cap + 1).fill(null));
        for (let w = 0; w <= cap; w++) grid[0][w] = 0;

        viz.recordStep({
          grid: clone(grid),
          rowHeaders,
          colHeaders,
          itemLabel: 'Init row 0',
          ansLabel: 'Max Value: ...',
          formula: 'Base case: 0 items -> value 0 for all capacities',
          description: 'With zero items available, maximum value at every capacity is 0.',
          codeLine: 2,
          updated: colHeaders.map((_, w) => [0, w]),
        });

        for (let i = 1; i <= n; i++) {
          const wt = weights[i - 1];
          const val = values[i - 1];
          for (let w = 0; w <= cap; w++) {
            const skip = grid[i - 1][w];
            const canTake = w >= wt;
            const take = canTake ? val + grid[i - 1][w - wt] : -1;
            const deps = canTake ? [[i - 1, w], [i - 1, w - wt]] : [[i - 1, w]];

            viz.recordStep({
              grid: clone(grid),
              rowHeaders,
              colHeaders,
              itemLabel: `Item #${i} (w=${wt}, v=${val})`,
              ansLabel: 'Max Value: ...',
              formula: canTake
                ? `w=${w}: max(skip=${skip}, take=${val} + dp[${i - 1}][${w - wt}]=${grid[i - 1][w - wt]} -> ${take})`
                : `w=${w} < wt=${wt}: must skip -> ${skip}`,
              description: canTake
                ? `At capacity ${w}, compare skipping (${skip}) vs. taking item #${i} (${take}).`
                : `Item #${i} weighs ${wt} > ${w}, so copy skip value ${skip}.`,
              codeLine: canTake ? 8 : 6,
              active: [[i, w]],
              deps,
            });

            grid[i][w] = canTake ? Math.max(skip, take) : skip;
            viz.recordStep({
              grid: clone(grid),
              rowHeaders,
              colHeaders,
              itemLabel: `Item #${i} (w=${wt}, v=${val})`,
              ansLabel: i === n && w === cap ? `Max Value: ${grid[n][cap]}` : 'Max Value: ...',
              formula: `dp[${i}][${w}] = ${grid[i][w]}`,
              description: `Write dp[${i}][${w}] = ${grid[i][w]}.`,
              codeLine: canTake ? 8 : 6,
              updated: [[i, w]],
              deps,
            });
          }
        }

        // Traceback chosen items
        const path = [];
        const picked = [];
        let w = cap;
        for (let i = n; i >= 1; i--) {
          path.push([i, w]);
          if (grid[i][w] !== grid[i - 1][w]) {
            picked.push(`#${i}`);
            w -= weights[i - 1];
          }
        }
        path.push([0, w]);
        picked.reverse();

        viz.recordStep({
          grid: clone(grid),
          rowHeaders,
          colHeaders,
          itemLabel: `Picked: [${picked.join(', ') || 'none'}]`,
          ansLabel: `Max Value: ${grid[n][cap]}`,
          formula: `Optimal value = dp[${n}][${cap}] = ${grid[n][cap]} (items ${picked.join(', ') || 'none'})`,
          description: `Done! Maximum value is ${grid[n][cap]} by packing items ${picked.join(', ') || 'none'}.`,
          codeLine: 9,
          path,
        });

        viz.goToStep(0);
      }

      document.getElementById('btnRun').addEventListener('click', run);
      document.querySelectorAll('.dp-presets [data-w]').forEach((btn) => {
        btn.addEventListener('click', () => {
          weightsInput.value = btn.dataset.w;
          valuesInput.value = btn.dataset.v;
          capInput.value = btn.dataset.c;
          run();
        });
      });

      run();
    </script>
  </body>
</html>
