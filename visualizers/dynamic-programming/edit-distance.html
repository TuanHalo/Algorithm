<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Distance (Levenshtein) Visualizer</title>
    <link rel="stylesheet" href="../shared/clay-visualizer.css" />
    <link rel="stylesheet" href="../shared/dp-canvas.css" />
  </head>
  <body>
    <div class="visualizer">
      <div class="vis-input">
        <span class="vis-input__label">Word 1:</span>
        <input type="text" id="w1Input" class="vis-input__field" value="horse" maxlength="7" aria-label="Source word" />
        <span class="vis-input__label">Word 2:</span>
        <input type="text" id="w2Input" class="vis-input__field" value="ros" maxlength="7" aria-label="Target word" />
        <button id="btnRun" class="vis-btn vis-btn--primary" type="button">Transform</button>
      </div>

      <div class="dp-presets">
        <span class="dp-preset-label">Presets:</span>
        <button class="vis-btn" type="button" data-w1="horse" data-w2="ros">horse -> ros (3)</button>
        <button class="vis-btn" type="button" data-w1="kitten" data-w2="sitting">kitten -> sitting (3)</button>
        <button class="vis-btn" type="button" data-w1="cat" data-w2="cut">cat -> cut (1)</button>
      </div>

      <div class="vis-controls">
        <button class="vis-btn vis-btn-reset" type="button">Reset</button>
        <button class="vis-btn vis-btn-step-back" type="button">Back</button>
        <button class="vis-btn vis-btn--primary vis-btn-play" type="button">Play</button>
        <button class="vis-btn vis-btn--primary vis-btn-pause" type="button" style="display: none;">Pause</button>
        <button class="vis-btn vis-btn-step-forward" type="button">Next</button>
        <span class="vis-step-counter">No steps</span>
        <label class="vis-speed"><span>Speed</span><input class="vis-speed-slider" type="range" min="1" max="10" value="7" /></label>
      </div>

      <div class="dp-status-bar">
        <div class="dp-status-group">
          <span id="pillOp" class="dp-pill dp-pill--accent">Check: -</span>
        </div>
        <span id="pillAns" class="dp-pill dp-pill--answer">Edit Distance: -</span>
      </div>

      <div class="vis-canvas dp-canvas">
        <div id="formulaBar" class="dp-formula-bar">match -> dp[i-1][j-1] | edit -> 1 + min(delete, insert, replace)</div>
        <div id="gridArea"></div>
      </div>

      <div class="vis-legend">
        <div class="vis-legend__item"><span class="vis-legend__dot" style="background: #ffc8a2;"></span>Active (i, j)</div>
        <div class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-sorted);"></span>Del / Ins / Rep Sources</div>
        <div class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-active);"></span>Written</div>
        <div class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-pivot);"></span>Optimal Edit Path</div>
      </div>

      <div id="visInfo" class="vis-info" style="margin-bottom: 1rem;">Top = delete, Left = insert, Diagonal = match or replace.</div>
      <div id="visCode" class="vis-code"></div>
    </div>

    <script src="../shared/visualizer-base.js"></script>
    <script src="../shared/dp-canvas.js"></script>
    <script>
      const PYTHON_LINES = [
        'def min_distance(word1: str, word2: str) -> int:',
        '    m, n = len(word1), len(word2)',
        '    dp = [[0] * (n + 1) for _ in range(m + 1)]',
        '    for i in range(m + 1): dp[i][0] = i',
        '    for j in range(n + 1): dp[0][j] = j',
        '    for i in range(1, m + 1):',
        '        for j in range(1, n + 1):',
        '            if word1[i - 1] == word2[j - 1]:',
        '                dp[i][j] = dp[i - 1][j - 1]',
        '            else:',
        '                dp[i][j] = 1 + min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1])',
        '    return dp[m][n]',
      ];

      const w1Input = document.getElementById('w1Input');
      const w2Input = document.getElementById('w2Input');
      const pillOp = document.getElementById('pillOp');
      const pillAns = document.getElementById('pillAns');
      const formulaBar = document.getElementById('formulaBar');
      const gridArea = document.getElementById('gridArea');
      const visInfo = document.getElementById('visInfo');
      const visCode = document.getElementById('visCode');

      const viz = new VisualizerEngine({
        defaultSpeed: 400,
        render: (step) => {
          pillOp.textContent = step.opLabel;
          pillAns.textContent = step.ansLabel;
          formulaBar.textContent = step.formula;
          visInfo.textContent = step.description;

          DPCanvas.render2D(gridArea, {
            title: 'Levenshtein Distance Matrix (dp[i][j])',
            matrix: step.grid,
            rowHeaders: step.rowHeaders,
            colHeaders: step.colHeaders,
            cornerLabel: 'w1\\w2',
            active: step.active || [],
            deps: step.deps || [],
            updated: step.updated || [],
            path: step.path || [],
          });
        },
        highlightCode: (line) => DPCanvas.renderCode(visCode, PYTHON_LINES, line),
      });
      viz.bindControls();

      function run() {
        const w1 = (w1Input.value.trim() || 'horse').slice(0, 7);
        const w2 = (w2Input.value.trim() || 'ros').slice(0, 7);
        w1Input.value = w1;
        w2Input.value = w2;

        const m = w1.length;
        const n = w2.length;
        const rowHeaders = ['""', ...w1.split('')];
        const colHeaders = ['""', ...w2.split('')];
        const clone = (g) => g.map((r) => [...r]);

        viz.reset();
        const grid = Array.from({ length: m + 1 }, () => Array(n + 1).fill(null));
        for (let i = 0; i <= m; i++) grid[i][0] = i;
        for (let j = 0; j <= n; j++) grid[0][j] = j;

        viz.recordStep({
          grid: clone(grid),
          rowHeaders,
          colHeaders,
          opLabel: 'Base Cases',
          ansLabel: 'Edit Distance: ...',
          formula: 'dp[i][0] = i deletes | dp[0][j] = j inserts',
          description: 'Turning a word into "" costs i deletions; turning "" into a word costs j insertions.',
          codeLine: 4,
          updated: [...Array(n + 1).keys()].map((j) => [0, j]).concat([...Array(m + 1).keys()].map((i) => [i, 0])),
        });

        for (let i = 1; i <= m; i++) {
          for (let j = 1; j <= n; j++) {
            const c1 = w1[i - 1];
            const c2 = w2[j - 1];
            const match = c1 === c2;

            const delCost = grid[i - 1][j];
            const insCost = grid[i][j - 1];
            const repCost = grid[i - 1][j - 1];

            viz.recordStep({
              grid: clone(grid),
              rowHeaders,
              colHeaders,
              opLabel: `'${c1}' -> '${c2}'`,
              ansLabel: 'Edit Distance: ...',
              formula: match
                ? `'${c1}' == '${c2}' -> free match! copy dp[${i - 1}][${j - 1}] = ${repCost}`
                : `1 + min(del=${delCost}, ins=${insCost}, rep=${repCost})`,
              description: match
                ? `'${c1}' already equals '${c2}', so 0 extra cost beyond dp[${i - 1}][${j - 1}].`
                : `Best of delete (${delCost}), insert (${insCost}), or replace (${repCost}), plus 1 edit.`,
              codeLine: match ? 8 : 10,
              active: [[i, j]],
              deps: match ? [[i - 1, j - 1]] : [[i - 1, j], [i, j - 1], [i - 1, j - 1]],
            });

            grid[i][j] = match ? repCost : 1 + Math.min(delCost, insCost, repCost);
            viz.recordStep({
              grid: clone(grid),
              rowHeaders,
              colHeaders,
              opLabel: `'${c1}' -> '${c2}'`,
              ansLabel: i === m && j === n ? `Edit Distance: ${grid[m][n]}` : 'Edit Distance: ...',
              formula: `dp[${i}][${j}] = ${grid[i][j]}`,
              description: `Set dp[${i}][${j}] = ${grid[i][j]}.`,
              codeLine: match ? 8 : 10,
              updated: [[i, j]],
              deps: match ? [[i - 1, j - 1]] : [[i - 1, j], [i, j - 1], [i - 1, j - 1]],
            });
          }
        }

        // Traceback edit path
        const path = [];
        let i = m;
        let j = n;
        while (i > 0 || j > 0) {
          path.push([i, j]);
          if (i > 0 && j > 0 && w1[i - 1] === w2[j - 1]) {
            i -= 1;
            j -= 1;
          } else if (i > 0 && j > 0 && grid[i][j] === 1 + grid[i - 1][j - 1]) {
            i -= 1;
            j -= 1;
          } else if (i > 0 && grid[i][j] === 1 + grid[i - 1][j]) {
            i -= 1;
          } else {
            j -= 1;
          }
        }
        path.push([0, 0]);

        viz.recordStep({
          grid: clone(grid),
          rowHeaders,
          colHeaders,
          opLabel: 'Complete',
          ansLabel: `Edit Distance: ${grid[m][n]}`,
          formula: `Minimum edits from "${w1}" to "${w2}" = ${grid[m][n]}`,
          description: `Done! Transforming "${w1}" into "${w2}" takes ${grid[m][n]} edit(s).`,
          codeLine: 11,
          path,
        });

        viz.goToStep(0);
      }

      document.getElementById('btnRun').addEventListener('click', run);
      document.querySelectorAll('.dp-presets [data-w1]').forEach((btn) => {
        btn.addEventListener('click', () => {
          w1Input.value = btn.dataset.w1;
          w2Input.value = btn.dataset.w2;
          run();
        });
      });

      run();
    </script>
  </body>
</html>
