<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Longest Increasing Subsequence (LIS) Visualizer</title>
    <link rel="stylesheet" href="../shared/clay-visualizer.css" />
    <link rel="stylesheet" href="../shared/dp-canvas.css" />
  </head>
  <body>
    <div class="visualizer">
      <div class="vis-input">
        <span class="vis-input__label">Array:</span>
        <input type="text" id="arrInput" class="vis-input__field" value="10, 9, 2, 5, 3, 7, 101, 18" placeholder="Comma-separated integers" aria-label="Input integer array" />
        <div class="dp-mode-toggle" role="group" aria-label="Algorithm variant">
          <button id="modeDP" class="vis-btn dp-mode-btn--active" type="button">O(n²) DP</button>
          <button id="modeTails" class="vis-btn" type="button">O(n log n) Tails</button>
        </div>
        <button id="btnRun" class="vis-btn vis-btn--primary" type="button">Run</button>
      </div>

      <div class="dp-presets">
        <span class="dp-preset-label">Presets:</span>
        <button class="vis-btn" type="button" data-arr="10, 9, 2, 5, 3, 7, 101, 18">Classic LeetCode</button>
        <button class="vis-btn" type="button" data-arr="0, 1, 0, 3, 2, 3">Tie-Breaker [0,1,0,3,2,3]</button>
        <button class="vis-btn" type="button" data-arr="7, 6, 5, 4">Strictly Decreasing</button>
      </div>

      <div class="vis-controls">
        <button class="vis-btn vis-btn-reset" type="button">Reset</button>
        <button class="vis-btn vis-btn-step-back" type="button">Back</button>
        <button class="vis-btn vis-btn--primary vis-btn-play" type="button">Play</button>
        <button class="vis-btn vis-btn--primary vis-btn-pause" type="button" style="display: none;">Pause</button>
        <button class="vis-btn vis-btn-step-forward" type="button">Next</button>
        <span class="vis-step-counter">No steps</span>
        <label class="vis-speed"><span>Speed</span><input class="vis-speed-slider" type="range" min="1" max="10" value="7" /></label>
      </div>

      <div class="dp-status-bar">
        <div class="dp-status-group">
          <span id="pillMode" class="dp-pill dp-pill--accent">Variant: O(n²) DP</span>
        </div>
        <span id="pillLen" class="dp-pill dp-pill--answer">LIS Length: -</span>
      </div>

      <div class="vis-canvas dp-canvas">
        <div id="formulaBar" class="dp-formula-bar">dp[i] = max(dp[i], dp[j] + 1) for j &lt; i if nums[j] &lt; nums[i]</div>
        <div id="numsArea"></div>
        <div id="auxArea"></div>
      </div>

      <div class="vis-legend">
        <div class="vis-legend__item"><span class="vis-legend__dot" style="background: #ffc8a2;"></span>Current i / num</div>
        <div class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-sorted);"></span>Candidate j / Search</div>
        <div class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-active);"></span>Updated</div>
        <div class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-pivot);"></span>LIS Path</div>
      </div>

      <div id="visInfo" class="vis-info" style="margin-bottom: 1rem;">Compare quadratic DP against O(n log n) patience tails with binary search.</div>
      <div id="visCode" class="vis-code"></div>
    </div>

    <script src="../shared/visualizer-base.js"></script>
    <script src="../shared/dp-canvas.js"></script>
    <script>
      const DP_CODE = [
        'def length_of_lis(nums: list[int]) -> int:',
        '    dp = [1] * len(nums)',
        '    for i in range(len(nums)):',
        '        for j in range(i):',
        '            if nums[j] < nums[i]:',
        '                dp[i] = max(dp[i], dp[j] + 1)',
        '    return max(dp, default=0)',
      ];

      const TAILS_CODE = [
        'from bisect import bisect_left',
        '',
        'def length_of_lis(nums: list[int]) -> int:',
        '    tails: list[int] = []',
        '    for num in nums:',
        '        idx = bisect_left(tails, num)',
        '        if idx == len(tails):',
        '            tails.append(num)',
        '        else:',
        '            tails[idx] = num  # Smaller tail leaves room for future numbers',
        '    return len(tails)',
      ];

      let mode = 'dp';
      const arrInput = document.getElementById('arrInput');
      const modeDPBtn = document.getElementById('modeDP');
      const modeTailsBtn = document.getElementById('modeTails');
      const pillMode = document.getElementById('pillMode');
      const pillLen = document.getElementById('pillLen');
      const formulaBar = document.getElementById('formulaBar');
      const numsArea = document.getElementById('numsArea');
      const auxArea = document.getElementById('auxArea');
      const visInfo = document.getElementById('visInfo');
      const visCode = document.getElementById('visCode');

      const viz = new VisualizerEngine({
        defaultSpeed: 500,
        render: (step) => {
          pillMode.textContent = mode === 'dp' ? 'Variant: O(n²) DP' : 'Variant: O(n log n) Tails';
          pillLen.textContent = `LIS Length: ${step.bestLen}`;
          formulaBar.textContent = step.formula;
          visInfo.textContent = step.description;

          DPCanvas.render1D(numsArea, {
            title: 'Input Sequence (nums[])',
            values: step.nums,
            labels: step.nums.map((_, i) => `[${i}]`),
            active: step.activeNum || [],
            deps: step.depNum || [],
            path: step.pathNum || [],
            tags: step.numTags || {},
          });

          DPCanvas.render1D(auxArea, {
            title: mode === 'dp' ? 'LIS Ending at i (dp[])' : 'Smallest Tail of Length k+1 (tails[])',
            values: step.aux,
            labels: mode === 'dp'
              ? step.aux.map((_, i) => `dp[${i}]`)
              : step.aux.map((_, i) => `len ${i + 1}`),
            active: step.activeAux || [],
            deps: step.depAux || [],
            updated: step.updatedAux || [],
            path: step.pathAux || [],
            tags: step.auxTags || {},
          });
        },
        highlightCode: (line) => DPCanvas.renderCode(visCode, mode === 'dp' ? DP_CODE : TAILS_CODE, line),
      });
      viz.bindControls();

      function buildDPSteps(nums) {
        const n = nums.length;
        const dp = Array(n).fill(1);
        const parent = Array(n).fill(-1);

        viz.recordStep({
          nums,
          aux: [...dp],
          bestLen: 1,
          formula: 'Initialize dp[i] = 1 (each element alone is an LIS of length 1)',
          description: 'Every single number starts as a subsequence of length 1.',
          codeLine: 1,
          updatedAux: dp.map((_, i) => i),
        });

        for (let i = 0; i < n; i++) {
          for (let j = 0; j < i; j++) {
            const canExtend = nums[j] < nums[i];
            viz.recordStep({
              nums,
              aux: [...dp],
              bestLen: Math.max(...dp),
              formula: `Compare nums[${j}]=${nums[j]} < nums[${i}]=${nums[i]} -> ${canExtend}`,
              description: canExtend
                ? `${nums[j]} < ${nums[i]}: can extend subsequence ending at index ${j} (len ${dp[j]} + 1).`
                : `${nums[j]} >= ${nums[i]}: cannot extend strictly increasing sequence.`,
              codeLine: 4,
              activeNum: [i],
              depNum: [j],
              activeAux: [i],
              depAux: [j],
              numTags: { [j]: 'j', [i]: 'i' },
            });

            if (canExtend && dp[j] + 1 > dp[i]) {
              dp[i] = dp[j] + 1;
              parent[i] = j;
              viz.recordStep({
                nums,
                aux: [...dp],
                bestLen: Math.max(...dp),
                formula: `dp[${i}] = dp[${j}] + 1 = ${dp[i]}`,
                description: `Updated dp[${i}] to ${dp[i]}!`,
                codeLine: 5,
                activeNum: [i],
                depNum: [j],
                updatedAux: [i],
                auxTags: { [i]: `best=${dp[i]}` },
              });
            }
          }
        }

        let bestIdx = 0;
        for (let i = 1; i < n; i++) {
          if (dp[i] > dp[bestIdx]) bestIdx = i;
        }
        const path = [];
        let cur = bestIdx;
        while (cur !== -1) {
          path.push(cur);
          cur = parent[cur];
        }
        path.reverse();

        viz.recordStep({
          nums,
          aux: [...dp],
          bestLen: dp[bestIdx],
          formula: `LIS = [${path.map((k) => nums[k]).join(', ')}] (length ${dp[bestIdx]})`,
          description: `Done! Longest Increasing Subsequence has length ${dp[bestIdx]}.`,
          codeLine: 6,
          pathNum: path,
          pathAux: [bestIdx],
        });
      }

      function buildTailsSteps(nums) {
        const tails = [];

        viz.recordStep({
          nums,
          aux: [],
          bestLen: 0,
          formula: 'tails = [] (tails[k] = smallest ending value for length k + 1)',
          description: 'Start with an empty tails array.',
          codeLine: 3,
        });

        nums.forEach((num, i) => {
          let lo = 0;
          let hi = tails.length;
          while (lo < hi) {
            const mid = (lo + hi) >> 1;
            if (tails[mid] < num) lo = mid + 1;
            else hi = mid;
          }
          const idx = lo;

          viz.recordStep({
            nums,
            aux: [...tails],
            bestLen: tails.length,
            formula: `bisect_left(tails, ${num}) -> idx = ${idx}`,
            description: `For num = ${num}, binary search finds insertion/replacement index ${idx}.`,
            codeLine: 5,
            activeNum: [i],
            depAux: idx < tails.length ? [idx] : [],
            numTags: { [i]: 'num' },
          });

          if (idx === tails.length) {
            tails.push(num);
            viz.recordStep({
              nums,
              aux: [...tails],
              bestLen: tails.length,
              formula: `Extend: tails.append(${num}) -> length ${tails.length}`,
              description: `${num} is larger than all tails, so LIS grows to length ${tails.length}.`,
              codeLine: 7,
              activeNum: [i],
              updatedAux: [idx],
              auxTags: { [idx]: 'append' },
            });
          } else {
            const old = tails[idx];
            tails[idx] = num;
            viz.recordStep({
              nums,
              aux: [...tails],
              bestLen: tails.length,
              formula: `Replace: tails[${idx}] = ${num} (was ${old})`,
              description: `Replace ${old} with smaller ${num} at tails[${idx}] to leave room for future elements.`,
              codeLine: 9,
              activeNum: [i],
              updatedAux: [idx],
              auxTags: { [idx]: `${old}->${num}` },
            });
          }
        });

        viz.recordStep({
          nums,
          aux: [...tails],
          bestLen: tails.length,
          formula: `Return len(tails) = ${tails.length}`,
          description: `Done! Maximum LIS length is ${tails.length} (note: tails stores lengths, not always the exact sequence).`,
          codeLine: 10,
          pathAux: tails.map((_, k) => k),
        });
      }

      function run() {
        const parsed = arrInput.value
          .split(/[,\s]+/)
          .map((x) => parseInt(x, 10))
          .filter((x) => !Number.isNaN(x))
          .slice(0, 10);
        const nums = parsed.length ? parsed : [10, 9, 2, 5, 3, 7, 101, 18];
        arrInput.value = nums.join(', ');

        viz.reset();
        if (mode === 'dp') buildDPSteps(nums);
        else buildTailsSteps(nums);
        viz.goToStep(0);
      }

      modeDPBtn.addEventListener('click', () => {
        mode = 'dp';
        modeDPBtn.classList.add('dp-mode-btn--active');
        modeTailsBtn.classList.remove('dp-mode-btn--active');
        run();
      });

      modeTailsBtn.addEventListener('click', () => {
        mode = 'tails';
        modeTailsBtn.classList.add('dp-mode-btn--active');
        modeDPBtn.classList.remove('dp-mode-btn--active');
        run();
      });

      document.getElementById('btnRun').addEventListener('click', run);
      document.querySelectorAll('.dp-presets [data-arr]').forEach((btn) => {
        btn.addEventListener('click', () => {
          arrInput.value = btn.dataset.arr;
          run();
        });
      });

      run();
    </script>
  </body>
</html>
