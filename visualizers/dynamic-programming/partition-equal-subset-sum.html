<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Partition Equal Subset Sum Visualizer</title>
    <link rel="stylesheet" href="../shared/clay-visualizer.css" />
    <link rel="stylesheet" href="../shared/dp-canvas.css" />
  </head>
  <body>
    <div class="visualizer">
      <div class="vis-input">
        <span class="vis-input__label">Numbers:</span>
        <input type="text" id="numsInput" class="vis-input__field" value="1, 5, 11, 5" placeholder="Positive integers" aria-label="Positive integers" />
        <button id="btnRun" class="vis-btn vis-btn--primary" type="button">Check Split</button>
      </div>

      <div class="dp-presets">
        <span class="dp-preset-label">Presets:</span>
        <button class="vis-btn" type="button" data-nums="1, 5, 11, 5">Can Split [1, 5, 11, 5]</button>
        <button class="vis-btn" type="button" data-nums="1, 2, 3, 5">Odd Sum [1, 2, 3, 5]</button>
        <button class="vis-btn" type="button" data-nums="2, 2, 3, 5">Even But False [2, 2, 3, 5]</button>
      </div>

      <div class="vis-controls">
        <button class="vis-btn vis-btn-reset" type="button">Reset</button>
        <button class="vis-btn vis-btn-step-back" type="button">Back</button>
        <button class="vis-btn vis-btn--primary vis-btn-play" type="button">Play</button>
        <button class="vis-btn vis-btn--primary vis-btn-pause" type="button" style="display: none;">Pause</button>
        <button class="vis-btn vis-btn-step-forward" type="button">Next</button>
        <span class="vis-step-counter">No steps</span>
        <label class="vis-speed"><span>Speed</span><input class="vis-speed-slider" type="range" min="1" max="10" value="7" /></label>
      </div>

      <div class="dp-status-bar">
        <div class="dp-status-group">
          <span id="pillInfo" class="dp-pill dp-pill--accent">Target: -</span>
        </div>
        <span id="pillAns" class="dp-pill dp-pill--answer">Result: -</span>
      </div>

      <div class="vis-canvas dp-canvas">
        <div id="formulaBar" class="dp-formula-bar">for s in range(target, num - 1, -1): dp[s] = dp[s] or dp[s - num]</div>
        <div id="numsArea"></div>
        <div id="dpArea"></div>
      </div>

      <div class="vis-legend">
        <div class="vis-legend__item"><span class="vis-legend__dot" style="background: #ffc8a2;"></span>Active Sum s</div>
        <div class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-sorted);"></span>Source dp[s - num]</div>
        <div class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-active);"></span>Newly Reachable (T)</div>
        <div class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-pivot);"></span>Target Reached</div>
      </div>

      <div id="visInfo" class="vis-info" style="margin-bottom: 1rem;">Loop backward from target down to num so each number is used at most once.</div>
      <div id="visCode" class="vis-code"></div>
    </div>

    <script src="../shared/visualizer-base.js"></script>
    <script src="../shared/dp-canvas.js"></script>
    <script>
      const PYTHON_LINES = [
        'def can_partition(nums: list[int]) -> bool:',
        '    total = sum(nums)',
        '    if total % 2 == 1:',
        '        return False',
        '    target = total // 2',
        '    dp = [True] + [False] * target',
        '    for num in nums:',
        '        for s in range(target, num - 1, -1):  # Reverse avoids reusing num',
        '            dp[s] = dp[s] or dp[s - num]',
        '    return dp[target]',
      ];

      const numsInput = document.getElementById('numsInput');
      const pillInfo = document.getElementById('pillInfo');
      const pillAns = document.getElementById('pillAns');
      const formulaBar = document.getElementById('formulaBar');
      const numsArea = document.getElementById('numsArea');
      const dpArea = document.getElementById('dpArea');
      const visInfo = document.getElementById('visInfo');
      const visCode = document.getElementById('visCode');

      const viz = new VisualizerEngine({
        defaultSpeed: 480,
        render: (step) => {
          pillInfo.textContent = step.infoLabel;
          pillAns.textContent = step.ansLabel;
          formulaBar.textContent = step.formula;
          visInfo.textContent = step.description;

          DPCanvas.render1D(numsArea, {
            title: 'Input Numbers (nums[])',
            values: step.nums,
            labels: step.nums.map((_, i) => `[${i}]`),
            active: step.activeNum !== null ? [step.activeNum] : [],
          });

          DPCanvas.render1D(dpArea, {
            title: 'Reachable Subset Sums (dp[0..target])',
            values: step.dp,
            labels: step.dp.map((_, s) => `s=${s}`),
            active: step.active || [],
            deps: step.deps || [],
            updated: step.updated || [],
            path: step.path || [],
            tags: step.tags || {},
          });
        },
        highlightCode: (line) => DPCanvas.renderCode(visCode, PYTHON_LINES, line),
      });
      viz.bindControls();

      function run() {
        const parsed = numsInput.value
          .split(/[,\s]+/)
          .map((x) => parseInt(x, 10))
          .filter((x) => !Number.isNaN(x) && x > 0)
          .slice(0, 7);
        const nums = parsed.length ? parsed : [1, 5, 11, 5];
        numsInput.value = nums.join(', ');

        const total = nums.reduce((a, b) => a + b, 0);
        viz.reset();

        if (total % 2 === 1) {
          viz.recordStep({
            nums,
            dp: [true],
            infoLabel: `Total = ${total} (Odd)`,
            ansLabel: 'Result: False',
            formula: `${total} % 2 == 1 -> cannot split into two equal integer halves`,
            description: `Total sum ${total} is odd, so return False immediately!`,
            codeLine: 3,
            activeNum: null,
          });
          viz.goToStep(0);
          return;
        }

        const target = Math.min(total / 2, 16);
        if (total / 2 > 16) {
          // Keep table compact by capping preset/custom display gracefully
          const dp = [true, ...Array(16).fill(false)];
          viz.recordStep({
            nums,
            dp,
            infoLabel: `Target = ${total / 2} (keep sum <= 32 for compact table)`,
            ansLabel: 'Truncated preview',
            formula: 'Tip: enter smaller numbers (sum <= 32) to view full dp[0..target] strip',
            description: 'Showing first 17 sum slots (0..16); enter numbers with sum <= 32 to see the complete target.',
            codeLine: 5,
            activeNum: null,
          });
          viz.goToStep(0);
          return;
        }

        const dp = [true, ...Array(target).fill(false)];
        viz.recordStep({
          nums,
          dp: [...dp],
          infoLabel: `Total = ${total} | Target = ${target}`,
          ansLabel: 'Result: ...',
          formula: `dp[0] = True, dp[1..${target}] = False`,
          description: `Sum is ${total}, so each half needs ${target}. Start with dp[0] = True.`,
          codeLine: 5,
          activeNum: null,
          updated: [0],
          tags: { 0: 'base' },
        });

        nums.forEach((num, idx) => {
          for (let s = target; s >= num; s--) {
            const wasTrue = dp[s];
            const fromTrue = dp[s - num];
            viz.recordStep({
              nums,
              dp: [...dp],
              infoLabel: `num = ${num} | s = ${s} (reverse)`,
              ansLabel: 'Result: ...',
              formula: `dp[${s}] = dp[${s}](${wasTrue ? 'T' : 'F'}) or dp[${s - num}](${fromTrue ? 'T' : 'F'})`,
              description: `Check if sum ${s} can be formed using num = ${num} and sum ${s - num}.`,
              codeLine: 7,
              activeNum: idx,
              active: [s],
              deps: [s - num],
              tags: { [s - num]: `s-${num}`, [s]: `+${num}` },
            });

            if (!wasTrue && fromTrue) {
              dp[s] = true;
              viz.recordStep({
                nums,
                dp: [...dp],
                infoLabel: `num = ${num} | s = ${s}`,
                ansLabel: dp[target] ? 'Result: True' : 'Result: ...',
                formula: `dp[${s}] becomes True via ${s - num} + ${num}!`,
                description: `Sum ${s} is now reachable!`,
                codeLine: 8,
                activeNum: idx,
                updated: [s],
                deps: [s - num],
                tags: { [s]: 'new T' },
              });
            }
          }
        });

        viz.recordStep({
          nums,
          dp: [...dp],
          infoLabel: `Target = ${target}`,
          ansLabel: `Result: ${dp[target] ? 'True' : 'False'}`,
          formula: `Return dp[${target}] = ${dp[target] ? 'True' : 'False'}`,
          description: dp[target]
            ? `Done! Target ${target} is reachable, so the array splits into two equal-sum subsets.`
            : `Done! Target ${target} is unreachable (False).`,
          codeLine: 9,
          activeNum: null,
          path: dp[target] ? [target] : [],
        });

        viz.goToStep(0);
      }

      document.getElementById('btnRun').addEventListener('click', run);
      document.querySelectorAll('.dp-presets [data-nums]').forEach((btn) => {
        btn.addEventListener('click', () => {
          numsInput.value = btn.dataset.nums;
          run();
        });
      });

      run();
    </script>
  </body>
</html>
