<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coin Change (Min Coins) Visualizer</title>
    <link rel="stylesheet" href="../shared/clay-visualizer.css" />
    <link rel="stylesheet" href="../shared/dp-canvas.css" />
  </head>
  <body>
    <div class="visualizer">
      <div class="vis-input">
        <span class="vis-input__label">Coins:</span>
        <input type="text" id="coinsInput" class="vis-input__field" value="1, 3, 4" placeholder="e.g. 1, 3, 4" aria-label="Coin denominations" />
        <span class="vis-input__label">Amount:</span>
        <input type="number" id="amountInput" class="vis-input__field vis-input__num" min="1" max="15" value="6" aria-label="Target amount" />
        <button id="btnRun" class="vis-btn vis-btn--primary" type="button">Solve</button>
      </div>

      <div class="dp-presets">
        <span class="dp-preset-label">Presets:</span>
        <button class="vis-btn" type="button" data-coins="1, 3, 4" data-amount="6">Greedy Trap (1,3,4 -> 6)</button>
        <button class="vis-btn" type="button" data-coins="1, 2, 5" data-amount="11">Standard (1,2,5 -> 11)</button>
        <button class="vis-btn" type="button" data-coins="2, 5" data-amount="3">Impossible (2,5 -> 3)</button>
      </div>

      <div class="vis-controls">
        <button class="vis-btn vis-btn-reset" type="button">Reset</button>
        <button class="vis-btn vis-btn-step-back" type="button">Back</button>
        <button class="vis-btn vis-btn--primary vis-btn-play" type="button">Play</button>
        <button class="vis-btn vis-btn--primary vis-btn-pause" type="button" style="display: none;">Pause</button>
        <button class="vis-btn vis-btn-step-forward" type="button">Next</button>
        <span class="vis-step-counter">No steps</span>
        <label class="vis-speed"><span>Speed</span><input class="vis-speed-slider" type="range" min="1" max="10" value="7" /></label>
      </div>

      <div class="dp-status-bar">
        <div class="dp-status-group">
          <span id="pillState" class="dp-pill dp-pill--accent">Amount: 0 | Coin: -</span>
        </div>
        <span id="pillAns" class="dp-pill dp-pill--answer">Min Coins: -</span>
      </div>

      <div class="vis-canvas dp-canvas">
        <div id="formulaBar" class="dp-formula-bar">dp[a] = min(dp[a], dp[a - coin] + 1)</div>
        <div id="dpArea"></div>
      </div>

      <div class="vis-legend">
        <div class="vis-legend__item"><span class="vis-legend__dot" style="background: #ffc8a2;"></span>Target dp[a]</div>
        <div class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-sorted);"></span>Source dp[a - c]</div>
        <div class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-active);"></span>Improved</div>
        <div class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-pivot);"></span>Traceback Path</div>
      </div>

      <div id="visInfo" class="vis-info" style="margin-bottom: 1rem;">Watch DP beat greedy on [1, 3, 4] for amount 6: 3 + 3 = 2 coins!</div>
      <div id="visCode" class="vis-code"></div>
    </div>

    <script src="../shared/visualizer-base.js"></script>
    <script src="../shared/dp-canvas.js"></script>
    <script>
      const PYTHON_LINES = [
        'def coin_change(coins: list[int], amount: int) -> int:',
        '    dp = [amount + 1] * (amount + 1)',
        '    dp[0] = 0  # 0 coins needed to make amount 0',
        '    for a in range(1, amount + 1):',
        '        for coin in coins:',
        '            if a >= coin:',
        '                dp[a] = min(dp[a], dp[a - coin] + 1)',
        '    return dp[amount] if dp[amount] <= amount else -1',
      ];

      const coinsInput = document.getElementById('coinsInput');
      const amountInput = document.getElementById('amountInput');
      const pillState = document.getElementById('pillState');
      const pillAns = document.getElementById('pillAns');
      const formulaBar = document.getElementById('formulaBar');
      const dpArea = document.getElementById('dpArea');
      const visInfo = document.getElementById('visInfo');
      const visCode = document.getElementById('visCode');

      const viz = new VisualizerEngine({
        defaultSpeed: 480,
        render: (step) => {
          pillState.textContent = step.stateLabel;
          pillAns.textContent = step.ansLabel;
          formulaBar.textContent = step.formula;
          visInfo.textContent = step.description;

          DPCanvas.render1D(dpArea, {
            title: 'Minimum Coins per Sub-Amount (dp[0..amount])',
            values: step.dp.map((v) => (v >= step.inf ? 'INF' : v)),
            labels: step.dp.map((_, i) => `${i}`),
            active: step.active || [],
            deps: step.deps || [],
            updated: step.updated || [],
            path: step.path || [],
            tags: step.tags || {},
          });
        },
        highlightCode: (line) => DPCanvas.renderCode(visCode, PYTHON_LINES, line),
      });
      viz.bindControls();

      function run() {
        const parsedCoins = [...new Set(
          coinsInput.value
            .split(/[,\s]+/)
            .map((x) => parseInt(x, 10))
            .filter((x) => !Number.isNaN(x) && x > 0)
        )].slice(0, 6);
        const coins = parsedCoins.length ? parsedCoins : [1, 3, 4];
        coinsInput.value = coins.join(', ');

        let amount = parseInt(amountInput.value, 10);
        if (Number.isNaN(amount)) amount = 6;
        amount = Math.max(1, Math.min(15, amount));
        amountInput.value = String(amount);

        viz.reset();
        const INF = amount + 1;
        const dp = Array(amount + 1).fill(INF);
        const choice = Array(amount + 1).fill(null);
        dp[0] = 0;

        viz.recordStep({
          dp: [...dp],
          inf: INF,
          stateLabel: 'Init',
          ansLabel: 'Min Coins: ...',
          formula: `dp[0] = 0, dp[1..${amount}] = ∞`,
          description: 'Initialize dp[0] = 0 and all positive amounts to ∞ (unreachable).',
          codeLine: 2,
          updated: [0],
          tags: { 0: 'base' },
        });

        for (let a = 1; a <= amount; a++) {
          for (const coin of coins) {
            if (a >= coin) {
              const prev = dp[a - coin];
              const candidate = prev + 1;
              const prevStr = prev >= INF ? '∞' : prev;
              const curStr = dp[a] >= INF ? '∞' : dp[a];

              viz.recordStep({
                dp: [...dp],
                inf: INF,
                stateLabel: `a = ${a} | coin = ${coin}`,
                ansLabel: 'Min Coins: ...',
                formula: `Try coin ${coin}: min(dp[${a}]=${curStr}, dp[${a - coin}]=${prevStr} + 1)`,
                description: `For amount ${a}, check using coin ${coin} after amount ${a - coin}.`,
                codeLine: 5,
                active: [a],
                deps: [a - coin],
                tags: { [a - coin]: `a-${coin}`, [a]: `+${coin}` },
              });

              if (candidate < dp[a]) {
                dp[a] = candidate;
                choice[a] = coin;
                viz.recordStep({
                  dp: [...dp],
                  inf: INF,
                  stateLabel: `a = ${a} | coin = ${coin}`,
                  ansLabel: a === amount ? `Min Coins: ${dp[a]}` : 'Min Coins: ...',
                  formula: `Updated dp[${a}] = ${dp[a]} (using coin ${coin})`,
                  description: `Better! dp[${a}] improves from ${curStr} to ${dp[a]}.`,
                  codeLine: 6,
                  updated: [a],
                  deps: [a - coin],
                  tags: { [a]: `c=${coin}` },
                });
              }
            }
          }
        }

        const possible = dp[amount] <= amount;
        const path = [];
        const usedCoins = [];
        const tags = {};
        if (possible) {
          let cur = amount;
          while (cur > 0 && choice[cur] !== null) {
            path.push(cur);
            usedCoins.push(choice[cur]);
            tags[cur] = `+${choice[cur]}`;
            cur -= choice[cur];
          }
          path.push(0);
          tags[0] = 'start';
        }

        viz.recordStep({
          dp: [...dp],
          inf: INF,
          stateLabel: 'Complete',
          ansLabel: possible ? `Min Coins: ${dp[amount]}` : 'Impossible (-1)',
          formula: possible
            ? `Optimal coins for ${amount}: [${usedCoins.join(' + ')}] = ${dp[amount]} coins`
            : `dp[${amount}] = ∞ -> return -1`,
          description: possible
            ? `Done! Minimum coins for ${amount} is ${dp[amount]} (${usedCoins.join(' + ')}).`
            : `Amount ${amount} cannot be formed from [${coins.join(', ')}].`,
          codeLine: 7,
          path,
          tags,
        });

        viz.goToStep(0);
      }

      document.getElementById('btnRun').addEventListener('click', run);
      document.querySelectorAll('.dp-presets [data-coins]').forEach((btn) => {
        btn.addEventListener('click', () => {
          coinsInput.value = btn.dataset.coins;
          amountInput.value = btn.dataset.amount;
          run();
        });
      });

      run();
    </script>
  </body>
</html>
