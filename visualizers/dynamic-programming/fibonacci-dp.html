<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fibonacci DP (Memoization vs. Tabulation) Visualizer</title>
    <link rel="stylesheet" href="../shared/clay-visualizer.css" />
    <link rel="stylesheet" href="../shared/dp-canvas.css" />
  </head>
  <body>
    <div class="visualizer">
      <div class="vis-input">
        <span class="vis-input__label">n =</span>
        <input type="number" id="nInput" class="vis-input__field vis-input__num" min="1" max="7" value="5" aria-label="Fibonacci index n" />
        <div class="dp-mode-toggle" role="group" aria-label="DP approach">
          <button id="modeMemo" class="vis-btn dp-mode-btn--active" type="button">Top-Down Memo</button>
          <button id="modeTab" class="vis-btn" type="button">Bottom-Up Table</button>
        </div>
        <button id="btnRun" class="vis-btn vis-btn--primary" type="button">Run</button>
      </div>

      <div class="dp-presets">
        <span class="dp-preset-label">Presets:</span>
        <button class="vis-btn" type="button" data-n="4">n = 4</button>
        <button class="vis-btn" type="button" data-n="5">n = 5 (Classic Tree)</button>
        <button class="vis-btn" type="button" data-n="6">n = 6</button>
      </div>

      <div class="vis-controls">
        <button class="vis-btn vis-btn-reset" type="button">Reset</button>
        <button class="vis-btn vis-btn-step-back" type="button">Back</button>
        <button class="vis-btn vis-btn--primary vis-btn-play" type="button">Play</button>
        <button class="vis-btn vis-btn--primary vis-btn-pause" type="button" style="display: none;">Pause</button>
        <button class="vis-btn vis-btn-step-forward" type="button">Next</button>
        <span class="vis-step-counter">No steps</span>
        <label class="vis-speed"><span>Speed</span><input class="vis-speed-slider" type="range" min="1" max="10" value="6" /></label>
      </div>

      <div class="dp-status-bar">
        <div class="dp-status-group">
          <span id="pillMode" class="dp-pill dp-pill--accent">Mode: Top-Down Memo</span>
          <span id="pillCalls" class="dp-pill">Calls / Ops: 0</span>
        </div>
        <span id="pillAnswer" class="dp-pill dp-pill--answer">F(n) = -</span>
      </div>

      <div class="vis-canvas dp-canvas">
        <div id="formulaBar" class="dp-formula-bar">F(n) = F(n - 1) + F(n - 2)</div>
        <div id="treeArea"></div>
        <div id="tableArea"></div>
      </div>

      <div class="vis-legend">
        <div class="vis-legend__item"><span class="vis-legend__dot" style="background: #ffc8a2;"></span>Active</div>
        <div class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-sorted);"></span>Dependency / Base</div>
        <div class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-active);"></span>Cache Hit / Written</div>
      </div>

      <div id="visInfo" class="vis-info" style="margin-bottom: 1rem;">Compare how memoization caches overlapping calls while tabulation fills bottom-up.</div>
      <div id="visCode" class="vis-code"></div>
    </div>

    <script src="../shared/visualizer-base.js"></script>
    <script src="../shared/dp-canvas.js"></script>
    <script>
      const MEMO_CODE = [
        'def fib_memo(n: int, memo: dict[int, int] | None = None) -> int:',
        '    memo = {} if memo is None else memo',
        '    if n <= 1:',
        '        return n',
        '    if n in memo:',
        '        return memo[n]  # Reuse cached subproblem in O(1)',
        '    memo[n] = fib_memo(n - 1, memo) + fib_memo(n - 2, memo)',
        '    return memo[n]',
      ];

      const TAB_CODE = [
        'def fib_tab(n: int) -> int:',
        '    if n <= 1:',
        '        return n',
        '    dp = [0] * (n + 1)',
        '    dp[1] = 1',
        '    for i in range(2, n + 1):',
        '        dp[i] = dp[i - 1] + dp[i - 2]',
        '    return dp[n]',
      ];

      let mode = 'memo';
      const nInput = document.getElementById('nInput');
      const modeMemoBtn = document.getElementById('modeMemo');
      const modeTabBtn = document.getElementById('modeTab');
      const pillMode = document.getElementById('pillMode');
      const pillCalls = document.getElementById('pillCalls');
      const pillAnswer = document.getElementById('pillAnswer');
      const formulaBar = document.getElementById('formulaBar');
      const treeArea = document.getElementById('treeArea');
      const tableArea = document.getElementById('tableArea');
      const visInfo = document.getElementById('visInfo');
      const visCode = document.getElementById('visCode');

      const viz = new VisualizerEngine({
        defaultSpeed: 600,
        render: (step) => {
          pillMode.textContent = mode === 'memo' ? 'Mode: Top-Down Memo' : 'Mode: Bottom-Up Table';
          pillCalls.textContent = mode === 'memo' ? `Calls: ${step.ops} (Hits: ${step.hits})` : `Steps: ${step.ops}`;
          pillAnswer.textContent = step.answer !== null ? `F(${step.n}) = ${step.answer}` : `F(${step.n}) = ...`;
          formulaBar.textContent = step.formula;
          visInfo.textContent = step.description;

          if (step.tree) {
            treeArea.style.display = '';
            DPCanvas.renderCallTree(treeArea, step.tree);
          } else {
            treeArea.style.display = 'none';
            treeArea.innerHTML = '';
          }

          DPCanvas.render1D(tableArea, {
            title: mode === 'memo' ? 'Memo Cache (memo[0..n])' : 'DP Table (dp[0..n])',
            values: step.dp,
            labels: step.dp.map((_, i) => `F(${i})`),
            active: step.active || [],
            deps: step.deps || [],
            updated: step.updated || [],
            tags: step.tags || {},
          });
        },
        highlightCode: (line) => {
          DPCanvas.renderCode(visCode, mode === 'memo' ? MEMO_CODE : TAB_CODE, line);
        },
      });
      viz.bindControls();

      function buildMemoSteps(n) {
        const dp = Array(n + 1).fill(null);
        const memo = {};
        const nodes = [];
        const edges = [];
        let nextId = 0;
        let ops = 0;
        let hits = 0;

        function layoutTree(root) {
          // Compact layered layout so tree stays readable up to n=7
          let leafX = 0;
          function measure(node, depth) {
            node.depth = depth;
            if (!node.children.length) {
              node.wx = leafX++;
            } else {
              node.children.forEach((c) => measure(c, depth + 1));
              node.wx = (node.children[0].wx + node.children[node.children.length - 1].wx) / 2;
            }
          }
          measure(root, 0);
          const totalLeaves = Math.max(1, leafX);
          const width = Math.max(460, Math.min(760, totalLeaves * 76));
          const maxDepth = Math.max(1, ...nodes.map((nd) => nd.depth));
          const height = Math.max(170, (maxDepth + 1) * 52 + 24);
          nodes.forEach((nd) => {
            nd.x = ((nd.wx + 0.5) / totalLeaves) * (width - 40) + 20;
            nd.y = nd.depth * 52 + 28;
          });
          return { width, height };
        }

        function snapshot(description, codeLine, formula, activeIdx, updatedIdx, answer = null) {
          const dims = layoutTree(nodes[0]);
          viz.recordStep({
            n,
            ops,
            hits,
            answer,
            formula,
            description,
            codeLine,
            dp: [...dp],
            active: activeIdx !== null ? [activeIdx] : [],
            updated: updatedIdx !== null ? [updatedIdx] : [],
            tree: {
              width: dims.width,
              height: dims.height,
              nodes: nodes.map((nd) => ({ id: nd.id, x: nd.x, y: nd.y, label: nd.label, status: nd.status })),
              edges: edges.map((ed) => ({ from: ed.from, to: ed.to, active: ed.active })),
            },
          });
        }

        function solve(k, parentId) {
          ops += 1;
          const id = nextId++;
          const node = { id, label: `F(${k})`, status: 'computing', children: [], depth: 0, wx: 0, x: 0, y: 0 };
          nodes.push(node);
          if (parentId !== null) {
            const parent = nodes[parentId];
            parent.children.push(node);
            edges.push({ from: parentId, to: id, active: true });
          }

          snapshot(`Call fib_memo(${k}).`, 0, `Computing F(${k})`, k, null);

          if (k <= 1) {
            dp[k] = k;
            memo[k] = k;
            node.status = 'base';
            node.label = `F(${k})=${k}`;
            snapshot(`Base case: F(${k}) = ${k}.`, 3, `Base case: F(${k}) = ${k}`, null, k);
            if (edges.length) edges[edges.length - 1].active = false;
            return k;
          }

          if (k in memo) {
            hits += 1;
            node.status = 'hit';
            node.label = `hit:${memo[k]}`;
            snapshot(`Cache hit! Reuse memo[${k}] = ${memo[k]} without recursing again.`, 5, `memo[${k}] hit -> ${memo[k]}`, null, k);
            if (edges.length) edges[edges.length - 1].active = false;
            return memo[k];
          }

          const left = solve(k - 1, id);
          const right = solve(k - 2, id);
          const val = left + right;
          memo[k] = val;
          dp[k] = val;
          node.status = 'done';
          node.label = `F(${k})=${val}`;
          snapshot(`Store memo[${k}] = ${left} + ${right} = ${val}.`, 6, `memo[${k}] = F(${k - 1})(${left}) + F(${k - 2})(${right}) = ${val}`, null, k, k === n ? val : null);
          edges.forEach((ed) => { if (ed.to === id) ed.active = false; });
          return val;
        }

        const ans = solve(n, null);
        snapshot(`Done! F(${n}) = ${ans} using ${ops} total calls (${hits} cache hits).`, 7, `Final answer: F(${n}) = ${ans}`, null, n, ans);
      }

      function buildTabSteps(n) {
        const dp = Array(n + 1).fill(null);
        dp[0] = 0;
        if (n >= 1) dp[1] = 1;
        let ops = 0;

        viz.recordStep({
          n,
          ops,
          hits: 0,
          answer: n <= 1 ? n : null,
          formula: 'Base cases: dp[0] = 0, dp[1] = 1',
          description: 'Initialize bottom-up table with base cases dp[0] = 0 and dp[1] = 1.',
          codeLine: 4,
          dp: [...dp],
          updated: n >= 1 ? [0, 1] : [0],
          tree: null,
        });

        for (let i = 2; i <= n; i++) {
          ops += 1;
          viz.recordStep({
            n,
            ops,
            hits: 0,
            answer: null,
            formula: `dp[${i}] = dp[${i - 1}](${dp[i - 1]}) + dp[${i - 2}](${dp[i - 2]})`,
            description: `Read dp[${i - 1}] = ${dp[i - 1]} and dp[${i - 2}] = ${dp[i - 2]}.`,
            codeLine: 5,
            dp: [...dp],
            active: [i],
            deps: [i - 1, i - 2],
            tags: { [i - 2]: 'i-2', [i - 1]: 'i-1', [i]: 'i' },
            tree: null,
          });

          dp[i] = dp[i - 1] + dp[i - 2];
          viz.recordStep({
            n,
            ops,
            hits: 0,
            answer: i === n ? dp[n] : null,
            formula: `dp[${i}] = ${dp[i - 1]} + ${dp[i - 2]} = ${dp[i]}`,
            description: `Write dp[${i}] = ${dp[i]}.`,
            codeLine: 6,
            dp: [...dp],
            updated: [i],
            deps: [i - 1, i - 2],
            tags: { [i]: 'written' },
            tree: null,
          });
        }

        viz.recordStep({
          n,
          ops,
          hits: 0,
          answer: dp[n],
          formula: `Return dp[${n}] = ${dp[n]}`,
          description: `Finished bottom-up pass! F(${n}) = ${dp[n]}.`,
          codeLine: 7,
          dp: [...dp],
          updated: [n],
          tree: null,
        });
      }

      function run() {
        let n = parseInt(nInput.value, 10);
        if (Number.isNaN(n)) n = 5;
        n = Math.max(1, Math.min(7, n));
        nInput.value = String(n);

        viz.reset();
        if (mode === 'memo') buildMemoSteps(n);
        else buildTabSteps(n);
        if (viz.steps.length > 0) viz.goToStep(0);
      }

      modeMemoBtn.addEventListener('click', () => {
        mode = 'memo';
        modeMemoBtn.classList.add('dp-mode-btn--active');
        modeTabBtn.classList.remove('dp-mode-btn--active');
        run();
      });

      modeTabBtn.addEventListener('click', () => {
        mode = 'tab';
        modeTabBtn.classList.add('dp-mode-btn--active');
        modeMemoBtn.classList.remove('dp-mode-btn--active');
        run();
      });

      document.getElementById('btnRun').addEventListener('click', run);
      document.querySelectorAll('.dp-presets [data-n]').forEach((btn) => {
        btn.addEventListener('click', () => {
          nInput.value = btn.dataset.n;
          run();
        });
      });

      run();
    </script>
  </body>
</html>
