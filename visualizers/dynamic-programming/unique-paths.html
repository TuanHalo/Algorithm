<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unique Paths (2D Grid DP) Visualizer</title>
    <link rel="stylesheet" href="../shared/clay-visualizer.css" />
    <link rel="stylesheet" href="../shared/dp-canvas.css" />
  </head>
  <body>
    <div class="visualizer">
      <div class="vis-input">
        <span class="vis-input__label">Rows:</span>
        <input type="number" id="rowsInput" class="vis-input__field vis-input__num" min="2" max="6" value="3" aria-label="Grid rows" />
        <span class="vis-input__label">Cols:</span>
        <input type="number" id="colsInput" class="vis-input__field vis-input__num" min="2" max="7" value="5" aria-label="Grid columns" />
        <button id="btnRun" class="vis-btn vis-btn--primary" type="button">Count Paths</button>
      </div>

      <div class="dp-presets">
        <span class="dp-preset-label">Presets:</span>
        <button class="vis-btn" type="button" data-rows="3" data-cols="5" data-obs="">3 × 5 Open Grid</button>
        <button class="vis-btn" type="button" data-rows="3" data-cols="4" data-obs="1,1">3 × 4 Obstacle at (1,1)</button>
        <button class="vis-btn" type="button" data-rows="4" data-cols="4" data-obs="1,2;2,1">4 × 4 Two Obstacles</button>
      </div>

      <div class="vis-controls">
        <button class="vis-btn vis-btn-reset" type="button">Reset</button>
        <button class="vis-btn vis-btn-step-back" type="button">Back</button>
        <button class="vis-btn vis-btn--primary vis-btn-play" type="button">Play</button>
        <button class="vis-btn vis-btn--primary vis-btn-pause" type="button" style="display: none;">Pause</button>
        <button class="vis-btn vis-btn-step-forward" type="button">Next</button>
        <span class="vis-step-counter">No steps</span>
        <label class="vis-speed"><span>Speed</span><input class="vis-speed-slider" type="range" min="1" max="10" value="7" /></label>
      </div>

      <div class="dp-status-bar">
        <div class="dp-status-group">
          <span id="pillCell" class="dp-pill dp-pill--accent">Cell: (0, 0)</span>
        </div>
        <span id="pillAns" class="dp-pill dp-pill--answer">Total Paths: -</span>
      </div>

      <div class="vis-canvas dp-canvas">
        <div id="formulaBar" class="dp-formula-bar">dp[r][c] = dp[r - 1][c] + dp[r][c - 1]</div>
        <div id="gridArea"></div>
      </div>

      <div class="vis-legend">
        <div class="vis-legend__item"><span class="vis-legend__dot" style="background: #ffc8a2;"></span>Active Cell</div>
        <div class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-sorted);"></span>Top &amp; Left Sources</div>
        <div class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-active);"></span>Written</div>
        <div class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-swapping);"></span>Obstacle (0 paths)</div>
      </div>

      <div id="visInfo" class="vis-info" style="margin-bottom: 1rem;">Each cell sums the paths arriving from directly above and directly left.</div>
      <div id="visCode" class="vis-code"></div>
    </div>

    <script src="../shared/visualizer-base.js"></script>
    <script src="../shared/dp-canvas.js"></script>
    <script>
      const PYTHON_LINES = [
        'def unique_paths(rows: int, cols: int) -> int:',
        '    dp = [[1] * cols for _ in range(rows)]',
        '    for r in range(1, rows):',
        '        for c in range(1, cols):',
        '            dp[r][c] = dp[r - 1][c] + dp[r][c - 1]',
        '    return dp[-1][-1]',
      ];

      let obstacles = new Set();
      const rowsInput = document.getElementById('rowsInput');
      const colsInput = document.getElementById('colsInput');
      const pillCell = document.getElementById('pillCell');
      const pillAns = document.getElementById('pillAns');
      const formulaBar = document.getElementById('formulaBar');
      const gridArea = document.getElementById('gridArea');
      const visInfo = document.getElementById('visInfo');
      const visCode = document.getElementById('visCode');

      const viz = new VisualizerEngine({
        defaultSpeed: 420,
        render: (step) => {
          pillCell.textContent = step.cellLabel;
          pillAns.textContent = step.ansLabel;
          formulaBar.textContent = step.formula;
          visInfo.textContent = step.description;

          DPCanvas.render2D(gridArea, {
            title: '2D Grid Path Counts (dp[r][c])',
            matrix: step.grid,
            cornerLabel: 'r\\c',
            active: step.active || [],
            deps: step.deps || [],
            updated: step.updated || [],
            blocked: step.blocked || [],
            path: step.path || [],
          });
        },
        highlightCode: (line) => DPCanvas.renderCode(visCode, PYTHON_LINES, line),
      });
      viz.bindControls();

      function run() {
        let rows = parseInt(rowsInput.value, 10) || 3;
        let cols = parseInt(colsInput.value, 10) || 5;
        rows = Math.max(2, Math.min(6, rows));
        cols = Math.max(2, Math.min(7, cols));
        rowsInput.value = String(rows);
        colsInput.value = String(cols);

        const blockedCoords = [...obstacles]
          .map((s) => s.split(',').map(Number))
          .filter(([r, c]) => r >= 0 && r < rows && c >= 0 && c < cols);

        const isBlocked = (r, c) => obstacles.has(`${r},${c}`);
        const cloneGrid = (g) => g.map((row) => [...row]);

        viz.reset();
        const grid = Array.from({ length: rows }, () => Array(cols).fill(null));
        grid[0][0] = isBlocked(0, 0) ? 0 : 1;

        for (let c = 1; c < cols; c++) {
          grid[0][c] = isBlocked(0, c) ? 0 : grid[0][c - 1];
        }
        for (let r = 1; r < rows; r++) {
          grid[r][0] = isBlocked(r, 0) ? 0 : grid[r - 1][0];
        }

        const baseCells = [];
        for (let c = 0; c < cols; c++) if (!isBlocked(0, c)) baseCells.push([0, c]);
        for (let r = 1; r < rows; r++) if (!isBlocked(r, 0)) baseCells.push([r, 0]);

        viz.recordStep({
          grid: cloneGrid(grid),
          blocked: blockedCoords,
          cellLabel: 'Base Edges',
          ansLabel: 'Total Paths: ...',
          formula: 'First row & first column each have 1 straight path (0 after an obstacle)',
          description: 'Initialize top row and left column base cases.',
          codeLine: 1,
          updated: baseCells,
        });

        for (let r = 1; r < rows; r++) {
          for (let c = 1; c < cols; c++) {
            if (isBlocked(r, c)) {
              grid[r][c] = 0;
              viz.recordStep({
                grid: cloneGrid(grid),
                blocked: blockedCoords,
                cellLabel: `Cell (${r}, ${c})`,
                ansLabel: 'Total Paths: ...',
                formula: `dp[${r}][${c}] = 0 (blocked obstacle)`,
                description: `Cell (${r}, ${c}) is blocked, so 0 paths pass through it.`,
                codeLine: 3,
                active: [[r, c]],
              });
              continue;
            }

            const top = grid[r - 1][c];
            const left = grid[r][c - 1];
            viz.recordStep({
              grid: cloneGrid(grid),
              blocked: blockedCoords,
              cellLabel: `Cell (${r}, ${c})`,
              ansLabel: 'Total Paths: ...',
              formula: `dp[${r}][${c}] = dp[${r - 1}][${c}](${top}) + dp[${r}][${c - 1}](${left})`,
              description: `Combine ${top} paths from above and ${left} paths from the left.`,
              codeLine: 3,
              active: [[r, c]],
              deps: [[r - 1, c], [r, c - 1]],
            });

            grid[r][c] = top + left;
            viz.recordStep({
              grid: cloneGrid(grid),
              blocked: blockedCoords,
              cellLabel: `Cell (${r}, ${c})`,
              ansLabel: r === rows - 1 && c === cols - 1 ? `Total Paths: ${grid[r][c]}` : 'Total Paths: ...',
              formula: `dp[${r}][${c}] = ${top} + ${left} = ${grid[r][c]}`,
              description: `Set dp[${r}][${c}] = ${grid[r][c]}.`,
              codeLine: 4,
              updated: [[r, c]],
              deps: [[r - 1, c], [r, c - 1]],
            });
          }
        }

        const ans = grid[rows - 1][cols - 1];
        viz.recordStep({
          grid: cloneGrid(grid),
          blocked: blockedCoords,
          cellLabel: `Goal (${rows - 1}, ${cols - 1})`,
          ansLabel: `Total Paths: ${ans}`,
          formula: `Return dp[${rows - 1}][${cols - 1}] = ${ans}`,
          description: `Done! There are ${ans} unique paths from top-left to bottom-right.`,
          codeLine: 5,
          path: [[rows - 1, cols - 1]],
        });

        viz.goToStep(0);
      }

      document.getElementById('btnRun').addEventListener('click', () => {
        obstacles = new Set();
        run();
      });

      document.querySelectorAll('.dp-presets [data-rows]').forEach((btn) => {
        btn.addEventListener('click', () => {
          rowsInput.value = btn.dataset.rows;
          colsInput.value = btn.dataset.cols;
          obstacles = new Set(btn.dataset.obs ? btn.dataset.obs.split(';') : []);
          run();
        });
      });

      run();
    </script>
  </body>
</html>
