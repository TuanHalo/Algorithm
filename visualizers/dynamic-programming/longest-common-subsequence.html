<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Longest Common Subsequence (LCS) Visualizer</title>
    <link rel="stylesheet" href="../shared/clay-visualizer.css" />
    <link rel="stylesheet" href="../shared/dp-canvas.css" />
  </head>
  <body>
    <div class="visualizer">
      <div class="vis-input">
        <span class="vis-input__label">Text 1:</span>
        <input type="text" id="s1Input" class="vis-input__field" value="ABCBDAB" maxlength="8" aria-label="First string" />
        <span class="vis-input__label">Text 2:</span>
        <input type="text" id="s2Input" class="vis-input__field" value="BDCABA" maxlength="8" aria-label="Second string" />
        <button id="btnRun" class="vis-btn vis-btn--primary" type="button">Compare</button>
      </div>

      <div class="dp-presets">
        <span class="dp-preset-label">Presets:</span>
        <button class="vis-btn" type="button" data-s1="ABCBDAB" data-s2="BDCABA">Classic (ABCBDAB / BDCABA)</button>
        <button class="vis-btn" type="button" data-s1="ace" data-s2="abcde">Full Subsequence (ace / abcde)</button>
        <button class="vis-btn" type="button" data-s1="AGGTAB" data-s2="GXTXAYB">DNA (AGGTAB / GXTXAYB)</button>
      </div>

      <div class="vis-controls">
        <button class="vis-btn vis-btn-reset" type="button">Reset</button>
        <button class="vis-btn vis-btn-step-back" type="button">Back</button>
        <button class="vis-btn vis-btn--primary vis-btn-play" type="button">Play</button>
        <button class="vis-btn vis-btn--primary vis-btn-pause" type="button" style="display: none;">Pause</button>
        <button class="vis-btn vis-btn-step-forward" type="button">Next</button>
        <span class="vis-step-counter">No steps</span>
        <label class="vis-speed"><span>Speed</span><input class="vis-speed-slider" type="range" min="1" max="10" value="7" /></label>
      </div>

      <div class="dp-status-bar">
        <div class="dp-status-group">
          <span id="pillChars" class="dp-pill dp-pill--accent">Compare: -</span>
        </div>
        <span id="pillAns" class="dp-pill dp-pill--answer">LCS: -</span>
      </div>

      <div class="vis-canvas dp-canvas">
        <div id="formulaBar" class="dp-formula-bar">match -> 1 + dp[i-1][j-1] | mismatch -> max(dp[i-1][j], dp[i][j-1])</div>
        <div id="gridArea"></div>
      </div>

      <div class="vis-legend">
        <div class="vis-legend__item"><span class="vis-legend__dot" style="background: #ffc8a2;"></span>Active (i, j)</div>
        <div class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-sorted);"></span>Diagonal / Top / Left</div>
        <div class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-active);"></span>Written</div>
        <div class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-pivot);"></span>Traceback LCS</div>
      </div>

      <div id="visInfo" class="vis-info" style="margin-bottom: 1rem;">Matching characters take the diagonal + 1; mismatches carry forward the best prefix.</div>
      <div id="visCode" class="vis-code"></div>
    </div>

    <script src="../shared/visualizer-base.js"></script>
    <script src="../shared/dp-canvas.js"></script>
    <script>
      const PYTHON_LINES = [
        'def lcs_length(text1: str, text2: str) -> int:',
        '    m, n = len(text1), len(text2)',
        '    dp = [[0] * (n + 1) for _ in range(m + 1)]',
        '    for i in range(1, m + 1):',
        '        for j in range(1, n + 1):',
        '            if text1[i - 1] == text2[j - 1]:',
        '                dp[i][j] = 1 + dp[i - 1][j - 1]',
        '            else:',
        '                dp[i][j] = max(dp[i - 1][j], dp[i][j - 1])',
        '    return dp[m][n]',
      ];

      const s1Input = document.getElementById('s1Input');
      const s2Input = document.getElementById('s2Input');
      const pillChars = document.getElementById('pillChars');
      const pillAns = document.getElementById('pillAns');
      const formulaBar = document.getElementById('formulaBar');
      const gridArea = document.getElementById('gridArea');
      const visInfo = document.getElementById('visInfo');
      const visCode = document.getElementById('visCode');

      const viz = new VisualizerEngine({
        defaultSpeed: 400,
        render: (step) => {
          pillChars.textContent = step.charsLabel;
          pillAns.textContent = step.ansLabel;
          formulaBar.textContent = step.formula;
          visInfo.textContent = step.description;

          DPCanvas.render2D(gridArea, {
            title: 'LCS Prefix Table (dp[i][j])',
            matrix: step.grid,
            rowHeaders: step.rowHeaders,
            colHeaders: step.colHeaders,
            cornerLabel: 't1\\t2',
            active: step.active || [],
            deps: step.deps || [],
            updated: step.updated || [],
            path: step.path || [],
          });
        },
        highlightCode: (line) => DPCanvas.renderCode(visCode, PYTHON_LINES, line),
      });
      viz.bindControls();

      function run() {
        const s1 = (s1Input.value.trim() || 'ABCBDAB').slice(0, 8);
        const s2 = (s2Input.value.trim() || 'BDCABA').slice(0, 8);
        s1Input.value = s1;
        s2Input.value = s2;

        const m = s1.length;
        const n = s2.length;
        const rowHeaders = ['""', ...s1.split('')];
        const colHeaders = ['""', ...s2.split('')];
        const clone = (g) => g.map((r) => [...r]);

        viz.reset();
        const grid = Array.from({ length: m + 1 }, () => Array(n + 1).fill(null));
        for (let i = 0; i <= m; i++) grid[i][0] = 0;
        for (let j = 0; j <= n; j++) grid[0][j] = 0;

        viz.recordStep({
          grid: clone(grid),
          rowHeaders,
          colHeaders,
          charsLabel: 'Init Base Row/Col',
          ansLabel: 'LCS: ...',
          formula: 'Empty prefix "" has LCS length 0 with any string',
          description: 'Initialize row 0 and column 0 to 0.',
          codeLine: 2,
          updated: [...Array(n + 1).keys()].map((j) => [0, j]).concat([...Array(m + 1).keys()].map((i) => [i, 0])),
        });

        for (let i = 1; i <= m; i++) {
          for (let j = 1; j <= n; j++) {
            const c1 = s1[i - 1];
            const c2 = s2[j - 1];
            const match = c1 === c2;

            viz.recordStep({
              grid: clone(grid),
              rowHeaders,
              colHeaders,
              charsLabel: `'${c1}' vs '${c2}'`,
              ansLabel: 'LCS: ...',
              formula: match
                ? `'${c1}' == '${c2}' -> 1 + dp[${i - 1}][${j - 1}](${grid[i - 1][j - 1]})`
                : `'${c1}' != '${c2}' -> max(top=${grid[i - 1][j]}, left=${grid[i][j - 1]})`,
              description: match
                ? `Characters '${c1}' and '${c2}' match! Add 1 to diagonal dp[${i - 1}][${j - 1}].`
                : `'${c1}' != '${c2}': take the larger of top (${grid[i - 1][j]}) and left (${grid[i][j - 1]}).`,
              codeLine: match ? 6 : 8,
              active: [[i, j]],
              deps: match ? [[i - 1, j - 1]] : [[i - 1, j], [i, j - 1]],
            });

            grid[i][j] = match ? 1 + grid[i - 1][j - 1] : Math.max(grid[i - 1][j], grid[i][j - 1]);
            viz.recordStep({
              grid: clone(grid),
              rowHeaders,
              colHeaders,
              charsLabel: `'${c1}' vs '${c2}'`,
              ansLabel: i === m && j === n ? `LCS Length: ${grid[m][n]}` : 'LCS: ...',
              formula: `dp[${i}][${j}] = ${grid[i][j]}`,
              description: `Write dp[${i}][${j}] = ${grid[i][j]}.`,
              codeLine: match ? 6 : 8,
              updated: [[i, j]],
              deps: match ? [[i - 1, j - 1]] : [[i - 1, j], [i, j - 1]],
            });
          }
        }

        // Traceback LCS string
        const path = [];
        const chars = [];
        let i = m;
        let j = n;
        while (i > 0 && j > 0) {
          path.push([i, j]);
          if (s1[i - 1] === s2[j - 1]) {
            chars.push(s1[i - 1]);
            i -= 1;
            j -= 1;
          } else if (grid[i - 1][j] >= grid[i][j - 1]) {
            i -= 1;
          } else {
            j -= 1;
          }
        }
        path.push([i, j]);
        const lcsStr = chars.reverse().join('');

        viz.recordStep({
          grid: clone(grid),
          rowHeaders,
          colHeaders,
          charsLabel: 'Complete',
          ansLabel: `LCS: "${lcsStr}" (${grid[m][n]})`,
          formula: `LCS = "${lcsStr}" with length ${grid[m][n]}`,
          description: `Done! Reconstructed Longest Common Subsequence: "${lcsStr}" (length ${grid[m][n]}).`,
          codeLine: 9,
          path,
        });

        viz.goToStep(0);
      }

      document.getElementById('btnRun').addEventListener('click', run);
      document.querySelectorAll('.dp-presets [data-s1]').forEach((btn) => {
        btn.addEventListener('click', () => {
          s1Input.value = btn.dataset.s1;
          s2Input.value = btn.dataset.s2;
          run();
        });
      });

      run();
    </script>
  </body>
</html>
