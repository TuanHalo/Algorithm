<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>House Robber DP Visualizer</title>
    <link rel="stylesheet" href="../shared/clay-visualizer.css" />
    <link rel="stylesheet" href="../shared/dp-canvas.css" />
  </head>
  <body>
    <div class="visualizer">
      <div class="vis-input">
        <span class="vis-input__label">Houses:</span>
        <input type="text" id="numsInput" class="vis-input__field" value="2, 7, 9, 3, 1" placeholder="Comma-separated non-negative integers" aria-label="House values" />
        <button id="btnRun" class="vis-btn vis-btn--primary" type="button">Plan Route</button>
      </div>

      <div class="dp-presets">
        <span class="dp-preset-label">Presets:</span>
        <button class="vis-btn" type="button" data-nums="2, 7, 9, 3, 1">Classic [2, 7, 9, 3, 1]</button>
        <button class="vis-btn" type="button" data-nums="2, 1, 1, 2">Skip Two [2, 1, 1, 2]</button>
        <button class="vis-btn" type="button" data-nums="6, 7, 1, 30, 8, 2, 4">Big Jackpot</button>
      </div>

      <div class="vis-controls">
        <button class="vis-btn vis-btn-reset" type="button">Reset</button>
        <button class="vis-btn vis-btn-step-back" type="button">Back</button>
        <button class="vis-btn vis-btn--primary vis-btn-play" type="button">Play</button>
        <button class="vis-btn vis-btn--primary vis-btn-pause" type="button" style="display: none;">Pause</button>
        <button class="vis-btn vis-btn-step-forward" type="button">Next</button>
        <span class="vis-step-counter">No steps</span>
        <label class="vis-speed"><span>Speed</span><input class="vis-speed-slider" type="range" min="1" max="10" value="6" /></label>
      </div>

      <div class="dp-status-bar">
        <div class="dp-status-group">
          <span id="pillChoice" class="dp-pill dp-pill--accent">Decision: -</span>
        </div>
        <span id="pillMax" class="dp-pill dp-pill--answer">Best Loot: -</span>
      </div>

      <div class="vis-canvas dp-canvas">
        <div id="formulaBar" class="dp-formula-bar">dp[i] = max(skip: dp[i - 1], rob: dp[i - 2] + nums[i])</div>
        <div id="housesArea"></div>
        <div id="dpArea"></div>
      </div>

      <div class="vis-legend">
        <div class="vis-legend__item"><span class="vis-legend__dot" style="background: #ffc8a2;"></span>Current House</div>
        <div class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-sorted);"></span>Skip / Rob Sources</div>
        <div class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-active);"></span>Written dp[i]</div>
        <div class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-pivot);"></span>Chosen Houses</div>
      </div>

      <div id="visInfo" class="vis-info" style="margin-bottom: 1rem;">At each house, compare skipping it vs. robbing it plus the best loot two doors back.</div>
      <div id="visCode" class="vis-code"></div>
    </div>

    <script src="../shared/visualizer-base.js"></script>
    <script src="../shared/dp-canvas.js"></script>
    <script>
      const PYTHON_LINES = [
        'def rob(nums: list[int]) -> int:',
        '    if not nums:',
        '        return 0',
        '    dp = [0] * (len(nums) + 1)',
        '    dp[1] = nums[0]',
        '    for i in range(2, len(nums) + 1):',
        '        dp[i] = max(dp[i - 1], dp[i - 2] + nums[i - 1])',
        '    return dp[-1]',
      ];

      const numsInput = document.getElementById('numsInput');
      const pillChoice = document.getElementById('pillChoice');
      const pillMax = document.getElementById('pillMax');
      const formulaBar = document.getElementById('formulaBar');
      const housesArea = document.getElementById('housesArea');
      const dpArea = document.getElementById('dpArea');
      const visInfo = document.getElementById('visInfo');
      const visCode = document.getElementById('visCode');

      const viz = new VisualizerEngine({
        defaultSpeed: 620,
        render: (step) => {
          pillChoice.textContent = `Decision: ${step.choice}`;
          pillMax.textContent = `Best Loot: ${step.best}`;
          formulaBar.textContent = step.formula;
          visInfo.textContent = step.description;

          DPCanvas.render1D(housesArea, {
            title: 'Street Houses (nums[])',
            values: step.nums,
            labels: step.nums.map((_, i) => `H${i}`),
            active: step.activeHouse !== null ? [step.activeHouse] : [],
            path: step.chosenHouses || [],
            tags: step.houseTags || {},
          });

          DPCanvas.render1D(dpArea, {
            title: 'DP Prefix Best (dp[0..n])',
            values: step.dp,
            labels: step.dp.map((_, i) => `dp[${i}]`),
            active: step.activeDp || [],
            deps: step.depsDp || [],
            updated: step.updatedDp || [],
            tags: step.dpTags || {},
          });
        },
        highlightCode: (line) => DPCanvas.renderCode(visCode, PYTHON_LINES, line),
      });
      viz.bindControls();

      function run() {
        const parsed = numsInput.value
          .split(/[,\s]+/)
          .map((x) => parseInt(x, 10))
          .filter((x) => !Number.isNaN(x) && x >= 0)
          .slice(0, 10);
        const nums = parsed.length ? parsed : [2, 7, 9, 3, 1];
        numsInput.value = nums.join(', ');

        viz.reset();
        const n = nums.length;
        const dp = Array(n + 1).fill(null);
        dp[0] = 0;
        dp[1] = nums[0];
        const took = Array(n + 1).fill(false);
        took[1] = true;

        viz.recordStep({
          nums,
          dp: [...dp],
          choice: `Rob H0 (${nums[0]})`,
          best: nums[0],
          formula: `Base: dp[0] = 0, dp[1] = nums[0] = ${nums[0]}`,
          description: `With 1 house, best loot is dp[1] = ${nums[0]}.`,
          codeLine: 4,
          activeHouse: 0,
          updatedDp: [0, 1],
          dpTags: { 0: 'empty', 1: 'H0' },
        });

        for (let i = 2; i <= n; i++) {
          const val = nums[i - 1];
          const skipVal = dp[i - 1];
          const robVal = dp[i - 2] + val;
          const shouldRob = robVal > skipVal;

          viz.recordStep({
            nums,
            dp: [...dp],
            choice: 'Comparing...',
            best: dp[i - 1],
            formula: `max(skip: dp[${i - 1}]=${skipVal}, rob: dp[${i - 2}]=${dp[i - 2]} + ${val} = ${robVal})`,
            description: `At H${i - 1} ($${val}): skip gives $${skipVal}, rob gives $${robVal}.`,
            codeLine: 5,
            activeHouse: i - 1,
            activeDp: [i],
            depsDp: [i - 1, i - 2],
            dpTags: { [i - 2]: 'i-2', [i - 1]: 'i-1', [i]: 'i' },
          });

          dp[i] = Math.max(skipVal, robVal);
          took[i] = shouldRob;

          viz.recordStep({
            nums,
            dp: [...dp],
            choice: shouldRob ? `Rob H${i - 1}` : `Skip H${i - 1}`,
            best: dp[i],
            formula: `dp[${i}] = ${dp[i]} (${shouldRob ? 'robbed H' + (i - 1) : 'skipped H' + (i - 1)})`,
            description: shouldRob
              ? `Robbing H${i - 1} wins! dp[${i}] = ${dp[i]}.`
              : `Skipping H${i - 1} keeps $${skipVal}. dp[${i}] = ${dp[i]}.`,
            codeLine: 6,
            activeHouse: i - 1,
            updatedDp: [i],
            depsDp: [i - 1, i - 2],
            dpTags: { [i]: shouldRob ? 'rob' : 'skip' },
          });
        }

        // Backtrack chosen houses
        const chosen = [];
        let idx = n;
        while (idx >= 1) {
          if (took[idx]) {
            chosen.push(idx - 1);
            idx -= 2;
          } else {
            idx -= 1;
          }
        }
        chosen.reverse();
        const houseTags = {};
        chosen.forEach((h) => { houseTags[h] = 'robbed'; });

        viz.recordStep({
          nums,
          dp: [...dp],
          choice: `Route [${chosen.map((h) => 'H' + h).join(', ')}]`,
          best: dp[n],
          formula: `Max loot = dp[${n}] = ${dp[n]}`,
          description: `Done! Optimal loot is $${dp[n]} from houses ${chosen.map((h) => 'H' + h).join(', ')}.`,
          codeLine: 7,
          activeHouse: null,
          updatedDp: [n],
          chosenHouses: chosen,
          houseTags,
        });

        viz.goToStep(0);
      }

      document.getElementById('btnRun').addEventListener('click', run);
      document.querySelectorAll('.dp-presets [data-nums]').forEach((btn) => {
        btn.addEventListener('click', () => {
          numsInput.value = btn.dataset.nums;
          run();
        });
      });

      run();
    </script>
  </body>
</html>
