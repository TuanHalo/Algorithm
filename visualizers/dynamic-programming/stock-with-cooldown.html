<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock with Cooldown (State Machine DP) Visualizer</title>
    <link rel="stylesheet" href="../shared/clay-visualizer.css" />
    <link rel="stylesheet" href="../shared/dp-canvas.css" />
  </head>
  <body>
    <div class="visualizer">
      <div class="vis-input">
        <span class="vis-input__label">Prices:</span>
        <input type="text" id="pricesInput" class="vis-input__field" value="1, 2, 3, 0, 2" placeholder="Daily stock prices" aria-label="Daily stock prices" />
        <button id="btnRun" class="vis-btn vis-btn--primary" type="button">Simulate Days</button>
      </div>

      <div class="dp-presets">
        <span class="dp-preset-label">Presets:</span>
        <button class="vis-btn" type="button" data-prices="1, 2, 3, 0, 2">Classic [1, 2, 3, 0, 2] (3)</button>
        <button class="vis-btn" type="button" data-prices="2, 1, 4, 5, 2, 9">Double Rally [2, 1, 4, 5, 2, 9]</button>
        <button class="vis-btn" type="button" data-prices="5, 4, 3, 2, 1">Downtrend [5, 4, 3, 2, 1]</button>
      </div>

      <div class="vis-controls">
        <button class="vis-btn vis-btn-reset" type="button">Reset</button>
        <button class="vis-btn vis-btn-step-back" type="button">Back</button>
        <button class="vis-btn vis-btn--primary vis-btn-play" type="button">Play</button>
        <button class="vis-btn vis-btn--primary vis-btn-pause" type="button" style="display: none;">Pause</button>
        <button class="vis-btn vis-btn-step-forward" type="button">Next</button>
        <span class="vis-step-counter">No steps</span>
        <label class="vis-speed"><span>Speed</span><input class="vis-speed-slider" type="range" min="1" max="10" value="6" /></label>
      </div>

      <div class="dp-status-bar">
        <div class="dp-status-group">
          <span id="pillDay" class="dp-pill dp-pill--accent">Day: 0</span>
        </div>
        <span id="pillAns" class="dp-pill dp-pill--answer">Max Profit: -</span>
      </div>

      <div class="vis-canvas dp-canvas">
        <div id="formulaBar" class="dp-formula-bar">hold = max(hold, rest - p) | sold = hold + p | rest = max(rest, sold)</div>
        <div id="pricesArea"></div>
        <div id="statesArea"></div>
      </div>

      <div class="vis-legend">
        <div class="vis-legend__item"><span class="vis-legend__dot" style="background: #ffc8a2;"></span>Current Day</div>
        <div class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-sorted);"></span>Previous State</div>
        <div class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-active);"></span>Updated State</div>
      </div>

      <div id="visInfo" class="vis-info" style="margin-bottom: 1rem;">Track three states per day: holding stock, just sold (must cool down), or resting/ready to buy.</div>
      <div id="visCode" class="vis-code"></div>
    </div>

    <script src="../shared/visualizer-base.js"></script>
    <script src="../shared/dp-canvas.js"></script>
    <script>
      const PYTHON_LINES = [
        'def max_profit_cooldown(prices: list[int]) -> int:',
        '    hold, sold, rest = float("-inf"), 0, 0',
        '    for price in prices:',
        '        prev_hold, prev_sold, prev_rest = hold, sold, rest',
        '        hold = max(prev_hold, prev_rest - price)  # Keep or buy after rest',
        '        sold = prev_hold + price                 # Sell today -> cooldown next',
        '        rest = max(prev_rest, prev_sold)         # Stay idle or finish cooldown',
        '    return max(sold, rest)',
      ];

      const pricesInput = document.getElementById('pricesInput');
      const pillDay = document.getElementById('pillDay');
      const pillAns = document.getElementById('pillAns');
      const formulaBar = document.getElementById('formulaBar');
      const pricesArea = document.getElementById('pricesArea');
      const statesArea = document.getElementById('statesArea');
      const visInfo = document.getElementById('visInfo');
      const visCode = document.getElementById('visCode');

      const viz = new VisualizerEngine({
        defaultSpeed: 600,
        render: (step) => {
          pillDay.textContent = step.dayLabel;
          pillAns.textContent = step.ansLabel;
          formulaBar.textContent = step.formula;
          visInfo.textContent = step.description;

          DPCanvas.render1D(pricesArea, {
            title: 'Daily Stock Prices (prices[])',
            values: step.prices,
            labels: step.prices.map((_, i) => `Day ${i}`),
            active: step.day !== null ? [step.day] : [],
          });

          DPCanvas.render2D(statesArea, {
            title: 'State Machine Profit Table (rows = state, cols = day)',
            matrix: step.table,
            rowHeaders: ['hold', 'sold', 'rest'],
            colHeaders: ['Init', ...step.prices.map((p, i) => `D${i}($${p})`)],
            cornerLabel: 'state\\t',
            active: step.active || [],
            deps: step.deps || [],
            updated: step.updated || [],
            path: step.path || [],
          });
        },
        highlightCode: (line) => DPCanvas.renderCode(visCode, PYTHON_LINES, line),
      });
      viz.bindControls();

      function run() {
        const parsed = pricesInput.value
          .split(/[,\s]+/)
          .map((x) => parseInt(x, 10))
          .filter((x) => !Number.isNaN(x) && x >= 0)
          .slice(0, 8);
        const prices = parsed.length ? parsed : [1, 2, 3, 0, 2];
        pricesInput.value = prices.join(', ');

        const n = prices.length;
        const clone = (m) => m.map((r) => [...r]);
        const table = Array.from({ length: 3 }, () => Array(n + 1).fill(null));
        table[0][0] = '-INF';
        table[1][0] = 0;
        table[2][0] = 0;

        let hold = -Infinity;
        let sold = 0;
        let rest = 0;

        viz.reset();
        viz.recordStep({
          prices,
          table: clone(table),
          day: null,
          dayLabel: 'Init',
          ansLabel: 'Max Profit: 0',
          formula: 'hold = -∞, sold = 0, rest = 0',
          description: 'Before Day 0, holding is impossible (-∞), while sold and rest start at $0.',
          codeLine: 1,
          updated: [[0, 0], [1, 0], [2, 0]],
        });

        prices.forEach((p, idx) => {
          const col = idx + 1;
          const pHold = hold;
          const pSold = sold;
          const pRest = rest;

          hold = Math.max(pHold, pRest - p);
          sold = pHold === -Infinity ? -Infinity : pHold + p;
          rest = Math.max(pRest, pSold);

          table[0][col] = hold;
          table[1][col] = sold === -Infinity ? '-INF' : sold;
          table[2][col] = rest;

          const pHoldStr = pHold === -Infinity ? '-∞' : pHold;
          const soldStr = sold === -Infinity ? '-∞' : sold;
          viz.recordStep({
            prices,
            table: clone(table),
            day: idx,
            dayLabel: `Day ${idx} (price = $${p})`,
            ansLabel: `Best so far: ${Math.max(sold === -Infinity ? 0 : sold, rest)}`,
            formula: `hold=max(${pHoldStr}, ${pRest}-${p})=${hold} | sold=${pHoldStr}+${p}=${soldStr} | rest=max(${pRest}, ${pSold === -Infinity ? '-∞' : pSold})=${rest}`,
            description: `Day ${idx} ($${p}): hold=${hold}, sold=${soldStr}, rest=${rest}.`,
            codeLine: 5,
            updated: [[0, col], [1, col], [2, col]],
            deps: [[0, col - 1], [1, col - 1], [2, col - 1]],
          });
        });

        const finalAns = Math.max(sold === -Infinity ? 0 : sold, rest);
        const bestRow = sold >= rest ? 1 : 2;
        viz.recordStep({
          prices,
          table: clone(table),
          day: null,
          dayLabel: 'Complete',
          ansLabel: `Max Profit: ${finalAns}`,
          formula: `Return max(sold=${sold === -Infinity ? '-∞' : sold}, rest=${rest}) = ${finalAns}`,
          description: `Done! Maximum profit with 1-day cooldown is $${finalAns}.`,
          codeLine: 7,
          path: [[bestRow, n]],
        });

        viz.goToStep(0);
      }

      document.getElementById('btnRun').addEventListener('click', run);
      document.querySelectorAll('.dp-presets [data-prices]').forEach((btn) => {
        btn.addEventListener('click', () => {
          pricesInput.value = btn.dataset.prices;
          run();
        });
      });

      run();
    </script>
  </body>
</html>
