<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monotonic Queue Visualizer</title>
    <link rel="stylesheet" href="../shared/clay-visualizer.css" />
    <style>
      .vis-k-group {
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }

      .vis-k-label {
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--text-secondary);
        white-space: nowrap;
      }

      .vis-k-field {
        width: 66px;
        min-width: 60px;
        flex: 0 0 auto;
        text-align: center;
      }

      .vis-presets {
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 0.75rem;
      }

      .vis-preset-label {
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      .vis-status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
        font-family: var(--font-code);
        font-size: 0.78rem;
        color: var(--text-secondary);
      }

      .vis-pill {
        background: var(--bg-card);
        border: var(--border-clay);
        box-shadow: var(--shadow-clay-subtle);
        border-radius: 999px;
        padding: 0.25rem 0.75rem;
      }

      .vis-pill--accent {
        background: rgba(255, 170, 165, 0.45);
        font-weight: 600;
        color: var(--text-primary);
      }

      .vis-canvas {
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        min-height: 235px;
        padding: 1.7rem 1.25rem 1.2rem;
      }

      .array-strip {
        display: flex;
        gap: 0.48rem;
        flex-wrap: wrap;
        justify-content: center;
      }

      .mq-cell {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.25rem;
        transition: opacity 220ms ease;
      }

      .mq-ptr {
        position: absolute;
        top: -21px;
        font-family: var(--font-code);
        font-size: 0.6rem;
        font-weight: 700;
        padding: 1px 5px;
        border-radius: 5px;
        background: var(--vis-comparing);
        color: #431407;
        box-shadow: var(--shadow-clay-subtle);
      }

      .mq-box {
        width: 46px;
        height: 44px;
        border-radius: var(--border-radius-xs);
        background: var(--vis-default);
        border: var(--border-clay);
        box-shadow: var(--shadow-clay-subtle);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-code);
        font-size: 0.92rem;
        font-weight: 700;
        transition: all 220ms ease;
      }

      .mq-cell--window .mq-box {
        background: rgba(168, 216, 234, 0.55);
      }

      .mq-cell--max .mq-box {
        background: var(--vis-active);
        box-shadow: var(--shadow-clay);
      }

      .mq-cell--current .mq-box {
        background: var(--vis-comparing);
        transform: translateY(-4px);
      }

      .mq-cell--outside {
        opacity: 0.38;
      }

      .mq-idx {
        font-family: var(--font-code);
        font-size: 0.68rem;
        color: var(--text-muted);
      }

      .dq-panel {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.35rem;
      }

      .dq-label {
        font-family: var(--font-code);
        font-size: 0.72rem;
        color: var(--text-muted);
      }

      .dq-box {
        min-height: 48px;
        min-width: 240px;
        max-width: 100%;
        padding: 0.45rem 0.85rem;
        border-radius: var(--border-radius-sm);
        background: rgba(255, 255, 255, 0.42);
        border: 2px dashed rgba(90, 90, 90, 0.22);
        box-shadow: var(--shadow-clay-pressed);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        flex-wrap: wrap;
      }

      .dq-chip {
        padding: 0.26rem 0.6rem;
        border-radius: var(--border-radius-xs);
        background: rgba(205, 180, 219, 0.6);
        border: var(--border-clay);
        box-shadow: var(--shadow-clay-subtle);
        font-family: var(--font-code);
        font-size: 0.78rem;
        font-weight: 600;
      }

      .dq-chip--front {
        background: var(--vis-active);
      }

      .dq-chip--evict {
        background: var(--vis-swapping);
      }
    </style>
  </head>
  <body>
    <div class="visualizer">
      <div class="vis-input">
        <input
          id="array-input"
          class="vis-input__field"
          type="text"
          value="1, 3, -1, -3, 5, 3, 6, 7"
          placeholder="Numbers separated by commas, e.g. 1, 3, -1, -3, 5"
          aria-label="Input numbers"
        />
        <div class="vis-k-group">
          <label for="k-input" class="vis-k-label">k:</label>
          <input id="k-input" class="vis-input__field vis-k-field" type="number" min="2" max="6" value="3" aria-label="Window size k" />
        </div>
        <button id="btn-apply" class="vis-btn vis-btn--primary" type="button">▶ Load &amp; Run</button>
        <button id="btn-random" class="vis-btn" type="button">🎲 Random</button>
      </div>

      <div class="vis-presets">
        <span class="vis-preset-label">Try presets:</span>
        <button class="vis-btn" type="button" data-arr="1, 3, -1, -3, 5, 3, 6, 7" data-k="3">Standard (k=3)</button>
        <button class="vis-btn" type="button" data-arr="9, 7, 5, 3, 1" data-k="3">Strictly Decreasing</button>
        <button class="vis-btn" type="button" data-arr="1, 2, 3, 4, 5, 6" data-k="3">Strictly Increasing</button>
        <button class="vis-btn" type="button" data-arr="4, 2, 7, 1, 5" data-k="2">Narrow Window (k=2)</button>
      </div>

      <div class="vis-controls">
        <button class="vis-btn vis-btn-reset" type="button" title="Jump to start">⏮ Reset</button>
        <button class="vis-btn vis-btn-step-back" type="button" title="Previous step">◀ Back</button>
        <button class="vis-btn vis-btn--primary vis-btn-play" type="button" title="Play animation">▶ Play</button>
        <button class="vis-btn vis-btn--primary vis-btn-pause" type="button" title="Pause animation" style="display: none;">⏸ Pause</button>
        <button class="vis-btn vis-btn-step-forward" type="button" title="Next step">Next ▶</button>
        <span class="vis-step-counter">No steps</span>
        <label class="vis-speed">
          <span>Speed</span>
          <input class="vis-speed-slider" type="range" min="1" max="10" value="6" />
        </label>
      </div>

      <div class="vis-legend">
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: rgba(168, 216, 234, 0.7);"></span> Active Window</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-comparing);"></span> Incoming Item</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-swapping);"></span> Evicting (Expired / Smaller)</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-active);"></span> Window Max (dq[0])</span>
      </div>

      <div class="vis-status-bar">
        <span id="status-window" class="vis-pill vis-pill--accent">Window: —</span>
        <span id="status-maxes" class="vis-pill">Window Maxes: []</span>
      </div>

      <div id="vis-canvas" class="vis-canvas" aria-live="polite"></div>

      <div id="vis-info" class="vis-info" style="margin-bottom: 1rem;">
        Press <strong>Play</strong> or <strong>Next</strong> to trace Sliding Window Maximum with a Monotonic Queue.
      </div>

      <div class="vis-code" id="vis-code"></div>
    </div>

    <script src="../shared/visualizer-base.js"></script>
    <script>
      const PYTHON_LINES = [
        'from collections import deque',
        'def sliding_window_max(nums: list[int], k: int) -> list[int]:',
        '    dq: deque[int] = deque()',
        '    maxes: list[int] = []',
        '    for idx, val in enumerate(nums):',
        '        if dq and dq[0] <= idx - k:',
        '            dq.popleft()',
        '        while dq and nums[dq[-1]] <= val:',
        '            dq.pop()',
        '        dq.append(idx)',
        '        if idx >= k - 1:',
        '            maxes.append(nums[dq[0]])',
        '    return maxes',
      ];

      const canvasEl = document.getElementById('vis-canvas');
      const infoEl = document.getElementById('vis-info');
      const codeEl = document.getElementById('vis-code');
      const arrayInputEl = document.getElementById('array-input');
      const kInputEl = document.getElementById('k-input');
      const statusWindowEl = document.getElementById('status-window');
      const statusMaxesEl = document.getElementById('status-maxes');

      function escapeHtml(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      function renderCodePanel() {
        codeEl.innerHTML = PYTHON_LINES.map((line, index) => (
          `<span class="vis-code__line" data-line="${index}"><span class="vis-code__line-number">${index + 1}</span>${escapeHtml(line)}</span>`
        )).join('');
      }

      function highlightCodeLine(lineIndex) {
        codeEl.querySelectorAll('.vis-code__line').forEach((el, idx) => {
          el.classList.toggle('vis-code__line--active', idx === lineIndex);
        });
      }

      function parseInputs() {
        const raw = arrayInputEl.value
          .split(',')
          .map((s) => Number(s.trim()))
          .filter((n) => Number.isFinite(n));
        const nums = raw.length >= 3 ? raw.slice(0, 10) : [1, 3, -1, -3, 5, 3, 6, 7];
        const kRaw = Number(kInputEl.value);
        const k = Number.isFinite(kRaw) ? Math.max(2, Math.min(nums.length, Math.round(kRaw))) : 3;
        return { nums, k };
      }

      function renderStep(step) {
        const winStart = Math.max(0, step.idx - step.k + 1);
        statusWindowEl.textContent = step.idx >= 0
          ? `Window [${winStart}..${step.idx}] (k=${step.k})`
          : `Window: Ready (k=${step.k})`;
        statusMaxesEl.textContent = `Window Maxes: [${step.maxes.join(', ')}]`;

        const frontMaxIdx = step.dq.length > 0 ? step.dq[0] : -1;
        const arrHtml = step.nums.map((val, i) => {
          const inWindow = step.idx >= 0 && i >= winStart && i <= step.idx;
          let cls = '';
          if (i === step.idx) cls = 'mq-cell--current';
          else if (inWindow && i === frontMaxIdx) cls = 'mq-cell--max';
          else if (inWindow) cls = 'mq-cell--window';
          else if (step.idx >= 0) cls = 'mq-cell--outside';

          return `
            <div class="mq-cell ${cls}">
              ${i === step.idx ? `<span class="mq-ptr">i=${i}</span>` : ''}
              <div class="mq-box">${val}</div>
              <span class="mq-idx">[${i}]</span>
            </div>
          `;
        }).join('');

        const dqHtml = step.dq.length === 0
          ? '<span style="font-family: var(--font-code); font-size: 0.76rem; color: var(--text-muted);">Empty Deque</span>'
          : step.dq.map((idx, pos) => {
              let cls = '';
              if (pos === 0 && step.evict === 'front') cls = 'dq-chip--evict';
              else if (pos === step.dq.length - 1 && step.evict === 'back') cls = 'dq-chip--evict';
              else if (pos === 0) cls = 'dq-chip--front';
              return `<span class="dq-chip ${cls}">[${idx}]: ${step.nums[idx]}</span>`;
            }).join('');

        canvasEl.innerHTML = `
          <div class="array-strip">${arrHtml}</div>
          <div class="dq-panel">
            <span class="dq-label">Decreasing Deque of Candidate Indices (front = window max)</span>
            <div class="dq-box">${dqHtml}</div>
          </div>
        `;
        infoEl.innerHTML = step.description;
      }

      const engine = new VisualizerEngine({
        render: renderStep,
        highlightCode: highlightCodeLine,
        defaultSpeed: 720,
      });

      function buildSteps(nums, k) {
        engine.reset();
        const dq = [];
        const maxes = [];

        engine.recordStep({
          nums: [...nums],
          k,
          idx: -1,
          dq: [...dq],
          maxes: [...maxes],
          evict: null,
          description: `Starting Sliding Window Maximum with window size <strong>k = ${k}</strong>.`,
          codeLine: 2,
        });

        for (let idx = 0; idx < nums.length; idx++) {
          const val = nums[idx];
          if (dq.length > 0 && dq[0] <= idx - k) {
            engine.recordStep({
              nums: [...nums],
              k,
              idx,
              dq: [...dq],
              maxes: [...maxes],
              evict: 'front',
              description: `Front index <strong>${dq[0]}</strong> slid past left edge (${idx - k + 1}). Evicting from front via <code>popleft()</code>.`,
              codeLine: 6,
            });
            dq.shift();
          }

          while (dq.length > 0 && nums[dq[dq.length - 1]] <= val) {
            const backIdx = dq[dq.length - 1];
            engine.recordStep({
              nums: [...nums],
              k,
              idx,
              dq: [...dq],
              maxes: [...maxes],
              evict: 'back',
              description: `Older back candidate <strong>${nums[backIdx]} ≤ ${val}</strong> can never win again — popping from back.`,
              codeLine: 8,
            });
            dq.pop();
          }

          dq.push(idx);
          if (idx >= k - 1) {
            maxes.push(nums[dq[0]]);
            engine.recordStep({
              nums: [...nums],
              k,
              idx,
              dq: [...dq],
              maxes: [...maxes],
              evict: null,
              description: `Appended <strong>[${idx}]: ${val}</strong>. Full window max is front <code>nums[${dq[0]}] = ${nums[dq[0]]}</code>.`,
              codeLine: 11,
            });
          } else {
            engine.recordStep({
              nums: [...nums],
              k,
              idx,
              dq: [...dq],
              maxes: [...maxes],
              evict: null,
              description: `Appended <strong>[${idx}]: ${val}</strong>. Filling initial window (${idx + 1}/${k}).`,
              codeLine: 9,
            });
          }
        }

        engine.recordStep({
          nums: [...nums],
          k,
          idx: nums.length - 1,
          dq: [...dq],
          maxes: [...maxes],
          evict: null,
          description: `✅ Completed in <strong>O(n)</strong>! Window maximums: <strong>[${maxes.join(', ')}]</strong>.`,
          codeLine: 12,
        });

        engine.goToStep(0);
      }

      renderCodePanel();
      engine.bindControls();

      document.getElementById('btn-apply').addEventListener('click', () => {
        const { nums, k } = parseInputs();
        arrayInputEl.value = nums.join(', ');
        kInputEl.value = String(k);
        buildSteps(nums, k);
        engine.play();
      });

      document.getElementById('btn-random').addEventListener('click', () => {
        const nums = Array.from({ length: 8 }, () => Math.floor(Math.random() * 19) - 4);
        const k = Math.floor(Math.random() * 2) + 3;
        arrayInputEl.value = nums.join(', ');
        kInputEl.value = String(k);
        buildSteps(nums, k);
      });

      document.querySelectorAll('[data-arr]').forEach((btn) => {
        btn.addEventListener('click', () => {
          arrayInputEl.value = btn.dataset.arr;
          kInputEl.value = btn.dataset.k;
          const { nums, k } = parseInputs();
          buildSteps(nums, k);
        });
      });

      const initial = parseInputs();
      buildSteps(initial.nums, initial.k);
    </script>
  </body>
</html>
