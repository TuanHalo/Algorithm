<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deque Operations Visualizer</title>
    <link rel="stylesheet" href="../shared/clay-visualizer.css" />
    <style>
      .vis-presets {
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 0.75rem;
      }

      .vis-preset-label {
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      .vis-status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
        font-family: var(--font-code);
        font-size: 0.78rem;
        color: var(--text-secondary);
      }

      .vis-status-group {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }

      .vis-pill {
        background: var(--bg-card);
        border: var(--border-clay);
        box-shadow: var(--shadow-clay-subtle);
        border-radius: 999px;
        padding: 0.25rem 0.75rem;
      }

      .vis-pill--accent {
        background: rgba(255, 170, 165, 0.45);
        font-weight: 600;
        color: var(--text-primary);
      }

      .vis-canvas {
        flex-direction: column;
        align-items: stretch;
        justify-content: center;
        gap: 1rem;
        min-height: 205px;
        padding: 1.5rem 1.25rem;
      }

      .dq-header {
        display: flex;
        justify-content: space-between;
        font-family: var(--font-code);
        font-size: 0.72rem;
        color: var(--text-muted);
      }

      .dq-track {
        width: 100%;
        min-height: 92px;
        padding: 1.7rem 1rem 0.85rem;
        border-radius: var(--border-radius-sm);
        border-top: 2px dashed rgba(90, 90, 90, 0.22);
        border-bottom: 2px dashed rgba(90, 90, 90, 0.22);
        background: rgba(255, 255, 255, 0.38);
        box-shadow: var(--shadow-clay-pressed);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.55rem;
        flex-wrap: wrap;
      }

      .dq-cell {
        position: relative;
        min-width: 56px;
        height: 52px;
        padding: 0 0.75rem;
        border-radius: var(--border-radius-sm);
        background: var(--vis-default);
        border: var(--border-clay);
        box-shadow: var(--shadow-clay-subtle);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-code);
        font-size: 0.95rem;
        font-weight: 700;
        transition: all 240ms ease;
      }

      .dq-cell__badges {
        position: absolute;
        top: -22px;
        display: flex;
        gap: 3px;
        white-space: nowrap;
      }

      .dq-badge {
        font-family: var(--font-code);
        font-size: 0.6rem;
        font-weight: 700;
        padding: 2px 5px;
        border-radius: 5px;
        box-shadow: var(--shadow-clay-subtle);
      }

      .dq-badge--left {
        background: #a8d8ea;
        color: #0c4a6e;
      }

      .dq-badge--right {
        background: var(--vis-pivot);
        color: #3d2b4d;
      }

      .dq-cell--push {
        background: var(--vis-active);
        transform: translateY(-4px) scale(1.04);
      }

      .dq-cell--pop {
        background: var(--vis-swapping);
        transform: translateY(-4px);
      }

      .ops-chips {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.35rem;
      }

      .op-chip {
        font-family: var(--font-code);
        font-size: 0.72rem;
        padding: 0.2rem 0.48rem;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.55);
        border: var(--border-clay);
        color: var(--text-secondary);
      }

      .op-chip--done {
        opacity: 0.45;
      }

      .op-chip--current {
        background: #ffaaa5;
        color: #4a1512;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="visualizer">
      <div class="vis-input">
        <input
          id="ops-input"
          class="vis-input__field"
          type="text"
          value="PUSH_BACK 20, PUSH_FRONT 10, PUSH_BACK 30, PUSH_FRONT 5, POP_FRONT, POP_BACK"
          placeholder="PUSH_FRONT 10, PUSH_BACK 20, POP_FRONT, POP_BACK"
          aria-label="Deque operations"
        />
        <button id="btn-apply" class="vis-btn vis-btn--primary" type="button">▶ Load &amp; Run</button>
        <button id="btn-random" class="vis-btn" type="button">🎲 Random</button>
      </div>

      <div class="vis-presets">
        <span class="vis-preset-label">Try presets:</span>
        <button class="vis-btn" type="button" data-ops="PUSH_BACK 20, PUSH_FRONT 10, PUSH_BACK 30, PUSH_FRONT 5, POP_FRONT, POP_BACK">Both Ends</button>
        <button class="vis-btn" type="button" data-ops="PUSH_BACK 1, PUSH_BACK 2, PUSH_BACK 1, POP_FRONT, POP_BACK">Palindrome Peel</button>
        <button class="vis-btn" type="button" data-ops="PUSH_FRONT 10, PUSH_FRONT 20, PUSH_FRONT 30, POP_FRONT, POP_BACK">Front Stack / Back Pop</button>
      </div>

      <div class="vis-controls">
        <button class="vis-btn vis-btn-reset" type="button" title="Jump to start">⏮ Reset</button>
        <button class="vis-btn vis-btn-step-back" type="button" title="Previous step">◀ Back</button>
        <button class="vis-btn vis-btn--primary vis-btn-play" type="button" title="Play animation">▶ Play</button>
        <button class="vis-btn vis-btn--primary vis-btn-pause" type="button" title="Pause animation" style="display: none;">⏸ Pause</button>
        <button class="vis-btn vis-btn-step-forward" type="button" title="Next step">Next ▶</button>
        <span class="vis-step-counter">No steps</span>
        <label class="vis-speed">
          <span>Speed</span>
          <input class="vis-speed-slider" type="range" min="1" max="10" value="6" />
        </label>
      </div>

      <div class="vis-legend">
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: #a8d8ea;"></span> Left / Front</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-pivot);"></span> Right / Rear</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-active);"></span> Added (O(1))</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-swapping);"></span> Popping (O(1))</span>
      </div>

      <div class="vis-status-bar">
        <span id="status-op" class="vis-pill vis-pill--accent">Operation: Ready</span>
        <div class="vis-status-group">
          <span id="status-size" class="vis-pill">Size: 0</span>
          <span id="status-output" class="vis-pill">Last Output: None</span>
        </div>
      </div>

      <div id="vis-canvas" class="vis-canvas" aria-live="polite"></div>

      <div id="vis-info" class="vis-info" style="margin-bottom: 1rem;">
        Press <strong>Play</strong> or <strong>Next</strong> to watch double-ended O(1) insertions and pops.
      </div>

      <div class="vis-code" id="vis-code"></div>
    </div>

    <script src="../shared/visualizer-base.js"></script>
    <script>
      const PYTHON_LINES = [
        'from collections import deque',
        'dq: deque[int] = deque()',
        'dq.appendleft(val)   # Push to front in O(1)',
        'dq.append(val)       # Push to back in O(1)',
        'dq.popleft()         # Pop from front in O(1)',
        'dq.pop()             # Pop from back in O(1)',
      ];

      const canvasEl = document.getElementById('vis-canvas');
      const infoEl = document.getElementById('vis-info');
      const codeEl = document.getElementById('vis-code');
      const opsInputEl = document.getElementById('ops-input');
      const statusOpEl = document.getElementById('status-op');
      const statusSizeEl = document.getElementById('status-size');
      const statusOutputEl = document.getElementById('status-output');

      function renderCodePanel() {
        codeEl.innerHTML = PYTHON_LINES.map((line, index) => (
          `<span class="vis-code__line" data-line="${index}"><span class="vis-code__line-number">${index + 1}</span>${line}</span>`
        )).join('');
      }

      function highlightCodeLine(lineIndex) {
        codeEl.querySelectorAll('.vis-code__line').forEach((el, idx) => {
          el.classList.toggle('vis-code__line--active', idx === lineIndex);
        });
      }

      function parseOperations(rawText) {
        const tokens = rawText.split(',').map((t) => t.trim()).filter(Boolean);
        const ops = [];
        for (const token of tokens.slice(0, 14)) {
          const parts = token.split(/\s+/);
          const cmd = parts[0].toUpperCase();
          const hasNum = parts[1] !== undefined && Number.isFinite(Number(parts[1]));
          if ((cmd === 'PUSH_FRONT' || cmd === 'APPENDLEFT' || cmd === 'PF') && hasNum) {
            ops.push({ type: 'PF', value: Number(parts[1]), label: `PUSH_FRONT ${Number(parts[1])}` });
          } else if ((cmd === 'PUSH_BACK' || cmd === 'APPEND' || cmd === 'PB') && hasNum) {
            ops.push({ type: 'PB', value: Number(parts[1]), label: `PUSH_BACK ${Number(parts[1])}` });
          } else if (cmd === 'POP_FRONT' || cmd === 'POPLEFT') {
            ops.push({ type: 'POPF', label: 'POP_FRONT' });
          } else if (cmd === 'POP_BACK' || cmd === 'POP') {
            ops.push({ type: 'POPB', label: 'POP_BACK' });
          }
        }
        return ops.length > 0
          ? ops
          : [
              { type: 'PB', value: 20, label: 'PUSH_BACK 20' },
              { type: 'PF', value: 10, label: 'PUSH_FRONT 10' },
              { type: 'POPF', label: 'POP_FRONT' },
            ];
      }

      function renderStep(step) {
        statusOpEl.textContent = `Operation: ${step.opLabel}`;
        statusSizeEl.textContent = `Size: ${step.dq.length}`;
        statusOutputEl.textContent = `Last Output: ${step.output ?? 'None'}`;

        const trackHtml = step.dq.length === 0
          ? '<span style="font-family: var(--font-code); font-size: 0.78rem; color: var(--text-muted);">Empty Deque</span>'
          : step.dq.map((val, idx) => {
              const isLeft = idx === 0;
              const isRight = idx === step.dq.length - 1;
              const badges = [];
              if (isLeft) badges.push('<span class="dq-badge dq-badge--left">FRONT</span>');
              if (isRight) badges.push('<span class="dq-badge dq-badge--right">BACK</span>');

              let cls = '';
              if (step.activeEnd === 'left' && isLeft) cls = step.mode === 'push' ? 'dq-cell--push' : 'dq-cell--pop';
              else if (step.activeEnd === 'right' && isRight) cls = step.mode === 'push' ? 'dq-cell--push' : 'dq-cell--pop';

              return `
                <div class="dq-cell ${cls}">
                  <div class="dq-cell__badges">${badges.join('')}</div>
                  <span>${val}</span>
                </div>
              `;
            }).join('');

        const chipsHtml = step.ops.map((op, idx) => {
          let cls = '';
          if (idx < step.opIdx) cls = 'op-chip--done';
          else if (idx === step.opIdx) cls = 'op-chip--current';
          return `<span class="op-chip ${cls}">${op.label}</span>`;
        }).join('');

        canvasEl.innerHTML = `
          <div>
            <div class="dq-header">
              <span>⇄ appendleft() / popleft()</span>
              <span>append() / pop() ⇄</span>
            </div>
            <div class="dq-track">${trackHtml}</div>
          </div>
          <div class="ops-chips">${chipsHtml}</div>
        `;
        infoEl.innerHTML = step.description;
      }

      const engine = new VisualizerEngine({
        render: renderStep,
        highlightCode: highlightCodeLine,
        defaultSpeed: 700,
      });

      function buildSteps(ops) {
        engine.reset();
        const dq = [];
        let lastOutput = 'None';

        engine.recordStep({
          dq: [...dq],
          ops,
          opIdx: -1,
          opLabel: 'Initialize',
          output: lastOutput,
          activeEnd: null,
          mode: 'idle',
          description: 'Created an empty <code>collections.deque()</code> ready for O(1) operations on both ends.',
          codeLine: 1,
        });

        ops.forEach((op, idx) => {
          if (op.type === 'PF') {
            dq.unshift(op.value);
            engine.recordStep({
              dq: [...dq],
              ops,
              opIdx: idx,
              opLabel: op.label,
              output: lastOutput,
              activeEnd: 'left',
              mode: 'push',
              description: `<code>appendleft(${op.value})</code> inserts <strong>${op.value}</strong> at the front in <strong>O(1)</strong>.`,
              codeLine: 2,
            });
          } else if (op.type === 'PB') {
            dq.push(op.value);
            engine.recordStep({
              dq: [...dq],
              ops,
              opIdx: idx,
              opLabel: op.label,
              output: lastOutput,
              activeEnd: 'right',
              mode: 'push',
              description: `<code>append(${op.value})</code> inserts <strong>${op.value}</strong> at the back in <strong>O(1)</strong>.`,
              codeLine: 3,
            });
          } else if (op.type === 'POPF') {
            if (dq.length === 0) {
              lastOutput = 'None';
              engine.recordStep({
                dq: [...dq],
                ops,
                opIdx: idx,
                opLabel: 'POP_FRONT (empty)',
                output: lastOutput,
                activeEnd: null,
                mode: 'idle',
                description: '⚠️ Deque is empty; cannot <code>popleft()</code>.',
                codeLine: 4,
              });
            } else {
              engine.recordStep({
                dq: [...dq],
                ops,
                opIdx: idx,
                opLabel: 'POP_FRONT',
                output: lastOutput,
                activeEnd: 'left',
                mode: 'pop',
                description: `About to remove front item <strong>${dq[0]}</strong> via <code>popleft()</code>.`,
                codeLine: 4,
              });
              const popped = dq.shift();
              lastOutput = String(popped);
              engine.recordStep({
                dq: [...dq],
                ops,
                opIdx: idx,
                opLabel: `POP_FRONT → ${popped}`,
                output: lastOutput,
                activeEnd: null,
                mode: 'idle',
                description: `Removed <strong>${popped}</strong> from the front in <strong>O(1)</strong>.`,
                codeLine: 4,
              });
            }
          } else if (op.type === 'POPB') {
            if (dq.length === 0) {
              lastOutput = 'None';
              engine.recordStep({
                dq: [...dq],
                ops,
                opIdx: idx,
                opLabel: 'POP_BACK (empty)',
                output: lastOutput,
                activeEnd: null,
                mode: 'idle',
                description: '⚠️ Deque is empty; cannot <code>pop()</code>.',
                codeLine: 5,
              });
            } else {
              engine.recordStep({
                dq: [...dq],
                ops,
                opIdx: idx,
                opLabel: 'POP_BACK',
                output: lastOutput,
                activeEnd: 'right',
                mode: 'pop',
                description: `About to remove back item <strong>${dq[dq.length - 1]}</strong> via <code>pop()</code>.`,
                codeLine: 5,
              });
              const popped = dq.pop();
              lastOutput = String(popped);
              engine.recordStep({
                dq: [...dq],
                ops,
                opIdx: idx,
                opLabel: `POP_BACK → ${popped}`,
                output: lastOutput,
                activeEnd: null,
                mode: 'idle',
                description: `Removed <strong>${popped}</strong> from the back in <strong>O(1)</strong>.`,
                codeLine: 5,
              });
            }
          }
        });

        engine.goToStep(0);
      }

      renderCodePanel();
      engine.bindControls();

      document.getElementById('btn-apply').addEventListener('click', () => {
        const ops = parseOperations(opsInputEl.value);
        opsInputEl.value = ops.map((o) => o.label).join(', ');
        buildSteps(ops);
        engine.play();
      });

      document.getElementById('btn-random').addEventListener('click', () => {
        const seq = [];
        let size = 0;
        for (let i = 0; i < 7; i++) {
          const val = Math.floor(Math.random() * 89) + 10;
          const r = Math.random();
          if (size === 0 || (r < 0.65 && size < 5)) {
            seq.push(r < 0.32 ? `PUSH_FRONT ${val}` : `PUSH_BACK ${val}`);
            size++;
          } else {
            seq.push(r < 0.82 ? 'POP_FRONT' : 'POP_BACK');
            size = Math.max(0, size - 1);
          }
        }
        opsInputEl.value = seq.join(', ');
        buildSteps(parseOperations(opsInputEl.value));
      });

      document.querySelectorAll('[data-ops]').forEach((btn) => {
        btn.addEventListener('click', () => {
          opsInputEl.value = btn.dataset.ops;
          buildSteps(parseOperations(opsInputEl.value));
        });
      });

      buildSteps(parseOperations(opsInputEl.value));
    </script>
  </body>
</html>
