<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monotonic Stack Visualizer</title>
    <link rel="stylesheet" href="../shared/clay-visualizer.css" />
    <style>
      .vis-presets {
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 0.75rem;
      }

      .vis-preset-label {
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      .vis-status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
        font-family: var(--font-code);
        font-size: 0.78rem;
        color: var(--text-secondary);
      }

      .vis-pill {
        background: var(--bg-card);
        border: var(--border-clay);
        box-shadow: var(--shadow-clay-subtle);
        border-radius: 999px;
        padding: 0.25rem 0.75rem;
      }

      .vis-pill--accent {
        background: rgba(255, 170, 165, 0.45);
        font-weight: 600;
        color: var(--text-primary);
      }

      .vis-canvas {
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.15rem;
        min-height: 225px;
        padding: 1.7rem 1.25rem 1.25rem;
      }

      .array-strip {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        justify-content: center;
      }

      .ms-cell {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.28rem;
      }

      .ms-ptr {
        position: absolute;
        top: -21px;
        font-family: var(--font-code);
        font-size: 0.62rem;
        font-weight: 700;
        padding: 1px 6px;
        border-radius: 5px;
        background: var(--vis-comparing);
        color: #431407;
        box-shadow: var(--shadow-clay-subtle);
      }

      .ms-box {
        width: 50px;
        height: 46px;
        border-radius: var(--border-radius-xs);
        background: var(--vis-default);
        border: var(--border-clay);
        box-shadow: var(--shadow-clay-subtle);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-code);
        font-size: 0.96rem;
        font-weight: 700;
        transition: all 230ms ease;
      }

      .ms-cell--current .ms-box {
        background: var(--vis-comparing);
        transform: translateY(-4px);
        box-shadow: var(--shadow-clay);
      }

      .ms-cell--resolved .ms-box {
        background: rgba(168, 216, 234, 0.6);
      }

      .ms-cell--popped .ms-box {
        background: var(--vis-active);
        transform: translateY(-4px) scale(1.06);
        box-shadow: var(--shadow-clay);
      }

      .ms-ans {
        font-family: var(--font-code);
        font-size: 0.7rem;
        padding: 2px 6px;
        border-radius: 5px;
        background: rgba(255, 255, 255, 0.65);
        border: var(--border-clay);
        color: var(--text-secondary);
      }

      .ms-ans--set {
        background: rgba(168, 230, 207, 0.7);
        color: #14532d;
        font-weight: 700;
      }

      .stack-row-wrap {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.35rem;
      }

      .stack-row-label {
        font-family: var(--font-code);
        font-size: 0.72rem;
        color: var(--text-muted);
      }

      .mono-stack {
        min-height: 52px;
        min-width: 240px;
        max-width: 100%;
        padding: 0.5rem 0.9rem;
        border-radius: var(--border-radius-sm);
        background: rgba(255, 255, 255, 0.42);
        border: 2px dashed rgba(90, 90, 90, 0.22);
        box-shadow: var(--shadow-clay-pressed);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.45rem;
        flex-wrap: wrap;
      }

      .mono-chip {
        padding: 0.3rem 0.65rem;
        border-radius: var(--border-radius-xs);
        background: rgba(205, 180, 219, 0.6);
        border: var(--border-clay);
        box-shadow: var(--shadow-clay-subtle);
        font-family: var(--font-code);
        font-size: 0.8rem;
        font-weight: 600;
      }

      .mono-chip--popping {
        background: var(--vis-swapping);
      }
    </style>
  </head>
  <body>
    <div class="visualizer">
      <div class="vis-input">
        <input
          id="array-input"
          class="vis-input__field"
          type="text"
          value="2, 1, 5, 3, 6, 4"
          placeholder="Numbers separated by commas, e.g. 2, 1, 5, 3, 6, 4"
          aria-label="Input numbers"
        />
        <button id="btn-apply" class="vis-btn vis-btn--primary" type="button">▶ Load &amp; Run</button>
        <button id="btn-random" class="vis-btn" type="button">🎲 Random</button>
      </div>

      <div class="vis-presets">
        <span class="vis-preset-label">Try presets:</span>
        <button class="vis-btn" type="button" data-arr="2, 1, 5, 3, 6, 4">Mixed Peaks</button>
        <button class="vis-btn" type="button" data-arr="1, 2, 3, 4, 5">Strictly Increasing</button>
        <button class="vis-btn" type="button" data-arr="9, 7, 5, 3, 1">Strictly Decreasing</button>
        <button class="vis-btn" type="button" data-arr="4, 2, 2, 6, 3, 8">With Duplicates</button>
      </div>

      <div class="vis-controls">
        <button class="vis-btn vis-btn-reset" type="button" title="Jump to start">⏮ Reset</button>
        <button class="vis-btn vis-btn-step-back" type="button" title="Previous step">◀ Back</button>
        <button class="vis-btn vis-btn--primary vis-btn-play" type="button" title="Play animation">▶ Play</button>
        <button class="vis-btn vis-btn--primary vis-btn-pause" type="button" title="Pause animation" style="display: none;">⏸ Pause</button>
        <button class="vis-btn vis-btn-step-forward" type="button" title="Next step">Next ▶</button>
        <span class="vis-step-counter">No steps</span>
        <label class="vis-speed">
          <span>Speed</span>
          <input class="vis-speed-slider" type="range" min="1" max="10" value="6" />
        </label>
      </div>

      <div class="vis-legend">
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-comparing);"></span> Current Element</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-swapping);"></span> Popping Smaller Top</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-active);"></span> Resolved Next Greater</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: rgba(205, 180, 219, 0.7);"></span> Decreasing Stack</span>
      </div>

      <div class="vis-status-bar">
        <span id="status-ops" class="vis-pill vis-pill--accent">Push/Pop Ops: 0</span>
        <span id="status-result" class="vis-pill">Result: [-1, ...]</span>
      </div>

      <div id="vis-canvas" class="vis-canvas" aria-live="polite"></div>

      <div id="vis-info" class="vis-info" style="margin-bottom: 1rem;">
        Press <strong>Play</strong> or <strong>Next</strong> to watch the decreasing stack resolve Next Greater Elements in O(n).
      </div>

      <div class="vis-code" id="vis-code"></div>
    </div>

    <script src="../shared/visualizer-base.js"></script>
    <script>
      const PYTHON_LINES = [
        'def next_greater_elements(nums: list[int]) -> list[int]:',
        '    result = [-1] * len(nums)',
        '    stack: list[int] = []',
        '    for idx, val in enumerate(nums):',
        '        while stack and nums[stack[-1]] < val:',
        '            waiting_idx = stack.pop()',
        '            result[waiting_idx] = val',
        '        stack.append(idx)',
        '    return result',
      ];

      const canvasEl = document.getElementById('vis-canvas');
      const infoEl = document.getElementById('vis-info');
      const codeEl = document.getElementById('vis-code');
      const arrayInputEl = document.getElementById('array-input');
      const statusOpsEl = document.getElementById('status-ops');
      const statusResultEl = document.getElementById('status-result');

      function escapeHtml(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      function renderCodePanel() {
        codeEl.innerHTML = PYTHON_LINES.map((line, index) => (
          `<span class="vis-code__line" data-line="${index}"><span class="vis-code__line-number">${index + 1}</span>${escapeHtml(line)}</span>`
        )).join('');
      }

      function highlightCodeLine(lineIndex) {
        codeEl.querySelectorAll('.vis-code__line').forEach((el, idx) => {
          el.classList.toggle('vis-code__line--active', idx === lineIndex);
        });
      }

      function parseArray() {
        const nums = arrayInputEl.value
          .split(',')
          .map((s) => Number(s.trim()))
          .filter((n) => Number.isFinite(n));
        return nums.length >= 2 ? nums.slice(0, 10) : [2, 1, 5, 3, 6, 4];
      }

      function renderStep(step) {
        statusOpsEl.textContent = `Push/Pop Ops: ${step.opsCount} (≤ ${step.nums.length * 2})`;
        statusResultEl.textContent = `Result: [${step.result.join(', ')}]`;

        const arrayHtml = step.nums.map((val, idx) => {
          let cls = '';
          if (idx === step.currentIdx) cls = 'ms-cell--current';
          else if (idx === step.resolvedIdx) cls = 'ms-cell--popped';
          else if (step.result[idx] !== -1) cls = 'ms-cell--resolved';

          const ansCls = step.result[idx] !== -1 ? 'ms-ans--set' : '';
          return `
            <div class="ms-cell ${cls}">
              ${idx === step.currentIdx ? `<span class="ms-ptr">idx=${idx}</span>` : ''}
              <div class="ms-box">${val}</div>
              <span class="ms-ans ${ansCls}">→ ${step.result[idx]}</span>
            </div>
          `;
        }).join('');

        const stackHtml = step.stack.length === 0
          ? '<span style="font-family: var(--font-code); font-size: 0.76rem; color: var(--text-muted);">Empty Stack</span>'
          : step.stack.map((sIdx, pos) => {
              const isPopping = step.poppingTop && pos === step.stack.length - 1;
              return `<span class="mono-chip ${isPopping ? 'mono-chip--popping' : ''}">[${sIdx}]: ${step.nums[sIdx]}</span>`;
            }).join('');

        canvasEl.innerHTML = `
          <div class="array-strip">${arrayHtml}</div>
          <div class="stack-row-wrap">
            <span class="stack-row-label">Decreasing Stack of Unresolved Indices (bottom → top)</span>
            <div class="mono-stack">${stackHtml}</div>
          </div>
        `;
        infoEl.innerHTML = step.description;
      }

      const engine = new VisualizerEngine({
        render: renderStep,
        highlightCode: highlightCodeLine,
        defaultSpeed: 700,
      });

      function buildSteps(nums) {
        engine.reset();
        const result = Array(nums.length).fill(-1);
        const stack = [];
        let opsCount = 0;

        engine.recordStep({
          nums: [...nums],
          result: [...result],
          stack: [...stack],
          currentIdx: -1,
          resolvedIdx: -1,
          poppingTop: false,
          opsCount,
          description: `Initialized <code>result = [${result.join(', ')}]</code> and an empty decreasing stack.`,
          codeLine: 2,
        });

        for (let idx = 0; idx < nums.length; idx++) {
          const val = nums[idx];
          engine.recordStep({
            nums: [...nums],
            result: [...result],
            stack: [...stack],
            currentIdx: idx,
            resolvedIdx: -1,
            poppingTop: false,
            opsCount,
            description: `Visiting index <strong>${idx}</strong> (value <strong>${val}</strong>). Checking if it beats the stack top.`,
            codeLine: 4,
          });

          while (stack.length > 0 && nums[stack[stack.length - 1]] < val) {
            const topIdx = stack[stack.length - 1];
            engine.recordStep({
              nums: [...nums],
              result: [...result],
              stack: [...stack],
              currentIdx: idx,
              resolvedIdx: -1,
              poppingTop: true,
              opsCount,
              description: `<strong>${nums[topIdx]} &lt; ${val}</strong>! Popping waiting index <strong>${topIdx}</strong> because <strong>${val}</strong> is its Next Greater Element.`,
              codeLine: 5,
            });
            stack.pop();
            result[topIdx] = val;
            opsCount++;
            engine.recordStep({
              nums: [...nums],
              result: [...result],
              stack: [...stack],
              currentIdx: idx,
              resolvedIdx: topIdx,
              poppingTop: false,
              opsCount,
              description: `Updated <code>result[${topIdx}] = ${val}</code>.`,
              codeLine: 6,
            });
          }

          stack.push(idx);
          opsCount++;
          engine.recordStep({
            nums: [...nums],
            result: [...result],
            stack: [...stack],
            currentIdx: idx,
            resolvedIdx: -1,
            poppingTop: false,
            opsCount,
            description: `Pushed index <strong>${idx}</strong> (value <strong>${val}</strong>) onto the stack while keeping values decreasing.`,
            codeLine: 7,
          });
        }

        engine.recordStep({
          nums: [...nums],
          result: [...result],
          stack: [...stack],
          currentIdx: -1,
          resolvedIdx: -1,
          poppingTop: false,
          opsCount,
          description: `✅ Done in <strong>${opsCount}</strong> total push/pop ops! Remaining stack indices stay <code>-1</code>. Final result: <strong>[${result.join(', ')}]</strong>.`,
          codeLine: 8,
        });

        engine.goToStep(0);
      }

      renderCodePanel();
      engine.bindControls();

      document.getElementById('btn-apply').addEventListener('click', () => {
        const nums = parseArray();
        arrayInputEl.value = nums.join(', ');
        buildSteps(nums);
        engine.play();
      });

      document.getElementById('btn-random').addEventListener('click', () => {
        const nums = Array.from({ length: 7 }, () => Math.floor(Math.random() * 19) + 1);
        arrayInputEl.value = nums.join(', ');
        buildSteps(nums);
      });

      document.querySelectorAll('[data-arr]').forEach((btn) => {
        btn.addEventListener('click', () => {
          arrayInputEl.value = btn.dataset.arr;
          buildSteps(parseArray());
        });
      });

      buildSteps(parseArray());
    </script>
  </body>
</html>
