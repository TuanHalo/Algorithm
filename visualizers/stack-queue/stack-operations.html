<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stack Operations Visualizer</title>
    <link rel="stylesheet" href="../shared/clay-visualizer.css" />
    <style>
      .vis-presets {
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 0.75rem;
      }

      .vis-preset-label {
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      .vis-status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
        font-family: var(--font-code);
        font-size: 0.78rem;
        color: var(--text-secondary);
      }

      .vis-status-group {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }

      .vis-pill {
        background: var(--bg-card);
        border: var(--border-clay);
        box-shadow: var(--shadow-clay-subtle);
        border-radius: 999px;
        padding: 0.25rem 0.75rem;
      }

      .vis-pill--accent {
        background: rgba(255, 170, 165, 0.45);
        font-weight: 600;
        color: var(--text-primary);
      }

      .vis-canvas {
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        min-height: 215px;
        padding: 1.25rem;
        flex-wrap: wrap;
      }

      .stack-stage {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 1.5rem;
        width: 100%;
        flex-wrap: wrap;
      }

      .stack-well-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.4rem;
      }

      .stack-well {
        min-width: 168px;
        min-height: 165px;
        padding: 0.75rem 0.9rem 0.6rem;
        border-radius: 0 0 var(--border-radius) var(--border-radius);
        border: 2px dashed rgba(90, 90, 90, 0.25);
        border-top: none;
        background: rgba(255, 255, 255, 0.38);
        box-shadow: var(--shadow-clay-pressed);
        display: flex;
        flex-direction: column-reverse;
        align-items: center;
        gap: 0.45rem;
      }

      .stack-empty-hint {
        font-family: var(--font-code);
        font-size: 0.75rem;
        color: var(--text-muted);
        margin: auto 0;
      }

      .stack-item {
        width: 132px;
        padding: 0.42rem 0.75rem;
        border-radius: var(--border-radius-xs);
        background: var(--vis-default);
        border: var(--border-clay);
        box-shadow: var(--shadow-clay-subtle);
        font-family: var(--font-code);
        font-size: 0.92rem;
        font-weight: 700;
        color: var(--text-primary);
        display: flex;
        align-items: center;
        justify-content: space-between;
        transition: all 240ms ease;
      }

      .stack-item--top {
        background: rgba(168, 216, 234, 0.65);
      }

      .stack-item--push {
        background: var(--vis-active);
        transform: translateY(-3px) scale(1.03);
        box-shadow: var(--shadow-clay);
      }

      .stack-item--peek {
        background: var(--vis-comparing);
        box-shadow: var(--shadow-clay);
      }

      .stack-item--pop {
        background: var(--vis-swapping);
        transform: translateY(-6px);
      }

      .stack-tag {
        font-size: 0.62rem;
        padding: 2px 5px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.75);
        color: var(--text-secondary);
      }

      .ops-queue {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        min-width: 190px;
        max-width: 280px;
      }

      .ops-queue__title {
        font-size: 0.74rem;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .ops-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
      }

      .op-chip {
        font-family: var(--font-code);
        font-size: 0.72rem;
        padding: 0.22rem 0.5rem;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.55);
        border: var(--border-clay);
        color: var(--text-secondary);
      }

      .op-chip--done {
        opacity: 0.45;
      }

      .op-chip--current {
        background: #ffaaa5;
        color: #4a1512;
        font-weight: 700;
        box-shadow: var(--shadow-clay-subtle);
      }

      @media (max-width: 600px) {
        .stack-well {
          min-width: 145px;
        }
        .ops-queue {
          max-width: 100%;
          align-items: center;
        }
        .ops-chips {
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <div class="visualizer">
      <div class="vis-input">
        <input
          id="ops-input"
          class="vis-input__field"
          type="text"
          value="PUSH 14, PUSH 28, PEEK, PUSH 42, POP, PUSH 99, POP"
          placeholder="Operations: PUSH 10, POP, PEEK (comma-separated)"
          aria-label="Stack operations sequence"
        />
        <button id="btn-apply" class="vis-btn vis-btn--primary" type="button">▶ Load &amp; Run</button>
        <button id="btn-random" class="vis-btn" type="button">🎲 Random</button>
      </div>

      <div class="vis-presets">
        <span class="vis-preset-label">Try presets:</span>
        <button class="vis-btn" type="button" data-ops="PUSH 14, PUSH 28, PEEK, PUSH 42, POP, PUSH 99, POP">LIFO Basics</button>
        <button class="vis-btn" type="button" data-ops="PUSH 1, PUSH 2, PUSH 3, POP, POP, POP">Drain Stack</button>
        <button class="vis-btn" type="button" data-ops="PUSH 7, POP, POP, PEEK, PUSH 15">Underflow Guard</button>
        <button class="vis-btn" type="button" data-ops="PUSH 10, PUSH 20, PUSH 30, PUSH 40, PEEK, POP">Build &amp; Peek</button>
      </div>

      <div class="vis-controls">
        <button class="vis-btn vis-btn-reset" type="button" title="Jump to start">⏮ Reset</button>
        <button class="vis-btn vis-btn-step-back" type="button" title="Previous step">◀ Back</button>
        <button class="vis-btn vis-btn--primary vis-btn-play" type="button" title="Play animation">▶ Play</button>
        <button class="vis-btn vis-btn--primary vis-btn-pause" type="button" title="Pause animation" style="display: none;">⏸ Pause</button>
        <button class="vis-btn vis-btn-step-forward" type="button" title="Next step">Next ▶</button>
        <span class="vis-step-counter">No steps</span>
        <label class="vis-speed">
          <span>Speed</span>
          <input class="vis-speed-slider" type="range" min="1" max="10" value="6" />
        </label>
      </div>

      <div class="vis-legend">
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-active);"></span> Pushed</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-comparing);"></span> Peeked</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-swapping);"></span> Popping / Underflow</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: rgba(168, 216, 234, 0.7);"></span> Current Top</span>
      </div>

      <div class="vis-status-bar">
        <span id="status-op" class="vis-pill vis-pill--accent">Operation: Ready</span>
        <div class="vis-status-group">
          <span id="status-size" class="vis-pill">Size: 0</span>
          <span id="status-output" class="vis-pill">Last Output: None</span>
        </div>
      </div>

      <div id="vis-canvas" class="vis-canvas" aria-live="polite"></div>

      <div id="vis-info" class="vis-info" style="margin-bottom: 1rem;">
        Enter stack operations above and press <strong>Play</strong> or <strong>Next</strong>.
      </div>

      <div class="vis-code" id="vis-code"></div>
    </div>

    <script src="../shared/visualizer-base.js"></script>
    <script>
      const PYTHON_LINES = [
        'class Stack:',
        '    def __init__(self) -> None:',
        '        self._items: list[int] = []',
        '    def push(self, value: int) -> None:',
        '        self._items.append(value)',
        '    def pop(self) -> int | None:',
        '        if not self._items:',
        '            return None',
        '        return self._items.pop()',
        '    def peek(self) -> int | None:',
        '        return self._items[-1] if self._items else None',
      ];

      const canvasEl = document.getElementById('vis-canvas');
      const infoEl = document.getElementById('vis-info');
      const codeEl = document.getElementById('vis-code');
      const opsInputEl = document.getElementById('ops-input');
      const statusOpEl = document.getElementById('status-op');
      const statusSizeEl = document.getElementById('status-size');
      const statusOutputEl = document.getElementById('status-output');

      function renderCodePanel() {
        codeEl.innerHTML = PYTHON_LINES.map((line, index) => (
          `<span class="vis-code__line" data-line="${index}"><span class="vis-code__line-number">${index + 1}</span>${line}</span>`
        )).join('');
      }

      function highlightCodeLine(lineIndex) {
        codeEl.querySelectorAll('.vis-code__line').forEach((el, idx) => {
          el.classList.toggle('vis-code__line--active', idx === lineIndex);
        });
      }

      function parseOperations(rawText) {
        const tokens = rawText.split(',').map((t) => t.trim()).filter(Boolean);
        const parsed = [];
        for (const token of tokens.slice(0, 14)) {
          const parts = token.split(/\s+/);
          const cmd = parts[0].toUpperCase();
          if ((cmd === 'PUSH' || cmd === 'P') && parts[1] !== undefined && Number.isFinite(Number(parts[1]))) {
            parsed.push({ type: 'PUSH', value: Number(parts[1]), label: `PUSH ${Number(parts[1])}` });
          } else if (cmd === 'POP') {
            parsed.push({ type: 'POP', label: 'POP' });
          } else if (cmd === 'PEEK' || cmd === 'TOP') {
            parsed.push({ type: 'PEEK', label: 'PEEK' });
          }
        }
        return parsed.length > 0
          ? parsed
          : [
              { type: 'PUSH', value: 14, label: 'PUSH 14' },
              { type: 'PUSH', value: 28, label: 'PUSH 28' },
              { type: 'PEEK', label: 'PEEK' },
              { type: 'POP', label: 'POP' },
            ];
      }

      function renderStep(step) {
        statusOpEl.textContent = `Operation: ${step.opLabel}`;
        statusSizeEl.textContent = `Size: ${step.stack.length}`;
        statusOutputEl.textContent = `Last Output: ${step.output ?? 'None'}`;

        const stackHtml = step.stack.length === 0
          ? '<div class="stack-empty-hint">Empty Stack</div>'
          : step.stack.map((val, idx) => {
              const isTop = idx === step.stack.length - 1;
              let cls = '';
              if (isTop && step.mode === 'push') cls = 'stack-item--push';
              else if (isTop && step.mode === 'peek') cls = 'stack-item--peek';
              else if (isTop && step.mode === 'popping') cls = 'stack-item--pop';
              else if (isTop) cls = 'stack-item--top';

              const tag = isTop ? '<span class="stack-tag">TOP</span>' : `<span class="stack-tag">[${idx}]</span>`;
              return `<div class="stack-item ${cls}"><span>${val}</span>${tag}</div>`;
            }).join('');

        const chipsHtml = step.ops.map((op, idx) => {
          let cls = '';
          if (idx < step.opIdx) cls = 'op-chip--done';
          else if (idx === step.opIdx) cls = 'op-chip--current';
          return `<span class="op-chip ${cls}">${op.label}</span>`;
        }).join('');

        canvasEl.innerHTML = `
          <div class="stack-stage">
            <div class="stack-well-wrap">
              <div class="stack-well">${stackHtml}</div>
              <span class="ops-queue__title">Stack Tray (LIFO)</span>
            </div>
            <div class="ops-queue">
              <span class="ops-queue__title">Operation Script</span>
              <div class="ops-chips">${chipsHtml}</div>
            </div>
          </div>
        `;

        infoEl.innerHTML = step.description;
      }

      const engine = new VisualizerEngine({
        render: renderStep,
        highlightCode: highlightCodeLine,
        defaultSpeed: 700,
      });

      function buildSteps(ops) {
        engine.reset();
        const stack = [];
        let lastOutput = null;

        engine.recordStep({
          stack: [...stack],
          ops,
          opIdx: -1,
          opLabel: 'Initialize',
          output: 'None',
          mode: 'idle',
          description: 'Initialized an empty <strong>Stack</strong> backed by a Python list.',
          codeLine: 2,
        });

        ops.forEach((op, idx) => {
          if (op.type === 'PUSH') {
            stack.push(op.value);
            engine.recordStep({
              stack: [...stack],
              ops,
              opIdx: idx,
              opLabel: op.label,
              output: lastOutput ?? 'None',
              mode: 'push',
              description: `<strong>push(${op.value})</strong> appends <strong>${op.value}</strong> onto the top (new size: ${stack.length}).`,
              codeLine: 4,
            });
          } else if (op.type === 'PEEK') {
            lastOutput = stack.length > 0 ? String(stack[stack.length - 1]) : 'None';
            engine.recordStep({
              stack: [...stack],
              ops,
              opIdx: idx,
              opLabel: 'PEEK',
              output: lastOutput,
              mode: stack.length > 0 ? 'peek' : 'idle',
              description: stack.length > 0
                ? `<strong>peek()</strong> reads top value <strong>${lastOutput}</strong> without removing it.`
                : '<strong>peek()</strong> sees an empty stack and returns <strong>None</strong>.',
              codeLine: 10,
            });
          } else if (op.type === 'POP') {
            if (stack.length === 0) {
              lastOutput = 'None';
              engine.recordStep({
                stack: [...stack],
                ops,
                opIdx: idx,
                opLabel: 'POP (empty)',
                output: 'None',
                mode: 'idle',
                description: '⚠️ Stack underflow guarded: stack is empty, so <strong>pop()</strong> returns <strong>None</strong>.',
                codeLine: 7,
              });
            } else {
              engine.recordStep({
                stack: [...stack],
                ops,
                opIdx: idx,
                opLabel: 'POP',
                output: lastOutput ?? 'None',
                mode: 'popping',
                description: `About to <strong>pop()</strong> current top element <strong>${stack[stack.length - 1]}</strong>.`,
                codeLine: 8,
              });
              const popped = stack.pop();
              lastOutput = String(popped);
              engine.recordStep({
                stack: [...stack],
                ops,
                opIdx: idx,
                opLabel: `POP → ${popped}`,
                output: lastOutput,
                mode: 'idle',
                description: `Removed and returned <strong>${popped}</strong>. ${stack.length > 0 ? `New top is <strong>${stack[stack.length - 1]}</strong>.` : 'Stack is now empty.'}`,
                codeLine: 8,
              });
            }
          }
        });

        engine.goToStep(0);
      }

      renderCodePanel();
      engine.bindControls();

      document.getElementById('btn-apply').addEventListener('click', () => {
        const ops = parseOperations(opsInputEl.value);
        opsInputEl.value = ops.map((o) => o.label).join(', ');
        buildSteps(ops);
        engine.play();
      });

      document.getElementById('btn-random').addEventListener('click', () => {
        const seq = [];
        let depth = 0;
        for (let i = 0; i < 7; i++) {
          const roll = Math.random();
          if (depth === 0 || (roll < 0.6 && depth < 5)) {
            const val = Math.floor(Math.random() * 89) + 10;
            seq.push(`PUSH ${val}`);
            depth++;
          } else if (roll < 0.8) {
            seq.push('PEEK');
          } else {
            seq.push('POP');
            depth = Math.max(0, depth - 1);
          }
        }
        opsInputEl.value = seq.join(', ');
        buildSteps(parseOperations(opsInputEl.value));
      });

      document.querySelectorAll('[data-ops]').forEach((btn) => {
        btn.addEventListener('click', () => {
          opsInputEl.value = btn.dataset.ops;
          buildSteps(parseOperations(opsInputEl.value));
        });
      });

      buildSteps(parseOperations(opsInputEl.value));
    </script>
  </body>
</html>
