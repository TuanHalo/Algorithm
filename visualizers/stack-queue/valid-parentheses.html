<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Balanced Brackets Visualizer</title>
    <link rel="stylesheet" href="../shared/clay-visualizer.css" />
    <style>
      .vis-presets {
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 0.75rem;
      }

      .vis-preset-label {
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      .vis-status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
        font-family: var(--font-code);
        font-size: 0.78rem;
        color: var(--text-secondary);
      }

      .vis-status-group {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }

      .vis-pill {
        background: var(--bg-card);
        border: var(--border-clay);
        box-shadow: var(--shadow-clay-subtle);
        border-radius: 999px;
        padding: 0.25rem 0.75rem;
      }

      .vis-pill--valid {
        background: rgba(168, 230, 207, 0.7);
        color: #14532d;
        font-weight: 700;
      }

      .vis-pill--invalid {
        background: rgba(255, 170, 165, 0.75);
        color: #7f1d1d;
        font-weight: 700;
      }

      .vis-canvas {
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.15rem;
        min-height: 215px;
        padding: 1.75rem 1.25rem 1.25rem;
      }

      .char-strip {
        display: flex;
        gap: 0.45rem;
        flex-wrap: wrap;
        justify-content: center;
      }

      .char-cell {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.25rem;
      }

      .char-pointer {
        position: absolute;
        top: -21px;
        font-family: var(--font-code);
        font-size: 0.62rem;
        font-weight: 700;
        padding: 1px 5px;
        border-radius: 5px;
        background: var(--vis-comparing);
        color: #431407;
        box-shadow: var(--shadow-clay-subtle);
      }

      .char-box {
        width: 44px;
        height: 44px;
        border-radius: var(--border-radius-xs);
        background: var(--vis-default);
        border: var(--border-clay);
        box-shadow: var(--shadow-clay-subtle);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-code);
        font-size: 1.05rem;
        font-weight: 700;
        transition: all 220ms ease;
      }

      .char-cell--done .char-box {
        opacity: 0.45;
        background: #e2e8f0;
      }

      .char-cell--current .char-box {
        background: var(--vis-comparing);
        transform: translateY(-4px) scale(1.06);
        box-shadow: var(--shadow-clay);
      }

      .char-cell--match .char-box {
        background: var(--vis-active);
        transform: translateY(-4px) scale(1.06);
      }

      .char-cell--error .char-box {
        background: var(--vis-swapping);
        transform: translateY(-4px) scale(1.06);
      }

      .char-idx {
        font-family: var(--font-code);
        font-size: 0.68rem;
        color: var(--text-muted);
      }

      .stack-row-wrap {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.4rem;
      }

      .stack-row-label {
        font-family: var(--font-code);
        font-size: 0.72rem;
        color: var(--text-muted);
      }

      .stack-row {
        min-height: 54px;
        min-width: 240px;
        max-width: 100%;
        padding: 0.5rem 0.9rem;
        border-radius: var(--border-radius-sm);
        background: rgba(255, 255, 255, 0.42);
        border: 2px dashed rgba(90, 90, 90, 0.22);
        box-shadow: var(--shadow-clay-pressed);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.45rem;
        flex-wrap: wrap;
      }

      .opener-chip {
        padding: 0.35rem 0.7rem;
        border-radius: var(--border-radius-xs);
        background: rgba(168, 216, 234, 0.65);
        border: var(--border-clay);
        box-shadow: var(--shadow-clay-subtle);
        font-family: var(--font-code);
        font-size: 0.95rem;
        font-weight: 700;
      }

      .opener-chip--top {
        background: var(--vis-active);
      }
    </style>
  </head>
  <body>
    <div class="visualizer">
      <div class="vis-input">
        <input
          id="text-input"
          class="vis-input__field"
          type="text"
          value="({[]})"
          placeholder="Enter brackets e.g. ({[]})"
          aria-label="Bracket expression"
        />
        <button id="btn-apply" class="vis-btn vis-btn--primary" type="button">▶ Load &amp; Run</button>
        <button id="btn-random" class="vis-btn" type="button">🎲 Random</button>
      </div>

      <div class="vis-presets">
        <span class="vis-preset-label">Try presets:</span>
        <button class="vis-btn" type="button" data-text="({[]})">Valid Nested</button>
        <button class="vis-btn" type="button" data-text="()[]{}">Sequential</button>
        <button class="vis-btn" type="button" data-text="([)]">Mismatched ([)]</button>
        <button class="vis-btn" type="button" data-text="((()">Unclosed (((</button>
        <button class="vis-btn" type="button" data-text="())">Stray Closer ())</button>
      </div>

      <div class="vis-controls">
        <button class="vis-btn vis-btn-reset" type="button" title="Jump to start">⏮ Reset</button>
        <button class="vis-btn vis-btn-step-back" type="button" title="Previous step">◀ Back</button>
        <button class="vis-btn vis-btn--primary vis-btn-play" type="button" title="Play animation">▶ Play</button>
        <button class="vis-btn vis-btn--primary vis-btn-pause" type="button" title="Pause animation" style="display: none;">⏸ Pause</button>
        <button class="vis-btn vis-btn-step-forward" type="button" title="Next step">Next ▶</button>
        <span class="vis-step-counter">No steps</span>
        <label class="vis-speed">
          <span>Speed</span>
          <input class="vis-speed-slider" type="range" min="1" max="10" value="6" />
        </label>
      </div>

      <div class="vis-legend">
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-comparing);"></span> Scanning Char</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-active);"></span> Matched Pair</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-swapping);"></span> Mismatch / Invalid</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: rgba(168, 216, 234, 0.7);"></span> Waiting Openers</span>
      </div>

      <div class="vis-status-bar">
        <span id="status-result" class="vis-pill">Status: Scanning...</span>
        <div class="vis-status-group">
          <span id="status-stack" class="vis-pill">Stack Depth: 0</span>
        </div>
      </div>

      <div id="vis-canvas" class="vis-canvas" aria-live="polite"></div>

      <div id="vis-info" class="vis-info" style="margin-bottom: 1rem;">
        Enter a bracket string above and press <strong>Play</strong> or <strong>Next</strong>.
      </div>

      <div class="vis-code" id="vis-code"></div>
    </div>

    <script src="../shared/visualizer-base.js"></script>
    <script>
      const PYTHON_LINES = [
        'def is_valid_brackets(text: str) -> bool:',
        '    pairs = {")": "(", "]": "[", "}": "{"}',
        '    stack: list[str] = []',
        '    for ch in text:',
        '        if ch in "([{":',
        '            stack.append(ch)',
        '        elif ch in pairs:',
        '            if not stack or stack.pop() != pairs[ch]:',
        '                return False',
        '    return len(stack) == 0',
      ];

      const canvasEl = document.getElementById('vis-canvas');
      const infoEl = document.getElementById('vis-info');
      const codeEl = document.getElementById('vis-code');
      const textInputEl = document.getElementById('text-input');
      const statusResultEl = document.getElementById('status-result');
      const statusStackEl = document.getElementById('status-stack');

      function escapeHtml(ch) {
        return ch
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      function renderCodePanel() {
        codeEl.innerHTML = PYTHON_LINES.map((line, index) => (
          `<span class="vis-code__line" data-line="${index}"><span class="vis-code__line-number">${index + 1}</span>${escapeHtml(line)}</span>`
        )).join('');
      }

      function highlightCodeLine(lineIndex) {
        codeEl.querySelectorAll('.vis-code__line').forEach((el, idx) => {
          el.classList.toggle('vis-code__line--active', idx === lineIndex);
        });
      }

      function renderStep(step) {
        statusStackEl.textContent = `Stack Depth: ${step.stack.length}`;
        statusResultEl.className = 'vis-pill';
        if (step.verdict === 'valid') {
          statusResultEl.textContent = 'Status: ✅ Valid (True)';
          statusResultEl.classList.add('vis-pill--valid');
        } else if (step.verdict === 'invalid') {
          statusResultEl.textContent = 'Status: ❌ Invalid (False)';
          statusResultEl.classList.add('vis-pill--invalid');
        } else {
          statusResultEl.textContent = 'Status: Scanning...';
        }

        const charsHtml = step.chars.map((ch, idx) => {
          let cls = '';
          if (idx === step.cursor) {
            if (step.charState === 'match') cls = 'char-cell--match';
            else if (step.charState === 'error') cls = 'char-cell--error';
            else cls = 'char-cell--current';
          } else if (idx < step.cursor) {
            cls = 'char-cell--done';
          }

          return `
            <div class="char-cell ${cls}">
              ${idx === step.cursor ? `<span class="char-pointer">i=${idx}</span>` : ''}
              <div class="char-box">${escapeHtml(ch)}</div>
              <span class="char-idx">[${idx}]</span>
            </div>
          `;
        }).join('');

        const stackHtml = step.stack.length === 0
          ? '<span style="font-family: var(--font-code); font-size: 0.76rem; color: var(--text-muted);">Empty Stack</span>'
          : step.stack.map((ch, idx) => (
              `<span class="opener-chip ${idx === step.stack.length - 1 ? 'opener-chip--top' : ''}">${escapeHtml(ch)}</span>`
            )).join('');

        canvasEl.innerHTML = `
          <div class="char-strip">${charsHtml}</div>
          <div class="stack-row-wrap">
            <span class="stack-row-label">Unmatched Openers Stack (bottom → top)</span>
            <div class="stack-row">${stackHtml}</div>
          </div>
        `;
        infoEl.innerHTML = step.description;
      }

      const engine = new VisualizerEngine({
        render: renderStep,
        highlightCode: highlightCodeLine,
        defaultSpeed: 700,
      });

      function buildSteps(rawText) {
        engine.reset();
        const cleaned = rawText.replace(/\s+/g, '').slice(0, 14) || '({[]})';
        const chars = [...cleaned];
        const pairs = { ')': '(', ']': '[', '}': '{' };
        const openers = new Set(['(', '[', '{']);
        const stack = [];

        engine.recordStep({
          chars,
          cursor: -1,
          stack: [...stack],
          charState: 'idle',
          verdict: 'scanning',
          description: `Starting scan of <code>${escapeHtml(cleaned)}</code> with an empty stack.`,
          codeLine: 2,
        });

        for (let i = 0; i < chars.length; i++) {
          const ch = chars[i];
          if (openers.has(ch)) {
            stack.push(ch);
            engine.recordStep({
              chars,
              cursor: i,
              stack: [...stack],
              charState: 'current',
              verdict: 'scanning',
              description: `Saw opener <code>${escapeHtml(ch)}</code> at index ${i} — pushed onto the stack.`,
              codeLine: 5,
            });
          } else if (pairs[ch]) {
            if (stack.length === 0) {
              engine.recordStep({
                chars,
                cursor: i,
                stack: [...stack],
                charState: 'error',
                verdict: 'invalid',
                description: `❌ Stray closer <code>${escapeHtml(ch)}</code> at index ${i}, but stack is empty! Returning <strong>False</strong>.`,
                codeLine: 8,
              });
              engine.goToStep(0);
              return;
            }
            const top = stack[stack.length - 1];
            if (top !== pairs[ch]) {
              engine.recordStep({
                chars,
                cursor: i,
                stack: [...stack],
                charState: 'error',
                verdict: 'invalid',
                description: `❌ Mismatch at index ${i}: closer <code>${escapeHtml(ch)}</code> expected <code>${pairs[ch]}</code>, but top was <code>${escapeHtml(top)}</code>.`,
                codeLine: 8,
              });
              engine.goToStep(0);
              return;
            }
            stack.pop();
            engine.recordStep({
              chars,
              cursor: i,
              stack: [...stack],
              charState: 'match',
              verdict: 'scanning',
              description: `✅ Closer <code>${escapeHtml(ch)}</code> matched and popped opener <code>${escapeHtml(top)}</code>.`,
              codeLine: 7,
            });
          } else {
            engine.recordStep({
              chars,
              cursor: i,
              stack: [...stack],
              charState: 'current',
              verdict: 'scanning',
              description: `Skipping non-bracket character <code>${escapeHtml(ch)}</code> at index ${i}.`,
              codeLine: 3,
            });
          }
        }

        const isValid = stack.length === 0;
        engine.recordStep({
          chars,
          cursor: chars.length,
          stack: [...stack],
          charState: 'idle',
          verdict: isValid ? 'valid' : 'invalid',
          description: isValid
            ? '✅ Finished scan with an empty stack — all brackets are balanced! Returning <strong>True</strong>.'
            : `❌ End of string reached with ${stack.length} unclosed bracket(s) still on the stack — returning <strong>False</strong>.`,
          codeLine: 9,
        });

        engine.goToStep(0);
      }

      renderCodePanel();
      engine.bindControls();

      document.getElementById('btn-apply').addEventListener('click', () => {
        const val = textInputEl.value.trim() || '({[]})';
        textInputEl.value = val;
        buildSteps(val);
        engine.play();
      });

      document.getElementById('btn-random').addEventListener('click', () => {
        const samples = ['({[]})', '[({})]', '(()[])', '([)]', '{[}]', '((())', '()[]{}'];
        const pick = samples[Math.floor(Math.random() * samples.length)];
        textInputEl.value = pick;
        buildSteps(pick);
      });

      document.querySelectorAll('[data-text]').forEach((btn) => {
        btn.addEventListener('click', () => {
          textInputEl.value = btn.dataset.text;
          buildSteps(btn.dataset.text);
        });
      });

      buildSteps(textInputEl.value);
    </script>
  </body>
</html>
