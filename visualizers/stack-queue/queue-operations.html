<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Queue Operations Visualizer</title>
    <link rel="stylesheet" href="../shared/clay-visualizer.css" />
    <style>
      .vis-presets {
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 0.75rem;
      }

      .vis-preset-label {
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      .vis-status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
        font-family: var(--font-code);
        font-size: 0.78rem;
        color: var(--text-secondary);
      }

      .vis-status-group {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }

      .vis-pill {
        background: var(--bg-card);
        border: var(--border-clay);
        box-shadow: var(--shadow-clay-subtle);
        border-radius: 999px;
        padding: 0.25rem 0.75rem;
      }

      .vis-pill--accent {
        background: rgba(255, 170, 165, 0.45);
        font-weight: 600;
        color: var(--text-primary);
      }

      .vis-canvas {
        flex-direction: column;
        align-items: stretch;
        justify-content: center;
        gap: 1rem;
        min-height: 205px;
        padding: 1.5rem 1.25rem;
      }

      .lane-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
      }

      .lane-labels {
        width: 100%;
        display: flex;
        justify-content: space-between;
        font-family: var(--font-code);
        font-size: 0.72rem;
        color: var(--text-muted);
      }

      .fifo-lane {
        width: 100%;
        min-height: 92px;
        padding: 1.7rem 1rem 0.85rem;
        border-radius: var(--border-radius-sm);
        border-top: 2px dashed rgba(90, 90, 90, 0.22);
        border-bottom: 2px dashed rgba(90, 90, 90, 0.22);
        background: rgba(255, 255, 255, 0.38);
        box-shadow: var(--shadow-clay-pressed);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.55rem;
        flex-wrap: wrap;
      }

      .q-cell {
        position: relative;
        min-width: 56px;
        height: 52px;
        padding: 0 0.75rem;
        border-radius: var(--border-radius-sm);
        background: var(--vis-default);
        border: var(--border-clay);
        box-shadow: var(--shadow-clay-subtle);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-code);
        font-size: 0.95rem;
        font-weight: 700;
        transition: all 240ms ease;
      }

      .q-cell__badges {
        position: absolute;
        top: -22px;
        display: flex;
        gap: 3px;
        white-space: nowrap;
      }

      .q-badge {
        font-family: var(--font-code);
        font-size: 0.6rem;
        font-weight: 700;
        padding: 2px 5px;
        border-radius: 5px;
        box-shadow: var(--shadow-clay-subtle);
      }

      .q-badge--front {
        background: #a8d8ea;
        color: #0c4a6e;
      }

      .q-badge--rear {
        background: var(--vis-pivot);
        color: #3d2b4d;
      }

      .q-cell--enqueue {
        background: var(--vis-active);
        transform: translateY(-4px) scale(1.04);
      }

      .q-cell--peek {
        background: var(--vis-comparing);
        transform: translateY(-4px);
      }

      .q-cell--dequeue {
        background: var(--vis-swapping);
        transform: translateX(-6px);
      }

      .ops-chips {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.35rem;
      }

      .op-chip {
        font-family: var(--font-code);
        font-size: 0.72rem;
        padding: 0.22rem 0.5rem;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.55);
        border: var(--border-clay);
        color: var(--text-secondary);
      }

      .op-chip--done {
        opacity: 0.45;
      }

      .op-chip--current {
        background: #ffaaa5;
        color: #4a1512;
        font-weight: 700;
        box-shadow: var(--shadow-clay-subtle);
      }
    </style>
  </head>
  <body>
    <div class="visualizer">
      <div class="vis-input">
        <input
          id="ops-input"
          class="vis-input__field"
          type="text"
          value="ENQ 10, ENQ 20, ENQ 30, PEEK, DEQ, ENQ 40, DEQ"
          placeholder="Operations: ENQ 10, DEQ, PEEK (comma-separated)"
          aria-label="Queue operations sequence"
        />
        <button id="btn-apply" class="vis-btn vis-btn--primary" type="button">▶ Load &amp; Run</button>
        <button id="btn-random" class="vis-btn" type="button">🎲 Random</button>
      </div>

      <div class="vis-presets">
        <span class="vis-preset-label">Try presets:</span>
        <button class="vis-btn" type="button" data-ops="ENQ 10, ENQ 20, ENQ 30, PEEK, DEQ, ENQ 40, DEQ">Drive-Thru Line</button>
        <button class="vis-btn" type="button" data-ops="ENQ 1, ENQ 2, ENQ 3, DEQ, DEQ, DEQ">Serve All</button>
        <button class="vis-btn" type="button" data-ops="ENQ 5, DEQ, DEQ, PEEK, ENQ 9">Empty Dequeue</button>
        <button class="vis-btn" type="button" data-ops="ENQ 8, ENQ 16, DEQ, ENQ 24, DEQ, ENQ 32">Alternating Flow</button>
      </div>

      <div class="vis-controls">
        <button class="vis-btn vis-btn-reset" type="button" title="Jump to start">⏮ Reset</button>
        <button class="vis-btn vis-btn-step-back" type="button" title="Previous step">◀ Back</button>
        <button class="vis-btn vis-btn--primary vis-btn-play" type="button" title="Play animation">▶ Play</button>
        <button class="vis-btn vis-btn--primary vis-btn-pause" type="button" title="Pause animation" style="display: none;">⏸ Pause</button>
        <button class="vis-btn vis-btn-step-forward" type="button" title="Next step">Next ▶</button>
        <span class="vis-step-counter">No steps</span>
        <label class="vis-speed">
          <span>Speed</span>
          <input class="vis-speed-slider" type="range" min="1" max="10" value="6" />
        </label>
      </div>

      <div class="vis-legend">
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: #a8d8ea;"></span> Front (Exit)</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-pivot);"></span> Rear (Entry)</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-active);"></span> Enqueued</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-comparing);"></span> Front Peeked</span>
        <span class="vis-legend__item"><span class="vis-legend__dot" style="background: var(--vis-swapping);"></span> Dequeuing</span>
      </div>

      <div class="vis-status-bar">
        <span id="status-op" class="vis-pill vis-pill--accent">Operation: Ready</span>
        <div class="vis-status-group">
          <span id="status-size" class="vis-pill">Size: 0</span>
          <span id="status-output" class="vis-pill">Last Output: None</span>
        </div>
      </div>

      <div id="vis-canvas" class="vis-canvas" aria-live="polite"></div>

      <div id="vis-info" class="vis-info" style="margin-bottom: 1rem;">
        Enter queue operations above and press <strong>Play</strong> or <strong>Next</strong>.
      </div>

      <div class="vis-code" id="vis-code"></div>
    </div>

    <script src="../shared/visualizer-base.js"></script>
    <script>
      const PYTHON_LINES = [
        'from collections import deque',
        'class Queue:',
        '    def __init__(self) -> None:',
        '        self._items: deque[int] = deque()',
        '    def enqueue(self, value: int) -> None:',
        '        self._items.append(value)',
        '    def dequeue(self) -> int | None:',
        '        if not self._items:',
        '            return None',
        '        return self._items.popleft()',
        '    def front(self) -> int | None:',
        '        return self._items[0] if self._items else None',
      ];

      const canvasEl = document.getElementById('vis-canvas');
      const infoEl = document.getElementById('vis-info');
      const codeEl = document.getElementById('vis-code');
      const opsInputEl = document.getElementById('ops-input');
      const statusOpEl = document.getElementById('status-op');
      const statusSizeEl = document.getElementById('status-size');
      const statusOutputEl = document.getElementById('status-output');

      function renderCodePanel() {
        codeEl.innerHTML = PYTHON_LINES.map((line, index) => (
          `<span class="vis-code__line" data-line="${index}"><span class="vis-code__line-number">${index + 1}</span>${line}</span>`
        )).join('');
      }

      function highlightCodeLine(lineIndex) {
        codeEl.querySelectorAll('.vis-code__line').forEach((el, idx) => {
          el.classList.toggle('vis-code__line--active', idx === lineIndex);
        });
      }

      function parseOperations(rawText) {
        const tokens = rawText.split(',').map((t) => t.trim()).filter(Boolean);
        const parsed = [];
        for (const token of tokens.slice(0, 14)) {
          const parts = token.split(/\s+/);
          const cmd = parts[0].toUpperCase();
          if ((cmd === 'ENQ' || cmd === 'ENQUEUE' || cmd === 'PUSH') && parts[1] !== undefined && Number.isFinite(Number(parts[1]))) {
            parsed.push({ type: 'ENQ', value: Number(parts[1]), label: `ENQ ${Number(parts[1])}` });
          } else if (cmd === 'DEQ' || cmd === 'DEQUEUE' || cmd === 'POP') {
            parsed.push({ type: 'DEQ', label: 'DEQ' });
          } else if (cmd === 'PEEK' || cmd === 'FRONT') {
            parsed.push({ type: 'PEEK', label: 'PEEK' });
          }
        }
        return parsed.length > 0
          ? parsed
          : [
              { type: 'ENQ', value: 10, label: 'ENQ 10' },
              { type: 'ENQ', value: 20, label: 'ENQ 20' },
              { type: 'DEQ', label: 'DEQ' },
            ];
      }

      function renderStep(step) {
        statusOpEl.textContent = `Operation: ${step.opLabel}`;
        statusSizeEl.textContent = `Size: ${step.queue.length}`;
        statusOutputEl.textContent = `Last Output: ${step.output ?? 'None'}`;

        const laneHtml = step.queue.length === 0
          ? '<span style="font-family: var(--font-code); font-size: 0.78rem; color: var(--text-muted);">Empty Queue</span>'
          : step.queue.map((val, idx) => {
              const isFront = idx === 0;
              const isRear = idx === step.queue.length - 1;
              const badges = [];
              if (isFront) badges.push('<span class="q-badge q-badge--front">FRONT</span>');
              if (isRear) badges.push('<span class="q-badge q-badge--rear">REAR</span>');

              let cls = '';
              if (isRear && step.mode === 'enqueue') cls = 'q-cell--enqueue';
              else if (isFront && step.mode === 'peek') cls = 'q-cell--peek';
              else if (isFront && step.mode === 'dequeuing') cls = 'q-cell--dequeue';

              return `
                <div class="q-cell ${cls}">
                  <div class="q-cell__badges">${badges.join('')}</div>
                  <span>${val}</span>
                </div>
              `;
            }).join('');

        const chipsHtml = step.ops.map((op, idx) => {
          let cls = '';
          if (idx < step.opIdx) cls = 'op-chip--done';
          else if (idx === step.opIdx) cls = 'op-chip--current';
          return `<span class="op-chip ${cls}">${op.label}</span>`;
        }).join('');

        canvasEl.innerHTML = `
          <div class="lane-wrap">
            <div class="lane-labels">
              <span>◀ popleft() exits here</span>
              <span>append() enters here ◀</span>
            </div>
            <div class="fifo-lane">${laneHtml}</div>
          </div>
          <div class="ops-chips">${chipsHtml}</div>
        `;
        infoEl.innerHTML = step.description;
      }

      const engine = new VisualizerEngine({
        render: renderStep,
        highlightCode: highlightCodeLine,
        defaultSpeed: 700,
      });

      function buildSteps(ops) {
        engine.reset();
        const queue = [];
        let lastOutput = null;

        engine.recordStep({
          queue: [...queue],
          ops,
          opIdx: -1,
          opLabel: 'Initialize',
          output: 'None',
          mode: 'idle',
          description: 'Initialized an empty <strong>Queue</strong> backed by <code>collections.deque()</code>.',
          codeLine: 3,
        });

        ops.forEach((op, idx) => {
          if (op.type === 'ENQ') {
            queue.push(op.value);
            engine.recordStep({
              queue: [...queue],
              ops,
              opIdx: idx,
              opLabel: op.label,
              output: lastOutput ?? 'None',
              mode: 'enqueue',
              description: `<strong>enqueue(${op.value})</strong> appends <strong>${op.value}</strong> to the rear in <strong>O(1)</strong> time.`,
              codeLine: 5,
            });
          } else if (op.type === 'PEEK') {
            lastOutput = queue.length > 0 ? String(queue[0]) : 'None';
            engine.recordStep({
              queue: [...queue],
              ops,
              opIdx: idx,
              opLabel: 'PEEK',
              output: lastOutput,
              mode: queue.length > 0 ? 'peek' : 'idle',
              description: queue.length > 0
                ? `<strong>front()</strong> peeks at the oldest waiting item <strong>${lastOutput}</strong>.`
                : '<strong>front()</strong> sees an empty queue and returns <strong>None</strong>.',
              codeLine: 11,
            });
          } else if (op.type === 'DEQ') {
            if (queue.length === 0) {
              lastOutput = 'None';
              engine.recordStep({
                queue: [...queue],
                ops,
                opIdx: idx,
                opLabel: 'DEQ (empty)',
                output: 'None',
                mode: 'idle',
                description: '⚠️ Queue is empty, so <strong>dequeue()</strong> returns <strong>None</strong> without crashing.',
                codeLine: 8,
              });
            } else {
              engine.recordStep({
                queue: [...queue],
                ops,
                opIdx: idx,
                opLabel: 'DEQ',
                output: lastOutput ?? 'None',
                mode: 'dequeuing',
                description: `About to remove oldest item <strong>${queue[0]}</strong> from the front via <code>popleft()</code>.`,
                codeLine: 9,
              });
              const removed = queue.shift();
              lastOutput = String(removed);
              engine.recordStep({
                queue: [...queue],
                ops,
                opIdx: idx,
                opLabel: `DEQ → ${removed}`,
                output: lastOutput,
                mode: 'idle',
                description: `Served and returned <strong>${removed}</strong> in <strong>O(1)</strong>. ${queue.length > 0 ? `Next in line is <strong>${queue[0]}</strong>.` : 'Line is now clear.'}`,
                codeLine: 9,
              });
            }
          }
        });

        engine.goToStep(0);
      }

      renderCodePanel();
      engine.bindControls();

      document.getElementById('btn-apply').addEventListener('click', () => {
        const ops = parseOperations(opsInputEl.value);
        opsInputEl.value = ops.map((o) => o.label).join(', ');
        buildSteps(ops);
        engine.play();
      });

      document.getElementById('btn-random').addEventListener('click', () => {
        const seq = [];
        let size = 0;
        for (let i = 0; i < 7; i++) {
          const roll = Math.random();
          if (size === 0 || (roll < 0.58 && size < 5)) {
            seq.push(`ENQ ${Math.floor(Math.random() * 89) + 10}`);
            size++;
          } else if (roll < 0.78) {
            seq.push('PEEK');
          } else {
            seq.push('DEQ');
            size = Math.max(0, size - 1);
          }
        }
        opsInputEl.value = seq.join(', ');
        buildSteps(parseOperations(opsInputEl.value));
      });

      document.querySelectorAll('[data-ops]').forEach((btn) => {
        btn.addEventListener('click', () => {
          opsInputEl.value = btn.dataset.ops;
          buildSteps(parseOperations(opsInputEl.value));
        });
      });

      buildSteps(parseOperations(opsInputEl.value));
    </script>
  </body>
</html>
